<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>売り子メニュー | シグマ祭</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="manifest" href="./manifest.webmanifest"><style>body{margin:0;background:#f7f4f2;font-family:system-ui,sans-serif;color:#222}header{background:#b5121b;color:white;padding:30px 20px;border-radius:0 0 24px 24px}main{max-width:580px;margin:auto;padding:20px}.card{display:block;width:100%;box-sizing:border-box;padding:23px;border:1px solid #eadfdb;border-radius:18px;background:white;color:#97111b;text-align:left;font-size:19px;font-weight:800;margin:12px 0;cursor:pointer}.card small{display:block;font-size:13px;color:#666;margin-top:7px;font-weight:400}.muted{color:#666}.red{color:#b5121b}button:disabled{opacity:.45}a{color:#b5121b}</style></head><body><header><h1>売り子メニュー</h1><div>既存アカウントで操作できます</div></header><main><p id="state">権限・ピーク状態を確認中…</p><button class="card" id="ticket" onclick="location.href='seller.html'" disabled>🎟 券発行<small>既存の当日券発行画面</small></button><button class="card" id="uber" onclick="location.href='remote-register.html'" disabled>🚲 ウーバーレジ<small id="uberHelp">現在の受付状態を確認します</small></button><p><a href="home.html">← ポータルへ戻る</a></p></main><script>const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
let enabled=false;let chan=null;
async function refresh(){
 const {data:{session}}=await sb.auth.getSession();if(!session){state.textContent='ログインが必要です';return;}
 const [rights,peak,staff]=await Promise.all([sb.rpc('can_use_remote_register'),sb.from('uber_peak_state').select('is_peak').eq('id',1).single(),sb.from('staff_members').select('can_sell').eq('user_id',session.user.id).maybeSingle()]);
 enabled=!rights.error&&rights.data===true;ticket.disabled=!(staff.data?.can_sell===true);uber.disabled=!enabled; // During peak the page remains accessible to check orders; DB blocks new registrations.
 state.textContent=!enabled?'ウーバーレジ権限がありません（券発行は別権限）':peak.error?'通信状況を確認できません':peak.data.is_peak?'ピーク中：ウーバー新規受付は停止中':'通常営業：ウーバー受付可能';
 uberHelp.textContent=peak.data?.is_peak?'ピーク中も履歴は遠隔レジ内で確認できます':'注文受付・配達状況';
}
refresh();chan=sb.channel('seller-menu-peak').on('postgres_changes',{event:'*',schema:'public',table:'uber_peak_state'},refresh).subscribe();setInterval(refresh,10000);addEventListener('online',refresh);
</script></body></html>
