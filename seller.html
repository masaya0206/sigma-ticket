<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 前売り券発行</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #loginArea,
    #sellerArea,
    #ticketResult,
    #mySummaryArea {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 10px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .success {
      background: #e8f7e8;
    }

    .danger {
      background: #ffe8e8;
    }

    .ticket-code {
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>シグマ祭 前売り券発行</h1>


  <div id="loginArea">

    <h2>販売者ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>

    <p id="loginMessage"></p>

  </div>


  <div id="sellerArea" style="display:none;">

    <p>
      販売者：
      <strong id="sellerName"></strong>
    </p>
    
    <input
  id="buyerName"
  type="text"
  placeholder="購入者の名前"
>

    <button onclick="issueTicket()">
      チケットを1枚発行
      <button onclick="loadMySummary()">
  自分の販売状況を見る
</button>

<div id="mySummaryArea">
  販売状況はまだ表示されていません。
</div>
    </button>

    <button onclick="logout()">
      ログアウト
    </button>

    <div id="ticketResult">
      まだチケットは発行されていません。
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let currentSeller = null;


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const loginMessage =
        document.getElementById("loginMessage");

      loginMessage.textContent =
        "ログインしています...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        loginMessage.textContent =
          "ログイン失敗：" + error.message;

        return;
      }

      await loadSeller();
    }


    async function loadSeller() {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {
        return;
      }

      const { data, error } =
        await supabaseClient
          .from("sellers")
          .select("*")
          .eq("user_id", user.id)
          .maybeSingle();

      if (error) {

        document.getElementById("loginMessage")
          .textContent =
          "販売者情報の取得に失敗：" +
          error.message;

        return;
      }

      if (!data) {

        await supabaseClient.auth.signOut();

        document.getElementById("loginMessage")
          .textContent =
          "このアカウントには販売者権限がありません。";

        return;
      }

      if (!data.is_active) {

        await supabaseClient.auth.signOut();

        document.getElementById("loginMessage")
          .textContent =
          "この販売者アカウントは現在無効です。";

        return;
      }

      currentSeller = data;

      document.getElementById("sellerName")
        .textContent =
        data.seller_name;

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("sellerArea")
        .style.display = "block";
    }


    function createTicketCode() {

      const randomPart =
        crypto.randomUUID()
          .replaceAll("-", "")
          .substring(0, 12)
          .toUpperCase();

      return "SGM-" + randomPart;
    }


    async function issueTicket() {

      if (!currentSeller) {
        return;
      }
      
      const buyerName =
  document.getElementById("buyerName")
    .value
    .trim();

if (!buyerName) {
  alert("購入者の名前を入力してください。");
  return;
}

      const ticketResult =
        document.getElementById("ticketResult");

      ticketResult.className = "";
      ticketResult.innerHTML =
        "チケットを発行しています...";

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {

        ticketResult.className = "danger";
        ticketResult.innerHTML =
          "ログイン情報を確認できませんでした。";

        return;
      }

      const ticketCode =
        createTicketCode();
      
      const claimToken =
  crypto.randomUUID()
    .replaceAll("-", "");
      
      const { data, error } =
        await supabaseClient
          .from("tickets")
          .insert({
            ticket_code: ticketCode,
            product_name: "チャーハン前売り券",
            seller_name: currentSeller.seller_name,
            seller_id: user.id,
            buyer_name: buyerName,
            status: "pending",
            claim_token: claimToken
          })
          .select()
          .single();

      if (error) {

        ticketResult.className = "danger";

        ticketResult.innerHTML =
          "発行エラー：" + error.message;

        return;
      }
      
await supabaseClient
  .from("ticket_logs")
  .insert({
    ticket_code: data.ticket_code,
    action: "issued",
    actor_id: user.id,
    actor_name: currentSeller.seller_name
  });
      const claimUrl =
  "https://masaya0206.github.io/sigma-ticket/claim.html?token="
  + encodeURIComponent(data.claim_token);
      ticketResult.className = "success";

      ticketResult.innerHTML = `
  <h2>✅ 発行完了</h2>

  <p>
    商品：${data.product_name}
  </p>

  <p>
    販売者：${data.seller_name}
  </p>

  <p>
    状態：受け取り待ち
  </p>

  <p>
    このURLを購入者に送ってください。
  </p>

  <p style="word-break:break-all;">
    ${claimUrl}
  </p>
`;
document.getElementById("buyerName").value = "";
      
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      currentSeller = null;

      document.getElementById("sellerArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";

      document.getElementById("password")
        .value = "";
    }

async function loadMySummary() {

  const mySummaryArea =
    document.getElementById("mySummaryArea");

  mySummaryArea.innerHTML =
    "販売状況を集計しています...";

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    mySummaryArea.innerHTML =
      "ログイン情報を確認できませんでした。";
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("tickets")
      .select("ticket_code,status,created_at")
      .eq("seller_id", user.id)
      .order("created_at", {
        ascending: false
      });

  if (error) {

    mySummaryArea.className = "danger";

    mySummaryArea.innerHTML =
      "エラー：" + error.message;

    return;
  }

 let total = 0;
let pending = 0;
let active = 0;
let used = 0;
let invalid = 0;

  for (const ticket of data) {

    total++;

   if (ticket.status === "pending") {
  pending++;
}

else if (ticket.status === "active") {
  active++;
}

    else if (ticket.status === "used") {
      used++;
    }

    else {
      invalid++;
    }
  }

  let html = `
    <h2>自分の販売状況</h2>

    発行：${total}枚<br>
🟡 受け取り待ち：${pending}枚<br>
🟢 有効：${active}枚<br>
🔴 使用済み：${used}枚<br>
⛔ 無効：${invalid}枚

    <h3>発行履歴</h3>
  `;

  for (const ticket of data) {

    const date =
      new Date(ticket.created_at)
        .toLocaleString("ja-JP");

    html += `
  <div style="
    border-top:1px solid #ccc;
    padding:12px 0;
    text-align:left;
  ">

    ${ticket.ticket_code}<br>
    状態：${ticket.status}<br>
    発行日時：${date}

    ${
      ticket.status === "pending"
      ? `
        <button
          onclick="cancelTicket('${ticket.ticket_code}')"
        >
          このチケットをキャンセル
        </button>
      `
      : ""
    }

  </div>
`;
  }

  mySummaryArea.className = "";

  mySummaryArea.innerHTML = html;
}
    async function cancelTicket(ticketCode) {

  const confirmed =
    confirm(
      "このチケットをキャンセルしますか？\n購入者がまだ受け取っていない券のみキャンセルできます。"
    );

  if (!confirmed) {
    return;
  }

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("ログイン情報を確認できませんでした。");
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("tickets")
      .update({
        status: "invalid"
      })
      .eq("ticket_code", ticketCode)
      .eq("seller_id", user.id)
      .eq("status", "pending")
      .select()
      .maybeSingle();

  if (error) {
    alert(
      "キャンセルできませんでした：" +
      error.message
    );
    return;
  }

  if (!data) {
    alert(
      "このチケットはキャンセルできません。\nすでに受け取り済みの可能性があります。"
    );
    return;
  }

  await supabaseClient
    .from("ticket_logs")
    .insert({
      ticket_code: data.ticket_code,
      action: "invalidated",
      actor_id: user.id,
      actor_name: currentSeller.seller_name
    });

  alert("チケットをキャンセルしました。");

  await loadMySummary();
}
    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();

      if (session) {
        await loadSeller();
      }
    }


    checkLogin();

  </script>

</body>
</html>
