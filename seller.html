<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 チケット発行</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card {
      margin-top: 16px;
      padding: 18px;
      background: #f2f2f2;
      border-radius: 12px;
      text-align: left;
    }

    .subcard {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    .success {
      background: #e8f7e8 !important;
    }

    .danger {
      background: #ffe8e8 !important;
    }

    .warning {
      background: #fff4df !important;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .ticket-code {
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }

    .link-text {
      word-break: break-all;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .summary-box {
      padding: 12px;
      background: #fff;
      border-radius: 10px;
      text-align: center;
    }

    #sellerArea,
    #newPasswordArea {
      display: none;
    }

    @media (max-width: 420px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  
    .claim-qr-wrap {
      margin-top: 16px;
      padding: 18px;
      text-align: center;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--sigma-line, #ece7e4);
    }

    #claimQrCode {
      display: flex;
      justify-content: center;
      margin: 16px 0 10px;
    }

    .handoff-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 900;
    }

    .handoff-note {
      margin: 0;
      color: var(--sigma-muted, #6e6e73);
      font-size: 13px;
      line-height: 1.6;
    }

  </style>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <style id="sigma-red-theme">
    :root {
      --sigma-red: #b5121b;
      --sigma-red-dark: #8f0e15;
      --sigma-red-soft: #fff1f2;
      --sigma-gold: #d9a526;
      --sigma-bg: #f7f4f2;
      --sigma-surface: #ffffff;
      --sigma-ink: #1c1c1e;
      --sigma-muted: #6e6e73;
      --sigma-line: #ece7e4;
      --sigma-green: #15803d;
      --sigma-shadow: 0 8px 24px rgba(74, 25, 25, 0.08);
    }

    html {
      background: var(--sigma-bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif !important;
      color: var(--sigma-ink) !important;
      background: var(--sigma-bg) !important;
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 20px !important;
    }

    body > h1:first-of-type {
      margin: -20px -20px 22px !important;
      padding:
        max(36px, env(safe-area-inset-top))
        22px
        34px !important;
      color: #fff !important;
      background:
        radial-gradient(circle at 86% 18%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(145deg, var(--sigma-red), var(--sigma-red-dark)) !important;
      border-radius: 0 0 28px 28px !important;
      font-size: 30px !important;
      letter-spacing: .02em !important;
      text-align: left !important;
    }

    input,
    select,
    textarea {
      color: var(--sigma-ink) !important;
      background: #fff !important;
      border: 1px solid #ddd5d1 !important;
      border-radius: 14px !important;
      box-shadow: none !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none !important;
      border-color: var(--sigma-red) !important;
      box-shadow: 0 0 0 3px rgba(181,18,27,.10) !important;
    }

    button {
      border-radius: 14px !important;
      font-weight: 750 !important;
      color: var(--sigma-red) !important;
      background: var(--sigma-red-soft) !important;
      box-shadow: none !important;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .45 !important;
    }

    #loginArea,
    #sellerArea,
    #staffArea,
    #adminArea,
    #backArea,
    #frontArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card,
    .subcard {
      border-radius: 20px !important;
    }

    #loginArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card {
      background: var(--sigma-surface) !important;
      border: 1px solid rgba(181,18,27,.06) !important;
      box-shadow: var(--sigma-shadow) !important;
    }

    .subcard {
      background: #fff !important;
      border-color: var(--sigma-line) !important;
    }

    .success {
      background: #ecfdf3 !important;
      color: #14532d !important;
    }

    .danger {
      background: #fff0f0 !important;
      color: #7f1d1d !important;
    }

    .warning {
      background: #fff8e8 !important;
      color: #6b4a00 !important;
    }

    a {
      color: var(--sigma-red) !important;
    }

    strong {
      color: inherit;
    }

    hr {
      border-color: var(--sigma-line) !important;
    }

    .ticket-code {
      color: var(--sigma-red) !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px !important;
      }

      body > h1:first-of-type {
        margin-left: -16px !important;
        margin-right: -16px !important;
      }
    }
  </style>

</head>

<body>

  <h1>シグマ祭 チケット発行</h1>


  <div id="loginArea" class="card">

    <h2>スタッフログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button onclick="login()">
      ログイン
    </button>

    <button onclick="resetPassword()">
      パスワードを設定・再設定
    </button>

    <p id="loginMessage"></p>

  </div>


  <div
    id="newPasswordArea"
    class="card"
  >

    <h2>新しいパスワードを設定</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="新しいパスワード"
    >

    <button onclick="saveNewPassword()">
      パスワードを保存
    </button>

    <p id="passwordMessage"></p>

  </div>


  <div id="sellerArea">

    <button onclick="location.href='home.html'">
      🏠 ポータルに戻る
    </button>

    <button onclick="logout()">
      ログアウト
    </button>


    <div class="card">
      <h2>チケット発行</h2>

      <p>
        発行者：
        <strong id="sellerName"></strong>
      </p>

      <input
        id="buyerName"
        type="text"
        placeholder="購入者の名前"
      >

      <button
        id="issueButton"
        onclick="issueTicket()"
      >
        チケットを1枚発行
      </button>

      <p class="small">
        発行すると受け取り用QRが表示されます。
        購入者にその場で読み取ってもらうとチケットが有効になります。
      </p>
    </div>


    <div
      id="ticketResult"
      class="card"
    >
      まだチケットは発行されていません。
    </div>


    <div class="card">
      <h2>自分の販売状況</h2>

      <button onclick="loadMySummary()">
        販売状況を更新
      </button>

      <div id="mySummaryArea">
        販売状況はまだ表示されていません。
      </div>
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let currentSeller = null;


    function statusText(status) {

      if (status === "pending") {
        return "🟡 受け取り待ち";
      }

      if (status === "active") {
        return "🟢 有効";
      }

      if (status === "used") {
        return "🔴 使用済み";
      }

      return "⛔ 無効";
    }


    function dateText(value) {

      if (!value) return "";

      return new Date(value)
        .toLocaleString("ja-JP");
    }


    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value;

      const password =
        document.getElementById(
          "password"
        ).value;

      const message =
        document.getElementById(
          "loginMessage"
        );

      message.textContent =
        "ログインしています...";

      const {
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {

        message.textContent =
          "ログイン失敗：" +
          error.message;

        return;
      }

      message.textContent = "";

      await loadSeller();
    }


    async function resetPassword() {

      const email =
        document.getElementById(
          "email"
        ).value;

      const message =
        document.getElementById(
          "loginMessage"
        );

      if (!email) {

        message.textContent =
          "メールアドレスを入力してください。";

        return;
      }

      const {
        error
      } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://masaya0206.github.io/sigma-ticket/seller.html"
            }
          );

      if (error) {

        message.textContent =
          "エラー：" +
          error.message;

        return;
      }

      message.textContent =
        "パスワード設定用メールを送信しました。";
    }


    async function saveNewPassword() {

      const newPassword =
        document.getElementById(
          "newPassword"
        ).value;

      const message =
        document.getElementById(
          "passwordMessage"
        );

      if (!newPassword) {

        message.textContent =
          "新しいパスワードを入力してください。";

        return;
      }

      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password:
              newPassword
          });

      if (error) {

        message.textContent =
          "エラー：" +
          error.message;

        return;
      }

      message.textContent =
        "✅ パスワードを設定しました。";

      await loadSeller();
    }


    supabaseClient.auth
      .onAuthStateChange(
        async (event) => {

          if (
            event ===
            "PASSWORD_RECOVERY"
          ) {

            document.getElementById(
              "loginArea"
            ).style.display =
              "none";

            document.getElementById(
              "sellerArea"
            ).style.display =
              "none";

            document.getElementById(
              "newPasswordArea"
            ).style.display =
              "block";
          }
        }
      );


    async function loadSeller() {

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      if (!user) {
        return;
      }

      const {
        data: staff,
        error: staffError
      } =
        await supabaseClient
          .from("staff_members")
          .select(
            "staff_name,is_active"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();

      if (
        staffError ||
        !staff
      ) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "スタッフ情報が見つかりません。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      if (!staff.is_active) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "このスタッフアカウントは停止中です。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      const {
        data: seller,
        error: sellerError
      } =
        await supabaseClient
          .from("sellers")
          .select(
            "user_id,seller_name,is_active"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();

      /*
        移行期間中は sellers に行があるスタッフを販売者として利用。
        新規登録フローでは register-seller が sellers と staff_members
        の両方を作成する前提。
      */
      if (
        sellerError ||
        !seller
      ) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "このアカウントにはチケット発行情報がありません。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      if (!seller.is_active) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "この販売者アカウントは現在無効です。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      currentSeller = {
        ...seller,
        seller_name:
          seller.seller_name ||
          staff.staff_name
      };

      document.getElementById(
        "sellerName"
      ).textContent =
        currentSeller.seller_name;

      document.getElementById(
        "loginArea"
      ).style.display =
        "none";

      document.getElementById(
        "newPasswordArea"
      ).style.display =
        "none";

      document.getElementById(
        "sellerArea"
      ).style.display =
        "block";

      await loadMySummary();
    }


    function createTicketCode() {

      const randomPart =
        crypto.randomUUID()
          .replaceAll("-", "")
          .substring(0, 12)
          .toUpperCase();

      return "SGM-" +
        randomPart;
    }


    async function issueTicket() {

      if (!currentSeller) {
        return;
      }

      const buyerName =
        document.getElementById(
          "buyerName"
        ).value.trim();

      const button =
        document.getElementById(
          "issueButton"
        );

      const result =
        document.getElementById(
          "ticketResult"
        );

      if (!buyerName) {

        result.className =
          "card warning";

        result.textContent =
          "購入者の名前を入力してください。";

        return;
      }

      button.disabled = true;

      result.className =
        "card";

      result.textContent =
        "チケットを発行しています...";

      try {

        const {
          data: { user }
        } =
          await supabaseClient.auth
            .getUser();

        if (!user) {
          throw new Error(
            "ログイン情報を確認できませんでした。"
          );
        }

        const ticketCode =
          createTicketCode();

        const claimToken =
          crypto.randomUUID()
            .replaceAll("-", "");

        const {
          data,
          error
        } =
          await supabaseClient
            .from("tickets")
            .insert({
              ticket_code:
                ticketCode,

              product_name:
                "チャーハン前売り券",

              seller_name:
                currentSeller.seller_name,

              seller_id:
                user.id,

              buyer_name:
                buyerName,

              status:
                "pending",

              claim_token:
                claimToken,

              sale_type:
                "presale"
            })
            .select()
            .single();

        if (error) {
          throw error;
        }

        const {
          error: logError
        } =
          await supabaseClient
            .from("ticket_logs")
            .insert({
              ticket_code:
                data.ticket_code,

              action:
                "issued",

              actor_id:
                user.id,

              actor_name:
                currentSeller.seller_name
            });

        const claimUrl =
          "https://masaya0206.github.io/sigma-ticket/claim.html?token=" +
          encodeURIComponent(
            data.claim_token
          );

        result.className =
          "card success";

        result.innerHTML = `
          <h2>✅ 発行完了</h2>

          <p>
            <strong>商品</strong><br>
            ${data.product_name}
          </p>

          <p>
            <strong>購入者</strong><br>
            ${data.buyer_name}
          </p>

          <div class="claim-qr-wrap">
            <p class="handoff-title">
              購入者にこのQRを読み取ってもらってください
            </p>

            <p class="handoff-note">
              QRには受け取りURLが入っています。
              売り子がURLを送る必要はありません。
            </p>

            <div id="claimQrCode"></div>

            <p class="handoff-note">
              読み取り後、購入者のスマホに本番用チケットQRが表示されます。
            </p>
          </div>

          <p>
            <strong>受け取りURL</strong><br>
            <span class="link-text">
              ${claimUrl}
            </span>
          </p>

          <button
            onclick="
              copyClaimUrl(
                '${claimUrl}'
              )
            "
          >
            受け取りURLをコピー
          </button>

          <button
            onclick="
              openClaimUrl(
                '${claimUrl}'
              )
            "
          >
            受け取りページを開く
          </button>

          ${
            logError
              ? `
                <p class="small">
                  ※チケット発行は完了しましたが、
                  発行履歴の保存に失敗しました。
                </p>
              `
              : ""
          }
        `;

        new QRCode(
          document.getElementById(
            "claimQrCode"
          ),
          {
            text:
              claimUrl,
            width:
              240,
            height:
              240
          }
        );

        document.getElementById(
          "buyerName"
        ).value = "";

        await loadMySummary();

      } catch (error) {

        result.className =
          "card danger";

        result.textContent =
          "発行エラー：" +
          error.message;

      } finally {

        button.disabled = false;
      }
    }


    async function copyClaimUrl(
      url
    ) {

      try {

        await navigator.clipboard
          .writeText(url);

        alert(
          "受け取りURLをコピーしました。"
        );

      } catch (error) {

        prompt(
          "このURLをコピーしてください。",
          url
        );
      }
    }


    function openClaimUrl(url) {

      window.open(
        url,
        "_blank",
        "noopener"
      );
    }


    async function loadMySummary() {

      const area =
        document.getElementById(
          "mySummaryArea"
        );

      area.textContent =
        "販売状況を集計しています...";

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      if (!user) {

        area.textContent =
          "ログイン情報を確認できませんでした。";

        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("tickets")
          .select(
            "ticket_code,status,created_at,buyer_name,product_name"
          )
          .eq(
            "seller_id",
            user.id
          )
          .order(
            "created_at",
            { ascending: false }
          );

      if (error) {

        area.className =
          "danger";

        area.textContent =
          "エラー：" +
          error.message;

        return;
      }

      let total = 0;
      let pending = 0;
      let active = 0;
      let used = 0;
      let invalid = 0;

      for (
        const ticket of data || []
      ) {

        total++;

        if (
          ticket.status ===
          "pending"
        ) {
          pending++;
        } else if (
          ticket.status ===
          "active"
        ) {
          active++;
        } else if (
          ticket.status ===
          "used"
        ) {
          used++;
        } else {
          invalid++;
        }
      }

      let html = `
        <div class="summary-grid">
          <div class="summary-box">
            発行<br>
            <strong>${total}枚</strong>
          </div>

          <div class="summary-box">
            🟡 受け取り待ち<br>
            <strong>${pending}枚</strong>
          </div>

          <div class="summary-box">
            🟢 有効<br>
            <strong>${active}枚</strong>
          </div>

          <div class="summary-box">
            🔴 使用済み<br>
            <strong>${used}枚</strong>
          </div>
        </div>

        <p>
          ⛔ 無効：${invalid}枚
        </p>

        <h3>発行履歴</h3>
      `;

      if (
        !data ||
        data.length === 0
      ) {

        html +=
          "<p>まだ発行履歴はありません。</p>";

      } else {

        for (const ticket of data) {

          html += `
            <div class="subcard">

              <strong>
                ${ticket.product_name}
              </strong>

              <br>

              購入者：
              ${ticket.buyer_name ?? "未登録"}

              <br>

              状態：
              ${statusText(
                ticket.status
              )}

              <br>

              チケットID：
              ${ticket.ticket_code}

              <br>

              発行日時：
              ${dateText(
                ticket.created_at
              )}

              ${
                ticket.status ===
                "pending"
                  ? `
                    <button
                      onclick="
                        cancelTicket(
                          '${ticket.ticket_code}'
                        )
                      "
                    >
                      このチケットをキャンセル
                    </button>
                  `
                  : ""
              }
            </div>
          `;
        }
      }

      area.className = "";
      area.innerHTML = html;
    }


    async function cancelTicket(
      ticketCode
    ) {

      const confirmed =
        confirm(
          "このチケットをキャンセルしますか？\n購入者がまだ受け取っていない券のみキャンセルできます。"
        );

      if (!confirmed) {
        return;
      }

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      if (!user) {

        alert(
          "ログイン情報を確認できませんでした。"
        );

        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("tickets")
          .update({
            status:
              "invalid"
          })
          .eq(
            "ticket_code",
            ticketCode
          )
          .eq(
            "seller_id",
            user.id
          )
          .eq(
            "status",
            "pending"
          )
          .select()
          .maybeSingle();

      if (error) {

        alert(
          "キャンセルできませんでした：" +
          error.message
        );

        return;
      }

      if (!data) {

        alert(
          "このチケットはキャンセルできません。\nすでに受け取り済みの可能性があります。"
        );

        return;
      }

      await supabaseClient
        .from("ticket_logs")
        .insert({
          ticket_code:
            data.ticket_code,

          action:
            "invalidated",

          actor_id:
            user.id,

          actor_name:
            currentSeller?.seller_name ??
            "販売者"
        });

      alert(
        "チケットをキャンセルしました。"
      );

      await loadMySummary();
    }


    async function logout() {

      await supabaseClient.auth
        .signOut();

      currentSeller = null;

      document.getElementById(
        "sellerArea"
      ).style.display =
        "none";

      document.getElementById(
        "loginArea"
      ).style.display =
        "block";

      document.getElementById(
        "password"
      ).value = "";
    }


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (session) {
        await loadSeller();
      }
    }


    checkLogin();

  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>
