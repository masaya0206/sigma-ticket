<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伝票入力</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🧾 伝票入力</h1></header><main><div class="card"><p>伝票1枚ごとに品数を入力します。登録時刻は自動保存されます。</p><div class="grid"><div><label>炒飯</label><input id="rice" type="number" min="0" value="1"></div><div><label>胡麻団子</label><input id="sesame" type="number" min="0" value="0"></div></div><button class="primary" id="save">この伝票を登録</button><div id="msg"></div></div><div class="card"><h2>直近の伝票</h2><div id="list">読み込み中...</div></div><button onclick="location.href='front.html'">表番画面へ戻る</button></main><script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){const {data,error}=await sb.from('order_slips').select('id,fried_rice_qty,sesame_qty,recorded_at').is('voided_at',null).order('recorded_at',{ascending:false}).limit(20);list.innerHTML=error?error.message:(data||[]).map(x=>`<div class="row"><b>${new Date(x.recorded_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</b>　炒飯 ${x.fried_rice_qty} / 胡麻 ${x.sesame_qty}</div>`).join('')||'まだありません';}
save.onclick=async()=>{msg.textContent='登録中...';const r=Number(rice.value)||0,s=Number(sesame.value)||0;const {data,error}=await sb.rpc('record_order_slip',{p_rice:r,p_sesame:s,p_note:null});msg.textContent=error?'エラー：'+error.message:'✅ 登録しました';if(!error){rice.value=1;sesame.value=0;load();}};load();</script></body></html>
