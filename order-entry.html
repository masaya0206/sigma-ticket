<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伝票入力</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style>
<style>
.register-colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}
.register-color{position:relative}
.register-color input{position:absolute;opacity:0;pointer-events:none}
.register-color label{display:block;padding:16px 8px;border:3px solid transparent;border-radius:16px;text-align:center;font-size:18px;font-weight:900;cursor:pointer}
.register-red label{background:#fff0f0;color:#a3151c}
.register-blue label{background:#eef6ff;color:#14599a}
.register-green label{background:#edf9ef;color:#26723a}
.register-color input:checked+label{border-color:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.color-pill{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px}
.color-red{background:#fff0f0;color:#a3151c}
.color-blue{background:#eef6ff;color:#14599a}
.color-green{background:#edf9ef;color:#26723a}
</style>
</head><body><header><h1>🧾 伝票入力</h1></header><main><div class="card">
<p>伝票1枚＝1組です。紙の伝票と同じレジ色を選んでから品数を入力します。</p>

<label><b>どのレジから来た伝票？</b></label>
<div class="register-colors">
  <div class="register-color register-red">
    <input id="regRed" name="registerColor" type="radio" value="red">
    <label for="regRed">🔴 赤</label>
  </div>
  <div class="register-color register-blue">
    <input id="regBlue" name="registerColor" type="radio" value="blue">
    <label for="regBlue">🔵 青</label>
  </div>
  <div class="register-color register-green">
    <input id="regGreen" name="registerColor" type="radio" value="green">
    <label for="regGreen">🟢 緑</label>
  </div>
</div>

<div class="grid"><div><label>炒飯</label><input id="rice" type="number" min="0" value="1"></div><div><label>胡麻団子</label><input id="sesame" type="number" min="0" value="0"></div></div><button class="primary" id="save">この伝票を登録</button><div id="msg"></div></div><div class="card"><h2>直近の伝票（注文組）</h2><div id="list">読み込み中...</div></div><button onclick="location.href='front.html'">表番画面へ戻る</button></main><script>
const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";
const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const colorLabel = {
  red: "赤",
  blue: "青",
  green: "緑"
};

const colorClass = {
  red: "color-red",
  blue: "color-blue",
  green: "color-green"
};

function selectedRegisterColor() {
  return document.querySelector(
    'input[name="registerColor"]:checked'
  )?.value || null;
}

async function load() {
  const { data, error } =
    await sb
      .from("order_slips")
      .select(
        "id,fried_rice_qty,sesame_qty,register_color,recorded_at"
      )
      .is("voided_at", null)
      .order("recorded_at", { ascending:false })
      .limit(20);

  if (error) {
    list.textContent = error.message;
    return;
  }

  list.innerHTML =
    (data || []).map(x => `
      <div class="row">
        <b>
          ${new Date(x.recorded_at).toLocaleTimeString(
            "ja-JP",
            { hour:"2-digit", minute:"2-digit" }
          )}
        </b>
        <span class="color-pill ${colorClass[x.register_color] || ""}">
          ${colorLabel[x.register_color] || "色不明"}レジ
        </span>
        <br>
        炒飯 ${x.fried_rice_qty} / 胡麻 ${x.sesame_qty}
      </div>
    `).join("") || "まだありません";
}

save.onclick = async () => {
  msg.textContent = "";

  const color = selectedRegisterColor();

  if (!color) {
    msg.textContent =
      "赤・青・緑のどのレジから来た伝票か選んでください。";
    return;
  }

  const r = Number(rice.value) || 0;
  const s = Number(sesame.value) || 0;

  msg.textContent = "登録中...";

  const { error } =
    await sb.rpc(
      "record_order_slip",
      {
        p_rice: r,
        p_sesame: s,
        p_register_color: color,
        p_note: null
      }
    );

  msg.textContent =
    error
      ? "エラー：" + error.message
      : `✅ ${colorLabel[color]}レジの伝票として登録しました`;

  if (!error) {
    rice.value = 1;
    sesame.value = 0;

    // 色は連続して同じレジの伝票を入れる場合もあるため維持する。
    await load();
  }
};

load();
</script></body></html>
