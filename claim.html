<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 前売り券受け取り</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 12px;
    }

    .success {
      background: #e8f7e8 !important;
    }

    .danger {
      background: #ffe8e8 !important;
    }

    .warning {
      background: #fff4df !important;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .ticket-code {
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
  </style>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <style id="sigma-red-theme">
    :root {
      --sigma-red: #b5121b;
      --sigma-red-dark: #8f0e15;
      --sigma-red-soft: #fff1f2;
      --sigma-gold: #d9a526;
      --sigma-bg: #f7f4f2;
      --sigma-surface: #ffffff;
      --sigma-ink: #1c1c1e;
      --sigma-muted: #6e6e73;
      --sigma-line: #ece7e4;
      --sigma-green: #15803d;
      --sigma-shadow: 0 8px 24px rgba(74, 25, 25, 0.08);
    }

    html {
      background: var(--sigma-bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif !important;
      color: var(--sigma-ink) !important;
      background: var(--sigma-bg) !important;
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 20px !important;
    }

    body > h1:first-of-type {
      margin: -20px -20px 22px !important;
      padding:
        max(36px, env(safe-area-inset-top))
        22px
        34px !important;
      color: #fff !important;
      background:
        radial-gradient(circle at 86% 18%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(145deg, var(--sigma-red), var(--sigma-red-dark)) !important;
      border-radius: 0 0 28px 28px !important;
      font-size: 30px !important;
      letter-spacing: .02em !important;
      text-align: left !important;
    }

    input,
    select,
    textarea {
      color: var(--sigma-ink) !important;
      background: #fff !important;
      border: 1px solid #ddd5d1 !important;
      border-radius: 14px !important;
      box-shadow: none !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none !important;
      border-color: var(--sigma-red) !important;
      box-shadow: 0 0 0 3px rgba(181,18,27,.10) !important;
    }

    button {
      border-radius: 14px !important;
      font-weight: 750 !important;
      color: var(--sigma-red) !important;
      background: var(--sigma-red-soft) !important;
      box-shadow: none !important;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .45 !important;
    }

    #loginArea,
    #sellerArea,
    #staffArea,
    #adminArea,
    #backArea,
    #frontArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card,
    .subcard {
      border-radius: 20px !important;
    }

    #loginArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card {
      background: var(--sigma-surface) !important;
      border: 1px solid rgba(181,18,27,.06) !important;
      box-shadow: var(--sigma-shadow) !important;
    }

    .subcard {
      background: #fff !important;
      border-color: var(--sigma-line) !important;
    }

    .success {
      background: #ecfdf3 !important;
      color: #14532d !important;
    }

    .danger {
      background: #fff0f0 !important;
      color: #7f1d1d !important;
    }

    .warning {
      background: #fff8e8 !important;
      color: #6b4a00 !important;
    }

    a {
      color: var(--sigma-red) !important;
    }

    strong {
      color: inherit;
    }

    hr {
      border-color: var(--sigma-line) !important;
    }

    .ticket-code {
      color: var(--sigma-red) !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px !important;
      }

      body > h1:first-of-type {
        margin-left: -16px !important;
        margin-right: -16px !important;
      }
    }
  </style>

</head>

<body>

  <h1>シグマ祭 前売り券</h1>

  <div
    id="claimArea"
    class="card"
  >

    <h2>チケットを受け取る</h2>

    <p>
      下のボタンを押すと、
      前売り券の受け取りが完了します。
    </p>

    <button
      id="claimButton"
      onclick="claimTicket()"
    >
      受け取り完了
    </button>

    <p id="message"></p>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const claimToken =
      params.get("token");


    function showTicket(ticket) {

      const claimArea =
        document.getElementById(
          "claimArea"
        );

      claimArea.className =
        "card success";

      claimArea.innerHTML = `
        <h2>✅ 受け取り完了</h2>

        <p>
          <strong>商品</strong><br>
          ${ticket.product_name}
        </p>

        <p>
          <strong>販売者</strong><br>
          ${ticket.seller_name}
        </p>

        <p>
          <strong>購入者</strong><br>
          ${ticket.buyer_name ?? "未登録"}
        </p>

        <p>
          <strong>チケットID</strong><br>
          <span class="ticket-code">
            ${ticket.ticket_code}
          </span>
        </p>

        <div id="qrcode"></div>

        <p>
          当日はこのQRコードを
          店舗スタッフに提示してください。
        </p>

        <p class="small">
          スクリーンショットを保存しておくと安心です。
        </p>
      `;

      new QRCode(
        document.getElementById(
          "qrcode"
        ),
        {
          text:
            ticket.ticket_code,
          width:
            220,
          height:
            220
        }
      );
    }


    async function claimTicket() {

      const claimArea =
        document.getElementById(
          "claimArea"
        );

      const claimButton =
        document.getElementById(
          "claimButton"
        );

      if (!claimToken) {

        claimArea.className =
          "card danger";

        claimArea.innerHTML = `
          <h2>❌ エラー</h2>

          <p>
            受け取り情報がありません。
          </p>
        `;

        return;
      }

      claimButton.disabled =
        true;

      claimButton.textContent =
        "確認しています...";

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "claim_ticket",
          {
            p_token:
              claimToken
          }
        );

      if (error) {

        claimArea.className =
          "card danger";

        claimArea.innerHTML = `
          <h2>⚠️ エラー</h2>

          <p>
            ${error.message}
          </p>
        `;

        return;
      }

      if (
        !data ||
        data.length === 0
      ) {

        claimArea.className =
          "card danger";

        claimArea.innerHTML = `
          <h2>❌ 無効なURL</h2>

          <p>
            このチケットは存在しないか、
            URLが正しくありません。
          </p>
        `;

        return;
      }

      const ticket =
        data[0];

      if (
        ticket.status ===
        "used"
      ) {

        claimArea.className =
          "card danger";

        claimArea.innerHTML = `
          <h2>🔴 使用済み</h2>

          <p>
            このチケットはすでに使用されています。
          </p>
        `;

        return;
      }

      if (
        ticket.status ===
        "invalid"
      ) {

        claimArea.className =
          "card danger";

        claimArea.innerHTML = `
          <h2>⛔ 無効</h2>

          <p>
            このチケットは無効になっています。
          </p>
        `;

        return;
      }

      if (
        ticket.status ===
        "pending"
      ) {

        claimArea.className =
          "card warning";

        claimArea.innerHTML = `
          <h2>🟡 受け取り処理中</h2>

          <p>
            チケットはまだ有効化されていません。
            もう一度受け取りをお試しください。
          </p>

          <button onclick="location.reload()">
            再読み込み
          </button>
        `;

        return;
      }

      if (
        ticket.status ===
        "active"
      ) {

        showTicket(ticket);

        return;
      }

      claimArea.className =
        "card danger";

      claimArea.innerHTML = `
        <h2>⚠️ 状態エラー</h2>

        <p>
          チケット状態を確認できませんでした。
        </p>
      `;
    }


    async function initialize() {

      if (!claimToken) {

        document.getElementById(
          "claimArea"
        ).className =
          "card danger";

        document.getElementById(
          "claimArea"
        ).innerHTML = `
          <h2>❌ 無効なURL</h2>

          <p>
            受け取り情報がありません。
          </p>
        `;

        return;
      }
    }


    initialize();

  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
