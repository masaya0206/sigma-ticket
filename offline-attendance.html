<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>オフライン勤怠</title><meta name="theme-color" content="#b5121b"><script src="https://unpkg.com/html5-qrcode"></script><script src="./offline-work-store.js"></script><style>
:root{--r:#b5121b;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:white;padding:30px 18px 24px;border-radius:0 0 28px 28px}main{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;font-weight:900;font-size:16px}.primary{background:var(--r);color:#fff}.dark{background:#2c2c2e;color:#fff}.small{font-size:12px;color:var(--muted);line-height:1.6}.ok{color:var(--green);font-weight:900}.err{color:#b00020;font-weight:900}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff3d6;color:#8a5a00;font-size:12px;font-weight:900}#reader{overflow:hidden;border-radius:14px;margin-top:12px}</style></head><body>
<header><h1 style="margin:0">オフライン勤怠</h1><p style="margin:7px 0 0;opacity:.85">通信障害時の出勤・退勤</p></header><main>
<section class="card"><span class="pill">端末内で暫定記録</span><div id="status" style="margin-top:10px;font-weight:900">状態を確認中...</div><div id="detail" class="small"></div></section>
<section id="clockInCard" class="card" style="display:none"><h2>オフライン出勤</h2><p class="small">店長・管理者が表示している時間式QRを読み取ってください。読み取り時刻とQR時刻を端末内で照合します。</p><div id="reader"></div><button id="startScan" class="primary">QRを読み取る</button><div id="scanMsg" class="small"></div></section>
<section id="clockOutCard" class="card" style="display:none"><h2>オフライン退勤</h2><p class="small">現在の暫定勤務を終了し、通信復旧後に自動同期します。</p><button id="clockOutBtn" class="dark">退勤する</button></section>
<section class="card"><button onclick="location.href='offline-seller.html'">オフライン券発行</button><button onclick="location.href='home.html'">ポータルへ戻る</button><div id="msg" class="small"></div></section>
</main><script>
const roleText=r=>({seller:'売り子',manager:'店長',register:'レジ',support:'サポート',cook:'調理',shopping_driver:'ドライバー',shopping_helper:'買い出し補助'})[r]||'未設定';
let state=null,snapshot=null,scanner=null,busy=false;
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
async function refresh(){snapshot=await SigmaOfflineWorkStore.getSnapshot();state=await SigmaOfflineWorkStore.getLocalWorkState();if(!snapshot){status.innerHTML='<span class="err">オフライン勤務データがありません</span>';detail.textContent='オンライン時にポータルを一度開き、最新データを保存してください。';return;}if(state?.working){status.innerHTML=`<span class="ok">勤務中：${roleText(state.role)}</span>`;detail.textContent=`出勤 ${new Date(state.clock_in).toLocaleString('ja-JP')} / 未同期の暫定状態`;clockInCard.style.display='none';clockOutCard.style.display='block';}else{status.textContent='勤務外';detail.textContent=`最終保存 ${new Date(snapshot.saved_at||snapshot.server_time||Date.now()).toLocaleString('ja-JP')}`;clockInCard.style.display='block';clockOutCard.style.display='none';}}
async function handleQr(text){if(busy)return;busy=true;try{const readAt=new Date().toISOString();const q=await SigmaOfflineWorkStore.validateQrPayload(text,readAt);const role=SigmaOfflineWorkStore.resolveRoleFromSnapshot(snapshot,readAt,120);if(!role)throw new Error('前後2時間以内にシフトがありません。店長・管理者による役割指定が必要です。');const ev={event_id:uuid(),event_type:'clock_in',occurred_at:readAt,qr_slot_at:q.slot_at,qr_token:q.token,role};await SigmaOfflineWorkStore.addEvent(ev);await SigmaOfflineWorkStore.setLocalWorkState({working:true,role,clock_in:readAt,source:'offline_qr',event_id:ev.event_id});scanMsg.innerHTML=`<span class="ok">✅ ${roleText(role)}として暫定出勤しました。</span>`;try{await scanner?.stop();}catch(_){}await refresh();}catch(e){scanMsg.innerHTML=`<span class="err">${e?.message||e}</span>`;}finally{busy=false;}}
startScan.onclick=async()=>{scanMsg.textContent='カメラを起動しています...';try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>handleQr(txt),()=>{});startScan.style.display='none';scanMsg.textContent='QRを枠内に入れてください。';}catch(e){scanMsg.innerHTML=`<span class="err">カメラを開始できません：${e?.message||e}</span>`;}};
clockOutBtn.onclick=async()=>{if(!state?.working)return;if(!confirm('オフライン退勤しますか？'))return;const now=new Date().toISOString();const ev={event_id:uuid(),event_type:'clock_out',occurred_at:now,role:state.role};await SigmaOfflineWorkStore.addEvent(ev);await SigmaOfflineWorkStore.setLocalWorkState({working:false,role:null,clock_in:null,clock_out:now,source:'offline'});msg.innerHTML='<span class="ok">✅ 暫定退勤しました。通信復旧後に同期します。</span>';await refresh();};
refresh();
</script></body></html>
