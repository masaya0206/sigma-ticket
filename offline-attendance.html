<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勤怠QR</title><meta name="theme-color" content="#b5121b">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline-work-store.js"></script>
<script src="./connection-status.js"></script>
<style>
:root{--r:#b5121b;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:white;padding:42px 18px 24px;border-radius:0 0 28px 28px}main{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;font-weight:900;font-size:16px}.primary{background:var(--r);color:#fff}.dark{background:#2c2c2e;color:#fff}.small{font-size:12px;color:var(--muted);line-height:1.6}.ok{color:var(--green);font-weight:900}.err{color:#b00020;font-weight:900}.warn{color:#9a6700;font-weight:900}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff3d6;color:#8a5a00;font-size:12px;font-weight:900}#reader{overflow:hidden;border-radius:14px;margin-top:12px}</style></head><body>
<header><h1 style="margin:0">勤怠QR</h1><p style="margin:7px 0 0;opacity:.85">オンライン・オフライン共通の出勤QR</p></header><main>
<section class="card"><span class="pill">同じQRで出勤</span><div id="status" style="margin-top:10px;font-weight:900">状態を確認中...</div><div id="detail" class="small"></div></section>
<section id="clockInCard" class="card" style="display:none"><h2>出勤</h2><p class="small">店長・管理者が表示している時間式QRを読み取ってください。オンライン時はそのままサーバーへ記録し、オフライン時は端末内へ暫定保存します。</p><div id="reader"></div><button id="startScan" class="primary">QRを読み取る</button><div id="scanMsg" class="small"></div></section>
<section id="manualRoleCard" class="card" style="display:none">
  <h2>役割を指定して出勤</h2>
  <p class="small">QRの検証は完了しています。近いシフトがないため、店長・管理者の承認で役割を指定してください。</p>
  <label class="small">役割</label>
  <select id="manualRole" style="width:100%;margin-top:6px;padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit">
    <option value="seller">売り子</option><option value="register">レジ</option><option value="support">サポート</option><option value="cook">調理</option><option value="manager">店長</option><option value="shopping_helper">買い出し補助</option><option value="shopping_driver">ドライバー</option>
  </select>
  <label class="small" style="display:block;margin-top:12px">店長・管理者パスワード</label>
  <input id="manualRolePassword" type="password" autocomplete="off" placeholder="パスワード" style="width:100%;margin-top:6px;padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit">
  <button id="manualRoleConfirmBtn" class="primary">この役割で出勤</button>
  <div id="manualRoleMsg" class="small"></div>
</section>
<section id="clockOutCard" class="card" style="display:none"><h2>退勤</h2><p class="small">現在の勤務を終了します。オフライン時は端末内へ保存し、復旧後に同期します。</p><button id="clockOutBtn" class="dark">退勤する</button></section>
<section class="card"><button onclick="location.href='offline-seller.html'">券発行</button><button onclick="location.href='offline-center.html'">オフライン対応へ戻る</button><div id="msg" class="small"></div></section>
</main><script>
const SUPABASE_URL='https://gsniytemgrbtgfywhqlu.supabase.co';
const SUPABASE_KEY='sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn';
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const roleText=r=>({seller:'売り子',manager:'店長',register:'レジ',support:'サポート',cook:'調理',shopping_driver:'ドライバー',shopping_helper:'買い出し補助'})[r]||'未設定';
let state=null,snapshot=null,scanner=null,busy=false,pendingQr=null,pendingReadAt=null;
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}

async function refreshSnapshotFromServer(){
  if(!navigator.onLine || !sb) return false;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) return false;
    const {data,error}=await sb.rpc('offline_work_snapshot');
    if(error) throw error;
    snapshot=await SigmaOfflineWorkStore.saveSnapshot(data||{});
    return true;
  }catch(e){
    console.warn('勤務スナップショット更新失敗:',e);
    return false;
  }
}

async function validateCurrentQr(text,readAt){
  try{
    return await SigmaOfflineWorkStore.validateQrPayload(text,readAt);
  }catch(e){
    const msg=String(e?.message||e);
    if(navigator.onLine && (
      msg.includes('公開鍵が端末に保存されていません') ||
      msg.includes('勤務データが保存されていません')
    )){
      const refreshed=await refreshSnapshotFromServer();
      if(refreshed){
        return await SigmaOfflineWorkStore.validateQrPayload(text,readAt);
      }
    }
    throw e;
  }
}

async function tryImmediateSync(ev){
  if(!navigator.onLine || !sb) return false;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) return false;
    const {data,error}=await sb.rpc('sync_offline_attendance_event_v2',{
      p_event_id:ev.event_id,
      p_event_type:ev.event_type,
      p_occurred_at:ev.occurred_at,
      p_qr_slot_epoch:ev.qr_slot_epoch||null,
      p_qr_key_id:ev.qr_key_id||null,
      p_qr_signature:ev.qr_signature||null,
      p_local_role:ev.role||null
    });
    if(error) throw error;
    await SigmaOfflineWorkStore.markEventSynced(ev.event_id,data||{});
    return true;
  }catch(e){
    await SigmaOfflineWorkStore.markEventError(ev.event_id,e?.message||String(e));
    return false;
  }
}

async function refresh(){
  if(navigator.onLine) await refreshSnapshotFromServer();
  snapshot=await SigmaOfflineWorkStore.getSnapshot();
  state=await SigmaOfflineWorkStore.getLocalWorkState();
  if(!snapshot){
    status.innerHTML='<span class="err">勤務データがありません</span>';
    detail.textContent='オンライン時にポータルを一度開き、最新データを保存してください。';
    return;
  }
  if(state?.working){
    status.innerHTML=`<span class="ok">勤務中：${roleText(state.role)}</span>`;
    detail.textContent=`出勤 ${new Date(state.clock_in).toLocaleString('ja-JP')} / ${state.source==='server'?'同期済み':'端末内記録'}`;
    clockInCard.style.display='none';clockOutCard.style.display='block';
  }else{
    status.textContent='勤務外';
    detail.textContent=`最終保存 ${new Date(snapshot.saved_at||snapshot.server_time||Date.now()).toLocaleString('ja-JP')}`;
    clockInCard.style.display='block';clockOutCard.style.display='none';
  }
}

async function handleQr(text){
  if(busy)return;busy=true;
  try{
    const readAt=new Date().toISOString();
    const q=await validateCurrentQr(text,readAt);
    const role=SigmaOfflineWorkStore.resolveRoleFromSnapshot(snapshot,readAt,120);

    if(!role){
      pendingQr=q; pendingReadAt=readAt;
      scanMsg.innerHTML='<span class="ok">✅ QRの署名と時刻は正常です。</span><br><span class="warn">近いシフトがありません。下で役割と承認パスワードを入力してください。</span>';
      manualRoleCard.style.display='block';
      manualRolePassword.value=''; manualRoleMsg.textContent='';
      try{await scanner?.stop();}catch(_){ }
      startScan.style.display='block';
      return;
    }

    const ev={
      event_id:uuid(),event_type:'clock_in',occurred_at:readAt,
      qr_version:q.qr_version,qr_slot_epoch:q.slot_epoch,
      qr_key_id:q.key_id,qr_signature:q.signature,role
    };
    await SigmaOfflineWorkStore.addEvent(ev);
    await SigmaOfflineWorkStore.setLocalWorkState({working:true,role,clock_in:readAt,source:navigator.onLine?'pending_online_qr':'offline_qr',event_id:ev.event_id});

    const synced=await tryImmediateSync(ev);
    if(synced){
      await SigmaOfflineWorkStore.setLocalWorkState({working:true,role,clock_in:readAt,source:'server',event_id:ev.event_id});
      scanMsg.innerHTML=`<span class="ok">✅ ${roleText(role)}として出勤しました。</span>`;
    }else{
      scanMsg.innerHTML=`<span class="ok">✅ ${roleText(role)}として暫定出勤しました。通信復旧後に同期します。</span>`;
    }
    try{await scanner?.stop();}catch(_){}
    await refresh();
  }catch(e){scanMsg.innerHTML=`<span class="err">${e?.message||e}</span>`;}
  finally{busy=false;}
}

manualRoleConfirmBtn.onclick=async()=>{
  if(!pendingQr||!pendingReadAt){manualRoleMsg.innerHTML='<span class="err">先に勤怠QRを読み取ってください。</span>';return;}
  const role=manualRole.value;
  const password=manualRolePassword.value;
  if(!password){manualRoleMsg.innerHTML='<span class="err">店長・管理者パスワードを入力してください。</span>';return;}
  manualRoleConfirmBtn.disabled=true; manualRoleMsg.textContent='確認中...';
  try{
    const proof=await SigmaOfflineWorkStore.managerPasswordProof(password);
    if(navigator.onLine&&sb){
      const {data,error}=await sb.rpc('approve_shiftless_clock_in_v91',{
        p_role:role,p_password_proof:proof,p_occurred_at:pendingReadAt,
        p_qr_slot_epoch:pendingQr.slot_epoch,p_qr_key_id:pendingQr.key_id,p_qr_signature:pendingQr.signature
      });
      if(error) throw error;
      await SigmaOfflineWorkStore.setLocalWorkState({working:true,role,clock_in:pendingReadAt,source:'server_shiftless',event_id:data?.event_id||null});
      scanMsg.innerHTML=`<span class="ok">✅ ${roleText(role)}として出勤しました。</span>`;
    }else{
      const ok=await SigmaOfflineWorkStore.verifyManagerPassword(password);
      if(!ok) throw new Error('パスワードが違います');
      const ev={event_id:uuid(),event_type:'clock_in_manual_role',occurred_at:pendingReadAt,
        qr_version:pendingQr.qr_version,qr_slot_epoch:pendingQr.slot_epoch,qr_key_id:pendingQr.key_id,
        qr_signature:pendingQr.signature,role,password_proof:proof};
      await SigmaOfflineWorkStore.addEvent(ev);
      await SigmaOfflineWorkStore.setLocalWorkState({working:true,role,clock_in:pendingReadAt,source:'offline_shiftless',event_id:ev.event_id});
      scanMsg.innerHTML=`<span class="ok">✅ ${roleText(role)}として暫定出勤しました。通信復旧後に同期します。</span>`;
    }
    pendingQr=null; pendingReadAt=null; manualRoleCard.style.display='none';
    await refresh();
  }catch(e){manualRoleMsg.innerHTML=`<span class="err">${e?.message||e}</span>`;}
  finally{manualRoleConfirmBtn.disabled=false;}
};

startScan.onclick=async()=>{
  scanMsg.textContent='カメラを起動しています...';
  try{
    scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>handleQr(txt),()=>{});
    startScan.style.display='none';scanMsg.textContent='QRを枠内に入れてください。';
  }catch(e){scanMsg.innerHTML=`<span class="err">カメラを開始できません：${e?.message||e}</span>`;}
};

clockOutBtn.onclick=async()=>{
  if(!state?.working)return;
  if(!confirm('退勤しますか？'))return;
  const now=new Date().toISOString();
  const ev={event_id:uuid(),event_type:'clock_out',occurred_at:now,role:state.role};
  await SigmaOfflineWorkStore.addEvent(ev);
  const synced=await tryImmediateSync(ev);
  await SigmaOfflineWorkStore.setLocalWorkState({working:false,role:null,clock_in:null,clock_out:now,source:synced?'server':'offline'});
  msg.innerHTML=synced?'<span class="ok">✅ 退勤しました。</span>':'<span class="ok">✅ 暫定退勤しました。通信復旧後に同期します。</span>';
  await refresh();
};
refresh();
</script></body></html>
