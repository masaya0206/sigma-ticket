<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新聞限定 50円OFF | Match Point</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b5121b;--ink:#241f1d;--muted:#756c68;--line:#eadfdb;}
*{box-sizing:border-box}
body{margin:0;background:#f7f4f2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:26px 18px 42px}
.brand{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--red);text-align:center;margin-bottom:10px}
.card{background:#fff;border-radius:24px;padding:26px 20px;box-shadow:0 12px 36px rgba(47,34,29,.08);text-align:center}
.kicker{font-size:14px;font-weight:800;color:var(--muted)}
.discount{font-size:56px;line-height:1;font-weight:1000;color:var(--red);margin:12px 0 8px}
.discount small{font-size:24px}
.title{font-size:22px;font-weight:900;margin:0 0 8px}
.note{font-size:13px;color:var(--muted);line-height:1.65}
.qrbox{margin:22px auto 14px;width:min(260px,78vw);padding:12px;background:#fff;border-radius:16px}
.qrbox img{display:block;width:100%;height:auto}
.rule{margin:20px 0 0;padding-top:18px;border-top:1px dashed var(--line);font-size:13px;line-height:1.75;text-align:left}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#fff3f3;color:var(--red);font-size:12px;font-weight:800;margin-top:10px}
.invalid{color:#9b1c24;background:#fff0f0;padding:16px;border-radius:16px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MATCH POINT × 第15回紫熊祭</div>
  <div class="card" id="couponCard">
    <div class="kicker">新聞を見た方限定</div>
    <div class="discount">50<small>円OFF</small></div>
    <h1 class="title">新聞クーポン</h1>
    <div class="badge">レジでこのQRを提示してください</div>

    <div class="qrbox">
      <img src="newspaper-coupon-qr.png" alt="新聞50円OFFクーポンQR">
    </div>

    <div class="rule">
      ・通常購入のお会計から50円引きします。<br>
      ・前売り券・当日券との併用はできません。<br>
      ・同じQRを何度でも提示できます。<br>
      ・QRのURLは固定です。ページのデザイン変更は、印刷済みQRにもそのまま反映されます。
    </div>
    <p id="status" class="note">クーポン状態を確認しています...</p>
  </div>
</div>
<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);
(async()=>{
  const {data,error}=await sb.rpc("public_newspaper_coupon_status");
  const status=document.getElementById("status");
  if(error){
    status.textContent="レジでクーポン状態を確認してください。";
    return;
  }
  if(!data?.issued || !data?.active){
    document.getElementById("couponCard").innerHTML=
      '<div class="invalid">この新聞クーポンは現在利用できません。</div>';
    return;
  }
  status.textContent="利用可能です。";
})();
</script>
</body>
</html>
