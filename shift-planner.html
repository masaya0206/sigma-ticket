<title>シフト調整へ移動</title>
<style>

.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(74,25,25,.07)}

<main><div class="card">

<button onclick="location.href='shift-editor.html'">希望シフト調整を開く</button>
</div></main>
<script>setTimeout(()=>location.replace("shift-editor.html"),800);</script>
