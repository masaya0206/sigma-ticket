<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Point 提携特典</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--red:#b5121b;--red2:#8f0e15;--soft:#fff1f2;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px} header p{margin:7px 0 0;color:#ffe0e2;font-size:13px;line-height:1.6}
main{max-width:680px;margin:auto;padding:16px 16px 36px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.05)}
h2{margin:0 0 12px;font-size:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d8ceca;border-radius:13px;background:#fff;font:inherit}
textarea{min-height:88px;resize:vertical}
button,.btn{width:100%;display:block;text-align:center;padding:13px;border:0;border-radius:13px;background:var(--red);color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;margin-top:10px}
.secondary{background:var(--soft);color:var(--red)}
.success{background:#edf9ef;border-color:#b9e5c1} .danger{background:#fff0f0;border-color:#f0b8b8}
.small{font-size:12px;color:var(--muted);line-height:1.6} .muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee} .row:last-child{border-bottom:0}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--red);font-size:11px;font-weight:900}
.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
pre{white-space:pre-wrap;word-break:break-all;background:#faf7f5;padding:10px;border-radius:10px;font-size:11px}
</style>
</head>
<body>

<header><h1>Match Point 提携特典</h1><p>Match Pointの前売り券を持っている方が利用できる提携サービスです。</p></header>
<main>
  <div id="benefits"><div class="card">読み込み中...</div></div>
</main>

<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
(async()=>{
  const {data,error}=await sb.rpc("public_partner_benefits");

  if(error){
    benefits.innerHTML=`<div class="card danger">エラー：${esc(error.message)}</div>`;
    return;
  }

  const groups=new Map();

  for(const row of (data||[])){
    const key=String(row.partner_name||"").trim();

    if(!groups.has(key)){
      groups.set(key,{
        partner_name:row.partner_name,
        instagram_url:row.instagram_url,
        benefits:[]
      });
    }

    groups.get(key).benefits.push(row);
  }

  const rows=Array.from(groups.values());

  benefits.innerHTML=rows.length
    ? rows.map(group=>`
        <div class="card">
          <h2>${esc(group.partner_name)}</h2>

          ${group.benefits.map((x,index)=>`
            <div style="${index>0?"border-top:1px solid #eee;padding-top:14px;margin-top:14px;":""}">
              <div style="font-size:21px;font-weight:900">
                ${esc(x.benefit_title)}
              </div>

              ${x.description
                ? `<div class="small" style="margin-top:8px">${esc(x.description)}</div>`
                : ""}

              <div style="margin-top:10px">
                <span class="pill">${esc(x.valid_label)}</span>
              </div>
            </div>
          `).join("")}

          ${group.instagram_url
            ? `<a class="btn instagram" href="${esc(group.instagram_url)}" target="_blank" rel="noopener">${esc(group.partner_name)} Instagram</a>`
            : ""}
        </div>
      `).join("")
    : '<div class="card">現在利用できる提携特典はありません。</div>';
})();

</script>
</body>
</html>
