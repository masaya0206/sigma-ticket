<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Point クーポン</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--red:#b5121b;--red2:#8f0e15;--soft:#fff1f2;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px} header p{margin:7px 0 0;color:#ffe0e2;font-size:13px;line-height:1.6}
main{max-width:680px;margin:auto;padding:16px 16px 36px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.05)}
h2{margin:0 0 12px;font-size:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d8ceca;border-radius:13px;background:#fff;font:inherit}
textarea{min-height:88px;resize:vertical}
button,.btn{width:100%;display:block;text-align:center;padding:13px;border:0;border-radius:13px;background:var(--red);color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;margin-top:10px}
.secondary{background:var(--soft);color:var(--red)}
.success{background:#edf9ef;border-color:#b9e5c1} .danger{background:#fff0f0;border-color:#f0b8b8}
.small{font-size:12px;color:var(--muted);line-height:1.6} .muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee} .row:last-child{border-bottom:0}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--red);font-size:11px;font-weight:900}
.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
pre{white-space:pre-wrap;word-break:break-all;background:#faf7f5;padding:10px;border-radius:10px;font-size:11px}

.coupon-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 2px 10px}.coupon-head h2{margin:0;font-size:21px}.coupon-hint{font-size:11px;color:var(--muted);white-space:nowrap}.coupon-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 2px 12px;scrollbar-width:none}.coupon-rail::-webkit-scrollbar{display:none}.coupon{position:relative;flex:0 0 min(84%,370px);scroll-snap-align:start;background:linear-gradient(180deg,#fffaf9,#fff);border:1.5px solid #efc7cb;border-radius:22px;padding:18px;box-shadow:0 8px 22px rgba(74,25,25,.07);overflow:hidden}.coupon::before,.coupon::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid #efc7cb}.coupon::before{left:-12px}.coupon::after{right:-12px}.coupon-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.coupon-label{display:inline-flex;align-items:center;gap:7px;color:var(--red);font-size:12px;font-weight:950}.coupon-label::before{content:"COUPON";padding:5px 8px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;letter-spacing:.1em}.coupon-valid{padding:6px 10px;border-radius:999px;background:#ffe9eb;color:var(--red);font-size:11px;font-weight:900}.coupon-cut{margin:14px -18px;border-top:2px dashed #edcfd2}.coupon-partner{font-size:13px;font-weight:800;color:#555}.coupon-title{font-size:25px;font-weight:950;line-height:1.28;margin-top:8px}.coupon-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-top:10px}.coupon-use{margin-top:14px;padding:11px 12px;border-radius:13px;background:#fff4f5;color:#7f252b;font-size:12px;font-weight:800;line-height:1.55}.coupon-instagram{display:block;margin-top:12px;padding:12px 14px;border:1px solid #ead1d4;border-radius:13px;background:#fff;color:#333;text-decoration:none;text-align:center;font-size:13px;font-weight:900}@media(max-width:420px){.coupon{flex-basis:88%}.coupon-title{font-size:23px}}
</style>
</head>
<body>

<header><h1>Match Point クーポン</h1><p>前売り券を持っている方が利用できる提携クーポンです。</p></header>
<main>
  <div id="benefits"><div class="card">読み込み中...</div></div>
</main>

<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
(async()=>{
  const {data,error}=await sb.rpc("public_partner_benefits");

  if(error){
    benefits.innerHTML=`<div class="card danger">エラー：${esc(error.message)}</div>`;
    return;
  }

  const coupons=(data||[]).map(x=>({
    partner_name:x.partner_name,
    instagram_url:x.instagram_url,
    title:x.benefit_title,
    description:x.description,
    valid_label:x.valid_label
  }));

  benefits.innerHTML=coupons.length
    ? `<div class="coupon-head"><h2>使えるクーポン</h2><div class="coupon-hint">横にスワイプ →</div></div><div class="coupon-rail">${coupons.map(c=>`<article class="coupon"><div class="coupon-top"><div class="coupon-label">提携クーポン</div><span class="coupon-valid">${esc(c.valid_label||"利用可能")}</span></div><div class="coupon-cut"></div><div class="coupon-partner">発行元：${esc(c.partner_name)}</div><div class="coupon-title">${esc(c.title)}</div>${c.description?`<div class="coupon-desc">${esc(c.description)}</div>`:""}<div class="coupon-use">利用時に前売り券QRを提携先スタッフへ提示してください。</div>${c.instagram_url?`<a class="coupon-instagram" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">Instagramを見る</a>`:""}</article>`).join("")}</div>`
    : '<div class="card">現在利用できるクーポンはありません。</div>';
})();

</script>
</body>
</html>
