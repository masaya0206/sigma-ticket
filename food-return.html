<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>出勤予定・食材受取</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#302b2d;background:#f9f5f6}body{margin:0}main{max-width:850px;margin:auto;padding:16px}h1{color:#9f1f2b;margin:10px 0}button{cursor:pointer;background:#a21f30;color:white;border:0;border-radius:10px;padding:11px;font-weight:700}button.secondary{background:#eee1e3;color:#7a1d29}.card{border:1px solid #eadcdf;border-radius:14px;background:white;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#756d70;font-size:13px}.item{border-top:1px solid #eadcdf;padding:12px 0}.item:first-child{border:0}.pill{border-radius:20px;padding:4px 9px;background:#f8e8df;color:#995012;font-size:12px}input,select{border:1px solid #d7c5ca;border-radius:8px;padding:10px;font-size:16px;max-width:100%;box-sizing:border-box}input[type=number]{width:105px}.summary{background:#f9edef;border-radius:12px;padding:11px}#message{position:sticky;top:0;background:#fff7de;padding:10px;border-radius:8px;display:none;z-index:2}
</style></head><body><main><nav class="row"><button class="secondary" onclick="location.href='home.html'">← ポータル</button><button class="secondary" onclick="location.href='prep-shopping.html'">食材保存</button></nav><h1>出勤予定・食材受取</h1><p class="muted">管理者・店長専用。預け完了の食材について、持参した数量を別記録します。保存ポイントは変更しません。</p><div id="message"></div><div class="card"><div class="row"><label>対象日 <input id="date" type="date"></label><label>表示 <select id="scope"><option value="scheduled">シフト予定者</option><option value="all">シフトなしを含む全員</option></select></label><button onclick="load()">更新</button></div><p class="muted">シフトは確定・固定・手動割当を参照。数量はスタッフ・食材・預け記録単位で管理します。</p></div><div id="summary" class="summary">読み込み中…</div><div id="people"></div></main><script>
const sb=supabase.createClient('https://gsniytemgrbtgfywhqlu.supabase.co','sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn');
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];
function show(s){el('message').textContent=s;el('message').style.display='block'}
function dayISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateRange(){let v=el('date').value;return {from:new Date(v+'T00:00:00+09:00').toISOString(),to:new Date(new Date(v+'T00:00:00+09:00').getTime()+86400000).toISOString()}}
function hm(v){return v?new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'未設定'}
function num(n){return Number(Number(n).toFixed(4))}
async function load(){try{const {from,to}=dateRange();const r=await sb.rpc('prep_food_return_overview',{p_from:from,p_to:to});if(r.error)throw r.error;data=r.data||[];render();el('message').style.display='none'}catch(e){show('取得できません：'+e.message)}}
function render(){let grouped=new Map(),all=el('scope').value==='all';for(const x of data){if(!all&&!x.shift_start)continue;let key=x.user_id;if(!grouped.has(key))grouped.set(key,{name:x.name,start:x.shift_start,end:x.shift_end,contacted:x.contacted_at,rows:[]});grouped.get(key).rows.push(x)}let total=[...grouped.values()].reduce((n,g)=>n+g.rows.length,0);el('summary').textContent=`対象 ${grouped.size}名・食材記録 ${total}件（未持参分）`;el('people').innerHTML=[...grouped].map(([uid,g])=>`<div class="card"><div class="row"><div><b>${esc(g.name)}</b><div class="muted">シフト ${g.start?hm(g.start)+'〜'+hm(g.end):'未設定'}</div></div><span class="pill">${g.contacted?'連絡記録あり':'連絡未記録'}</span></div><div class="row" style="margin-top:10px"><button class="secondary" data-contact="${esc(uid)}">電話などで連絡した記録を保存</button></div>${g.rows.map(x=>`<div class="item"><div class="row"><b>${esc(x.item_name)}</b><span>預け ${num(x.stored)}${esc(x.unit)} / 持参済 ${num(x.returned)}${esc(x.unit)} / <b>残 ${num(x.remaining)}${esc(x.unit)}</b></span></div><div class="row" style="margin-top:8px"><label>今回受取 <input type="number" min="0.0001" step="any" max="${num(x.remaining)}" value="${num(x.remaining)}" data-qty="${esc(x.handoff_id)}"></label><button data-receive="${esc(x.handoff_id)}">受取を記録</button></div></div>`).join('')}</div>`).join('')||'<div class="card">この条件で未持参の食材はありません。</div>';document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>contact(b.dataset.contact));document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>receive(b.dataset.receive));}
async function contact(uid){let note=prompt('連絡メモ（任意）','持参のお願い');if(note===null)return;let r=await sb.rpc('prep_food_return_contact',{p_user:uid,p_day:el('date').value,p_note:note});if(r.error)show('保存失敗：'+r.error.message);else{show('連絡状況を保存しました');await load()}}
async function receive(id){const x=data.find(y=>String(y.handoff_id)===String(id));if(!x)return;const input=[...document.querySelectorAll('[data-qty]')].find(i=>i.dataset.qty===String(id));const q=Number(input.value);if(!Number.isFinite(q)||q<=0||q>Number(x.remaining)){show('受取数量を確認してください');return}if(!confirm(`${x.name}：${x.item_name} を ${q}${x.unit} 受け取りましたか？`))return;const note=prompt('受取メモ（任意）','');if(note===null)return;const r=await sb.rpc('prep_food_return_receive',{p_handoff_id:id,p_quantity:q,p_note:note});if(r.error)show('受取記録エラー：'+r.error.message);else{await load();show('受取を記録しました')}}
el('scope').onchange=render;el('date').value=dayISO(new Date());(async()=>{let a=await sb.auth.getUser();if(!a.data.user){show('ログインが必要です');return}load()})();
</script></body></html>
