<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遠隔レジ権限管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#f7f4f2;margin:0}header{background:#b5121b;color:white;padding:25px}main{max-width:650px;margin:auto;padding:15px}.item{display:flex;align-items:center;justify-content:space-between;background:white;padding:12px;margin:8px 0;border-radius:12px}button{padding:12px;border:0;border-radius:10px;background:#b5121b;color:white}a{color:#b5121b}</style></head><body><header><h1>遠隔レジ権限管理</h1></header><main><a href="home.html">← ホーム</a><p>権限を与えても店長・管理者にはなりません。</p><p id="message">読み込み中…</p><div id="list"></div></main><script>const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const {data,error}=await sb.rpc('admin_remote_register_staff');if(error){document.getElementById('message').textContent='管理者のみ利用可能です：'+error.message;return;}document.getElementById('message').textContent='有効なスタッフに遠隔レジ権限を付与・解除できます。';
 document.getElementById('list').innerHTML=data.map(x=>`<div class="item"><span>${esc(x.staff_name)}${x.is_active?'':'（無効）'}</span><button data-uid="${x.user_id}" data-next="${!x.remote_allowed}">${x.remote_allowed?'解除':'付与'}</button></div>`).join('');
 document.querySelectorAll('[data-uid]').forEach(btn=>btn.onclick=async()=>{const enabled=btn.dataset.next==='true';if(!confirm(`遠隔レジ権限を${enabled?'付与':'解除'}しますか？`))return;btn.disabled=true;const {error}=await sb.rpc('admin_set_remote_register_access',{p_user:btn.dataset.uid,p_enabled:enabled});if(error)alert(error.message);await load();});}
load();</script></body></html>
