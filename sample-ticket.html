<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シグマ祭 見本券</title>
<meta name="theme-color" content="#b5121b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#b5121b;--red2:#8f0e15;--ink:#191919;--muted:#707070;--bg:#f6f3f1;--card:#fff;--line:#eadfdb;--green:#eaf7eb;--soft:#fff1f2}
*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:28px}
.wrap{max-width:560px;margin:auto;padding:0 16px 36px}
.hero{margin:0 -16px 18px;padding:28px 22px 24px;background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;border-radius:0 0 28px 28px}
.hero .eyebrow{font-size:12px;font-weight:800;opacity:.85;letter-spacing:.08em}.hero h1{margin:5px 0 0;font-size:30px}.hero p{margin:7px 0 0;font-size:13px;opacity:.9}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(58,25,20,.06);overflow:hidden}
.control h2,.status h2{margin:0 0 10px}.control label{display:block;margin-top:12px;font-size:13px;font-weight:800;color:#4e4947}.control input{width:100%;padding:13px 14px;margin-top:6px;border:1px solid #ddd2ce;border-radius:13px;background:#fff;font:inherit;font-size:16px}
button,.btn{display:block;width:100%;padding:15px;border:0;border-radius:15px;background:var(--red);color:#fff;font:inherit;font-weight:900;text-decoration:none;text-align:center;margin-top:12px;cursor:pointer}.secondary{background:var(--soft);color:var(--red)}.ghost{background:#fff;color:var(--red);border:1px solid #e7bcc0}
.notice{padding:14px 15px;border-radius:16px;background:#fff4df;border:1px solid #f0d8ab;font-size:13px;line-height:1.65;color:#624a1f;font-weight:700}
.ticket{background:linear-gradient(180deg,#fff,#fffaf8);padding-top:26px}.ticket-title{text-align:center;font-size:14px;color:var(--muted);font-weight:800}.product{text-align:center;font-size:25px;font-weight:950;margin:6px 0 14px;line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#faf7f5;border-radius:14px;padding:12px}.info span{display:block;font-size:11px;color:var(--muted)}.info b{display:block;margin-top:3px;font-size:15px;word-break:break-word}
.sample-ribbon{position:absolute;top:19px;right:-44px;width:180px;transform:rotate(38deg);padding:7px 0;background:#b5121b;color:#fff;text-align:center;font-size:12px;font-weight:950;letter-spacing:.16em;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sample-watermark{pointer-events:none;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-18deg);font-size:70px;font-weight:950;letter-spacing:.08em;color:rgba(181,18,27,.07);white-space:nowrap}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#fff0f0;color:#b5121b;font-size:12px;font-weight:900}.badge-wrap{text-align:center;margin:0 0 12px}
#qrcode{display:flex;justify-content:center;margin:20px auto 12px;padding:14px;background:#fff;width:max-content;max-width:100%;border-radius:18px;border:1px solid #eee}.code{text-align:center;font-size:12px;color:var(--muted);word-break:break-all}.note{text-align:center;color:var(--muted);font-size:13px;line-height:1.7}

.coupon-section{margin:18px 0 4px}
.coupon-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 2px 10px}
.coupon-section-title{font-size:21px;font-weight:950;line-height:1.2}
.coupon-section-hint{font-size:11px;color:var(--muted);white-space:nowrap}
.coupon-rail{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.coupon-rail::-webkit-scrollbar{display:none}
.coupon-card{position:relative;flex:0 0 min(84%,370px);scroll-snap-align:start;background:linear-gradient(180deg,#fffaf9 0%,#fff 100%);border:1.5px solid #efc7cb;border-radius:22px;padding:18px;box-shadow:0 8px 22px rgba(74,25,25,.07);overflow:hidden}
.coupon-card::before,.coupon-card::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid #efc7cb}
.coupon-card::before{left:-12px}.coupon-card::after{right:-12px}
.coupon-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.coupon-mark{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:950;letter-spacing:.08em;color:var(--red)}
.coupon-mark::before{content:"COUPON";display:inline-block;padding:5px 8px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;letter-spacing:.10em}
.coupon-valid{display:inline-block;padding:6px 10px;background:#ffe9eb;color:var(--red);font-size:11px;font-weight:900;border-radius:999px;white-space:nowrap}
.coupon-divider{margin:14px -18px 14px;border-top:2px dashed #edcfd2}
.coupon-partner{font-size:13px;font-weight:800;color:#555}
.coupon-title{font-size:25px;font-weight:950;line-height:1.28;margin-top:8px;letter-spacing:-.01em}
.coupon-description{font-size:13px;color:var(--muted);line-height:1.7;margin-top:10px}
.coupon-howto{margin-top:14px;padding:11px 12px;border-radius:13px;background:#fff4f5;color:#7f252b;font-size:12px;font-weight:800;line-height:1.55}
.coupon-instagram{display:block;margin-top:12px;padding:12px 14px;border:1px solid #ead1d4;border-radius:13px;background:#fff;color:#333;text-decoration:none;text-align:center;font-size:13px;font-weight:900}
.coupon-empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--muted);font-size:13px}

.coupon-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.coupon-spot{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#eef6ff;color:#174a88;font-size:12px;font-weight:900}
.coupon-map-btn{display:block;margin-top:12px;padding:12px 14px;border:1px solid #ead1d4;border-radius:13px;background:#fff;color:var(--red);text-decoration:none;text-align:center;font-size:13px;font-weight:900}
.map-launch-title{font-size:19px;font-weight:950}
.map-launch-text{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.map-modal{position:fixed;inset:0;background:rgba(18,12,12,.52);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:9999}
.map-modal.show{display:flex}
.map-sheet{width:min(100%,720px);max-height:min(92vh,900px);overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.22)}
.map-sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.map-sheet-title{font-size:22px;font-weight:950;line-height:1.2}
.map-sheet-sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.6}
.map-close{width:auto;margin:0;padding:10px 13px;border-radius:12px;background:#fff1f2;color:var(--red);font-size:14px}
.map-image-wrap{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:18px;background:#faf7f5}
.map-image{display:block;width:100%;height:auto;border-radius:12px}
.map-caption{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}
.map-store-list{display:grid;gap:10px;margin-top:14px}
.map-store{padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:#faf7f5}
.map-store.active{border-color:#d9a0a6;background:#fff1f2;box-shadow:0 0 0 3px rgba(181,18,27,.08)}
.map-store-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.map-store-name{font-weight:900;line-height:1.45}
.map-store-num{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:999px;background:#eef6ff;color:#174a88;font-size:12px;font-weight:900;white-space:nowrap}
.map-store-note{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}

@media(max-width:420px){.coupon-card{flex-basis:88%;}.coupon-title{font-size:23px}}

.small{font-size:12px;color:var(--muted);line-height:1.65}
.top-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.top-actions button{margin-top:0}
@media(max-width:420px){.grid,.top-actions{grid-template-columns:1fr}.product{font-size:22px}.sample-watermark{font-size:52px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">MATCH POINT × 第十五回紫熊祭</div>
    <h1>見本券発行</h1>
    <p>提携先への説明専用。販売実績には一切入りません。</p>
  </div>

  <div id="controlArea" class="card control">
    <h2>見本券を作る</h2>
    <div class="notice">この見本券は実際のチケットではありません。売上・販売枚数・ポイント・ノルマ・受取処理・商品交換には一切反映されません。27日以降も見本として使用できます。</div>
    <label>表示する販売者名</label>
    <input id="sellerInput" value="Match Point スタッフ" maxlength="40">
    <label>表示する購入者名</label>
    <input id="buyerInput" value="提携先ご担当者様" maxlength="40">
    <button onclick="generateSample()">見本券を発行</button>
    <button class="ghost" onclick="location.href='admin-menu.html'">管理者メニューに戻る</button>
  </div>

  <div id="previewArea"></div>
</div>
<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);
const params=new URLSearchParams(location.search);

const PARTNER_TENT_LOOKUP=[
  {tent:19,display_name:"生協組織部",aliases:["組織部","生協組織部"]},
  {tent:10,display_name:"文芸部・セピア",aliases:["熊大文芸部 セピア","文芸部・セピア","文芸部セピア","セピア"]}
];
let currentCouponMapPartners=[];
function normalizePartnerName(v){return String(v??"").toLowerCase().replace(/熊本大学/g,"熊大").replace(/[\s　・･\-ー―_]/g,"");}
function resolvePartnerLocation(name){
  const target=normalizePartnerName(name);
  if(!target) return null;
  for(const item of PARTNER_TENT_LOOKUP){
    const names=[item.display_name].concat(item.aliases||[]);
    for(const n of names){
      const x=normalizePartnerName(n);
      if(!x) continue;
      if(target===x || target.includes(x) || x.includes(target)) return item;
    }
  }
  return null;
}
function buildMapPartners(coupons){
  const out=[]; const seen=new Set();
  for(const c of coupons){
    const loc=resolvePartnerLocation(c.partner_name);
    if(!loc) continue;
    const key=loc.tent+"|"+loc.display_name;
    if(seen.has(key)) continue;
    seen.add(key);
    out.push({partner_name:c.partner_name,display_name:loc.display_name,tent:loc.tent});
  }
  return out.sort((a,b)=>a.tent-b.tent);
}
function samePartner(a,b){
  const ra=resolvePartnerLocation(a); const rb=resolvePartnerLocation(b);
  if(ra&&rb) return ra.tent===rb.tent;
  return normalizePartnerName(a)===normalizePartnerName(b);
}
function mapLaunchHtml(){
  return currentCouponMapPartners.length?`<div class="card"><div class="map-launch-title">🗺️ クーポン店舗マップ</div><div class="map-launch-text">クーポンが使える店舗の位置をテント配置図で確認できます。</div><button onclick="openCouponMap()">マップを見る</button></div>`:"";
}
function mapModalHtml(){
  if(!currentCouponMapPartners.length) return "";
  return `<div id="couponMapModal" class="map-modal" onclick="if(event.target===this)closeCouponMap()"><div class="map-sheet"><div class="map-sheet-head"><div><div class="map-sheet-title">クーポン店舗マップ</div><div class="map-sheet-sub">下の地図でテント番号を確認してください。各店舗の場所は一覧にもまとめています。</div></div><button type="button" class="map-close" onclick="closeCouponMap()">閉じる</button></div><div class="map-image-wrap"><img class="map-image" src="./coupon-map.png" alt="シグマ祭のテント配置図。クーポン店舗のテント番号確認用"><div class="map-caption">※ 地図内の番号と、下の店舗一覧の「テント番号」を対応させて見てください。</div></div><div id="couponMapList" class="map-store-list"></div></div></div>`;
}
function renderCouponMapList(activeName=""){
  const list=document.getElementById("couponMapList");
  if(!list) return;
  list.innerHTML=currentCouponMapPartners.map(p=>`<div class="map-store ${activeName&&samePartner(activeName,p.partner_name)?'active':''}" data-tent="${p.tent}"><div class="map-store-top"><div class="map-store-name">${esc(p.partner_name)}</div><span class="map-store-num">テント ${p.tent}</span></div><div class="map-store-note">地図内の番号 ${p.tent} を探してください。</div></div>`).join("");
  const active=list.querySelector(".map-store.active");
  if(active) active.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function openCouponMapByName(encodedName){openCouponMap(decodeURIComponent(encodedName||""));}
function openCouponMap(activeName=""){
  const modal=document.getElementById("couponMapModal");
  if(!modal) return;
  renderCouponMapList(activeName);
  modal.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeCouponMap(){
  const modal=document.getElementById("couponMapModal");
  if(!modal) return;
  modal.classList.remove("show");
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCouponMap();});

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function sampleCode(){return "SAMPLE-"+Math.random().toString(36).slice(2,10).toUpperCase();}
function buildShareUrl(seller,buyer,code){
  const u=new URL(location.href);u.search="";
  u.searchParams.set("view","1");u.searchParams.set("seller",seller);u.searchParams.set("buyer",buyer);u.searchParams.set("code",code);
  return u.toString();
}
async function partnerHtml(ticketKind){
  const {data,error}=await sb.rpc("public_partner_benefits");
  if(error || !data || data.length===0) return "";

  const coupons=(data||[]).map(row=>({
    partner_name:row.partner_name,
    instagram_url:row.instagram_url,
    title:row.benefit_title,
    description:row.description,
    valid_label:row.valid_label
  }));
  currentCouponMapPartners=buildMapPartners(coupons);

  return `
    ${mapLaunchHtml()}
    <section class="coupon-section" aria-label="使えるクーポン">
      <div class="coupon-section-head">
        <div class="coupon-section-title">🎟️ 使えるクーポン</div>
        <div class="coupon-section-hint">横にスワイプ →</div>
      </div>
      <div class="coupon-rail">
        ${coupons.map(c=>{
          const loc=resolvePartnerLocation(c.partner_name);
          return `
          <article class="coupon-card">
            <div class="coupon-top">
              <div class="coupon-mark">提携クーポン</div>
              <span class="coupon-valid">${esc(c.valid_label||"利用可能")}</span>
            </div>
            <div class="coupon-divider"></div>
            <div class="coupon-partner">発行元：${esc(c.partner_name)}</div>
            <div class="coupon-title">${esc(c.title)}</div>
            ${c.description?`<div class="coupon-description">${esc(c.description)}</div>`:""}
            ${loc?`<div class="coupon-meta"><span class="coupon-spot">場所：テント ${loc.tent}</span></div><button type="button" class="coupon-map-btn" onclick="openCouponMapByName('${encodeURIComponent(c.partner_name)}')">地図で場所を見る</button>`:""}
            <div class="coupon-howto">※見本表示です。本物の前売り券QRを提示すると利用できます。</div>
            ${c.instagram_url?`<a class="coupon-instagram" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">Instagramを見る</a>`:""}
          </article>
          `;
        }).join("")}
      </div>
    </section>
    ${mapModalHtml()}
  `;
}
async function renderSample(seller,buyer,code){
  const shareUrl=buildShareUrl(seller,buyer,code);
  const partner=await partnerHtml();
  document.getElementById("previewArea").innerHTML=`
    <div class="card ticket">
      <div class="sample-ribbon">SAMPLE</div><div class="sample-watermark">SAMPLE</div>
      <div class="ticket-title">シグマ祭 前売り券</div>
      <div class="product">前売り券（炒飯1個 / 胡麻団子2個）</div>
      <div class="badge-wrap"><span class="badge">見本・利用不可</span></div>
      <div class="grid"><div class="info"><span>販売者</span><b>${esc(seller)}</b></div><div class="info"><span>購入者</span><b>${esc(buyer)}</b></div></div>
      <div id="qrcode"></div><div class="code">${esc(code)}</div>
      <div class="top-actions"><button class="secondary" onclick="copyText('${encodeURIComponent(shareUrl)}')">見本URLをコピー</button><button class="secondary" onclick="shareSample('${encodeURIComponent(shareUrl)}')">共有</button></div>
      <p class="note">このQRコードも見本ページに移動するだけです。<br>レジでの使用・商品交換・ポイント計上はできません。</p>
    </div>${partner}`;
  new QRCode(document.getElementById("qrcode"),{text:shareUrl,width:230,height:230});
}
async function copyText(encoded){const url=decodeURIComponent(encoded);try{await navigator.clipboard.writeText(url);alert("見本URLをコピーしました。");}catch(e){prompt("このURLをコピーしてください。",url);}}
async function shareSample(encoded){const url=decodeURIComponent(encoded);if(navigator.share){try{await navigator.share({title:"シグマ祭 前売り券 見本",url});return;}catch(e){if(e&&e.name==="AbortError")return;}}copyText(encoded);}
function generateSample(){const seller=document.getElementById("sellerInput").value.trim()||"Match Point スタッフ";const buyer=document.getElementById("buyerInput").value.trim()||"提携先ご担当者様";const code=sampleCode();history.replaceState(null,"",buildShareUrl(seller,buyer,code));document.getElementById("controlArea").style.display="none";renderSample(seller,buyer,code);}
function init(){if(params.get("view")==="1"){document.getElementById("controlArea").style.display="none";renderSample(params.get("seller")||"Match Point スタッフ",params.get("buyer")||"提携先ご担当者様",params.get("code")||sampleCode());}}
init();
</script>
<p style="text-align:center;color:#666;">利用期間：11/1〜11/3（シグマ祭期間中）</p>
</body>
</html>
