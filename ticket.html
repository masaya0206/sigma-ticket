<style>

.coupon-card::before,.coupon-card::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid #efc7cb}

.map-sheet{width:min(100%,720px);max-height:min(92vh,900px);overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.22)}

.map-store.active{border-color:#d9a0a6;background:#fff1f2;box-shadow:0 0 0 3px rgba(181,18,27,.08)}
.map-store-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.map-store-name{font-weight:900;line-height:1.45}
.map-store-base{margin-top:4px;color:#b5121b;font-size:11px;font-weight:900}
.map-store-num{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:999px;background:#eef6ff;color:#174a88;font-size:12px;font-weight:900;white-space:nowrap}
.map-store-note{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}
.illustrated-map-wrap{margin-top:14px}.illustrated-map-stage{position:relative;width:100%;overflow:hidden;border:1px solid #eee2dd;border-radius:20px;background:#fbfaf8}.illustrated-map{display:block;width:100%;height:auto}.map-focus-ring{position:absolute;display:none;width:72px;height:72px;border:5px solid #ff3347;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 7px rgba(255,51,71,.15);animation:mapPulse 1.25s ease-in-out infinite;pointer-events:none}@keyframes mapPulse{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.82}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}.map-image-wrap,.map-store-list,.map-wrap{display:none!important}@media(max-width:520px){.map-sheet{padding:14px}.map-sheet-title{font-size:20px}.map-sheet-sub{font-size:12px}.map-focus-ring{width:58px;height:58px;border-width:4px}}
.map-wrap{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:18px;background:#faf7f5}.map-stage{position:relative;border-radius:14px;overflow:hidden;background:#f0eeec}.map-image{display:block;width:100%;height:auto}.map-pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:0;cursor:pointer}.map-pin-badge{width:34px;height:34px;border-radius:999px;background:#123e74;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:950;box-shadow:0 6px 18px rgba(0,0,0,.18)}.map-pin-base .map-pin-badge{background:#b5121b}.map-pin-label{max-width:132px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.96);color:#1d2733;font-size:12px;font-weight:900;line-height:1.2;box-shadow:0 6px 18px rgba(0,0,0,.12)}.map-pin.active .map-pin-badge{transform:scale(1.08);box-shadow:0 0 0 4px rgba(181,18,27,.16),0 8px 24px rgba(0,0,0,.18)}.map-pin.active .map-pin-label{background:#fff1f2;color:#9a1620;box-shadow:0 0 0 3px rgba(181,18,27,.10),0 8px 24px rgba(0,0,0,.14)}.map-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.map-chip{width:auto;margin:0;padding:10px 12px;border-radius:999px;background:#fff;border:1px solid #d8dfe8;color:#174a88;font-size:12px;font-weight:900}.map-chip.active{background:#fff1f2;border-color:#efc7cb;color:#9a1620}.map-chip small{font-size:11px;font-weight:800;opacity:.85}.map-tip{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}.map-minilegend{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}.map-miniitem{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #ece7e4;font-size:12px;font-weight:900;color:#38404a}.map-dot{width:10px;height:10px;border-radius:999px;background:#123e74;display:inline-block}.map-miniitem.base .map-dot{background:#b5121b}.map-image-wrap,.map-store-list{display:none}@media(max-width:520px){.map-pin-badge{width:30px;height:30px;font-size:12px}.map-pin-label{font-size:11px;max-width:112px;padding:6px 8px}}

@media(max-width:420px){.coupon-card{flex-basis:88%;}.coupon-title{font-size:23px}}

<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">MATCH POINT × 第十五回紫熊祭</div>
    <h1 id="heroTitle">券情報</h1>
    <p id="heroSub">購入者用ページ</p>
  </div>

  <div id="main">
    <div class="card status">読み込み中...</div>
  </div>
</div>

<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);
const code=new URLSearchParams(location.search).get("code");

const BASE_MAP_SPOTS=[
  {tent:7,display_name:"Match Point",short_label:"Match Point",aliases:["Match Point","MatchPoint","マッチポイント"],always_show:true,is_base:true,x:61.1,y:64.6}
];
const PARTNER_TENT_LOOKUP=[
  {tent:19,display_name:"生協組織部",short_label:"組織部",aliases:["組織部","生協組織部"],x:59.7,y:33.3},
  {tent:10,display_name:"文芸部・セピア",short_label:"セピア",aliases:["熊大文芸部 セピア","文芸部・セピア","文芸部セピア","セピア"],x:60.0,y:57.3},
  {tent:6,display_name:"書道部",short_label:"書道部",aliases:["書道部"],x:58.0,y:71.2},
  {tent:8,display_name:"映画研究部",short_label:"映画研究部",aliases:["映画研究部","映画研究会","映画研"],x:49.5,y:74.0}
];
let currentCouponMapPartners=[];
function normalizePartnerName(v){return String(v??"").toLowerCase().replace(/熊本大学/g,"熊大").replace(/[\s　・･\-ー―_]/g,"");}
function resolvePartnerLocation(name){
  const target=normalizePartnerName(name);
  if(!target) return null;
  const all=[...BASE_MAP_SPOTS,...PARTNER_TENT_LOOKUP];
  for(const item of all){
    const names=[item.display_name].concat(item.aliases||[]);
    for(const n of names){
      const x=normalizePartnerName(n);
      if(!x) continue;
      if(target===x || target.includes(x) || x.includes(target)) return item;
    }
  }
  return null;
}
function buildMapPartners(coupons){
  const out=[];const seen=new Set();
  for(const base of BASE_MAP_SPOTS){
    const key=base.tent+"|"+base.display_name;
    seen.add(key);out.push({...base,partner_name:base.display_name});
  }
  for(const c of coupons){
    const loc=resolvePartnerLocation(c.partner_name);
    if(!loc) continue;
    const key=loc.tent+"|"+loc.display_name;
    if(seen.has(key)) continue;
    seen.add(key);out.push({...loc,partner_name:c.partner_name,is_base:false});
  }
  return out;
}
function mapLaunchHtml(){
  return `<div class="card"><div class="map-launch-title">🗺️ クーポン店舗マップ</div><div class="map-launch-text">熊大黒髪北キャンパスをもとに、赤門からの道筋と道沿いの店舗位置を分かりやすくまとめた案内図です。</div><button onclick="openCouponMap()">店舗マップを見る</button></div>`;
}
function mapModalHtml(){
  return `<div id="couponMapModal" class="map-modal" onclick="if(event.target===this)closeCouponMap()"><div class="map-sheet"><div class="map-sheet-head"><div><div class="map-sheet-title">クーポン店舗マップ</div><div class="map-sheet-sub">赤門（会場入口）からの道筋と、道沿いの店舗位置を優先した当日向けの案内図です。</div></div><button type="button" class="map-close" onclick="closeCouponMap()">閉じる</button></div><div class="illustrated-map-wrap"><div class="illustrated-map-stage"><img class="illustrated-map" src="./coupon-campus-illustrated.png" alt="熊本大学黒髪北キャンパスのクーポン店舗マップ"><div id="mapFocusRing" class="map-focus-ring" aria-hidden="true"></div></div></div></div></div>`;
}
function openCouponMapByName(encodedName){openCouponMap(decodeURIComponent(encodedName||""));}
function openCouponMap(activeName=""){
  const modal=document.getElementById("couponMapModal");
  const ring=document.getElementById("mapFocusRing");
  if(!modal) return;
  if(ring){
    const loc=resolvePartnerLocation(activeName);
    if(loc){ring.style.display="block";ring.style.left=loc.x+"%";ring.style.top=loc.y+"%";}
    else{ring.style.display="none";}
  }
  modal.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeCouponMap(){
  const modal=document.getElementById("couponMapModal");
  if(!modal) return;
  modal.classList.remove("show");
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCouponMap();});


function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

async function partnerHtml(ticketKind){
  const {data,error}=await sb.rpc("public_partner_benefits");
  if(error || !data || data.length===0) return "";

  const coupons=(data||[]).map(row=>({
    partner_name:row.partner_name,
    instagram_url:row.instagram_url,
    title:row.benefit_title,
    description:row.description,
    valid_label:row.valid_label
  }));
  currentCouponMapPartners=buildMapPartners(coupons);

  return `
    ${mapLaunchHtml()}
    <section class="coupon-section" aria-label="使えるクーポン">
      <div class="coupon-section-head">
        <div class="coupon-section-title">🎟️ 使えるクーポン</div>
        <div class="coupon-section-hint">横にスワイプ →</div>
      </div>
      <div class="coupon-rail">
        ${coupons.map(c=>{
          const loc=resolvePartnerLocation(c.partner_name);
          return `
          <article class="coupon-card">
            <div class="coupon-top">
              <div class="coupon-mark">提携クーポン</div>
              <span class="coupon-valid">${esc(c.valid_label||"利用可能")}</span>
            </div>
            <div class="coupon-divider"></div>
            <div class="coupon-partner">発行元：${esc(c.partner_name)}</div>
            <div class="coupon-title">${esc(c.title)}</div>
            ${c.description?`<div class="coupon-description">${esc(c.description)}</div>`:""}
            ${loc?`<button type="button" class="coupon-map-btn" onclick="openCouponMapByName('${encodeURIComponent(c.partner_name)}')">地図で場所を見る</button>`:""}
            <div class="coupon-howto">利用時に${esc(ticketKind)}のQRコードを提携先スタッフへ提示してください。</div>
            ${c.instagram_url?`<a class="coupon-instagram" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">Instagramを見る</a>`:""}
          </article>
          `;
        }).join("")}
      </div>
    </section>
    ${mapModalHtml()}
  `;
}

async function copyTicketUrl(encodedCode){
  const url="https://masaya0206.github.io/sigma-ticket/ticket.html?code="+encodedCode;
  try{
    await navigator.clipboard.writeText(url);
    alert("券URLをコピーしました。");
  }catch(e){
    prompt("このURLをコピーしてください。",url);
  }
}


function displayProductName(v){
  const raw=String(v??"");
  return raw
    .replace(/前売り券（炒飯1個\s*\/\s*胡麻団子2個）/g,"前売り券（炒飯1皿 または 胡麻団子2本）")
    .replace(/炒飯1個\s*\/\s*胡麻団子2個/g,"炒飯1皿 または 胡麻団子2本");
}
function isChoiceTicketName(v){
  return /炒飯(?:1個|1皿)/.test(String(v??"")) && /胡麻団子(?:2個|2本)/.test(String(v??""));
}


function choiceTicketHtml(ticketKind){
  return `<div class="product-choice-wrap">
    <div class="product-choice-title">${esc(ticketKind)}</div>
    <div class="product-choice-grid" aria-label="交換商品をどちらか1つ選択">
      <div class="product-choice-option"><span class="choice-name">炒飯</span><span class="choice-qty">1皿</span></div>
      <div class="product-choice-or">または</div>
      <div class="product-choice-option"><span class="choice-name">胡麻団子</span><span class="choice-qty">2本</span></div>
    </div>
    <div class="product-choice-note">どちらか1つと交換できます</div>
  </div>`;
}

async function renderTicket(t){
  const ticketKind=t.sale_type==="same_day" ? "当日券" : "前売り券";
  document.title=`第15回紫熊祭 ${ticketKind}`;
  const heroTitle=document.getElementById("heroTitle");
  const heroSub=document.getElementById("heroSub");
  if(heroTitle) heroTitle.textContent=ticketKind;
  if(heroSub) heroSub.textContent=`購入者用 ${ticketKind}ページ`;

  const partner=await partnerHtml(ticketKind);
  const used=t.status==="used";
  main.innerHTML=`
    <div class="card ticket">
      <div class="ticket-title">第15回紫熊祭 ${esc(ticketKind)}</div>
      ${isChoiceTicketName(t.product_name)
        ? choiceTicketHtml(ticketKind)
        : `<div class="product">${esc(displayProductName(t.product_name))}</div>`}

      <div style="text-align:center;margin-bottom:14px">
        ${used
          ? '<span class="used-badge">Match Point商品交換済み</span>'
          : '<span class="active-badge">利用可能</span>'}
      </div>

      <div class="grid">
        <div class="info"><span>販売者</span><b>${esc(t.seller_name)}</b></div>
        <div class="info"><span>購入者</span><b>${esc(t.buyer_name||"未登録")}</b></div>
      </div>

      <div id="qrcode"></div>
      <div class="code">${esc(t.ticket_code)}</div>
      <button class="secondary" onclick="copyTicketUrl('${encodeURIComponent(t.ticket_code)}')">
        券URLをコピー
      </button>
      <a class="instagram-main-link" href="https://www.instagram.com/kumadai.bado_mp?stkn=YWp0c3Q4YXVndmRr" target="_blank" rel="noopener noreferrer">📷 Match Point公式Instagramを見る</a>

      <p class="note">
        利用期間：11/1〜11/3（シグマ祭期間中）<br><br>当日はこのQRコードを店舗スタッフに提示してください。<br>
        スクリーンショットを保存しておくと安心です。
        ${ticketKind==="前売り券"?`<br><br><strong style="color:#9a1620;">有効期限を過ぎた場合、または対象商品が売り切れとなった場合でも返金はできません。</strong>`:""}
      </p>

      ${used?`
        <p class="small" style="text-align:center">
          ※ Match Pointの商品交換が済んでいても、未使用のクーポンは利用できます。
        </p>`:""}
    </div>
    ${partner}
  `;

  const ticketUrl="https://masaya0206.github.io/sigma-ticket/ticket.html?code="+encodeURIComponent(t.ticket_code);

  new QRCode(document.getElementById("qrcode"),{
    text:ticketUrl,width:230,height:230
  });
}

function showError(message){
  main.innerHTML=`<div class="card status"><h2>確認できませんでした</h2><p>${esc(message)}</p></div>`;
}

async function init(){
  if(!code){showError("券情報がありません。");return;}

  const {data,error}=await sb.rpc(
    "public_ticket_by_code",
    {p_ticket_code:code}
  );

  if(error){showError(error.message);return;}

  const t=Array.isArray(data)?data[0]:data;

  if(!t){
    showError("この券は現在表示できません。");
    return;
  }

  if(t.status==="invalid"){
    showError("このチケットは無効です。");
    return;
  }

  await renderTicket(t);
}
init();
</script>
</body>
</html>
