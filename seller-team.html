<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シグマ祭 売り子チーム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#b5121b">
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7f4;color:#222;max-width:760px;margin:auto;padding:20px}h1{color:#8f0e15}.card{background:#fff;border:1px solid #ead6d1;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px #0001}button{background:#b5121b;color:white;border:0;border-radius:12px;padding:12px 16px;margin:6px 4px;font-weight:800}button.secondary{background:#555}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin:6px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ok{background:#edf8ef}.warn{background:#fff5d8}.danger{background:#ffe7e7}.small{font-size:13px;color:#666}.price{font-size:24px;font-weight:900}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>売り子チーム</h1><button onclick="location.href='seller.html'">← 売り子画面</button><button onclick="location.href='home.html'">🏠 ポータル</button>
<div id="status" class="card">読み込み中...</div>
<div id="soloArea" style="display:none"><div class="card"><h2>チームを作る</h2><input id="teamName" placeholder="チーム名"><button onclick="createTeam()">作成</button><p class="small">作成直後は「編成中」です。2人目が加入して初めてチームとして有効になります。</p></div><div class="card"><h2>既存チームに加入申請</h2><input id="joinCode" placeholder="8文字の参加コード"><button onclick="joinTeam()">加入申請</button><p class="small">既存メンバーの過半数承認で加入します。</p></div></div>
<div id="teamArea" style="display:none"><div class="card"><h2 id="teamTitle"></h2><div id="teamInfo"></div><button onclick="leaveTeam()" class="secondary">チームを離脱</button></div><div class="card"><h2>ポイント配分比率</h2><div id="ratioInfo"></div><input id="ratio" type="range" step="0.1"><div id="ratioPreview"></div><button onclick="proposeRatio()">この比率を変更申請</button><p class="small">過半数承認までは現在の比率が継続されます。変更は過去の販売には遡りません。</p></div><div class="card"><h2>承認待ち</h2><div id="proposals"></div></div></div>
<div class="card"><h2>加入前に確認</h2><p class="small">参加コードを教えてもらった場合、下の欄でチームの現状を確認できます。</p><input id="previewCode" placeholder="参加コード"><button onclick="previewTeam()">チーム情報を見る</button><div id="preview"></div></div>
<p id="msg"></p>
<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");let me=null,current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function staffName(uid){const {data}=await sb.from('staff_members').select('staff_name').eq('user_id',uid).maybeSingle();return data?.staff_name||uid.slice(0,8)}
async function createTeam(){const {error}=await sb.rpc('create_seller_team',{p_name:teamName.value.trim()});msg.textContent=error?'エラー：'+error.message:'✅ チームを作成しました';await load()}
async function joinTeam(){const {error}=await sb.rpc('request_join_seller_team',{p_join_code:joinCode.value.trim()});msg.textContent=error?'エラー：'+error.message:'✅ 加入申請を送りました';}
async function leaveTeam(){if(!confirm('チームを離脱しますか？'))return;const {data,error}=await sb.rpc('leave_seller_team');msg.textContent=error?'エラー：'+error.message:(data==='dissolved'?'チームは1人になったため自動解散しました。':'離脱しました。');await load()}
function previewRatio(){if(!current)return;const n=Number(current.member_count);const sr=+ratio.value;const other=n>1?(100-sr)/(n-1):0;ratioPreview.innerHTML=`販売者 <strong>${sr.toFixed(1)}%</strong> / その他1人あたり <strong>${other.toFixed(1)}%</strong>`}
async function proposeRatio(){const {error}=await sb.rpc('propose_seller_ratio',{p_ratio:+ratio.value});msg.textContent=error?'エラー：'+error.message:'✅ 比率変更を申請しました';await loadProposals()}
async function vote(id,v){const {data,error}=await sb.rpc('vote_seller_team_proposal',{p_proposal:id,p_vote:v});msg.textContent=error?'エラー：'+error.message:'投票しました：'+data;await load()}
async function loadProposals(){if(!current)return;const {data}=await sb.from('seller_team_proposals').select('*').eq('team_id',current.team_id).eq('status','pending').order('created_at',{ascending:false});let html='';for(const p of data||[]){let detail='';if(p.proposal_type==='join'){detail='加入申請：'+await staffName(p.target_user_id)}else{detail=`販売者比率を ${p.proposed_ratio}% に変更`};const {data:votes}=await sb.from('seller_team_votes').select('*').eq('proposal_id',p.id);const yes=(votes||[]).filter(x=>x.vote).length,no=(votes||[]).filter(x=>!x.vote).length;const needed=Math.floor(Number(current.member_count)/2)+1;html+=`<div class="card"><strong>${esc(detail)}</strong><br>賛成 ${yes} / 反対 ${no} / 成立には ${needed}票<button onclick="vote('${p.id}',true)">賛成</button><button class="secondary" onclick="vote('${p.id}',false)">反対</button></div>`}proposals.innerHTML=html||'承認待ちはありません。'}
async function previewTeam(){const code=previewCode.value.trim().toUpperCase();const {data:t}=await sb.from('seller_teams').select('*').eq('join_code',code).in('status',['forming','active']).maybeSingle();if(!t){preview.textContent='チームが見つかりません。';return}const {data:m}=await sb.from('seller_team_members').select('user_id').eq('team_id',t.id).is('left_at',null);const names=[];for(const x of m||[])names.push(await staffName(x.user_id));const n=(m||[]).length,after=n+1,other=(100-t.seller_ratio)/(after-1);preview.innerHTML=`<div class="card"><strong>${esc(t.team_name)}</strong><br>現在 ${n}人：${names.map(esc).join('・')}<br>現在の販売者比率 ${t.seller_ratio}%<br><strong>あなたが加入した後：</strong> ${after}人 / 販売者 ${t.seller_ratio}% / 非販売者1人あたり ${other.toFixed(2)}%<br><span class="small">比率変更申請中の有無は加入後の承認画面でも確認できます。</span></div>`}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){status.textContent='ログインが必要です。';return}me=user;const {data}=await sb.rpc('my_active_seller_team');current=data?.[0]||null;if(!current){status.innerHTML='<strong>現在はソロです。</strong>';soloArea.style.display='block';teamArea.style.display='none';return}soloArea.style.display='none';teamArea.style.display='block';status.innerHTML=current.team_status==='forming'?'🟡 チーム編成中（まだソロ扱い）':'🟢 チーム参加中';teamTitle.textContent=current.team_name;const {data:m}=await sb.from('seller_team_members').select('user_id,joined_at').eq('team_id',current.team_id).is('left_at',null);const names=[];for(const x of m||[])names.push(await staffName(x.user_id));const n=Number(current.member_count),other=n>1?(100-current.seller_ratio)/(n-1):0;teamInfo.innerHTML=`参加コード：<strong>${current.join_code}</strong><br>メンバー：${names.map(esc).join('・')}<br>人数：${n}人<br>現在の配分：販売者 ${current.seller_ratio}% / その他 ${other.toFixed(2)}%ずつ`;const min=100/n;ratio.min=min;ratio.max=99;ratio.value=Math.max(min,+current.seller_ratio);ratioInfo.innerHTML=`設定可能範囲：<strong>${min.toFixed(2)}%（完全平等）〜99%</strong>`;previewRatio();ratio.oninput=previewRatio;await loadProposals()}
load();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script></body></html>
