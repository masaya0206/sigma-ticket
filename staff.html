<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 スタッフ</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      background: #f2f2f2;
      border-radius: 12px;
      text-align: left;
    }

    #staffArea {
      display: none;
    }
  </style>
</head>

<body>

  <h1>シグマ祭 スタッフ</h1>

  <div id="loginArea">

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>

    <p id="loginMessage"></p>

  </div>


  <div id="staffArea">

    <button onclick="logout()">
      ログアウト
    </button>

    <div class="card">
      <h2 id="staffName">
        スタッフ
      </h2>

      <p id="currentRole">
        今日の予定を確認しています...
      </p>
    </div>


    <div class="card">

      <h2>勤怠</h2>

      <button onclick="clockIn()">
        出勤
      </button>

      <button onclick="startBreak()">
        休憩開始
      </button>

      <button onclick="endBreak()">
        休憩終了
      </button>

      <button onclick="clockOut()">
        退勤
      </button>

      <p id="attendanceMessage"></p>

      <hr style="margin:20px 0;">

<h2>レジ</h2>

<button
  id="registerStartButton"
  onclick="startRegister()"
>
  レジ開始
</button>

<button
  id="registerEndButton"
  onclick="endRegister()"
  style="display:none;"
>
  レジ終了
</button>

<button
  id="scannerButton"
  onclick="location.href='index.html'"
  style="display:none;"
>
  📷 チケットスキャン
</button>

<p id="registerMessage"></p>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent =
          "ログイン失敗：" + error.message;
        return;
      }

      message.textContent = "";

      await showStaffArea();
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("staffArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";
    }


    async function showStaffArea() {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {
        return;
      }

      const {
        data: staff,
        error
      } =
        await supabaseClient
          .from("staff_members")
          .select(
            "staff_name,is_active,can_sell,can_scan"
          )
          .eq("user_id", user.id)
          .maybeSingle();

      if (error || !staff) {

        document.getElementById("loginMessage")
          .textContent =
          "スタッフ情報が見つかりません。";

        await supabaseClient.auth.signOut();
        return;
      }

      if (!staff.is_active) {

        document.getElementById("loginMessage")
          .textContent =
          "このスタッフアカウントは停止中です。";

        await supabaseClient.auth.signOut();
        return;
      }

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("staffArea")
        .style.display = "block";

      document.getElementById("staffName")
        .textContent = staff.staff_name;

      await loadTodayAssignment(user.id);
      await updateRegisterState();
    }


    async function loadTodayAssignment(userId) {

      const now =
        new Date().toISOString();

      const {
        data,
        error
      } =
        await supabaseClient
          .from("staff_assignments")
          .select(
            "role,start_at,end_at"
          )
          .eq("user_id", userId)
          .lte("start_at", now)
          .gte("end_at", now)
          .order("start_at", {
            ascending: false
          })
          .limit(1)
          .maybeSingle();

      const area =
        document.getElementById("currentRole");

      if (error) {
        area.textContent =
          "予定シフト取得エラー";
        return;
      }

      if (!data) {
        area.textContent =
          "現在の予定シフトはありません。";
        return;
      }

      const roleText =
  data.role === "seller"
    ? "売り子"
    : data.role === "tent"
    ? "テント内"
    : data.role === "front"
    ? "表番"
    : data.role === "back"
    ? "裏番"
    : "未確定";

      const start =
        new Date(data.start_at)
          .toLocaleTimeString(
            "ja-JP",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      const end =
        new Date(data.end_at)
          .toLocaleTimeString(
            "ja-JP",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      area.textContent =
        `予定：${roleText} ${start}〜${end}`;
    }

async function getCurrentAttendanceRole(userId) {

  const now =
    new Date().toISOString();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_assignments")
      .select("role,start_at,end_at")
      .eq("user_id", userId)
      .lte("start_at", now)
      .gte("end_at", now)
      .order("start_at", {
        ascending: false
      })
      .limit(1)
      .maybeSingle();

  if (error) {
    throw error;
  }

  return data?.role ?? null;
}


async function getOpenAttendance(userId) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_attendance")
      .select(
        "id,role,clock_in,clock_out"
      )
      .eq("user_id", userId)
      .is("clock_out", null)
      .order("clock_in", {
        ascending: false
      })
      .limit(1)
      .maybeSingle();

  if (error) {
    throw error;
  }

  return data;
}


async function clockIn() {

  const message =
    document.getElementById(
      "attendanceMessage"
    );

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    message.textContent =
      "ログインしてください。";
    return;
  }

  try {

    const openAttendance =
      await getOpenAttendance(user.id);

    if (openAttendance) {
      message.textContent =
        "すでに勤務中です。";
      return;
    }

    const role =
      await getCurrentAttendanceRole(
        user.id
      );

    // 売り子は通常勤怠を取らない
    if (role === "seller") {
      message.textContent =
        "売り子は通常勤怠の対象外です。";
      return;
    }

    const { error } =
      await supabaseClient
        .from("staff_attendance")
        .insert({
  user_id: user.id,
  role: role,
  clock_in:
    new Date().toISOString(),
  attendance_state:
    "working"
});

    if (error) {
      throw error;
    }

    if (role) {
      message.textContent =
        "✅ 出勤しました。";
    } else {
      message.textContent =
        "⚠️ 予定外勤務として出勤しました。裏番による役割確定が必要です。";
    }

  } catch (error) {

    message.textContent =
      "出勤エラー：" +
      error.message;
  }
}


async function startBreak() {

  const message =
    document.getElementById(
      "attendanceMessage"
    );

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  try {

    const attendance =
      await getOpenAttendance(user.id);

    if (!attendance) {
      message.textContent =
        "現在勤務中ではありません。";
      return;
    }

    if (attendance.role === "register") {
      message.textContent =
        "レジ勤務中です。先にレジ終了をしてください。";
      return;
    }

    const { error } =
      await supabaseClient
        .from("staff_attendance")
        .update({
  clock_out:
    new Date().toISOString(),

  attendance_state:
    "break"
})
        .eq(
          "id",
          attendance.id
        );

    if (error) {
      throw error;
    }

    message.textContent =
      "☕ 休憩を開始しました。";

  } catch (error) {

    message.textContent =
      "休憩開始エラー：" +
      error.message;
  }
}


async function endBreak() {

  const message =
    document.getElementById(
      "attendanceMessage"
    );

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  try {

    const openAttendance =
      await getOpenAttendance(user.id);

    if (openAttendance) {
      message.textContent =
        "すでに勤務中です。";
      return;
    }

    const role =
      await getCurrentAttendanceRole(
        user.id
      );

    if (role === "seller") {
      message.textContent =
        "現在は売り子予定のため通常勤怠は使用しません。";
      return;
    }

    const { error } =
      await supabaseClient
        .from("staff_attendance")
        .insert({
          user_id: user.id,
          role: role,
          clock_in:
            new Date().toISOString()
        });

    if (error) {
      throw error;
    }

    if (role) {
      message.textContent =
        "▶️ 勤務を再開しました。";
    } else {
      message.textContent =
        "⚠️ 予定外勤務として再開しました。裏番による役割確定が必要です。";
    }

  } catch (error) {

    message.textContent =
      "休憩終了エラー：" +
      error.message;
  }
}


async function clockOut() {

  const message =
    document.getElementById(
      "attendanceMessage"
    );

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  try {

    const attendance =
      await getOpenAttendance(user.id);

    if (!attendance) {
      message.textContent =
        "現在勤務中ではありません。";
      return;
    }

    if (attendance.role === "register") {
      message.textContent =
        "レジ勤務中です。先にレジ終了をしてください。";
      return;
    }

    const { error } =
      await supabaseClient
        .from("staff_attendance")
        .update({
  clock_out:
    new Date().toISOString(),

  attendance_state:
    "finished"
})
        .eq(
          "id",
          attendance.id
        );

    if (error) {
      throw error;
    }

    message.textContent =
      "✅ 退勤しました。";

  } catch (error) {

    message.textContent =
      "退勤エラー：" +
      error.message;
  }
}
    

    async function startRegister() {

  const message =
    document.getElementById("registerMessage");

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    message.textContent =
      "ログインしてください。";
    return;
  }

  try {

    const openAttendance =
      await getOpenAttendance(user.id);

    if (openAttendance) {
      message.textContent =
        "すでに別の勤務を開始しています。";
      return;
    }

    const role =
      await getCurrentAttendanceRole(
        user.id
      );

    if (role !== "seller") {
      message.textContent =
        "レジには売り子の予定時間中のみ入れます。";
      return;
    }

    const { error } =
      await supabaseClient
        .from("staff_attendance")
        .insert({
  user_id: user.id,
  role: "register",
  clock_in:
    new Date().toISOString(),
  attendance_state: "working"
});

    if (error) {
      throw error;
    }

    message.textContent =
      "✅ レジ勤務を開始しました。";

    await updateRegisterState();

  } catch (error) {

    message.textContent =
      "レジ開始エラー：" +
      error.message;
  }
}


async function endRegister() {

  const message =
    document.getElementById("registerMessage");

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("staff_attendance")
        .select("id")
        .eq("user_id", user.id)
        .eq("role", "register")
        .is("clock_out", null)
        .order(
          "clock_in",
          { ascending: false }
        )
        .limit(1)
        .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {
      message.textContent =
        "現在レジ勤務中ではありません。";
      return;
    }

    const { error: updateError } =
      await supabaseClient
        .from("staff_attendance")
        .update({
  clock_out:
    new Date().toISOString(),
  attendance_state:
    "finished"
})
        .eq("id", data.id);

    if (updateError) {
      throw updateError;
    }

    message.textContent =
      "✅ レジ勤務を終了しました。";

    await updateRegisterState();

  } catch (error) {

    message.textContent =
      "レジ終了エラー：" +
      error.message;
  }
}


async function updateRegisterState() {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_attendance")
      .select("id")
      .eq("user_id", user.id)
      .eq("role", "register")
      .is("clock_out", null)
      .limit(1)
      .maybeSingle();

  if (error) {
    return;
  }

  const isRegister =
    !!data;

  document.getElementById(
    "registerStartButton"
  ).style.display =
    isRegister ? "none" : "block";

  document.getElementById(
    "registerEndButton"
  ).style.display =
    isRegister ? "block" : "none";

  document.getElementById(
    "scannerButton"
  ).style.display =
    isRegister ? "block" : "none";
}


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();

      if (session) {
        await showStaffArea();
      }
    }


    checkLogin();

  </script>

</body>
</html>
