<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタッフ・勤怠</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}
header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}
button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}
input,select,textarea{border:1px solid #ddd5d1;background:#fff}
button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}
.primary{background:#b5121b;color:#fff}
.danger{background:#7f1d1d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#6e6e73;line-height:1.55}
.big{font-size:30px;font-weight:900}
.row{padding:11px 0;border-top:1px solid #eee}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}
.ok{color:#15803d;font-weight:800}.err{color:#b00020;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
#reader{width:100%;overflow:hidden;border-radius:16px} .stat{padding:12px;background:#fff8f8;border-radius:14px}</style>

<style id="globalBottomNavStyle">
  body{padding-bottom:82px!important}
  .global-bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(100%,620px);
    height:72px;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    z-index:9998;
    background:rgba(255,255,255,.96);
    border-top:1px solid #eadfdb;
    box-shadow:0 -5px 22px rgba(55,20,20,.08);
    backdrop-filter:blur(12px);
  }
  .global-bottom-nav.admin-nav{
    grid-template-columns:repeat(4,1fr);
  }
  .global-bottom-nav button{
    width:100%!important;
    min-width:0;
    margin:0!important;
    padding:7px 4px!important;
    border:0!important;
    border-radius:12px!important;
    background:transparent!important;
    color:#6e6e73!important;
    font:inherit;
    font-size:11px!important;
    font-weight:700!important;
    line-height:1.15;
    box-shadow:none!important;
  }
  .global-bottom-nav button .gicon{
    display:block;
    margin-bottom:4px;
    font-size:20px;
    line-height:1;
  }
  .global-bottom-nav button.active{
    color:#b5121b!important;
    background:#fff1f2!important;
  }
</style>


<style id="responsiveOverflowFixV1">
/* 共通：iPhone/Safariを含む横はみ出し防止 */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{overflow-wrap:anywhere}
main,.container,.wrap,.content,.page,.card,.panel,.row,.grid,.field,form,
main>*,.card>*,.panel>*,.grid>*{
  min-width:0;
  max-width:100%;
}
input,select,textarea,button{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
input[type="datetime-local"],
input[type="date"],
input[type="time"],
input[type="month"],
input[type="week"]{
  display:block;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
  -webkit-appearance:none;
  appearance:none;
}
img,video,canvas,svg,iframe{
  max-width:100%;
}
pre,code{
  max-width:100%;
  overflow-x:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
table{
  max-width:100%;
}
@media(max-width:600px){
  main{width:100%;max-width:100%}
  .card,.panel{max-width:100%;min-width:0}
  input,select,textarea{font-size:16px}
}
</style>

</head><body><header><h1>👤 スタッフ・勤怠</h1></header><main>
<div class="card"><h2>現在の状態</h2><div id="status">読み込み中...</div></div>
<div class="card"><h2>時間式QRで出勤・退勤</h2><p class="small">オンライン・オフライン共通の勤怠QRを使用します。出勤は時間式QRの読み取り、退勤は勤務中画面から行います。</p><button class="primary" onclick="location.href='offline-attendance.html'">勤怠QRを開く</button></div>
<div class="card"><button onclick="location.href='shift.html'">🗓 希望シフトを提出</button><button onclick="location.href='work.html'">← 勤怠・シフト</button></div>
</main><script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
const roleName=r=>{if(["front","back","tent"].includes(r))r="manager";return ({seller:"売り子",manager:"店長",cook:"調理",support:"サポート",register:"レジ",shopping_driver:"買い出し運転手",shopping_helper:"買い出し手伝い"}[r]||r||"—")};
async function auth(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='home.html';return null}return user}
async function load(){
  const statusEl=document.getElementById('status');
  try{
    const u=await auth();
    if(!u)return;
    const {data:x,error}=await sb.rpc('my_work_status');
    if(error) throw error;
    const s=x||{};
    if(s.working){
      statusEl.innerHTML=`<div class="big">勤務中</div><div>現在役職：<b>${roleName(s.role)}</b></div><div class="small">出勤 ${s.clock_in?new Date(s.clock_in).toLocaleString('ja-JP'):'—'}</div>`;
    }else{
      statusEl.innerHTML=`<div class="big">退勤中</div><div class="small">時間式QRを読み取ると、完成シフトから役割を自動判定して出勤します。</div>`;
    }
  }catch(e){
    statusEl.innerHTML=`<span class="err">状態を取得できませんでした。</span><div class="small">${String(e?.message||e)}</div>`;
  }
}
load();
</script><nav class="global-bottom-nav" aria-label="メインナビゲーション"><button class="" onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button><button class="active" onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button><button class="" onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button></nav>
</body></html>
