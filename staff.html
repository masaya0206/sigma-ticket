<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタッフ・勤怠</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}
header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}
button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}
input,select,textarea{border:1px solid #ddd5d1;background:#fff}
button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}
.primary{background:#b5121b;color:#fff}
.danger{background:#7f1d1d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#6e6e73;line-height:1.55}
.big{font-size:30px;font-weight:900}
.row{padding:11px 0;border-top:1px solid #eee}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}
.ok{color:#15803d;font-weight:800}.err{color:#b00020;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
#reader{width:100%;overflow:hidden;border-radius:16px} .stat{padding:12px;background:#fff8f8;border-radius:14px}</style>
</head><body><header><h1>👤 スタッフ・勤怠</h1></header><main>
<div class="card"><h2>現在の状態</h2><div id="status">読み込み中...</div></div>
<div class="card"><h2>動的QRで出勤・退勤</h2><p class="small">会場に表示されている最新QRを読み取ります。同じQRを同じ人が2回使うことはできません。</p><button class="primary" id="scanBtn">QRを読み取る</button><button id="stopBtn" style="display:none">カメラを止める</button><div id="reader"></div><div id="scanMsg"></div></div>
<div class="card"><button onclick="location.href='shift.html'">🗓 希望シフトを提出</button><button onclick="location.href='home.html'">ホームへ戻る</button></div>
</main><script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
let scanner=null,busy=false;
const roleName=r=>({seller:"売り子",front:"表番",back:"裏番",cook:"調理",support:"サポート",register:"レジ",shopping_driver:"買い出し運転手",shopping_helper:"買い出し手伝い"}[r]||r||"—");
async function auth(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='home.html';return null}return user}
async function load(){
 const u=await auth();if(!u)return;
 const [ws,pre,prov,fin]=await Promise.all([
   sb.rpc('my_work_status'), sb.rpc('my_presale_status'),
   sb.rpc('my_point_summary',{p_final:false}), sb.rpc('my_point_summary',{p_final:true})
 ]);
 if(ws.error) status.innerHTML='<span class="err">'+ws.error.message+'</span>';
 else {
   const x=ws.data||{};
   status.innerHTML=x.working?`<div class="big">勤務中</div><div>現在役職：<b>${roleName(x.role)}</b></div><div class="small">出勤 ${new Date(x.clock_in).toLocaleString('ja-JP')}</div>`:`<div class="big">退勤中</div><div class="small">QRを読み取ると売り子として出勤します。</div>`;
 }
 if(!pre.error){
   prePt.textContent=Number(pre.data?.presale_points||0).toFixed(1)+' pt';
   residual.textContent=(pre.data?.residual_remaining||0)+' 枚';
   residualValue.textContent='残券相当額 '+Number(pre.data?.residual_value||0).toLocaleString()+'円';
 }
 const rows=fin.data?.length?fin.data:(prov.data||[]);
 let day=0;for(const r of rows) day+=Number(r.points||0);
 dayPt.textContent=day.toFixed(1)+' pt'+(fin.data?.length?'（確定）':'（暫定）');
}
async function startScan(){
 if(scanner)return;
 scanner=new Html5Qrcode("reader");
 scanBtn.style.display='none';stopBtn.style.display='block';scanMsg.textContent='カメラを起動しています...';
 try{
   await scanner.start({facingMode:"environment"},{fps:10,qrbox:250},async text=>{
     if(busy)return;busy=true;
     let token=text;
     try{const u=new URL(text);token=u.searchParams.get('attendance_token')||text}catch(e){}
     const {data,error}=await sb.rpc('toggle_attendance_by_qr',{p_token:token});
     scanMsg.innerHTML=error?'<span class="err">エラー：'+error.message+'</span>':'<span class="ok">✅ '+(data.action==='clock_in'?'出勤しました':'退勤しました')+'</span>';
     if(!error){await stopScan();await load()}
     busy=false;
   });
   scanMsg.textContent='QRを画面中央に入れてください。';
 }catch(e){scanMsg.innerHTML='<span class="err">'+e.message+'</span>';scanner=null;scanBtn.style.display='block';stopBtn.style.display='none'}
}
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}scanner=null}scanBtn.style.display='block';stopBtn.style.display='none'}
scanBtn.onclick=startScan;stopBtn.onclick=stopScan;load();
</script></body></html>
