<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>店長 | シグマ祭</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline-store.js"></script>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{--red:#b5121b;--dark:#8f0e15;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;padding-bottom:82px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:30px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--dark));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#ffdede}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.06)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:15px;background:var(--soft)}
.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:4px;font-size:25px}
.tools{display:grid;grid-template-columns:1fr;gap:12px}
button{border:0;border-radius:13px;padding:13px;font:inherit;font-weight:800;background:var(--soft);color:var(--red)}
.order{border-left:5px solid #ddd}.order.new{border-left-color:#b5121b}.order.cooking{border-left-color:#d98b00}.order.ready{border-left-color:#15803d}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-items{font-size:20px;font-weight:900}
.meta{margin-top:6px;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{width:auto;flex:1;min-width:82px;padding:9px}
.color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#999}
.color-dot.red{background:#dc2626}.color-dot.blue{background:#2563eb}.color-dot.green{background:#16a34a}.pickup-number{font-size:30px;font-weight:900;margin-bottom:8px}.pickup-number.red{color:#dc2626!important}.pickup-number.blue{color:#2563eb!important}.pickup-number.green{color:#16a34a!important}
.small{font-size:12px;color:var(--muted)}
.global-bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);min-height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9998;background:rgba(255,255,255,.96);border-top:1px solid #eadfdb;box-shadow:0 -5px 22px rgba(55,20,20,.08)}
.global-bottom-nav button{margin:0;padding:7px 4px;background:transparent;color:#6e6e73;font-size:11px}.global-bottom-nav .gicon{display:block;font-size:20px;margin-bottom:4px}



.tools button{width:100%;min-height:64px;margin:0;padding:15px 14px;border-radius:14px}
</style>
</head>
<body>
<header>
  <h1>店長</h1>
  <p>注文・人員・レジ・買い出しをここで管理</p>
</header>
<main>
  <section id="offlineManagerBanner" class="card" style="display:none;background:#fff8e8;border-color:#efd39a">
    <strong>非常用・店長バックアップ</strong>
    <p id="offlineManagerText" class="small">オフライン直前までの未提供注文を表示します。障害後の新規注文は紙伝票で運用し、この画面へ打ち直す必要はありません。</p>
  </section>

  <section class="card">
    <h2 style="margin-top:0">現在の注文</h2>
    <div class="summary">
      <div class="stat"><span>未提供 炒飯</span><strong id="pendingRice">0</strong></div>
      <div class="stat"><span>未提供 胡麻団子</span><strong id="pendingSesame">0</strong></div>
      <div class="stat"><span>新規注文</span><strong id="newCount">0</strong></div>
      <div class="stat"><span>提供待ち</span><strong id="readyCount">0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2 style="margin-top:0">店長ツール</h2>
    <div class="tools">
      <button onclick="location.href='active-staff.html'">出勤中・役割変更</button>
      <button onclick="location.href='shopping.html'">買い出し</button>
      <button onclick="location.href='attendance-qr.html'">勤怠QR</button>
    </div>
  </section>

  <section class="card"><h2>食材受取管理</h2><button onclick="location.href='food-return.html'">出勤予定・食材受取を開く</button></section>
<section>
    <h2>注文一覧</h2>
    <p class="small">古い注文から表示。番号修正・取消はオンライン時のみ店長／管理者が行えます。取消は返金確認とは別です。</p>
    <div id="orders"><div class="card">読み込み中...</div></div>
  </section>

  <section class="card">
    <h2 style="margin-top:0">提供済み履歴</h2>
    <p class="small">間違って提供済みにした注文は、ここから「受け渡し待ち」へ戻せます。</p>
    <button onclick="toggleHistory()" id="historyToggleBtn">履歴を表示</button>
    <div id="historyArea" style="display:none;margin-top:12px;"></div>
  </section>
</main>

<nav class="global-bottom-nav">
  <button onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button>
  <button onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button>
  <button onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button>
</nav>

<script>

const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);

function colorName(c){
  return c==="red"?"赤レジ":c==="blue"?"青レジ":c==="green"?"緑レジ":"レジ不明";
}
function statusName(s){
  return s==="new"?"新規":s==="cooking"?"調理中":s==="ready"?"受け渡し待ち":s==="served"?"提供済み":s==="void"?"取消済み":s;
}
function time(v){
  return new Date(v).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
async function saveManagerBackup(rows){
  try{
    if(window.SigmaOfflineStore){
      const active=(rows||[]).filter(x=>x.order_status!=="served"&&x.order_status!=="void");
      await SigmaOfflineStore.setManagerOrders(active,'manager_live');
    }
  }catch(_){}
}

async function showOfflineOrders(){
  offlineManagerBanner.style.display='block';
  let snap={saved_at:null,orders:[]};
  try{snap=await SigmaOfflineStore.getManagerOrders();}catch(_){}
  const rows=Array.isArray(snap?.orders)?snap.orders:[];
  offlineManagerText.textContent=`最終バックアップ：${snap?.saved_at?new Date(snap.saved_at).toLocaleString('ja-JP'):'未保存'}。障害後の新規注文は紙伝票で運用し、この画面への再入力は不要です。`;

  const active=rows.filter(x=>x.order_status!=="served"&&x.order_status!=="void");
  pendingRice.textContent=active.reduce((a,x)=>a+Number(x.fried_rice_qty||0),0);
  pendingSesame.textContent=active.reduce((a,x)=>a+Number(x.sesame_qty||0),0);
  newCount.textContent=active.filter(x=>x.order_status==="new").length;
  readyCount.textContent=active.filter(x=>x.order_status==="ready").length;

  if(!active.length){
    orders.innerHTML='<div class="card">バックアップ時点で未提供の注文はありません。</div>';
    return;
  }

  orders.innerHTML=active
    .sort((a,b)=>new Date(a.ordered_at)-new Date(b.ordered_at))
    .slice(0,100)
    .map(x=>{
      const items=[
        Number(x.fried_rice_qty||0)>0?`炒飯 ${x.fried_rice_qty}`:"",
        Number(x.sesame_qty||0)>0?`胡麻団子 ${x.sesame_qty}`:""
      ].filter(Boolean).join("・");
      return `<div class="card order ${x.order_status}">
        <div class="pickup-number ${x.register_color||""}">受取 ${x.pickup_number||"—"}</div>
        <div class="order-top">
          <div>
            <div class="order-items">${items}</div>
            <div class="meta"><span class="color-dot ${x.register_color||""}"></span>${colorName(x.register_color)} ／ ${x.source==="cash"?"現金":x.source==="mixed"?"QR＋現金":"QR交換"} ／ ${time(x.ordered_at)}</div>
          </div>
          <strong>${statusName(x.order_status)}</strong>
        </div>
        <div class="small" style="margin-top:10px">オフラインバックアップ表示。障害後の注文は紙伝票を使用してください。</div>
      </div>`;
    }).join("");
}

async function setStatus(id,status){
  const {error}=await sb.rpc("manager_set_order_status",{p_order_id:id,p_status:status});
  if(error){alert(error.message);return;}
  await loadOrders();
}
async function loadOrders(){
  const {data,error}=await sb.rpc("manager_order_board_v3",{p_include_served:false});
  if(error){
    await showOfflineOrders();
    return;
  }

  const rows=data||[];
  offlineManagerBanner.style.display='none';
  await saveManagerBackup(rows);
  const active=rows.filter(x=>x.order_status!=="served"&&x.order_status!=="void");
  pendingRice.textContent=active.reduce((a,x)=>a+Number(x.fried_rice_qty||0),0);
  pendingSesame.textContent=active.reduce((a,x)=>a+Number(x.sesame_qty||0),0);
  newCount.textContent=rows.filter(x=>x.order_status==="new").length;
  readyCount.textContent=rows.filter(x=>x.order_status==="ready").length;

  const visible=rows
    .filter(x=>x.order_status!=="served"&&x.order_status!=="void")
    .sort((a,b)=>new Date(a.ordered_at)-new Date(b.ordered_at))
    .slice(0,80);
  if(!visible.length){
    orders.innerHTML='<div class="card">現在、未提供の注文はありません。</div>';
    return;
  }

  orders.innerHTML=visible.map(x=>{
    const items=[
      Number(x.fried_rice_qty||0)>0?`炒飯 ${x.fried_rice_qty}`:"",
      Number(x.sesame_qty||0)>0?`胡麻団子 ${x.sesame_qty}`:""
    ].filter(Boolean).join("・");

    return `<div class="card order ${x.order_status}">
      <div class="pickup-number ${x.register_color || ""}">
        受取 ${x.pickup_number || "—"}
      </div>
      <div class="order-top">
        <div>
          <div class="order-items">${items}</div>
          <div class="meta">
            <span class="color-dot ${x.register_color||""}"></span>${colorName(x.register_color)}
            ／ ${x.source==="cash"?"現金":x.source==="mixed"?"QR＋現金":"QR交換"} ／ ${time(x.ordered_at)}
          </div>
        </div>
        <strong>${statusName(x.order_status)}</strong>
      </div>
      <div class="actions">
        <button onclick="setStatus(${x.id},'served')">提供済みにする</button>
        <button onclick="editProducts(${x.id},${Number(x.fried_rice_qty||0)},${Number(x.sesame_qty||0)})">商品修正</button>
        <button onclick="editPickupNumber(${x.id},decodeURIComponent('${encodeURIComponent(String(x.pickup_number??''))}'))">番号修正</button>
        <button onclick="voidServiceOrder(${x.id})">注文取消</button>
      </div>
    </div>`;
  }).join("");
}


async function editProducts(id,currentRice,currentSesame){
  if(!navigator.onLine)return alert('商品修正はオンライン時のみ可能です');
  const riceRaw=prompt('修正後のチャーハン数量（0以上の整数）',String(currentRice));
  if(riceRaw===null)return;
  const sesameRaw=prompt('修正後のごま団子セット数（0以上の整数）',String(currentSesame));
  if(sesameRaw===null)return;
  if(!/^\\d{1,3}$/.test(riceRaw.trim())||!/^\\d{1,3}$/.test(sesameRaw.trim()))
    return alert('数量は0〜999の整数で入力してください');
  const rice=Number(riceRaw.trim()),sesame=Number(sesameRaw.trim());
  if(rice+sesame===0)return alert('商品をすべて0にする場合は注文取消を使用してください');
  if(rice===currentRice&&sesame===currentSesame)return alert('変更がありません');
  const reason=prompt('商品修正の理由（必須）','レジ入力ミスの訂正');
  if(!reason?.trim())return;
  if(!confirm(`注文ID ${id}の商品数量を修正します。\\nチャーハン：${currentRice} → ${rice}\\nごま団子：${currentSesame} → ${sesame}\\n※現金金額・返金状態は変更されません。`))return;
  const {error}=await sb.rpc('manager_change_order_products',{
    p_order_id:id,p_fried_rice_qty:rice,p_sesame_qty:sesame,p_reason:reason.trim()
  });
  if(error)return alert('商品修正に失敗しました：'+error.message);
  alert('商品数量を修正しました。現金金額は変更していません。');
  await loadOrders();if(historyOpen)await loadHistory();
}
async function editPickupNumber(id,current){
  if(!navigator.onLine)return alert('番号修正はオンライン時のみ可能です');
  const next=prompt('新しい受取番号を入力してください',current);
  if(next===null)return;
  const pickup=next.trim();if(!/^\d{1,6}$/.test(pickup))return alert('番号は1〜6桁の数字で入力してください');
  const reason=prompt('変更理由を入力してください（必須）','レジ入力ミスの訂正');
  if(!reason?.trim())return;
  if(!confirm(`注文ID ${id} の受取番号を ${current} → ${pickup} に変更します。よろしいですか？`))return;
  const {error}=await sb.rpc('manager_change_order_pickup',{p_order_id:id,p_new_pickup_number:pickup,p_reason:reason.trim()});
  if(error)return alert('変更できませんでした：'+error.message);
  alert('受取番号を更新しました');await loadOrders();if(historyOpen)await loadHistory();
}
async function voidServiceOrder(id){
  if(!navigator.onLine)return alert('注文取消はオンライン時のみ可能です');
  const reason=prompt('取消理由を入力してください（必須）','レジ入力ミス');
  if(!reason?.trim())return;
  if(!confirm(`注文ID ${id} を取り消します。調理状況を確認してください。
システム上の返金処理と現金の実返金は区別して記録します。`))return;
  const {error}=await sb.rpc('manager_void_service_order',{p_order_id:id,p_reason:reason.trim()});
  if(error)return alert('取消できませんでした：'+error.message);
  alert('注文を取り消しました。現金を実際に返した場合は別途返金確認を記録してください。');
  await loadOrders();if(historyOpen)await loadHistory();
}
let historyOpen=false;

async function restoreOrder(id){
  if(!confirm("この注文を受け渡し待ちへ戻しますか？")) return;
  const {error}=await sb.rpc("manager_restore_order",{p_order_id:id});
  if(error){alert(error.message);return;}
  await loadOrders();
  if(historyOpen) await loadHistory();
}

async function loadHistory(){
  const area=document.getElementById("historyArea");
  area.innerHTML="読み込み中...";

  const {data,error}=await sb.rpc(
    "manager_order_board_v3",
    {p_include_served:true}
  );

  if(error){
    area.innerHTML=`<div class="card">エラー：${error.message}</div>`;
    return;
  }

  const rows=(data||[]).filter(x=>x.order_status==="served");

  if(!rows.length){
    area.innerHTML='<div class="small">提供済み履歴はありません。</div>';
    return;
  }

  area.innerHTML=rows.slice(0,100).map(x=>{
    const items=[
      Number(x.fried_rice_qty||0)>0?`炒飯 ${x.fried_rice_qty}`:"",
      Number(x.sesame_qty||0)>0?`胡麻団子 ${x.sesame_qty}`:""
    ].filter(Boolean).join("・");

    return `<div class="card">
      <div class="pickup-number ${x.register_color||""}">
        受取 ${x.pickup_number||"—"}
      </div>
      <div class="order-items">${items}</div>
      <div class="meta">${colorName(x.register_color)} ／ 提供済み ${x.served_at?time(x.served_at):""}</div>
      <div class="actions">
        <button onclick="restoreOrder(${x.id})">受け渡し待ちへ戻す</button>
        <button onclick="editProducts(${x.id},${Number(x.fried_rice_qty||0)},${Number(x.sesame_qty||0)})">商品修正</button>
        <button onclick="editPickupNumber(${x.id},decodeURIComponent('${encodeURIComponent(String(x.pickup_number??''))}'))">番号修正</button>
        <button onclick="voidServiceOrder(${x.id})">注文取消</button>
      </div>
    </div>`;
  }).join("");
}

async function toggleHistory(){
  historyOpen=!historyOpen;
  const area=document.getElementById("historyArea");
  const btn=document.getElementById("historyToggleBtn");
  area.style.display=historyOpen?"block":"none";
  if(btn) btn.textContent=historyOpen?"履歴を閉じる":"履歴を表示";
  if(historyOpen) await loadHistory();
}

async function guard(){
  const {data,error}=await sb.rpc("is_store_manager");
  if(error||!data){
    document.querySelector("main").innerHTML=
      '<div class="card">店長勤務中または管理者のみ利用できます。</div>';
    return false;
  }
  return true;
}

(async()=>{
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{});}
  if(!navigator.onLine){await showOfflineOrders();return;}
  if(!await guard()) return;
  await loadOrders();

  sb.channel("v8-service-orders")
    .on("postgres_changes",{event:"*",schema:"public",table:"service_orders"},async()=>{await loadOrders();if(historyOpen)await loadHistory();})
    .subscribe();

  setInterval(async()=>{if(navigator.onLine)await loadOrders();else await showOfflineOrders();},5000);
})();
window.addEventListener('offline',()=>showOfflineOrders());
window.addEventListener('online',()=>setTimeout(async()=>{if(await guard())await loadOrders();},1000));
</script>
</body>
</html>
