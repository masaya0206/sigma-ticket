<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>店長 | シグマ祭</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{--red:#b5121b;--dark:#8f0e15;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;padding-bottom:82px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:30px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--dark));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#ffdede}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.06)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:15px;background:var(--soft)}
.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:4px;font-size:25px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:13px;padding:13px;font:inherit;font-weight:800;background:var(--soft);color:var(--red)}
.order{border-left:5px solid #ddd}.order.new{border-left-color:#b5121b}.order.cooking{border-left-color:#d98b00}.order.ready{border-left-color:#15803d}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-items{font-size:20px;font-weight:900}
.meta{margin-top:6px;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{width:auto;flex:1;min-width:82px;padding:9px}
.color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#999}
.color-dot.red{background:#dc2626}.color-dot.blue{background:#2563eb}.color-dot.green{background:#16a34a}.pickup-number{font-size:30px;font-weight:900;margin-bottom:8px}.pickup-number.red{color:#dc2626!important}.pickup-number.blue{color:#2563eb!important}.pickup-number.green{color:#16a34a!important}
.small{font-size:12px;color:var(--muted)}
.global-bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);min-height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9998;background:rgba(255,255,255,.96);border-top:1px solid #eadfdb;box-shadow:0 -5px 22px rgba(55,20,20,.08)}
.global-bottom-nav button{margin:0;padding:7px 4px;background:transparent;color:#6e6e73;font-size:11px}.global-bottom-nav .gicon{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <h1>店長</h1>
  <p>注文・人員・レジ・買い出しをここで管理</p>
</header>
<main>
  <section class="card">
    <h2 style="margin-top:0">現在の注文</h2>
    <div class="summary">
      <div class="stat"><span>未提供 炒飯</span><strong id="pendingRice">0</strong></div>
      <div class="stat"><span>未提供 胡麻団子</span><strong id="pendingSesame">0</strong></div>
      <div class="stat"><span>新規注文</span><strong id="newCount">0</strong></div>
      <div class="stat"><span>提供待ち</span><strong id="readyCount">0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2 style="margin-top:0">店長ツール</h2>
    <div class="tools">
      <button onclick="location.href='register-teams.html'">レジ編成</button>
      <button onclick="location.href='role-control.html'">役割変更</button>
      <button onclick="location.href='shopping.html'">買い出し</button>
      <button onclick="location.href='attendance-qr.html'">勤怠QR</button>
    </div>
  </section>

  <section>
    <h2>注文一覧</h2>
    <div id="orders"><div class="card">読み込み中...</div></div>
  </section>

  <section class="card">
    <button onclick="toggleHistory()">提供済み履歴を見る / 閉じる</button>
    <div id="historyArea" style="display:none;margin-top:12px;"></div>
  </section>
</main>

<nav class="global-bottom-nav">
  <button onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button>
  <button onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button>
  <button onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button>
</nav>

<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);

function colorName(c){
  return c==="red"?"赤レジ":c==="blue"?"青レジ":c==="green"?"緑レジ":"レジ不明";
}
function statusName(s){
  return s==="new"?"新規":s==="cooking"?"調理中":s==="ready"?"受け渡し待ち":s==="served"?"提供済み":s;
}
function time(v){
  return new Date(v).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
async function setStatus(id,status){
  const {error}=await sb.rpc("manager_set_order_status",{p_order_id:id,p_status:status});
  if(error){alert(error.message);return;}
  await loadOrders();
}
async function loadOrders(){
  const {data,error}=await sb.rpc("manager_order_board_v3",{p_include_served:false});
  if(error){
    orders.innerHTML=`<div class="card">エラー：${error.message}</div>`;
    return;
  }

  const rows=data||[];
  const active=rows.filter(x=>x.order_status!=="served");
  pendingRice.textContent=active.reduce((a,x)=>a+Number(x.fried_rice_qty||0),0);
  pendingSesame.textContent=active.reduce((a,x)=>a+Number(x.sesame_qty||0),0);
  newCount.textContent=rows.filter(x=>x.order_status==="new").length;
  readyCount.textContent=rows.filter(x=>x.order_status==="ready").length;

  const visible=rows.filter(x=>x.order_status!=="served").slice(0,80);
  if(!visible.length){
    orders.innerHTML='<div class="card">現在、未提供の注文はありません。</div>';
    return;
  }

  orders.innerHTML=visible.map(x=>{
    const items=[
      Number(x.fried_rice_qty||0)>0?`炒飯 ${x.fried_rice_qty}`:"",
      Number(x.sesame_qty||0)>0?`胡麻団子 ${x.sesame_qty}`:""
    ].filter(Boolean).join("・");

    return `<div class="card order ${x.order_status}">
      <div class="pickup-number ${x.register_color || ""}">
        受取 ${x.pickup_number || "—"}
      </div>
      <div class="order-top">
        <div>
          <div class="order-items">${items}</div>
          <div class="meta">
            <span class="color-dot ${x.register_color||""}"></span>${colorName(x.register_color)}
            ／ ${x.source==="cash"?"現金":"QR交換"} ／ ${time(x.ordered_at)}
          </div>
        </div>
        <strong>${statusName(x.order_status)}</strong>
      </div>
      <div class="actions">
        ${x.order_status==="new"?`<button onclick="setStatus(${x.id},'cooking')">調理中</button>`:""}
        ${["new","cooking"].includes(x.order_status)?`<button onclick="setStatus(${x.id},'ready')">受け渡し待ち</button>`:""}
        <button onclick="setStatus(${x.id},'served')">提供済み</button>
      </div>
    </div>`;
  }).join("");
}


let historyOpen=false;

async function restoreOrder(id){
  if(!confirm("この注文を受け渡し待ちへ戻しますか？")) return;
  const {error}=await sb.rpc("manager_restore_order",{p_order_id:id});
  if(error){alert(error.message);return;}
  await loadOrders();
  if(historyOpen) await loadHistory();
}

async function loadHistory(){
  const area=document.getElementById("historyArea");
  area.innerHTML="読み込み中...";

  const {data,error}=await sb.rpc(
    "manager_order_board_v3",
    {p_include_served:true}
  );

  if(error){
    area.innerHTML=`<div class="card">エラー：${error.message}</div>`;
    return;
  }

  const rows=(data||[]).filter(x=>x.order_status==="served");

  if(!rows.length){
    area.innerHTML='<div class="small">提供済み履歴はありません。</div>';
    return;
  }

  area.innerHTML=rows.slice(0,100).map(x=>{
    const items=[
      Number(x.fried_rice_qty||0)>0?`炒飯 ${x.fried_rice_qty}`:"",
      Number(x.sesame_qty||0)>0?`胡麻団子 ${x.sesame_qty}`:""
    ].filter(Boolean).join("・");

    return `<div class="card">
      <div class="pickup-number ${x.register_color||""}">
        受取 ${x.pickup_number||"—"}
      </div>
      <div class="order-items">${items}</div>
      <div class="meta">${colorName(x.register_color)} ／ 提供済み ${x.served_at?time(x.served_at):""}</div>
      <div class="actions">
        <button onclick="restoreOrder(${x.id})">受け渡し待ちへ戻す</button>
      </div>
    </div>`;
  }).join("");
}

async function toggleHistory(){
  historyOpen=!historyOpen;
  const area=document.getElementById("historyArea");
  area.style.display=historyOpen?"block":"none";
  if(historyOpen) await loadHistory();
}

async function guard(){
  const {data,error}=await sb.rpc("is_store_manager");
  if(error||!data){
    document.querySelector("main").innerHTML=
      '<div class="card">店長勤務中または管理者のみ利用できます。</div>';
    return false;
  }
  return true;
}

(async()=>{
  if(!await guard()) return;
  await loadOrders();

  sb.channel("v8-service-orders")
    .on("postgres_changes",{event:"*",schema:"public",table:"service_orders"},async()=>{await loadOrders();if(historyOpen)await loadHistory();})
    .subscribe();

  setInterval(loadOrders,5000);
})();
</script>
</body>
</html>
