<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前売りノルマ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f5;margin:0;color:#251313}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #f0caca;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #8b000012}h1{font-size:24px}h2{font-size:18px;margin-top:0}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#a91520;color:white;font-weight:700;font-size:16px}.secondary{background:#fff;color:#a91520;border:1px solid #a91520}.danger{background:#6d0c13}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9bcbc;border-radius:10px;font-size:16px;margin:5px 0 10px}.big{font-size:32px;font-weight:800}.muted{color:#725b5b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff7f7;border-radius:14px;padding:14px}.ok{color:#147b31}.warn{color:#b36a00}.row{padding:10px 0;border-bottom:1px solid #f0dddd}.pill{display:inline-block;padding:4px 8px;background:#f8dddd;border-radius:999px;font-size:12px}label{font-weight:700}</style></head><body><main>
<button class="secondary" onclick="location.href='home.html'">← ホーム</button><h1>前売りノルマ</h1>
<div class="card"><h2>現在の状況</h2><div class="grid"><div class="metric"><div class="muted">前売りポイント</div><div class="big" id="pt">--</div></div><div class="metric"><div class="muted">残券</div><div class="big" id="res">--</div></div></div><p id="resValue" class="muted"></p></div>
<div class="card"><h2>ノルマ選択</h2><p class="muted">最低8枚・1枚刻み・上限なし。管理者が確定した瞬間から返金不可です。未選択は8枚になります。</p><label>希望ノルマ枚数</label><input id="quota" type="number" min="8" step="1" value="8"><div id="preview"></div><button id="save" onclick="saveQuota()">この枚数を選択</button><p id="msg"></p></div>
<div class="card"><h2>確定内容</h2><div id="details">読み込み中...</div></div>
<script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function basePt(n){n=Math.max(8,Number(n)||8);return n<=8?8:Math.round((0.1*n*n-0.5*n+5.6)*10)/10}
quota.oninput=()=>preview.innerHTML=`<b>${quota.value}枚 → 初期 ${basePt(quota.value)}pt</b>`;
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='home.html';return}const{data,error}=await db.rpc('my_presale_status');if(error){details.textContent='エラー: '+error.message;return}quota.value=data.requested_quota||8;quota.oninput();pt.textContent=Number(data.presale_points||0).toFixed(1)+' pt';res.textContent=(data.residual_remaining||0)+' 枚';resValue.textContent=(data.residual_remaining||0)>0?'残券相当額 '+Number(data.residual_value||0).toLocaleString()+'円':'残券なし ✓';const confirmed=!!data.confirmed_at;save.disabled=confirmed;quota.disabled=confirmed;details.innerHTML=`希望: <b>${data.requested_quota}枚</b><br>確定: <b>${confirmed?data.confirmed_quota+'枚':'未確定'}</b><br>確定時徴収額: <b>${data.collected_amount==null?'--':Number(data.collected_amount).toLocaleString()+'円'}</b><br>祭前販売: <b>${data.presale_sold}枚</b><br>超過販売: <b>${data.overflow_sold}枚</b><br><span class="muted">超過分は1枚=1pt</span>`;}
async function saveQuota(){const n=Number(quota.value);msg.textContent='保存中...';const{error}=await db.rpc('select_presale_quota',{p_quota:n});msg.textContent=error?'エラー: '+error.message:'✅ 選択を保存しました';if(!error)load()}load();</script></main></body></html>
