<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポイント管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>⭐ ポイント管理</h1></header><main><div class="card"><h2>係数設定</h2><div class="grid">
<label>表番係数<input id="front" type="number" step=".01"></label><label>裏番係数<input id="back" type="number" step=".01"></label><label>調理係数<input id="cook" type="number" step=".01"></label><label>サポート係数<input id="support" type="number" step=".01"></label><label>炒飯負荷<input id="rice" type="number" step=".01"></label><label>胡麻団子負荷<input id="sesame" type="number" step=".01"></label><label>外1件 基礎pt<input id="outside" type="number" step=".1"></label><label>基準伝票数/時<input id="ref" type="number" step=".1"></label><label>レジ補正係数<input id="reg" type="number" step=".01"></label><label>買い出し倍率（最低1）<input id="shop" type="number" step=".01" min="1"></label></div><button class="primary" id="save">設定保存</button><div id="msg"></div></div>
<div class="card"><h2>再計算</h2><label>開始日時<input id="from" type="datetime-local"></label><label>終了日時<input id="to" type="datetime-local"></label><div class="grid"><button id="prov">暫定（60分）再計算</button><button class="primary" id="finalize">最終（30分）再計算</button></div><div id="calcmsg"></div></div>
<div class="card"><h2>ランキング</h2><div class="grid"><button onclick="ranking(false)">暫定</button><button onclick="ranking(true)">最終</button></div><div id="ranking"></div></div><button onclick="location.href='admin.html'">管理者画面へ戻る</button></main><script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function adminCheck(){const {data:{user}}=await sb.auth.getUser();if(!user){document.body.innerHTML='管理者ログインが必要です';return false}const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data){document.body.innerHTML='管理者権限がありません';return false}return true}
async function loadSettings(){const {data,error}=await sb.from('point_system_settings').select('*').eq('id',1).single();if(error){msg.textContent=error.message;return}front.value=data.role_front_coeff;back.value=data.role_back_coeff;cook.value=data.role_cook_coeff;support.value=data.role_support_coeff;rice.value=data.fried_rice_load;sesame.value=data.sesame_load;outside.value=data.outside_base_action_pt;ref.value=data.outside_reference_slips_per_hour;reg.value=data.register_factor;shop.value=data.shopping_multiplier;}
save.onclick=async()=>{const {data:{user}}=await sb.auth.getUser();const payload={role_front_coeff:+front.value,role_back_coeff:+back.value,role_cook_coeff:+cook.value,role_support_coeff:+support.value,fried_rice_load:+rice.value,sesame_load:+sesame.value,outside_base_action_pt:+outside.value,outside_reference_slips_per_hour:+ref.value,register_factor:+reg.value,shopping_multiplier:Math.max(1,+shop.value),updated_at:new Date().toISOString(),updated_by:user.id};const {error}=await sb.from('point_system_settings').update(payload).eq('id',1);msg.textContent=error?'エラー：'+error.message:'✅ 保存しました';}
function iso(v){return new Date(v).toISOString()}async function recalc(finalFlag){calcmsg.textContent='計算中...';const {data,error}=await sb.rpc('recalculate_points',{p_from:iso(from.value),p_to:iso(to.value),p_final:finalFlag});calcmsg.textContent=error?'エラー：'+error.message:'✅ '+JSON.stringify(data);if(!error)ranking(finalFlag)}prov.onclick=()=>recalc(false);finalize.onclick=()=>recalc(true);
async function ranking(finalFlag){const {data,error}=await sb.rpc('point_ranking',{p_final:finalFlag});ranking.innerHTML=error?error.message:(data||[]).map((x,i)=>`<div class="row"><b>${i+1}. ${x.staff_name}</b><br><span class="small">内 ${Number(x.inside_points).toFixed(1)} / 外 ${Number(x.outside_points).toFixed(1)} / 買出 ${Number(x.shopping_points).toFixed(1)}</span><span style="float:right"><b>${Number(x.total_points).toFixed(1)}pt</b></span></div>`).join('')}
(async()=>{if(await adminCheck()){await loadSettings();ranking(false)}})();</script></body></html>
