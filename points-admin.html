<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポイント管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}
header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}
button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}
input,select,textarea{border:1px solid #ddd5d1;background:#fff}
button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}
.primary{background:#b5121b;color:#fff}
.danger{background:#7f1d1d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#6e6e73;line-height:1.55}
.big{font-size:30px;font-weight:900}
.row{padding:11px 0;border-top:1px solid #eee}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}
.ok{color:#15803d;font-weight:800}.err{color:#b00020;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>⭐ ポイント管理</h1></header>
<main>

<div class="card">
  <h2>ポイント再計算</h2>
  <p class="small">
    現在のポイントルールで再計算します。<br>
    ・当日内：注文時点の客数・店内人数・役割係数<br>
    ・売り子：各日の客数実績から動的難易度を算出<br>
    ・最終計算：売り子難易度を30分単位で再計算
  </p>
  <div class="grid">
    <button id="prov">暫定再計算</button>
    <button class="primary" id="finalize">最終再計算</button>
  </div>
  <div id="calcmsg"></div>
</div>

<div class="card">
  <h2>内外換算</h2>
  <div id="conversion">未計算</div>
  <p class="small">
    最終ポイント計算で使用する内外の換算状況を表示します。
    係数そのものの設定は「変数設定」で管理します。
  </p>
</div>

<div class="card">
  <h2>ランキング</h2>
  <div class="grid">
    <button onclick="ranking(false)">暫定</button>
    <button onclick="ranking(true)">最終</button>
  </div>
  <div id="rank"></div>
</div>

<div class="grid">
  <button onclick="location.href='variables-admin.html'">変数設定</button>
  <button onclick="location.href='admin-menu.html'">管理者メニューへ</button>
</div>

</main>

<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);

async function adminCheck(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){
    location.href="home.html";
    return false;
  }
  const {data}=await sb.from("admins")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(!data){
    document.body.innerHTML="管理者権限がありません";
    return false;
  }
  return true;
}

async function calc(finalFlag){
  calcmsg.textContent="計算中...";

  const {error}=await sb.rpc(
    "recalculate_event_points",
    {p_final:finalFlag}
  );

  if(error){
    calcmsg.innerHTML=`<span class="err">${error.message}</span>`;
    return;
  }

  calcmsg.innerHTML=finalFlag
    ?'<span class="ok">✅ 最終ポイントを再計算しました</span>'
    :'<span class="ok">✅ 暫定ポイントを再計算しました</span>';

  await ranking(finalFlag);
  await conv();
}

prov.onclick=()=>calc(false);
finalize.onclick=()=>calc(true);

async function conv(){
  const {data,error}=await sb.rpc("final_point_conversion");

  if(error){
    conversion.textContent=error.message;
    return;
  }

  const x=data?.[0]||{};

  conversion.innerHTML=`
    内換算係数 <b>${Number(x.inside_factor||1).toFixed(4)}</b>
    <br>
    <span class="small">
      内実働 ${Number(x.inside_minutes||0).toFixed(0)}分 /
      外実働 ${Number(x.outside_minutes||0).toFixed(0)}分
      <br>
      内raw ${Number(x.inside_raw_points||0).toFixed(1)} /
      外raw ${Number(x.outside_raw_points||0).toFixed(1)}
    </span>
  `;
}

async function ranking(finalFlag){
  const {data,error}=await sb.rpc(
    "point_ranking",
    {p_final:finalFlag}
  );

  if(error){
    rank.textContent=error.message;
    return;
  }

  rank.innerHTML=(data||[]).map((x,i)=>`
    <div class="row">
      <b>${i+1}. ${x.staff_name}</b>
      <br>
      <span class="small">
        当日内 ${Number(x.inside_points||0).toFixed(1)}
        /
        当日外 ${Number(x.outside_points||0).toFixed(1)}
        ${Number(x.shopping_points||0)!==0
          ?` / 買い出し ${Number(x.shopping_points||0).toFixed(1)}`
          :""
        }
      </span>
      <span style="float:right">
        <b>${Number(x.total_points||0).toFixed(1)}pt</b>
      </span>
    </div>
  `).join("");
}

(async()=>{
  if(await adminCheck()){
    await ranking(false);
    await conv();
  }
})();
</script>
</body>
</html>
