<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#b5121b"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>前売り券・当日券</title>
<style>
:root{--red:#b5121b;--dark:#8f0e15;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:var(--red);font-size:20px;font-weight:900;box-shadow:0 4px 15px #4a191912}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{width:100%;margin:10px 0;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left;box-shadow:0 5px 16px #2b16160b}
.card:active{transform:scale(.987)}.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:var(--soft);color:var(--red);font-weight:900;font-size:20px}
.name{display:block;margin-top:11px;font-size:18px;font-weight:900}.desc{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
</style>
<style id="globalBottomNavStyle">
  body{padding-bottom:82px!important}
  .global-bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(100%,620px);
    height:72px;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    z-index:9998;
    background:rgba(255,255,255,.96);
    border-top:1px solid #eadfdb;
    box-shadow:0 -5px 22px rgba(55,20,20,.08);
    backdrop-filter:blur(12px);
  }
  .global-bottom-nav.admin-nav{
    grid-template-columns:repeat(4,1fr);
  }
  .global-bottom-nav button{
    width:100%!important;
    min-width:0;
    margin:0!important;
    padding:7px 4px!important;
    border:0!important;
    border-radius:12px!important;
    background:transparent!important;
    color:#6e6e73!important;
    font:inherit;
    font-size:11px!important;
    font-weight:700!important;
    line-height:1.15;
    box-shadow:none!important;
  }
  .global-bottom-nav button .gicon{
    display:block;
    margin-bottom:4px;
    font-size:20px;
    line-height:1;
  }
  .global-bottom-nav button.active{
    color:#b5121b!important;
    background:#fff1f2!important;
  }
</style>


<style id="v80BottomNav">
body{padding-bottom:82px!important}
.global-bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);
width:min(100%,620px);min-height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9998;background:rgba(255,255,255,.96);
border-top:1px solid #eadfdb;box-shadow:0 -5px 22px rgba(55,20,20,.08);backdrop-filter:blur(12px)}
.global-bottom-nav.admin-nav{grid-template-columns:repeat(4,1fr)}
.global-bottom-nav button{width:100%!important;margin:0!important;padding:7px 4px!important;border:0!important;
border-radius:12px!important;background:transparent!important;color:#6e6e73!important;font:inherit;font-size:11px!important;
font-weight:700!important;line-height:1.15;box-shadow:none!important}
.global-bottom-nav .gicon{display:block;margin-bottom:4px;font-size:20px;line-height:1}
.global-bottom-nav button.active{color:#b5121b!important;background:#fff1f2!important}
</style>

</head><body><main>
<div class="top"><button class="back" onclick="history.length>1?history.back():location.href='home.html'">←</button><div><h1>前売り券・当日券</h1><div class="sub">販売と自分の状況</div></div></div>
<button class="card" onclick="location.href='seller.html'"><span class="icon">券</span><span class="name">チケット発行</span><span class="desc">前売り券・当日券・ノルマ残券の販売</span></button>
<button class="card" onclick="location.href='presale.html'"><span class="icon">数</span><span class="name">前売りノルマ・販売状況</span><span class="desc">希望ノルマ、前売りpt、残券を確認</span></button>
</main><nav class="global-bottom-nav"><button class="" onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button><button class="" onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button><button class="active" onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button></nav>
</body></html>
