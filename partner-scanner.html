<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提携特典QRリーダー</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root{--red:#b5121b;--red2:#8f0e15;--soft:#fff1f2;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px} header p{margin:7px 0 0;color:#ffe0e2;font-size:13px;line-height:1.6}
main{max-width:680px;margin:auto;padding:16px 16px 36px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.05)}
h2{margin:0 0 12px;font-size:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d8ceca;border-radius:13px;background:#fff;font:inherit}
textarea{min-height:88px;resize:vertical}
button,.btn{width:100%;display:block;text-align:center;padding:13px;border:0;border-radius:13px;background:var(--red);color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;margin-top:10px}
.secondary{background:var(--soft);color:var(--red)}
.success{background:#edf9ef;border-color:#b9e5c1} .danger{background:#fff0f0;border-color:#f0b8b8}
.small{font-size:12px;color:var(--muted);line-height:1.6} .muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee} .row:last-child{border-bottom:0}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--red);font-size:11px;font-weight:900}
.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
pre{white-space:pre-wrap;word-break:break-all;background:#faf7f5;padding:10px;border-radius:10px;font-size:11px}
</style>
</head>
<body>

<header>
  <h1 id="partnerTitle">提携特典QRリーダー</h1>
  <p id="partnerSub">前売り券QRを読み取って特典を適用します。</p>
</header>
<main>
  <div class="card" id="benefitCard">読み込み中...</div>

  <div class="card">
    <button id="scanBtn" onclick="startScanner()">QRコードを読み取る</button>
    <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none">読み取りを停止</button>
    <div id="reader" style="margin-top:12px"></div>
  </div>

  <div id="result"></div>

  <div class="card">
    <h2>自分の利用処理履歴</h2>
    <div id="history">読み込み中...</div>
  </div>

  <button class="secondary" onclick="logout()">ログアウト</button>
</main>

<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");

let ctx=null, currentBenefit=null, scanner=null, currentTicket=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function init(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){location.href="partner-login.html";return;}

  const {data,error}=await sb.rpc("partner_scanner_context");
  if(error){result.innerHTML=`<div class="card danger">${esc(error.message)}</div>`;return;}
  ctx=data;
  currentBenefit=(ctx.benefits||[])[0]||null;
  partnerTitle.textContent=ctx.partner.name+" 特典QRリーダー";
  partnerSub.textContent="Match Point前売り券の提携特典を処理します。";

  benefitCard.innerHTML=`
    <h2>${esc(ctx.partner.name)}</h2>
    ${currentBenefit?`
      <div style="font-size:20px;font-weight:900">${esc(currentBenefit.title)}</div>
      <div class="small" style="margin-top:6px">${esc(currentBenefit.description||"")}</div>
      <div style="margin-top:8px"><span class="pill">${esc(currentBenefit.valid_label)}</span> <span class="pill">1枚につき${currentBenefit.max_uses_per_ticket}回</span></div>
    `:"<div>現在利用できる特典がありません。</div>"}
    ${ctx.partner.instagram_url?`<a class="btn instagram" href="${esc(ctx.partner.instagram_url)}" target="_blank" rel="noopener">組織部 Instagram</a>`:""}
  `;
  await loadHistory();
}

async function startScanner(){
  if(!currentBenefit){alert("利用可能な特典がありません");return;}
  result.innerHTML="";
  scanBtn.style.display="none"; stopBtn.style.display="block";
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:250}},
      async decoded=>{
        await stopScanner();
        await checkTicket(decoded.trim());
      },
      ()=>{}
    );
  }catch(e){
    scanner=null;
    scanBtn.style.display="block";stopBtn.style.display="none";
    result.innerHTML=`<div class="card danger">カメラエラー：${esc(e.message||e)}</div>`;
  }
}

async function stopScanner(){
  if(scanner){
    try{await scanner.stop();await scanner.clear();}catch(e){}
    scanner=null;
  }
  scanBtn.style.display="block";stopBtn.style.display="none";
}

async function checkTicket(code){
  currentTicket=code;
  result.innerHTML='<div class="card">前売り券を確認しています...</div>';
  const {data,error}=await sb.rpc("partner_check_ticket",{p_ticket_code:code,p_benefit_id:currentBenefit.id});
  if(error){result.innerHTML=`<div class="card danger">エラー：${esc(error.message)}</div>`;return;}
  if(!data.ok){
    result.innerHTML=`<div class="card danger"><h2>利用できません</h2><b>${esc(data.message)}</b>${data.buyer_name?`<div class="small">購入者：${esc(data.buyer_name)}</div>`:""}<button class="secondary" onclick="startScanner()">次のQRを読む</button></div>`;
    return;
  }
  result.innerHTML=`<div class="card success">
    <h2>🟢 特典利用OK</h2>
    <div><b>${esc(currentBenefit.title)}</b></div>
    <div style="margin-top:10px">購入者：<b>${esc(data.buyer_name||"—")}</b></div>
    <div class="small">前売り券：${esc(data.ticket_code)}</div>
    <button onclick="redeem()">この特典を使用する</button>
    <button class="secondary" onclick="startScanner()">キャンセルして次へ</button>
  </div>`;
}

async function redeem(){
  if(!currentTicket)return;
  const {data,error}=await sb.rpc("partner_redeem_benefit",{p_ticket_code:currentTicket,p_benefit_id:currentBenefit.id});
  if(error){result.innerHTML=`<div class="card danger">エラー：${esc(error.message)}</div>`;return;}
  result.innerHTML=`<div class="card success"><h2>✅ 使用完了</h2><div>${esc(currentBenefit.title)}</div><button onclick="startScanner()">次のQRを読む</button></div>`;
  currentTicket=null;
  await loadHistory();
}

async function loadHistory(){
  const {data,error}=await sb.rpc("partner_recent_redemptions");
  if(error){history.textContent="履歴エラー："+error.message;return;}
  history.innerHTML=(data||[]).length?(data||[]).map(x=>`
    <div class="row">
      <div><b>${esc(x.buyer_name||"購入者名なし")}</b><div class="small">${new Date(x.redeemed_at).toLocaleString("ja-JP")} ／ ${esc(x.benefit_title)}</div></div>
    </div>`).join(""):'<div class="small">まだ利用処理はありません。</div>';
}

async function logout(){await sb.auth.signOut();location.href="partner-login.html";}
init();

</script>
</body>
</html>
