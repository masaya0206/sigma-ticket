<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前売り・券種管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f5;margin:0;color:#251313}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #f0caca;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #8b000012}h1{font-size:24px}h2{font-size:18px;margin-top:0}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#a91520;color:white;font-weight:700;font-size:16px}.secondary{background:#fff;color:#a91520;border:1px solid #a91520}.danger{background:#6d0c13}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9bcbc;border-radius:10px;font-size:16px;margin:5px 0 10px}.big{font-size:32px;font-weight:800}.muted{color:#725b5b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff7f7;border-radius:14px;padding:14px}.ok{color:#147b31}.warn{color:#b36a00}.row{padding:10px 0;border-bottom:1px solid #f0dddd}.pill{display:inline-block;padding:4px 8px;background:#f8dddd;border-radius:999px;font-size:12px}label{font-weight:700} table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #edd;text-align:left}</style></head><body><main><button class="secondary" onclick="location.href='home.html'">← ホーム</button><h1>前売り・券種管理</h1>
<div class="card"><h2>販売設定</h2><div class="grid"><div><label>前売り券価格</label><input id="pp" type="number"></div><div><label>当日券価格</label><input id="dp" type="number"></div></div><label><input id="pe" type="checkbox" style="width:auto"> 前売り券を販売中</label><br><label><input id="de" type="checkbox" style="width:auto"> 当日券を販売中</label><br><label>ノルマ選択期限</label><input id="deadline" type="datetime-local"><label>前売り終了予定</label><input id="endat" type="datetime-local"><button onclick="saveSettings()">設定を保存</button><p id="setmsg"></p></div>
<div class="card"><h2>ノルマ確定</h2><p class="muted">未選択者は8枚として確定します。確定した瞬間から返金不可・徴収額固定です。</p><button class="danger" onclick="confirmAll()">全スタッフのノルマを確定</button><p id="cmsg"></p></div>
<div class="card"><h2>前売り終了・残券確定</h2><p class="muted">祭前販売を締め、その瞬間の残券数と売れ残り率を固定します。同時に前売り停止・当日券販売開始になります。</p><button class="danger" onclick="closePre()">前売りを締めて残券を確定</button><p id="clmsg"></p></div>
<div class="card"><h2>インセンティブ配分</h2><label>総インセンティブ原資</label><input id="pool" type="number"><label>祭全体の最終売上</label><input id="totalsales" type="number"><button onclick="saveSettings()">金額を保存して再計算</button><div id="inc"></div></div>
<div class="card"><h2>スタッフ一覧</h2><button class="secondary" onclick="loadStaff()">更新</button><div style="overflow:auto"><table><thead><tr><th>名前</th><th>希望</th><th>確定</th><th>販売</th><th>pt</th><th>残券</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loc=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const iso=v=>v?new Date(v).toISOString():null;
async function ensureAdmin(){const{data:{user}}=await db.auth.getUser();if(!user)throw Error('ログインしてください');const{data}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data)throw Error('管理者のみ利用できます')}
async function loadSettings(){await ensureAdmin();const{data,error}=await db.from('ticket_sales_settings').select('*').eq('id',1).single();if(error)throw error;pp.value=data.presale_price;dp.value=data.day_price;pe.checked=data.presale_enabled;de.checked=data.day_enabled;deadline.value=loc(data.quota_selection_deadline);endat.value=loc(data.presale_end_at);pool.value=data.total_incentive_pool;totalsales.value=data.final_total_sales_amount;await previewInc();}
async function saveSettings(){setmsg.textContent='保存中...';const{error}=await db.rpc('update_ticket_sales_settings',{p_presale_price:+pp.value,p_day_price:+dp.value,p_presale_enabled:pe.checked,p_day_enabled:de.checked,p_deadline:iso(deadline.value),p_presale_end:iso(endat.value),p_incentive:+pool.value||0,p_total_sales:+totalsales.value||0});setmsg.textContent=error?'エラー: '+error.message:'✅ 保存しました';if(!error)previewInc()}
async function confirmAll(){if(!confirm('全員のノルマを確定します。確定後は返金不可です。よろしいですか？'))return;const{data,error}=await db.rpc('confirm_all_presale_quotas');cmsg.textContent=error?'エラー: '+error.message:`✅ ${data.confirmed}人を確定しました`;loadStaff()}
async function closePre(){if(!confirm('前売りを終了し、残券数を固定しますか？'))return;const{data,error}=await db.rpc('close_presale_period');clmsg.textContent=error?'エラー: '+error.message:`✅ 残券 ${data.residual}枚 / 売れ残り率 ${(data.risk_rate*100).toFixed(1)}%`;loadSettings();loadStaff()}
async function previewInc(){const{data,error}=await db.rpc('presale_incentive_preview');if(error){inc.innerHTML='<p class="muted">前売り締め後、売上を入力すると表示されます。</p>';return}inc.innerHTML=`<p>前売り売上比率: <b>${(Number(data.presale_sales_ratio)*100).toFixed(1)}%</b><br>リスク補正: <b>×${Number(data.risk_multiplier).toFixed(3)}</b><br>推奨 前売り原資: <b>${Number(data.recommended_presale_pool).toLocaleString()}円</b><br>推奨 当日原資: <b>${Number(data.recommended_day_pool).toLocaleString()}円</b></p><p class="muted">前売り売上比率 × (1 + 売れ残り率÷2)</p>`}
async function loadStaff(){const{data,error}=await db.rpc('admin_presale_staff_status');if(error){rows.innerHTML='<tr><td>'+error.message+'</td></tr>';return}rows.innerHTML=data.map(x=>`<tr><td>${x.staff_name}</td><td>${x.requested_quota}</td><td>${x.confirmed_quota??'-'}</td><td>${x.presale_sold}</td><td>${Number(x.presale_points||0).toFixed(1)}</td><td>${x.residual_remaining}</td></tr>`).join('')}
(async()=>{try{await loadSettings();await loadStaff()}catch(e){document.body.innerHTML='<main><div class="card">'+e.message+'</div></main>'}})();</script></main></body></html>
