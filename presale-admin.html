<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前売り・券種管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f5;margin:0;color:#251313}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #f0caca;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #8b000012}h1{font-size:24px}h2{font-size:18px;margin-top:0}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#a91520;color:white;font-weight:700;font-size:16px}.secondary{background:#fff;color:#a91520;border:1px solid #a91520}.danger{background:#6d0c13}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9bcbc;border-radius:10px;font-size:16px;margin:5px 0 10px}.big{font-size:32px;font-weight:800}.muted{color:#725b5b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff7f7;border-radius:14px;padding:14px}.ok{color:#147b31}.warn{color:#b36a00}.row{padding:10px 0;border-bottom:1px solid #f0dddd}.pill{display:inline-block;padding:4px 8px;background:#f8dddd;border-radius:999px;font-size:12px}label{font-weight:700} table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #edd;text-align:left}</style>
<style id="responsiveOverflowFixV1">
/* 共通：iPhone/Safariを含む横はみ出し防止 */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{overflow-wrap:anywhere}
main,.container,.wrap,.content,.page,.card,.panel,.row,.grid,.field,form,
main>*,.card>*,.panel>*,.grid>*{
  min-width:0;
  max-width:100%;
}
input,select,textarea,button{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
input[type="datetime-local"],
input[type="date"],
input[type="time"],
input[type="month"],
input[type="week"]{
  display:block;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
  -webkit-appearance:none;
  appearance:none;
}
img,video,canvas,svg,iframe{
  max-width:100%;
}
pre,code{
  max-width:100%;
  overflow-x:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
table{
  max-width:100%;
}
@media(max-width:600px){
  main{width:100%;max-width:100%}
  .card,.panel{max-width:100%;min-width:0}
  input,select,textarea{font-size:16px}
}
</style>


<style id="iosNativeDateOverflowFixV3">
/*
  iOS Safari の date / datetime-local 固有の最小幅による
  右方向のはみ出しを止める。
*/
input[type="datetime-local"],
input[type="date"],
input[type="time"]{
  box-sizing:border-box!important;
  display:block!important;
  width:calc(100% - 4px)!important;
  max-width:calc(100% - 4px)!important;
  min-width:0!important;
  inline-size:calc(100% - 4px)!important;
  max-inline-size:calc(100% - 4px)!important;
  min-inline-size:0!important;
  -webkit-min-logical-width:0!important;
  margin-left:0!important;
  margin-right:4px!important;
  overflow:hidden!important;
}

input[type="datetime-local"]::-webkit-date-and-time-value,
input[type="date"]::-webkit-date-and-time-value,
input[type="time"]::-webkit-date-and-time-value{
  min-width:0!important;
  width:auto!important;
  text-align:left;
}

input[type="datetime-local"]::-webkit-datetime-edit,
input[type="date"]::-webkit-datetime-edit,
input[type="time"]::-webkit-datetime-edit{
  min-width:0!important;
  max-width:100%!important;
  overflow:hidden!important;
}

@media(max-width:600px){
  input[type="datetime-local"],
  input[type="date"],
  input[type="time"]{
    font-size:16px!important;
    width:calc(100% - 8px)!important;
    max-width:calc(100% - 8px)!important;
    inline-size:calc(100% - 8px)!important;
    max-inline-size:calc(100% - 8px)!important;
    margin-right:8px!important;
  }
}
</style>


<style id="quotaUnlockStyleV1">
.warn{background:#fff4e5!important;color:#8a4b00!important;border:1px solid #f1c98a!important}
.mini{width:auto!important;padding:8px 10px!important;font-size:12px!important;margin:2px!important}
.lock-note{font-size:12px;color:#7a6a64;line-height:1.55;margin-top:8px}
</style>

</head><body><main><button class="secondary" onclick="location.href='home.html'">← ホーム</button><h1>前売り・券種管理</h1>
<div class="card"><h2>販売設定</h2><div class="grid"><div><label>前売り券価格</label><input id="pp" type="number"></div><div><label>当日券価格</label><input id="dp" type="number"></div></div><label><input id="pe" type="checkbox" style="width:auto"> 前売り券を販売中</label><br><label><input id="de" type="checkbox" style="width:auto"> 当日券を販売中</label><br><label>ノルマ選択期限</label><input id="deadline" type="datetime-local"><label>前売り終了予定</label><input id="endat" type="datetime-local"><button onclick="saveSettings()">設定を保存</button><p id="setmsg"></p></div>


</div>

<div class="card">
  <h2>ノルマ確定</h2>
  <p class="muted">未選択者は6枚として確定します。確定した瞬間から徴収額が固定されます。</p>
  <button class="danger" onclick="confirmAll()">全スタッフのノルマを確定</button>
  <button class="warn" onclick="unlockAll()">販売前の確定を一括解除</button>
  <div class="lock-note">
    解除できるのは、前売り販売実績がなく、ノルマ譲渡が進行中でないスタッフだけです。
    前売り終了・残券確定後は解除できません。
  </div>
  <p id="cmsg"></p>
</div>
<div class="card"><h2>前売り終了・残券確定</h2><p class="muted">祭前販売を締め、その瞬間の残券数と売れ残り率を固定します。同時に前売り停止・当日券販売開始になります。</p><button class="danger" onclick="closePre()">前売りを締めて残券を確定</button><p id="clmsg"></p></div>
<div class="card"><h2>ポイント変数</h2><p class="muted">ノルマ加速係数は「変数設定」に一本化しました。</p><button onclick="location.href='variables-admin.html'">変数設定を開く</button></div>
<div class="card"><h2>最終インセンティブ</h2><p class="muted">前売り・食材保存・当日内・当日外の最終配分は専用画面で計算します。</p><button onclick="location.href='incentive-admin.html'">最終インセンティブ計算を開く</button></div>
<div class="card"><h2>スタッフ一覧</h2><button class="secondary" onclick="loadStaff()">更新</button><div style="overflow:auto"><table><thead><tr><th>名前</th><th>希望</th><th>確定</th><th>販売</th><th>pt</th><th>残券</th><th>確定操作</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loc=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const iso=v=>v?new Date(v).toISOString():null;
async function ensureAdmin(){const{data:{user}}=await db.auth.getUser();if(!user)throw Error('ログインしてください');const{data}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data)throw Error('管理者のみ利用できます')}
let keepIncentive=0,keepTotalSales=0;
async function loadSettings(){
  await ensureAdmin();
  const{data,error}=await db.from('ticket_sales_settings').select('*').eq('id',1).single();
  if(error)throw error;
  pp.value=data.presale_price;
  dp.value=data.day_price;
  pe.checked=data.presale_enabled;
  de.checked=data.day_enabled;
  deadline.value=loc(data.quota_selection_deadline);
  endat.value=loc(data.presale_end_at);
  keepIncentive=Number(data.total_incentive_pool||0);
  keepTotalSales=Number(data.final_total_sales_amount||0);
}
async function saveSettings(){
  setmsg.textContent='保存中...';
  const{error}=await db.rpc('update_ticket_sales_settings',{
    p_presale_price:+pp.value,
    p_day_price:+dp.value,
    p_presale_enabled:pe.checked,
    p_day_enabled:de.checked,
    p_deadline:iso(deadline.value),
    p_presale_end:iso(endat.value),
    p_incentive:keepIncentive,
    p_total_sales:keepTotalSales
  });
  setmsg.textContent=error?'エラー: '+error.message:'✅ 保存しました';
}



async function confirmAll(){
  if(!confirm('全員のノルマを確定します。確定後は徴収額が固定されます。よろしいですか？'))return;
  const{data,error}=await db.rpc('confirm_all_presale_quotas');
  cmsg.textContent=error?'エラー: '+error.message:`✅ ${data.confirmed}人を確定しました`;
  loadStaff();
}

async function unlockOne(userId,staffName,sold){
  if(Number(sold)>0){
    alert('前売り販売実績があるため、このスタッフの確定は解除できません。');
    return;
  }
  if(!confirm(`${staffName}さんのノルマ確定を解除しますか？\n\n解除すると、本人が再び希望ノルマを変更できる状態に戻ります。`))return;

  cmsg.textContent='解除中...';
  const{data,error}=await db.rpc('admin_unlock_presale_quota',{p_user:userId});
  cmsg.textContent=error
    ? 'エラー: '+error.message
    : `✅ ${staffName}さんのノルマ確定を解除しました`;
  await loadStaff();
}

async function unlockAll(){
  if(!confirm('販売前のスタッフについて、ノルマ確定を一括解除しますか？\n\n販売実績がある人・譲渡中の人は解除されません。'))return;

  cmsg.textContent='一括解除中...';
  const{data,error}=await db.rpc('admin_unlock_all_presale_quotas');

  if(error){
    cmsg.textContent='エラー: '+error.message;
    return;
  }

  cmsg.textContent=
    `✅ ${data.unlocked}人を解除しました`+
    ` / 販売済み ${data.skipped_sales}人`+
    ` / 譲渡あり ${data.skipped_transfers}人`;
  await loadStaff();
}

async function closePre(){
  if(!confirm('前売りを終了し、残券数を固定しますか？'))return;
  const{data,error}=await db.rpc('close_presale_period');
  clmsg.textContent=error?'エラー: '+error.message:`✅ 残券 ${data.residual}枚 / 売れ残り率 ${(data.risk_rate*100).toFixed(1)}%`;
  loadSettings();
  loadStaff();
}

async function loadStaff(){
  const{data,error}=await db.rpc('admin_presale_staff_status');
  if(error){rows.innerHTML='<tr><td>'+error.message+'</td></tr>';return}

  rows.innerHTML=data.map(x=>{
    const confirmed=x.confirmed_quota!=null;
    const sold=Number(x.presale_sold||0);
    const action=!confirmed
      ? '<span class="muted">未確定</span>'
      : sold>0
        ? '<span class="muted">販売済み</span>'
        : `<button class="mini warn" onclick='unlockOne(${JSON.stringify(x.user_id)},${JSON.stringify(x.staff_name)},${sold})'>解除</button>`;

    return `<tr>
      <td>${x.staff_name}</td>
      <td>${x.requested_quota}</td>
      <td>${x.confirmed_quota??'-'}</td>
      <td>${x.presale_sold}</td>
      <td>${Number(x.presale_points||0).toFixed(1)}</td>
      <td>${x.residual_remaining}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');
}
(async()=>{try{await loadSettings();await loadStaff()}catch(e){document.body.innerHTML='<main><div class="card">'+e.message+'</div></main>'}})();</script></main></body></html>
