<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>役職変更</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,select{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0;border:0}select{border:1px solid #ddd5d1;background:#fff}button{background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.row{padding:10px 0;border-top:1px solid #eee}</style></head><body><header><h1>👥 役職変更</h1></header><main><div class="card"><p>全員のベースは売り子です。役職を付けた瞬間から売り子人数から外れます。</p><select id="staff"></select><select id="role"><option value="seller">売り子へ戻す</option><option value="front">表番</option><option value="back">裏番</option><option value="cook">調理</option><option value="support">サポート</option></select><button class="primary" id="apply">役職を変更</button><div id="msg"></div></div><div class="card"><h2>現在の特殊役職</h2><div id="list"></div></div><button onclick="location.href='home.html'">ポータルへ戻る</button></main><script>const sb=window.supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");async function load(){const {data:s}=await sb.from('staff_members').select('user_id,staff_name').eq('is_active',true).order('staff_name');staff.innerHTML=(s||[]).map(x=>`<option value="${x.user_id}">${x.staff_name}</option>`).join('');const {data:r,error}=await sb.from('work_role_segments').select('user_id,role,started_at').is('ended_at',null);if(error){list.textContent=error.message;return}const map=new Map((s||[]).map(x=>[x.user_id,x.staff_name]));list.innerHTML=(r||[]).map(x=>`<div class="row"><b>${map.get(x.user_id)||x.user_id}</b>：${x.role}<br><small>${new Date(x.started_at).toLocaleTimeString('ja-JP')}</small></div>`).join('')||'全員売り子です';}apply.onclick=async()=>{const {error}=await sb.rpc('set_work_role',{p_user:staff.value,p_role:role.value});msg.textContent=error?'エラー：'+error.message:'✅ 変更しました';if(!error)load()};load();</script></body></html>
