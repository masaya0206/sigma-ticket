<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120">
<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.13"/></filter>
  <style>
    .title{font-family:"Noto Sans CJK JP",sans-serif;fill:#27313c;font-weight:900}
    .sub{font-family:"Noto Sans CJK JP",sans-serif;fill:#6f6f72;font-size:18px}
    .road-major{fill:none;stroke:#e7e0da;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
    .road-minor{fill:none;stroke:#efe9e4;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
    .road-mini{fill:none;stroke:#f5f1ed;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .bld{fill:#f6f2ee;stroke:#cfc6bf;stroke-width:3}
    .bldText{font-family:"Noto Sans CJK JP",sans-serif;fill:#27313c;font-weight:800;font-size:24px}
    .bubbleText{font-family:"Noto Sans CJK JP",sans-serif;fill:#17212b;font-weight:900;font-size:22px}
    .bubbleSub{font-family:"Noto Sans CJK JP",sans-serif;fill:#5d6570;font-weight:700;font-size:14px}
    .legend{font-family:"Noto Sans CJK JP",sans-serif;fill:#4b535c;font-size:18px;font-weight:700}
    .tree{fill:#dcebd9}
  </style>
</defs>
