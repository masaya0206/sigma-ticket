<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者権限の設定</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#282326;background:#f7f4f2}*{box-sizing:border-box}body{margin:0;padding:16px 16px 90px}main{max-width:640px;margin:auto}h1{font-size:24px}p{color:#60565a;line-height:1.6}.panel{background:white;padding:18px;border-radius:16px;margin:15px 0;box-shadow:0 2px 8px #0001}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}button{border:0;background:#ae1727;color:white;border-radius:10px;padding:12px 15px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.48;cursor:default}.outline{background:#fff;color:#971425;border:1px solid #b42130}.staff{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0}.name{font-weight:750}.muted{color:#776c71;font-size:12px}.green{color:#167347}#status{white-space:pre-wrap;padding:8px 0;min-height:22px}.back{background:transparent;color:#971425;padding:8px 0}.tag{font-size:11px;padding:3px 7px;background:#f9e8ec;border-radius:7px;color:#9f1725}
</style></head><body><main><button class="back" onclick="location.href='admin-menu.html'">← 管理者メニューへ</button><h1>管理者権限の設定</h1><p>登録済みスタッフから選び、システム全体の管理者権限を付与・解除します。操作は既存の管理者のみ可能です。</p><div class="panel"><label for="search">スタッフを検索</label><input id="search" placeholder="名前で検索" autocomplete="off"><div id="status" role="status"></div><div id="list"></div></div><p>管理者権限を付与すると、チケット・集金・勤怠・食材保存などの管理機能へアクセスできます。付与された人は再ログインしてください。</p></main><script>
const sb=window.supabase.createClient('https://gsniytemgrbtgfywhqlu.supabase.co','sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn');
const list=document.getElementById('list'),status=document.getElementById('status'),search=document.getElementById('search');
let staff=[],me=null,busy=false;
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x}
function render(){list.replaceChildren();const q=search.value.trim().toLowerCase();const rows=staff.filter(x=>(x.staff_name||'').toLowerCase().includes(q));if(!rows.length){list.append(node('p','muted','該当するスタッフがいません'));return}
for(const s of rows){const row=node('div','staff');const details=node('div');details.append(node('div','name',s.staff_name||'名前未登録'));let label=s.is_admin?'管理者':'一般スタッフ';if(!s.is_active)label+='・停止中';if(s.user_id===me)label+='・自分';details.append(node('div',s.is_admin?'tag':'muted',label));const btn=node('button',s.is_admin?'outline':'',s.is_admin?'権限を解除':'管理者にする');btn.disabled=busy||!s.is_active||(s.is_admin&&s.user_id===me);btn.addEventListener('click',()=>change(s));row.append(details,btn);list.append(row)}}
async function reload(){status.textContent='読み込み中…';const r=await sb.rpc('list_staff_admin_access');if(r.error){status.textContent='取得できません：'+r.error.message+'\nSQLが未反映の場合はSQL Editorで更新してください。';list.replaceChildren();return}staff=r.data||[];status.textContent='登録スタッフ '+staff.length+'名 / 管理者 '+staff.filter(x=>x.is_admin).length+'名';render()}
async function change(s){if(busy)return;const enable=!s.is_admin;const action=enable?'管理者にします':'管理者権限を解除します';if(!confirm(s.staff_name+'さんを'+action+'。よろしいですか？'))return;busy=true;render();const r=await sb.rpc('set_staff_admin_access',{p_user_id:s.user_id,p_enable:enable});busy=false;if(r.error){status.textContent='変更できません：'+r.error.message;render();return}await reload();status.textContent=s.staff_name+'さんの管理者権限を'+(enable?'付与':'解除')+'しました。'}
search.addEventListener('input',render);(async()=>{const r=await sb.auth.getUser();me=r.data?.user?.id;if(!me){status.textContent='ログインが必要です。';return}await reload()})();
</script></body></html>
