<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");let dayRows=[];
const lin=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
async function check(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data){document.body.innerHTML='管理者権限が必要です';return false}return true}
async function loadDays(){const {data,error}=await sb.from('event_days').select('*').order('id');if(error){dayMsg.textContent=error.message;return}dayRows=data||[];days.innerHTML=dayRows.map(d=>`<div class="row"><b>${d.label}</b><input id="s${d.id}" type="datetime-local" value="${lin(d.starts_at)}"><input id="e${d.id}" type="datetime-local" value="${lin(d.ends_at)}"></div>`).join('')}
saveDays.onclick=async()=>{
  dayMsg.textContent='保存中...';

  const payload=[];
  for(const d of dayRows){
    const s=document.getElementById('s'+d.id).value;
    const e=document.getElementById('e'+d.id).value;

    if(!s||!e){
      dayMsg.innerHTML='<span class="err">開始・終了日時をすべて入力してください</span>';
      return;
    }

    const start=new Date(s);
    const end=new Date(e);

    if(!(start<end)){
      dayMsg.innerHTML='<span class="err">'+d.label+'の終了日時は開始日時より後にしてください</span>';
      return;
    }

    payload.push({
      id:d.id,
      starts_at:start.toISOString(),
      ends_at:end.toISOString()
    });
  }

  const {data,error}=await sb.rpc('admin_save_event_days',{p_days:payload});
  if(error){
    dayMsg.innerHTML='<span class="err">'+error.message+'</span>';
    return;
  }

  dayMsg.innerHTML='<span class="ok">✅ 5日間の日時を保存しました</span>';
  await loadDays();
  if(typeof loadShiftAggregation==='function') await loadShiftAggregation();
};

let shiftRows=[];
let shiftStaff=[];
let shiftRoleMap={};
let selectedShiftDay=null;
let selectedRole='all';

const esc=v=>String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");

const fmtDate=v=>new Date(v).toLocaleDateString('ja-JP',{
  month:'numeric',day:'numeric',weekday:'short'
});
const fmtTime=v=>new Date(v).toLocaleTimeString('ja-JP',{
  hour:'2-digit',minute:'2-digit'
});

const roleLabel={
  seller:'売り子',
  register:'レジ',
  shopping_helper:'買い出し補助',
  shopping_driver:'ドライバー',
  manager:'店長',
  cook:'調理',
  support:'サポート'
};

function roleValues(uid){
  const r=shiftRoleMap[uid];
  if(!r)return [];
  return [r.first_role,r.second_role,r.third_role].filter(Boolean);
}

function staffMatchesRole(uid){
  return selectedRole==='all' || roleValues(uid).includes(selectedRole);
}

function renderShiftTabs(){
  const tabs=[
    ...dayRows.map(d=>({key:String(d.id),label:d.label})),
    {key:'all',label:'全5日'}
  ];
  shiftTabs.innerHTML=tabs.map(t=>`
    <button class="shift-tab ${String(selectedShiftDay)===String(t.key)?'active':''}"
      onclick="selectShiftDay('${t.key}')">${esc(t.label)}</button>
  `).join('');
}

function selectShiftDay(key){
  selectedShiftDay=key;
  renderShiftTabs();
  renderShiftList();
}

function mergeIntervals(items){
  const a=items
    .map(x=>[new Date(x.available_from).getTime(),new Date(x.available_to).getTime()])
    .filter(([s,e])=>Number.isFinite(s)&&Number.isFinite(e)&&e>s)
    .sort((x,y)=>x[0]-y[0]);

  const out=[];
  for(const [s,e] of a){
    if(!out.length || s>out[out.length-1][1]){
      out.push([s,e]);
    }else{
      out[out.length-1][1]=Math.max(out[out.length-1][1],e);
    }
  }
  return out;
}

function getDayUserMap(d){
  const m=new Map();
  shiftRows
    .filter(x=>Number(x.event_day_id)===Number(d.id))
    .forEach(x=>{
      if(!m.has(x.user_id))m.set(x.user_id,[]);
      m.get(x.user_id).push(x);
    });
  return m;
}

function buildCoverageBins(d,userMap,staffIds){
  const start=new Date(d.starts_at).getTime();
  const end=new Date(d.ends_at).getTime();
  const oneHour=60*60*1000;
  const bins=[];

  for(let s=start;s<end;s+=oneHour){
    const e=Math.min(s+oneHour,end);
    let count=0;
    for(const uid of staffIds){
      const items=userMap.get(uid)||[];
      const overlaps=items.some(x=>{
        const a=new Date(x.available_from).getTime();
        const b=new Date(x.available_to).getTime();
        return a<e && b>s;
      });
      if(overlaps)count++;
    }
    bins.push({start:s,end:e,count});
  }
  return bins;
}

function roleShort(uid){
  const vals=roleValues(uid);
  if(!vals.length)return '希望職種未登録';
  return vals.map((x,i)=>`${i+1}.${roleLabel[x]||x}`).join(' / ');
}

function renderCoverageChart(d,userMap,submittedStaff){
  const ids=submittedStaff.map(s=>s.user_id);
  const bins=buildCoverageBins(d,userMap,ids);
  const maxCount=Math.max(1,...bins.map(b=>b.count));
  const peak=Math.max(0,...bins.map(b=>b.count));
  const peakBins=bins.filter(b=>b.count===peak && peak>0);

  const peakText=peakBins.length
    ? `最大 ${peak}人（${peakBins.map(b=>fmtTime(b.start)).join('・')}頃）`
    : '提出なし';

  return `
    <div class="coverage-wrap">
      <div class="coverage-title-row">
        <div class="coverage-title">時間帯別 参加可能人数</div>
        <div class="coverage-peak">${peakText}</div>
      </div>
      <div class="coverage-chart" style="grid-template-columns:repeat(${Math.max(1,bins.length)},minmax(0,1fr))">
        ${bins.map((b,i)=>{
          const h=b.count===0?2:Math.max(10,(b.count/maxCount)*100);
          const showLabel=i===0 || i===bins.length-1 || i%2===0;
          return `
            <div class="coverage-col" title="${fmtTime(b.start)}〜${fmtTime(b.end)}：${b.count}人">
              <div class="coverage-bar" style="height:${h}%">
                <span class="coverage-count">${b.count}</span>
              </div>
              ${showLabel?`<span class="coverage-label">${fmtTime(b.start)}</span>`:''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTimeline(d,userMap,submittedStaff){
  const ds=new Date(d.starts_at).getTime();
  const de=new Date(d.ends_at).getTime();
  const span=Math.max(1,de-ds);

  const rows=submittedStaff.map(s=>{
    const merged=mergeIntervals(userMap.get(s.user_id)||[]);
    const segs=merged.map(([a,b])=>{
      const ca=Math.max(ds,a);
      const cb=Math.min(de,b);
      if(cb<=ca)return '';
      const left=((ca-ds)/span)*100;
      const width=((cb-ca)/span)*100;
      return `<span class="staff-timeline-seg" style="left:${left.toFixed(3)}%;width:${width.toFixed(3)}%"></span>`;
    }).join('');

    return `
      <div class="staff-timeline-row">
        <div class="staff-timeline-meta">
          <div class="staff-timeline-name">${esc(s.staff_name)}</div>
          <div class="staff-timeline-roles">${esc(roleShort(s.user_id))}</div>
        </div>
        <div class="staff-timeline-track" title="${esc(s.staff_name)}">${segs}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="timeline-panel">
      <div class="timeline-panel-title">
        <b>スタッフ別タイムライン</b>
        <span>${submittedStaff.length}人</span>
      </div>
      <div class="timeline-axis">
        <span>${fmtTime(d.starts_at)}</span>
        <span>${fmtTime(d.ends_at)}</span>
      </div>
      <div class="staff-timeline-list">
        ${rows || '<div class="filter-empty">条件に一致する提出者はいません。</div>'}
      </div>
    </div>
  `;
}

function renderDetailList(userMap,submittedStaff){
  const html=submittedStaff.map(s=>{
    const items=(userMap.get(s.user_id)||[])
      .sort((a,b)=>new Date(a.available_from)-new Date(b.available_from));

    return `
      <div class="compact-staff">
        <div class="compact-staff-head">
          <div>
            <b>${esc(s.staff_name)}</b>
            <div class="role-line">${esc(roleShort(s.user_id))}</div>
          </div>
          <div class="compact-time">
            ${items.map(x=>`${fmtTime(x.available_from)}〜${fmtTime(x.available_to)}`).join('<br>')}
          </div>
        </div>
        ${items.filter(x=>x.note).map(x=>`<div class="note-text">📝 ${esc(x.note)}</div>`).join('')}
      </div>
    `;
  }).join('');

  return `
    <details class="shift-detail-toggle">
      <summary>詳細一覧を表示</summary>
      <div style="margin-top:8px">${html || '<div class="empty">提出なし</div>'}</div>
    </details>
  `;
}

function renderOneDay(d){
  const userMap=getDayUserMap(d);

  const roleTargetStaff=shiftStaff.filter(s=>staffMatchesRole(s.user_id));
  const submittedStaff=roleTargetStaff
    .filter(s=>userMap.has(s.user_id))
    .sort((a,b)=>{
      const ai=(userMap.get(a.user_id)||[])[0];
      const bi=(userMap.get(b.user_id)||[])[0];
      return new Date(ai?.available_from||0)-new Date(bi?.available_from||0)
        || String(a.staff_name).localeCompare(String(b.staff_name),'ja');
    });

  const missing=roleTargetStaff.filter(s=>!userMap.has(s.user_id));

  return `
    <section class="day-block">
      <div class="day-head">
        <div>
          <div class="day-title">${esc(d.label)}</div>
          <div class="day-date">${fmtDate(d.starts_at)}　${fmtTime(d.starts_at)}〜${fmtTime(d.ends_at)}</div>
        </div>
        <span class="pill">${submittedStaff.length}人提出</span>
      </div>

      ${renderCoverageChart(d,userMap,submittedStaff)}
      ${renderTimeline(d,userMap,submittedStaff)}
      ${renderDetailList(userMap,submittedStaff)}

      <details class="missing">
        <summary>未提出 ${missing.length}人</summary>
        <div class="missing-list">
          ${missing.length?missing.map(s=>esc(s.staff_name)).join('、'):'全員提出済みです'}
        </div>
      </details>
    </section>
  `;
}

function renderShiftList(){
  const daysToShow=selectedShiftDay==='all'
    ? dayRows
    : dayRows.filter(d=>String(d.id)===String(selectedShiftDay));

  const validDayIds=new Set(dayRows.map(d=>Number(d.id)));
  const validRows=shiftRows.filter(x=>validDayIds.has(Number(x.event_day_id)));

  const targetStaff=shiftStaff.filter(s=>staffMatchesRole(s.user_id));
  const targetIds=new Set(targetStaff.map(s=>s.user_id));
  const submittedUsers=new Set(
    validRows
      .filter(x=>targetIds.has(x.user_id))
      .map(x=>x.user_id)
  );

  shiftSummary.innerHTML=`
    <span class="pill">対象 ${selectedShiftDay==='all'?'5日間':'1日'}</span>
    <span class="pill">${selectedRole==='all'?'全職種':esc(roleLabel[selectedRole]||selectedRole)}</span>
    <span class="pill">対象スタッフ ${targetStaff.length}人</span>
    <span class="pill">提出 ${submittedUsers.size}人</span>
  `;

  shifts.innerHTML=daysToShow.length
    ? daysToShow.map(renderOneDay).join('')
    : '<div class="empty">表示対象の日程がありません。</div>';
}

async function loadShiftList(){
  shifts.textContent='読み込み中...';

  const enabledIds=new Set(dayRows.map(d=>Number(d.id)));

  const [
    {data:availability,error:availabilityError},
    {data:staff,error:staffError},
    {data:roles,error:rolesError}
  ]=await Promise.all([
    sb.from('staff_availability')
      .select('user_id,event_day_id,available_from,available_to,note')
      .order('available_from'),
    sb.from('staff_members')
      .select('user_id,staff_name,is_active')
      .eq('is_active',true)
      .order('staff_name'),
    sb.rpc('admin_staff_role_preferences')
  ]);

  if(availabilityError){shifts.textContent=availabilityError.message;return}
  if(staffError){shifts.textContent=staffError.message;return}

  shiftRows=(availability||[]).filter(x=>enabledIds.has(Number(x.event_day_id)));
  shiftStaff=staff||[];
  shiftRoleMap=Object.fromEntries((rolesError?[]:(roles||[])).map(r=>[r.user_id,r]));

  if(selectedShiftDay===null){
    selectedShiftDay=dayRows.length?String(dayRows[0].id):'all';
  }

  renderShiftTabs();
  renderShiftList();
}

roleFilter.onchange=()=>{
  selectedRole=roleFilter.value;
  renderShiftList();
};

loadShifts.onclick=loadShiftList;
(async()=>{if(await check()){await loadDays();await loadShiftList()}})();
</script></body></html>
