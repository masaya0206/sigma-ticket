<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日別勤怠一括編集｜シグマ祭</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--red:#aa1520;--ink:#252b35;--line:#dfe3e9;--bg:#f7f7f9}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--ink);margin:0}header{background:var(--red);color:white;padding:26px 18px}main{max-width:1000px;margin:auto;padding:18px}.card{border:1px solid var(--line);border-radius:16px;background:white;padding:18px;margin:14px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex:0 1 auto}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,select,textarea,button{font:inherit;border-radius:9px;border:1px solid #bdc2cb;padding:11px;max-width:100%}input[type=time]{min-width:110px}button{background:white;cursor:pointer;font-weight:700}button.primary{background:var(--red);color:white;border-color:var(--red)}button.warn{color:#a41922;border-color:#db9aa0}button:disabled{opacity:.4}button:focus-visible{outline:2px solid #2563eb}small,.muted{color:#68717c}#sessions{display:grid;gap:10px}.session{display:grid;grid-template-columns:auto minmax(100px,1fr) minmax(100px,1fr) minmax(105px,1fr) auto;gap:8px;align-items:end;background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:12px}.pill{background:#e9f5ed;color:#236b41;border-radius:99px;padding:6px 10px;font-weight:700}#original{overflow:auto;max-height:260px}.o{border-bottom:1px solid var(--line);padding:8px 0}textarea{width:100%;min-height:78px}#status{font-weight:700}#summary{font-size:18px;font-weight:800}@media(max-width:650px){.session{grid-template-columns:1fr 1fr}.session .rlabel{grid-column:1/-1}.session button{grid-column:2}.card{padding:13px}header{padding:21px 16px}}
</style></head><body><header><h1>日別勤怠 一括編集</h1><div>スタッフ1名・1日分をまとめて編集｜原本は変更しない</div></header><main>
<div class="card"><div class="row"><button onclick="location.href='work-timeline-admin.html'">← 勤務実績タイムライン</button><button id="reload" onclick="load()">データを取得</button></div><div class="row"><div><label for="day">対象日</label><select id="day"><option value="2026-10-31">10/31 準備</option><option value="2026-11-01">11/1 本祭1日目</option><option value="2026-11-02">11/2 本祭2日目</option><option value="2026-11-03">11/3 本祭3日目</option><option value="2026-11-04">11/4 片付け</option></select></div><div><label for="staff">スタッフ</label><select id="staff"></select></div></div><p id="status" class="muted">読み込み前</p></div>
<div class="card"><h2>この日の勤務区間</h2><p class="muted">勤務のない時間帯は空白にします。連続していない勤務は別行にしてください。役割も区間ごとに選べます。</p><div id="summary">—</div><div id="sessions"></div><div class="row" style="margin-top:14px"><button onclick="addRow()">＋ 勤務区間を追加</button><button onclick="resetForm()">編集内容を再読込</button></div><label for="note">編集理由（必須）</label><textarea id="note" placeholder="本人確認により、11:00〜13:00と15:00〜17:00に訂正"></textarea><div class="row" style="margin-top:12px"><button class="primary" id="save" onclick="save()">この日をまとめて保存</button><button class="warn" id="restore" onclick="restore()">元に戻す（編集を取消）</button></div><p class="muted">この画面は独立した編集データを保存します。QR原本・提供されたExcelは変更しません。従来の勤務実績画面・ポイント計算には、現時点ではこの編集結果を自動反映しません。</p></div>
<div class="card"><h2>原本の参照（読み取り専用）</h2><p class="muted">添付Excelの「勤務詳細（正確な時刻）」に記載されていた勤怠と役割履歴です。導入前に修正済みのデータが含まれる可能性があります。</p><div id="original"></div></div></main><script>
'use strict';
const sb=window.supabase.createClient('https://gsniytemgrbtgfywhqlu.supabase.co','sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn');
const ROLES={seller:'売り子',support:'サポート',cook:'調理',manager:'店長',register:'レジ',shopping_driver:'運転手',shopping_helper:'買い出し補助'};
let payload=null,workRows=[],dirty=false;
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getStaff=()=>payload?.staff.find(x=>x.user_id===el('staff').value);
function hhmm(d){const z=new Date(d);const x=new Date(z.getTime()+9*3600000);return x.toISOString().slice(11,16)}
function toIso(h){return new Date(el('day').value+'T'+h+':00+09:00').toISOString()}
function dayRows(){const p=getStaff();if(!p)return [];
 const imported=(payload.excel_original||[]).filter(x=>x.staff_name===p.staff_name&&x.record_kind==='勤怠');
 if(imported.length)return imported.map(x=>({start:hhmm(x.started_at),end:hhmm(x.ended_at),role:x.role_code in ROLES?x.role_code:'seller'}));
 return (payload.current_attendance||[]).filter(x=>x.user_id===p.user_id).map(x=>({start:hhmm(x.clock_in),end:hhmm(x.clock_out),role:x.role in ROLES?x.role:'seller'}));
}
function currentEdit(){return (payload?.edits||[]).find(x=>x.user_id===el('staff').value)}
function changeSelection(){if(dirty&&!confirm('未保存の編集内容を破棄してスタッフを切り替えますか？'))return;resetForm()}
async function load(){el('reload').disabled=true;el('status').textContent='取得中…';try{const {data,error}=await sb.rpc('admin_sigma_day_editor_data',{p_date:el('day').value});if(error)throw error;payload=data;const before=el('staff').value;el('staff').innerHTML=payload.staff.map(x=>`<option value="${esc(x.user_id)}">${esc(x.staff_name)}</option>`).join('');if(payload.staff.some(x=>x.user_id===before))el('staff').value=before;resetForm();el('status').textContent='取得完了（編集データは原本と別保存）';}catch(e){payload=null;el('status').textContent='取得エラー：'+e.message;}finally{el('reload').disabled=false}}
function resetForm(){const edit=currentEdit();workRows=edit?edit.intervals.map(x=>({start:hhmm(x.start_at),end:hhmm(x.end_at),role:x.role})):dayRows();el('note').value='';dirty=false;render()}
function addRow(){workRows.push({start:'09:00',end:'10:00',role:'seller'});dirty=true;render()}
function changeRow(i,key,value){workRows[i][key]=value;dirty=true;summary()}
function delRow(i){workRows.splice(i,1);dirty=true;render()}
function render(){const p=getStaff(),edit=currentEdit();el('restore').disabled=!edit;el('sessions').innerHTML=workRows.map((r,i)=>`<div class="session"><div class="rlabel"><b>勤務${i+1}</b></div><div><label>出勤</label><input type="time" value="${esc(r.start)}" onchange="changeRow(${i},'start',this.value)"></div><div><label>退勤</label><input type="time" value="${esc(r.end)}" onchange="changeRow(${i},'end',this.value)"></div><div><label>役割</label><select onchange="changeRow(${i},'role',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===r.role?'selected':''}>${v}</option>`).join('')}</select></div><button class="warn" onclick="delRow(${i})">削除</button></div>`).join('')||'<p class="muted">勤務区間なし（この日を0時間として保存できます）</p>';
 const orig=(payload?.excel_original||[]).filter(x=>p&&x.staff_name===p.staff_name);el('original').innerHTML=orig.map(x=>`<div class="o"><b>${esc(x.record_kind)}</b> / ${esc(x.role_label)} / ${esc(hhmm(x.started_at))}〜${esc(hhmm(x.ended_at))} <small>原本${x.source_row}行</small></div>`).join('')||'<p class="muted">このスタッフのExcel原本記録はありません。データベースの勤怠を初期表示しています。</p>';
 el('status').textContent=(edit?'編集データあり（版'+edit.revision+'）':'編集データなし・原本表示')+(dirty?'・未保存の変更あり':'');summary()}
function summary(){let t=0;for(const x of workRows){if(/^\d{2}:\d{2}$/.test(x.start)&&/^\d{2}:\d{2}$/.test(x.end)){const a=x.start.split(':').map(Number),b=x.end.split(':').map(Number);t+=Math.max(0,(b[0]*60+b[1])-(a[0]*60+a[1]));}}el('summary').textContent=`勤務 ${workRows.length}区間 / 合計 ${(t/60).toFixed(2)}時間`}
function validated(){const res=[];for(const r of workRows){if(!/^\d{2}:\d{2}$/.test(r.start)||!/^\d{2}:\d{2}$/.test(r.end)||r.start>=r.end||!(r.role in ROLES))throw Error('勤務区間の時刻・役割を確認してください（同日内のみ）。');res.push({start_at:toIso(r.start),end_at:toIso(r.end),role:r.role});}res.sort((a,b)=>a.start_at.localeCompare(b.start_at));for(let i=1;i<res.length;i++)if(res[i].start_at<res[i-1].end_at)throw Error('勤務区間が重複しています');return res}
async function save(){if(!payload)return;const note=el('note').value.trim();if(!note)return alert('修正理由を入力してください');let intervals;try{intervals=validated()}catch(e){return alert(e.message)}const p=getStaff(),edit=currentEdit();if(!confirm(`${p.staff_name}・${el('day').value}の勤務${intervals.length}区間を、編集データとしてまとめて保存します。\nQR原本・Excelは変更しません。よろしいですか？`))return;el('save').disabled=true;try{const {error}=await sb.rpc('admin_sigma_save_day_edit',{p_user_id:p.user_id,p_date:el('day').value,p_intervals:intervals,p_note:note,p_expected_revision:edit?.revision||0});if(error)throw error;await load();alert('この日の編集データを保存しました。旧画面・ポイントへの反映は別途統合が必要です。')}catch(e){alert('保存できません：'+e.message)}finally{el('save').disabled=false}}
async function restore(){const p=getStaff(),e=currentEdit();if(!p||!e)return;const note=prompt('編集データを取り消し、原本の勤務区間を再表示します。理由を入力してください。','誤編集のため');if(note===null)return;if(!note.trim())return alert('理由は必須です');if(!confirm(`${p.staff_name}・${el('day').value}の編集データを取り消しますか？\n履歴は残し、Excel原本は変更しません。`))return;el('restore').disabled=true;try{const {error}=await sb.rpc('admin_sigma_restore_day_edit',{p_user_id:p.user_id,p_date:el('day').value,p_note:note.trim(),p_expected_revision:e.revision});if(error)throw error;await load();alert('原本表示へ戻しました')}catch(e){alert('元に戻せません：'+e.message)}finally{el('restore').disabled=false}}
el('day').addEventListener('change',()=>{if(dirty&&!confirm('未保存の内容は破棄されます。日付を変更しますか？')){}load()});el('staff').addEventListener('change',changeSelection);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});load();
</script></body></html>
