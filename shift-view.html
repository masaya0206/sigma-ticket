<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>完成シフト</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}:root{--red:#b5121b;--red2:#8f0e15;--bg:#f7f4f2;--line:#eadfdb;--muted:#6e6e73;--manager:#8b5cf6;--register:#3b82f6;--cook:#ef5350;--support:#34a853;--shopping_helper:#22a6b3;--shopping_driver:#6366f1;--seller:#d9a40e;--namew:132px;--pxpermin:1.25px}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#1c1c1e;padding-bottom:82px}header{background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;padding:28px 18px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;font-size:12px;opacity:.9}main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:16px;margin:13px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}.small{font-size:11px;color:var(--muted);line-height:1.55}.ok{color:#15803d;font-weight:800}.err{color:#b00020;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:9px 12px;background:#f4efed;color:#5f5754;font-weight:800}.tabs button.active{background:var(--red);color:#fff}.myshift{display:grid;gap:7px}.myseg{padding:10px 12px;border-radius:12px;background:#faf7f5;font-weight:800;font-size:13px;border-left:6px solid #aaa}.legend{display:flex;gap:8px 12px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:3px}.wrap{overflow:auto;max-height:67vh;border:1px solid var(--line);border-radius:14px;background:#fff}.timeline{width:max-content;min-width:100%}.head,.row,.group{display:flex}.head{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1 >👥 完成シフト</h1><p>公開された確定シフトを閲覧できます。</p></header><main><div class="card"><div id="publishMsg">公開状況を確認中...</div></div><div class="card" id="myCard" style="display:none"><h2>あなたのシフト</h2><div id="myShift" class="myshift"></div></div><div id="publishedArea" style="display:none"><div class="card"><div id="tabs" class="tabs"></div><div id="legend" class="legend"></div></div><div class="card" style="padding:8px"><div class="wrap"><div id="timeline" class="timeline"></div></div></div></div></main><nav class="global-bottom-nav"><button onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button><button class="active" onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button><button onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button></nav><script>const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");const roles=[["manager","店長"],["cook","調理"],["support","サポート"],["register","レジ"],["shopping_helper","買い出し補助"],["shopping_driver","ドライバー"],["seller","売り子"],["unassigned","未分類"]];const roleLabel=Object.fromEntries(roles),roleOrder=roles.map(x=>x[0]),roleColor={manager:"#8b5cf6",cook:"#ef5350",support:"#34a853",register:"#3b82f6",shopping_helper:"#22a6b3",shopping_driver:"#6366f1",seller:"#d9a40e",unassigned:"#a6abb3"};let rows=[],user=null,selectedDay=null;const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"),ms=v=>new Date(v).getTime(),fmt=v=>new Date(v).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});function renderLegend(){legend.innerHTML=roles.map(([r,l])=>`<span><i class="dot" style="background:${roleColor[r]}"></i>${l}</span>`).join("")}function renderTabs(){const days=[];for(const r of rows){if(!days.some(d=>d.id===r.event_day_id))days.push({id:r.event_day_id,label:r.day_label,start:r.day_starts_at,end:r.day_ends_at})}days.sort((a,b)=>a.id-b.id);if(!selectedDay&&days.length)selectedDay=days[0].id;tabs.innerHTML=days.map(d=>`<button class="${d.id===selectedDay?'active':''}" onclick="selectDay(${d.id})">${esc(d.label)}</button>`).join("")}window.selectDay=id=>{selectedDay=id;renderTabs();renderTimeline()};function renderMyShift(){const mine=rows.filter(r=>r.user_id===user.id).sort((a,b)=>a.event_day_id-b.event_day_id||ms(a.starts_at)-ms(b.starts_at));if(!mine.length){myShift.innerHTML='<div class="small">現在、あなたの保存シフトはありません。</div>';return}myShift.innerHTML=mine.map(r=>{const rt=r.role==="unassigned"?(r.day_type==="cleanup"?"片付け":r.day_type==="prep"?"本祭担当なし":"未分類"):(roleLabel[r.role]||r.role);return `<div class="myseg" style="border-left-color:${roleColor[r.role]||'#aaa'}"><b>${esc(r.day_label)}</b>　${fmt(r.starts_at)}〜${fmt(r.ends_at)}　${esc(rt)}</div>`}).join("")}function primaryRole(uid,dayRows){const totals={};for(const r of dayRows.filter(x=>x.user_id===uid))totals[r.role]=(totals[r.role]||0)+(ms(r.ends_at)-ms(r.starts_at));return Object.keys(totals).sort((a,b)=>(totals[b]-totals[a])||(roleOrder.indexOf(a)-roleOrder.indexOf(b)))[0]||"seller"}function renderTimeline(){const dr=rows.filter(r=>r.event_day_id===selectedDay);if(!dr.length){timeline.innerHTML='<div class="empty">この日の公開シフトはありません。</div>';return}const meta=dr[0],start=ms(meta.day_starts_at),end=ms(meta.day_ends_at),px=1.25,trackW=Math.max(620,((end-start)/60000)*px);document.documentElement.style.setProperty("--pxpermin",px+"px");const uids=[...new Set(dr.map(r=>r.user_id))],groups=Object.fromEntries(roleOrder.map(r=>[r,[]]));for(const uid of uids)(groups[primaryRole(uid,dr)]??=[]).push(uid);let h=`<div class="head"><div class="corner">スタッフ</div><div class="trackhead" style="width:${trackW}px">`;let t=new Date(start);t.setMinutes(0,0,0);if(t.getTime()<start)t.setHours(t.getHours()+1);for(let x=t.getTime();x<=end;x+=3600000){const l=((x-start)/60000)*px;h+=`<div class="hour" style="left:${l}px">${fmt(x)}</div>`}h+=`</div></div>`;for(const role of roleOrder){const members=groups[role]||[];if(!members.length)continue;members.sort((a,b)=>{const ar=dr.filter(x=>x.user_id===a&&x.role===role).reduce((s,x)=>s+ms(x.ends_at)-ms(x.starts_at),0),br=dr.filter(x=>x.user_id===b&&x.role===role).reduce((s,x)=>s+ms(x.ends_at)-ms(x.starts_at),0);return br-ar||String(dr.find(x=>x.user_id===a)?.staff_name||"").localeCompare(String(dr.find(x=>x.user_id===b)?.staff_name||""),"ja")});const gl=role==="unassigned"?(meta.day_type==="cleanup"?"片付け参加者":"本祭担当なし"):roleLabel[role];h+=`<div class="group"><div class="groupname" style="color:${roleColor[role]}">${gl}（${members.length}人）</div><div style="width:${trackW}px"></div></div>`;for(const uid of members){const name=dr.find(x=>x.user_id===uid)?.staff_name||"";h+=`<div class="row"><div class="name">${esc(name)}</div><div class="track" style="width:${trackW}px">`;for(const s of dr.filter(x=>x.user_id===uid)){const l=((ms(s.starts_at)-start)/60000)*px,w=((ms(s.ends_at)-ms(s.starts_at))/60000)*px;const br=s.role==="unassigned"?(s.day_type==="cleanup"?"片付け":s.day_type==="prep"?"本祭担当なし":"未分類"):(roleLabel[s.role]||s.role);h+=`<div class="bar role-${s.role}" style="left:${l}px;width:${Math.max(16,w)}px">${esc(br)} ${fmt(s.starts_at)}-${fmt(s.ends_at)}</div>`}h+=`</div></div>`}}timeline.innerHTML=h}(async()=>{const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href="home.html";return}user=u;const {data:settings,error:settingsError}=await sb.rpc("get_shift_public_settings");if(settingsError){publishMsg.innerHTML='<span class="err">'+esc(settingsError.message)+'</span>';return}if(settings?.schedule_published!==true){publishMsg.innerHTML='<b>完成シフトはまだ公開されていません。</b><div class="small">管理者が公開すると、ここから全体シフトを確認できます。</div>';return}const {data,error}=await sb.rpc("get_published_shift");if(error){publishMsg.innerHTML='<span class="err">'+esc(error.message)+'</span>';return}rows=data||[];publishMsg.innerHTML='<span class="ok">🟢 完成シフト公開中</span>';publishedArea.style.display="";myCard.style.display="";renderLegend();renderTabs();renderMyShift();renderTimeline()})();</script></body></html>
