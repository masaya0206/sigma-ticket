<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウーバーレジ | シグマ祭</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="manifest" href="./manifest.webmanifest"><style>body{margin:0;background:#f7f4f2;font-family:system-ui,sans-serif}header{background:#b5121b;color:#fff;padding:25px 20px;border-radius:0 0 24px 24px}main{max-width:620px;margin:auto;padding:16px}section{background:#fff;border:1px solid #e6dddd;border-radius:18px;padding:16px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:12px;box-sizing:border-box}input{width:100%;border:1px solid #ddd;margin:5px 0 12px}button{border:0;background:#b5121b;color:#fff;font-weight:800}button:disabled{opacity:.35}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:15px 0}.qty{display:flex;gap:10px;align-items:center}.qty button{min-width:43px}.muted{color:#666;font-size:13px}.status{padding:12px;background:#f8e8e8;border-radius:10px}.ord{border-top:1px solid #eee;padding:12px 0}.total{font-size:26px;font-weight:900;text-align:right}a{color:#b5121b}</style></head><body><header><h1>🚲 ウーバーレジ</h1><div>注文時に現金を受け取ります</div></header><main><p><a href="seller-menu.html">← 売り子メニュー</a></p><div id="status" class="status">通信確認中…</div><section><h2>新規注文</h2><label>お客さんの名前<input id="customer" maxlength="60" autocomplete="off" placeholder="例：山田さん"></label><label>届け先メモ（任意）<input id="note" maxlength="200" placeholder="例：正門前"></label><div class="row"><span>チャーハン <small id="ricePrice"></small></span><div class="qty"><button id="riceMinus" onclick="changeQty('rice',-1)">−</button><b id="riceQty">0</b><button id="ricePlus" onclick="changeQty('rice',1)">＋</button></div></div><div class="row"><span>ごま団子 <small id="sesamePrice"></small></span><div class="qty"><button id="sesameMinus" onclick="changeQty('sesame',-1)">−</button><b id="sesameQty">0</b><button id="sesamePlus" onclick="changeQty('sesame',1)">＋</button></div></div><div class="total" id="total">0円</div><label>受取現金（円）<input type="number" inputmode="numeric" min="0" id="cash" value="" oninput="render()"></label><div class="total" id="change">お釣り：—</div><button style="width:100%" id="submit" onclick="submitOrder()" disabled>会計済み注文を確定する</button><p class="muted">通信不良・ピーク中・営業時間外は新規受付を停止します。同じ注文の送信失敗時は重複登録防止IDを保持します。</p></section><section><h2>自分の受付済み注文</h2><div id="history">読み込み中…</div></section></main><script>const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
let state={allowed:false,peak:true,menu:null,busy:false,rice:0,sesame:0,windowOpen:false};
let requestId=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeId(){return crypto.randomUUID();}
function changeQty(k,d){state[k]=Math.max(0,Math.min(99,state[k]+d));requestId=null;render();}
function amount(){const m=state.menu;return m?state.rice*Number(m.fried_rice_price)+state.sesame*Number(m.sesame_single_price):0;}
function render(){const m=state.menu;el('riceQty').textContent=state.rice;el('sesameQty').textContent=state.sesame;
 el('ricePrice').textContent=m?`${m.fried_rice_price}円`:'';el('sesamePrice').textContent=m?`${m.sesame_single_price}円/個`:'';
 el('total').textContent=amount().toLocaleString()+'円';const rec=Number(el('cash').value);el('change').textContent='お釣り：'+(rec>=amount()&&amount()>0?(rec-amount()).toLocaleString()+'円':'—');
 const ok=navigator.onLine&&state.allowed&&!state.peak&&state.windowOpen&&m&&!state.busy&&state.rice+state.sesame>0&&rec>=amount()&&amount()>0&&el('customer').value.trim().length>0 && !(state.rice>0&&m.fried_rice_status!=='selling')&&!(state.sesame>0&&m.sesame_status!=='selling');
 el('submit').disabled=!ok;el('submit').textContent=state.busy?'送信中…':'会計済み注文を確定する';
}
async function refresh(){try{const [rights,peak,menu,windowResult]=await Promise.all([sb.rpc('can_use_remote_register'),sb.from('uber_peak_state').select('is_peak').eq('id',1).single(),sb.from('menu_state').select('*').eq('id',1).single(),sb.rpc('uber_register_window_open')]);
state.allowed=!rights.error&&rights.data===true;state.peak=!!peak.error||peak.data?.is_peak!==false;state.menu=menu.error?null:menu.data;state.windowOpen=!windowResult.error&&windowResult.data===true;
el('status').textContent=!navigator.onLine?'通信切断：注文停止':!state.allowed?'権限なし':peak.error||menu.error||windowResult.error?'サーバー確認不可：注文停止':!state.windowOpen?'営業時間外：新規受付停止':state.peak?'🔴 ピーク中：ウーバー受付停止':'🟢 受付可能';
}catch(_){state.peak=true;el('status').textContent='通信エラー：注文停止';}render();}
async function submitOrder(){await refresh();render();if(el('submit').disabled)return;
 const params={p_request_id:requestId??(requestId=makeId()),p_customer_name:el('customer').value.trim(),p_rice:state.rice,p_sesame:state.sesame,p_cash_received:Number(el('cash').value),p_delivery_note:el('note').value.trim()};
 if(!confirm(`お客さん：${params.p_customer_name}\n商品合計：${amount()}円\n受取現金：${params.p_cash_received}円\n会計済みとして登録しますか？`))return;
 state.busy=true;render();const {data,error}=await sb.rpc('create_uber_order',params);state.busy=false;
 if(error){el('status').textContent='登録できません：'+error.message;render();return;}
 alert(data.duplicate?'すでに登録済みです。重複発行はしていません。':`注文を登録しました。番号：${data.pickup_number}`);
 requestId=null;state.rice=0;state.sesame=0;el('customer').value='';el('note').value='';el('cash').value='';await refresh();await loadHistory();}
const statusLabel={accepted:'受付済み',cooking:'調理中',ready:'調理完了・取りに戻る',handed_off:'受取済み・配達待ち',delivered:'配達完了',void:'取消済み'};
async function deliver(orderId){if(!confirm('お客さんへの配達完了を登録しますか？'))return;const {error}=await sb.rpc('uber_mark_delivered',{p_order_id:orderId});if(error)alert(error.message);await loadHistory();}
async function loadHistory(){const {data,error}=await sb.rpc('uber_my_orders');if(error){el('history').textContent='注文履歴を読み込めません：'+error.message;return;}
 el('history').innerHTML=(data||[]).map(o=>`<div class="ord"><b>${esc(o.customer_name)}</b>・${esc(statusLabel[o.status]||o.status)}<div class="muted">${esc(o.pickup_number)} / 炒飯${o.rice}・ごま団子${o.sesame} / ${Number(o.total_amount).toLocaleString()}円</div>${o.status==='handed_off'?`<button data-deliver="${o.order_id}">配達完了</button>`:''}</div>`).join('')||'注文はまだありません';
 el('history').querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>deliver(Number(b.dataset.deliver)));}
['customer','cash'].forEach(id=>el(id).addEventListener('input',()=>{requestId=null;render();}));
el('note').addEventListener('input',()=>{requestId=null;});
refresh().then(loadHistory);sb.channel('uber-remote').on('postgres_changes',{event:'*',schema:'public',table:'uber_peak_state'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'service_orders'},loadHistory).subscribe();setInterval(()=>{refresh();loadHistory();},8000);addEventListener('offline',()=>{state.peak=true;render();el('status').textContent='オフライン：新規受付停止';});addEventListener('online',()=>{refresh();loadHistory();});
</script></body></html>
