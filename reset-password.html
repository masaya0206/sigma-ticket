<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | シグマ祭</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta name="theme-color" content="#b5121b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">

  <style>
    :root {
      --red:#b5121b;
      --red-dark:#8f0e15;
      --red-soft:#fff1f2;
      --ink:#1c1c1e;
      --muted:#6e6e73;
      --line:#ece7e4;
      --bg:#f7f4f2;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--ink);
      background:var(--bg);
    }

    .app {
      max-width:620px;
      min-height:100vh;
      margin:0 auto;
      padding-bottom:34px;
    }

    .hero {
      padding:max(34px, env(safe-area-inset-top)) 22px 38px;
      color:white;
      background:linear-gradient(145deg,var(--red),var(--red-dark));
      border-radius:0 0 30px 30px;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-mark {
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.55);
      border-radius:15px;
      font-size:29px;
      font-weight:900;
      background:rgba(255,255,255,.09);
    }

    h1 { margin:0; font-size:27px; }
    .subtitle { margin-top:5px; color:rgba(255,255,255,.78); font-size:13px; }

    .content { padding:0 16px 26px; }

    .card {
      position:relative;
      z-index:2;
      margin-top:-18px;
      padding:22px;
      background:white;
      border:1px solid rgba(181,18,27,.06);
      border-radius:22px;
      box-shadow:0 8px 24px rgba(74,25,25,.08);
    }

    h2 { margin:0 0 10px; font-size:22px; }

    .explain {
      margin:0 0 14px;
      color:var(--muted);
      font-size:14px;
      line-height:1.65;
    }

    input {
      width:100%;
      margin-top:10px;
      padding:15px 16px;
      font:inherit;
      border:1px solid #ded8d4;
      border-radius:14px;
      outline:none;
      background:#fff;
    }

    input:focus {
      border-color:var(--red);
      box-shadow:0 0 0 3px rgba(181,18,27,.10);
    }

    button {
      width:100%;
      margin-top:12px;
      padding:15px 16px;
      border:0;
      border-radius:14px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .primary {
      color:white;
      background:var(--red);
    }

    .secondary {
      color:var(--red);
      background:var(--red-soft);
    }

    .message {
      margin:14px 2px 0;
      color:var(--muted);
      line-height:1.55;
      overflow-wrap:anywhere;
    }

    #newPasswordArea { display:none; }
  </style>
</head>

<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="brand-mark">Σ</div>
        <div>
          <h1>パスワード再設定</h1>
          <div class="subtitle">MATCH POINT · シグマ祭</div>
        </div>
      </div>
    </header>

    <div class="content">
      <section id="requestArea" class="card">
        <h2>パスワードを忘れた方</h2>

        <p class="explain">
          スタッフ登録済みのメールアドレスを入力してください。
          登録済みの場合、そのメールアドレスへ再設定用リンクを送ります。
        </p>

        <input
          id="email"
          type="email"
          placeholder="登録済みメールアドレス"
          autocomplete="email"
        >

        <button class="primary" onclick="sendResetMail()">
          再設定メールを送る
        </button>

        <button class="secondary" onclick="location.href='home.html'">
          ログイン画面へ戻る
        </button>

        <p id="requestMessage" class="message"></p>
      </section>

      <section id="newPasswordArea" class="card">
        <h2>新しいパスワード</h2>

        <p class="explain">
          新しく使用するパスワードを入力してください。
        </p>

        <input
          id="newPassword"
          type="password"
          placeholder="新しいパスワード"
          autocomplete="new-password"
        >

        <button class="primary" onclick="saveNewPassword()">
          新しいパスワードを保存
        </button>

        <p id="passwordMessage" class="message"></p>
      </section>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    async function sendResetMail() {
      const email =
        document.getElementById("email")
          .value
          .trim();

      const message =
        document.getElementById(
          "requestMessage"
        );

      if (!email) {
        message.textContent =
          "メールアドレスを入力してください。";
        return;
      }

      message.textContent =
        "送信しています...";

      const { error } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://masaya0206.github.io/sigma-ticket/reset-password.html"
            }
          );

      if (error) {
        message.textContent =
          "エラー：" + error.message;
        return;
      }

      // 登録有無を画面上で断定しない
      message.textContent =
        "登録済みのメールアドレスの場合、再設定用メールを送信しました。";
    }

    async function saveNewPassword() {
      const password =
        document.getElementById(
          "newPassword"
        ).value;

      const message =
        document.getElementById(
          "passwordMessage"
        );

      if (!password) {
        message.textContent =
          "新しいパスワードを入力してください。";
        return;
      }

      message.textContent =
        "保存しています...";

      const { error } =
        await supabaseClient.auth
          .updateUser({
            password
          });

      if (error) {
        message.textContent =
          "エラー：" + error.message;
        return;
      }

      message.textContent =
        "✅ パスワードを変更しました。ログイン画面へ移動します。";

      setTimeout(
        () => {
          location.href =
            "home.html";
        },
        1400
      );
    }

    supabaseClient.auth
      .onAuthStateChange(
        async (event) => {
          if (
            event ===
            "PASSWORD_RECOVERY"
          ) {
            document.getElementById(
              "requestArea"
            ).style.display =
              "none";

            document.getElementById(
              "newPasswordArea"
            ).style.display =
              "block";
          }
        }
      );
  </script>
</body>
</html>
