<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#b5121b"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>管理者メニュー</title>
<style>
:root{--red:#b5121b;--dark:#8f0e15;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:var(--red);font-size:20px;font-weight:900;box-shadow:0 4px 15px #4a191912}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{width:100%;margin:10px 0;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left;box-shadow:0 5px 16px #2b16160b}
.card:active{transform:scale(.987)}.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:var(--soft);color:var(--red);font-weight:900;font-size:20px}
.name{display:block;margin-top:11px;font-size:18px;font-weight:900}.desc{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
</style></head><body><main>
<div class="top"><button class="back" onclick="location.href='home.html'">←</button><div><h1>管理者メニュー</h1><div class="sub">全機能・設定・運営操作</div></div></div>
<button class='card' onclick="location.href='admin.html'"><span class='icon'>管</span><span class='name'>運営・チケット管理</span><span class='desc'>シフト・チケット・スタッフ管理</span></button><button class='card' onclick="location.href='event-admin.html'"><span class='icon'>本</span><span class='name'>本番運用設定</span><span class='desc'>5日間・本番前初期化</span></button><button class='card' onclick="location.href='presale-admin.html'"><span class='icon'>券</span><span class='name'>前売り・券種管理</span><span class='desc'>ノルマ確定・価格・インセンティブ</span></button><button class='card' onclick="location.href='points-admin.html'"><span class='icon'>点</span><span class='name'>ポイント管理</span><span class='desc'>係数・再計算・ランキング</span></button><button class='card' onclick="location.href='front.html'"><span class='icon'>表</span><span class='name'>表番</span><span class='desc'>表番用の運営画面</span></button><button class='card' onclick="location.href='back.html'"><span class='icon'>裏</span><span class='name'>裏番</span><span class='desc'>裏番用の運営画面</span></button><button class='card' onclick="location.href='index.html'"><span class='icon'>レ</span><span class='name'>レジ</span><span class='desc'>QR受付・会計</span></button><button class='card' onclick="location.href='order-entry.html'"><span class='icon'>票</span><span class='name'>伝票入力</span><span class='desc'>炒飯・胡麻団子の伝票入力</span></button><button class='card' onclick="location.href='register-teams.html'"><span class='icon'>組</span><span class='name'>レジ編成</span><span class='desc'>レジ要員の派遣・入替</span></button><button class='card' onclick="location.href='role-control.html'"><span class='icon'>役</span><span class='name'>役職変更</span><span class='desc'>勤務中スタッフの役割変更</span></button><button class='card' onclick="location.href='attendance-qr.html'"><span class='icon'>QR</span><span class='name'>勤怠QR管理</span><span class='desc'>動的QR表示</span></button><button class='card' onclick="location.href='shopping.html'"><span class='icon'>車</span><span class='name'>買い出し</span><span class='desc'>要請・ミッション・運転手管理</span></button>
</main></body></html>
