<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者メニュー</title>
<style>
:root{--red:#b5121b;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;padding-bottom:82px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 40px}.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:var(--red);font-size:20px;font-weight:900}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{width:100%;margin:10px 0;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left}
.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:var(--soft);color:var(--red);font-weight:900}
.name{display:block;margin-top:11px;font-size:18px;font-weight:900}.desc{display:block;margin-top:5px;color:var(--muted);font-size:13px}
</style>
<style id="v80BottomNav">
body{padding-bottom:82px!important}
.global-bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);
width:min(100%,620px);min-height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9998;background:rgba(255,255,255,.96);
border-top:1px solid #eadfdb;box-shadow:0 -5px 22px rgba(55,20,20,.08);backdrop-filter:blur(12px)}
.global-bottom-nav.admin-nav{grid-template-columns:repeat(4,1fr)}
.global-bottom-nav button{width:100%!important;margin:0!important;padding:7px 4px!important;border:0!important;
border-radius:12px!important;background:transparent!important;color:#6e6e73!important;font:inherit;font-size:11px!important;
font-weight:700!important;line-height:1.15;box-shadow:none!important}
.global-bottom-nav .gicon{display:block;margin-bottom:4px;font-size:20px;line-height:1}
.global-bottom-nav button.active{color:#b5121b!important;background:#fff1f2!important}
</style>
</head><body><main>
<div class="top"><button class="back" onclick="history.length>1?history.back():location.href='home.html'">←</button>
<div><h1>管理者メニュー</h1><div class="sub">出勤・役割に関係なく全機能へアクセス</div></div></div>
<button class="card" onclick="location.href='manager.html'"><span class="icon">店</span><span class="name">店長画面</span><span class="desc">注文・人員・レジ・買い出し</span></button>
<button class="card" onclick="location.href='admin.html'"><span class="icon">管</span><span class="name">運営・チケット管理</span><span class="desc">スタッフ・チケット・シフト管理</span></button>
<button class="card" onclick="location.href='event-admin.html'"><span class="icon">本</span><span class="name">本番運用設定</span><span class="desc">5日間・本番前初期化</span></button>
<button class="card" onclick="location.href='presale-admin.html'"><span class="icon">券</span><span class="name">前売り・券種管理</span><span class="desc">ノルマ確定・価格・インセンティブ</span></button>
<button class="card" onclick="location.href='points-admin.html'"><span class="icon">点</span><span class="name">ポイント管理</span><span class="desc">係数・再計算・ランキング</span></button>
<button class="card" onclick="location.href='register-teams.html'"><span class="icon">組</span><span class="name">レジ編成</span><span class="desc">赤・青・緑レジの派遣</span></button>
<button class="card" onclick="location.href='role-control.html'"><span class="icon">役</span><span class="name">役割変更</span><span class="desc">店長・調理・サポート</span></button>
<button class="card" onclick="location.href='attendance-qr.html'"><span class="icon">QR</span><span class="name">勤怠QR管理</span><span class="desc">動的QR表示</span></button>
<button class="card" onclick="location.href='shopping.html'"><span class="icon">車</span><span class="name">買い出し</span><span class="desc">要請・ミッション・運転手管理</span></button>
<button class="card" onclick="location.href='shopping-team-admin.html'"><span class="icon">員</span><span class="name">買い出しメンバー管理</span><span class="desc">車を出せる人・買い出し候補を登録</span></button>
<button class="card" onclick="location.href='partner-admin.html'"><span class="icon">提</span><span class="name">提携先管理</span><span class="desc">提携特典・専用スタッフ・QRリーダー</span></button>
</main><nav class="global-bottom-nav admin-nav"><button class="" onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button><button class="" onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button><button class="" onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button><button class="active" onclick="location.href='admin-menu.html'"><span class="gicon">管</span>管理</button></nav></body></html>
