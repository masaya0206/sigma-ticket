<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勤怠QR</title>
<meta name="theme-color" content="#b5121b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline-work-store.js"></script>
<script src="./connection-status.js"></script>
<style>
body{margin:0;background:#f7f4f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:42px 18px 26px;border-radius:0 0 28px 28px}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;text-align:center;box-shadow:0 8px 24px rgba(74,25,25,.07)}.qr{display:flex;justify-content:center;padding:16px;min-height:312px;align-items:center}.big{font-size:30px;font-weight:900}.small{font-size:12px;color:#6e6e73;line-height:1.55}.err{color:#b00020;font-weight:900}.ok{color:#15803d;font-weight:900}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#ecfdf3;color:#15803d;font-size:12px;font-weight:900}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;font-weight:900}</style></head>
<body><header><h1 style="margin:0">勤怠QR</h1><p style="margin:7px 0 0;opacity:.85">オンライン・オフライン共通 / 30秒ごとに端末内生成</p></header><main>
<section class="card"><span class="pill">その場生成方式</span><div id="state" style="margin-top:10px">初期設定を確認中...</div><div id="qr" class="qr"></div><div id="clock" class="big"></div><div id="slot" class="small"></div></section>
<section class="card"><p class="small">この端末に保存された秘密鍵でQRへ署名します。QRデータを事前に大量保存しないため、シグマ祭の日程外でもテストできます。</p><button onclick="location.href='home.html'">ポータルへ戻る</button></section>
</main><script>
const SUPABASE_URL='https://gsniytemgrbtgfywhqlu.supabase.co';
const SUPABASE_KEY='sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn';
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let lastSlot=null,ready=false,busy=false;
function fmt(d){return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}

async function provision(){
  try{
    let id=await SigmaOfflineWorkStore.getQrSigningIdentity();
    if(!id && !navigator.onLine){
      state.innerHTML='<span class="err">この端末ではまだQR生成の初期設定が完了していません。一度オンラインでこの画面を開いてください。</span>';
      return false;
    }
    id=await SigmaOfflineWorkStore.ensureQrSigningIdentity();

    if(navigator.onLine && sb){
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(session?.user){
          const {error}=await sb.rpc('register_attendance_qr_signing_key',{
            p_key_id:id.key_id,
            p_public_jwk:id.public_jwk
          });
          if(error) throw error;
          state.innerHTML='<span class="ok">✅ QR生成準備完了</span>';
        }else{
          state.textContent='QR生成準備完了（公開鍵の登録は次回ログイン時に行います）';
        }
      }catch(e){
        state.innerHTML='<span class="err">公開鍵の登録に失敗しました：'+(e?.message||e)+'</span>';
        return false;
      }
    }else{
      state.innerHTML='<span class="ok">✅ オフラインQR生成中</span>';
    }
    return true;
  }catch(e){
    state.innerHTML='<span class="err">QR生成準備エラー：'+(e?.message||e)+'</span>';
    return false;
  }
}

async function tick(){
  clock.textContent=fmt(new Date());
  if(!ready || busy) return;
  const s=SigmaOfflineWorkStore.currentSlotEpoch();
  if(s===lastSlot) return;
  busy=true;
  try{
    const data=await SigmaOfflineWorkStore.createAttendanceQrPayload();
    lastSlot=data.slot_epoch;
    qr.innerHTML='';
    new QRCode(qr,{text:data.payload,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
    const at=new Date(data.slot_epoch*1000);
    slot.textContent=`QR時刻 ${at.toLocaleString('ja-JP')} / 30秒ごとに自動更新`;
    state.innerHTML='<span class="ok">QR表示中</span>';
  }catch(e){
    state.innerHTML='<span class="err">QR生成エラー：'+(e?.message||e)+'</span>';
    qr.innerHTML='';
  }finally{busy=false;}
}

(async()=>{ready=await provision();await tick();setInterval(tick,1000);})();
</script></body></html>
