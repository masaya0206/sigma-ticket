<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>買い出し</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f5;margin:0;color:#251313}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #f0caca;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #8b000012}h1{font-size:24px}h2{font-size:18px;margin-top:0}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#a91520;color:white;font-weight:700;font-size:16px}.secondary{background:#fff;color:#a91520;border:1px solid #a91520}.danger{background:#6d0c13}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9bcbc;border-radius:10px;font-size:16px;margin:5px 0 10px}.big{font-size:32px;font-weight:800}.muted{color:#725b5b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff7f7;border-radius:14px;padding:14px}.ok{color:#147b31}.warn{color:#b36a00}.row{padding:10px 0;border-bottom:1px solid #f0dddd}.pill{display:inline-block;padding:4px 8px;background:#f8dddd;border-radius:999px;font-size:12px}label{font-weight:700}</style></head><body><main><button class="secondary" onclick="location.href='home.html'">← ホーム</button><h1>買い出し</h1><p class="muted">ポイント対象になるのは、裏番または管理者が複数要請をまとめて正式承認した「買い出しミッション」だけです。</p>
<div class="card"><h2>① 買い出し要請を出す</h2><input id="note" placeholder="例：油2本、米10kg"><button onclick="requestShop()">要請を追加</button><p id="rmsg"></p></div>
<div class="card" id="approveCard"><h2>② 未処理要請をまとめて承認</h2><div id="requests">読み込み中...</div><button onclick="approveMission()">選択した要請を1ミッションとして承認</button><p id="amsg"></p></div>
<div class="card"><h2>③ 正式ミッション</h2><div id="missions"></div></div>
<div class="card"><h2>自分への手伝い招待</h2><div id="invites">なし</div></div>
<script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let me=null,board=null;
async function requestShop(){const{data,error}=await db.rpc('create_shopping_request',{p_note:note.value.trim()});rmsg.textContent=error?'エラー: '+error.message:'✅ 要請しました';if(!error){note.value='';load()}}
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='home.html';return}me=user.id;const{data,error}=await db.rpc('shopping_board');if(error){requests.textContent='エラー: '+error.message;return}board=data;requests.innerHTML=(data.requests||[]).length?(data.requests||[]).map(r=>`<label class="row" style="display:block"><input style="width:auto" type="checkbox" class="req" value="${r.id}"> ${r.note||'内容未入力'} <span class="muted">${new Date(r.requested_at).toLocaleString('ja-JP')}</span></label>`).join(''):'未処理要請はありません。';renderMissions();renderInvites()}
async function approveMission(){const ids=[...document.querySelectorAll('.req:checked')].map(x=>x.value);if(!ids.length){amsg.textContent='要請を選択してください';return}const{data,error}=await db.rpc('create_shopping_mission',{p_requests:ids});amsg.textContent=error?'エラー: '+error.message:'✅ 正式ミッションを承認しました';if(!error)load()}
function missionText(m){return (m.requests||[]).map(x=>x.note||'内容未入力').join(' / ')}
function renderMissions(){missions.innerHTML=(board.missions||[]).length?(board.missions||[]).map(m=>{let actions='';if(m.status==='approved')actions=`<button onclick="claim('${m.id}')">今回運転する</button>`;if(m.status==='driver_selected'&&m.driver_user_id===me)actions=`<select id="helper-${m.id}"><option value="">手伝いを選択</option>${(board.staff||[]).filter(s=>s.user_id!==me).map(s=>`<option value="${s.user_id}">${s.name}</option>`).join('')}</select><button class="secondary" onclick="invite('${m.id}')">手伝いを招待</button><button onclick="start('${m.id}')">出発</button>`;if(m.status==='departed'&&m.driver_user_id===me)actions=`<button class="danger" onclick="complete('${m.id}')">帰還・完了</button>`;return `<div class="row"><b>${missionText(m)}</b><br><span class="pill">${m.status}</span><br>${actions}</div>`}).join(''):'正式ミッションはありません。'}
function renderInvites(){let all=[];(board.missions||[]).forEach(m=>(m.helpers||[]).forEach(h=>{if(h.user_id===me&&h.status==='pending')all.push(m)}));invites.innerHTML=all.length?all.map(m=>`<div class="row"><b>${missionText(m)}</b><button onclick="respond('${m.id}',true)">参加する</button><button class="secondary" onclick="respond('${m.id}',false)">断る</button></div>`).join(''):'なし'}
async function claim(id){const{error}=await db.rpc('claim_shopping_mission',{p_mission:id});if(error)alert(error.message);load()}
async function invite(id){const u=document.getElementById('helper-'+id).value;if(!u)return;const{error}=await db.rpc('invite_shopping_helper',{p_mission:id,p_user:u});if(error)alert(error.message);load()}
async function respond(id,a){const{error}=await db.rpc('respond_shopping_helper',{p_mission:id,p_accept:a});if(error)alert(error.message);load()}
async function start(id){if(!confirm('この正式ミッションで出発しますか？'))return;const{error}=await db.rpc('start_shopping_mission',{p_mission:id});if(error)alert(error.message);load()}
async function complete(id){const{error}=await db.rpc('complete_shopping_mission',{p_mission:id});if(error)alert(error.message);load()}load();</script></main></body></html>
