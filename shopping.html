<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>買い出し</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🚗 買い出し</h1></header><main><div class="card"><h2>裏番：買い出し要請</h2><textarea id="note" placeholder="買う物・連絡事項"></textarea><button class="primary" id="request">買い出しチームへ要請</button><div id="msg"></div></div><div class="card"><h2>現在の要請</h2><div id="requests"></div></div><div class="card"><h2>手伝い依頼</h2><p class="small">運転手が名指し・募集を選べます。採用/承認後に買い出し手伝いになります。</p><label>要請ID<select id="reqSel"></select></label><label>方式<select id="helperType"><option value="open">募集</option><option value="named">名指し</option></select></label><label>必要人数<input id="slots" type="number" min="1" value="1"></label><label>名指し相手<select id="target"><option value="">-- 募集なら不要 --</option></select></label><button id="helperReq">手伝い依頼を出す</button></div><div class="card"><h2>自分への/募集中の手伝い</h2><div id="helpers"></div></div><button onclick="location.href='home.html'">ポータルへ戻る</button></main><script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null;
async function load(){
  const {data:{user}}=await sb.auth.getUser(); me=user;
  const {data:staffs}=await sb.from('staff_members').select('user_id,staff_name').eq('is_active',true);
  target.innerHTML='<option value="">-- 募集なら不要 --</option>'+(staffs||[]).map(x=>`<option value="${x.user_id}">${x.staff_name}</option>`).join('');
  const {data:r,error}=await sb.from('shopping_requests').select('*').in('status',['open','driver_selected','departed']).order('requested_at',{ascending:false});
  if(error){requests.textContent=error.message;return;}
  reqSel.innerHTML=(r||[]).map(x=>`<option value="${x.id}">${x.status} / ${new Date(x.requested_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</option>`).join('');
  requests.innerHTML=(r||[]).map(x=>{
    let buttons='';
    if(x.status==='open') buttons+=`<button onclick="claim('${x.id}')">今回運転する</button>`;
    if(x.driver_user_id===me?.id&&x.status==='driver_selected') buttons+=`<button class="primary" onclick="startRun('${x.id}')">出発</button>`;
    if(x.driver_user_id===me?.id&&x.status==='departed') buttons+=`<button class="primary" onclick="completeRun('${x.id}')">買い出し完了</button>`;
    return `<div class="row"><b>${x.note||'買い出し'}</b><br><span class="small">${x.status} / driver: ${x.driver_user_id||'未定'}</span>${buttons}</div>`;
  }).join('')||'要請なし';
  await loadHelpers();
}
request.onclick=async()=>{const {error}=await sb.rpc('create_shopping_request',{p_note:note.value||null});msg.textContent=error?'エラー：'+error.message:'✅ 要請しました';if(!error){note.value='';load();}};
async function claim(id){const {error}=await sb.rpc('claim_shopping_driver',{p_request:id});alert(error?error.message:'運転手になりました');load();}
async function startRun(id){const {error}=await sb.rpc('start_shopping_run',{p_request:id});alert(error?error.message:'出発を記録しました');load();}
async function completeRun(id){const {error}=await sb.rpc('complete_shopping_run',{p_request:id});alert(error?error.message:'完了しました');load();}
helperReq.onclick=async()=>{const body={shopping_request_id:reqSel.value,request_type:helperType.value,target_user_id:helperType.value==='named'?target.value:null,slots:+slots.value,requested_by:me.id};const {error}=await sb.from('shopping_helper_requests').insert(body);alert(error?error.message:'依頼を出しました');loadHelpers();};
async function loadHelpers(){const {data:h,error}=await sb.from('shopping_helper_requests').select('*').eq('status','open').order('created_at',{ascending:false});if(error){helpers.textContent=error.message;return;}helpers.innerHTML=(h||[]).filter(x=>x.request_type==='open'||x.target_user_id===me?.id).map(x=>`<div class="row"><b>${x.request_type==='open'?'募集':'名指し'} / ${x.slots}人</b><button onclick="acceptHelper('${x.id}','${x.shopping_request_id}')">承認・参加</button></div>`).join('')||'ありません';}
async function acceptHelper(id,req){const {error}=await sb.from('shopping_helper_responses').upsert({helper_request_id:id,user_id:me.id,response:'accepted'},{onConflict:'helper_request_id,user_id'});if(error){alert(error.message);return;}const {error:e2}=await sb.from('shopping_run_helpers').upsert({shopping_request_id:req,user_id:me.id,accepted_at:new Date().toISOString()},{onConflict:'shopping_request_id,user_id'});alert(e2?e2.message:'参加承認しました');loadHelpers();}
load();</script></body></html>
