<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 管理者画面</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #ticketArea,
    #loginArea,
    #logArea,
    #summaryArea {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 10px;
    }

    .danger {
      background: #ffe8e8;
    }

    .success {
      background: #e8f7e8;
    }
  </style>
</head>

<body>

  <h1>シグマ祭 管理者画面</h1>

  <div id="loginArea">

    <h2>管理者ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>
    
    <button onclick="resetPassword()">
  パスワードを設定・再設定
</button>

    <p id="loginMessage"></p>

  </div>
  
  <div id="newPasswordArea" style="display:none;">

    <h2>新しいパスワードを設定</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="新しいパスワード"
    >

    <button onclick="saveNewPassword()">
      パスワードを保存
    </button>

    <p id="passwordMessage"></p>

  </div>

  <div id="adminArea" style="display:none;">

    <button onclick="logout()">
      ログアウト
    </button>

    <h2>チケット検索</h2>

    <input
      id="ticketCode"
      type="text"
      placeholder="例：TEST-001"
    >

    <button onclick="searchTicket()">
      検索
    </button>
    
    <button onclick="loadLogs()">
  操作履歴を見る
</button>
    <button onclick="loadSalesSummary()">
  販売状況を見る
</button>

<div id="summaryArea">
  販売状況はまだ表示されていません。
</div>

<div id="logArea">
  操作履歴はまだ表示されていません。
</div>

    <div id="ticketArea">
      チケットIDを入力してください。
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const loginMessage =
        document.getElementById("loginMessage");

      loginMessage.textContent =
        "ログインしています...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        loginMessage.textContent =
          "ログイン失敗：" + error.message;

        return;
      }

      loginMessage.textContent = "";

      showAdminArea();
    }
async function resetPassword() {

  const email =
    document.getElementById("email").value;

  const loginMessage =
    document.getElementById("loginMessage");

  if (!email) {
    loginMessage.textContent =
      "メールアドレスを入力してください。";
    return;
  }

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          "https://masaya0206.github.io/sigma-ticket/admin.html"
      }
    );

  if (error) {
    loginMessage.textContent =
      "エラー：" + error.message;
    return;
  }

  loginMessage.textContent =
    "パスワード設定用メールを送信しました。";
}

    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("adminArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";
    }


    function showAdminArea() {

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("adminArea")
        .style.display = "block";
    }


    async function searchTicket() {

      const ticketCode =
        document
          .getElementById("ticketCode")
          .value
          .trim();

      const ticketArea =
        document.getElementById("ticketArea");

      if (!ticketCode) {

        ticketArea.innerHTML =
          "チケットIDを入力してください。";

        return;
      }

      ticketArea.innerHTML =
        "検索しています...";

      const { data, error } =
        await supabaseClient
          .from("tickets")
          .select("*")
          .eq("ticket_code", ticketCode)
          .maybeSingle();

      if (error) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "エラー：" + error.message;

        return;
      }

      if (!data) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "該当するチケットがありません。";

        return;
      }

      showTicket(data);
    }


    function showTicket(ticket) {

      const ticketArea =
        document.getElementById("ticketArea");

      let statusText = "";

      if (ticket.status === "pending") {
  statusText = "🟡 受け取り待ち";
}

else if (ticket.status === "active") {
  statusText = "🟢 有効";
}

      else if (ticket.status === "used") {
        statusText = "🔴 使用済み";
      }

      else {
        statusText = "⛔ 無効";
      }

      ticketArea.className = "";

      ticketArea.innerHTML = `
        <h2>${statusText}</h2>

        <p>
          <strong>商品</strong><br>
          ${ticket.product_name}
        </p>

        <p>
          <strong>販売者</strong><br>
          ${ticket.seller_name}
        </p>

        <p>
          <strong>チケットID</strong><br>
          ${ticket.ticket_code}
        </p>

        ${
          ticket.status === "used"
          ? `
            <button
              onclick="reactivateTicket(
                '${ticket.ticket_code}'
              )"
            >
              再有効化する
            </button>
          `
          : ""
        }
      `;
    }


    async function reactivateTicket(ticketCode) {

      const confirmed =
        confirm(
          "このチケットを未使用に戻しますか？"
        );

      if (!confirmed) return;

      const ticketArea =
        document.getElementById("ticketArea");

      ticketArea.innerHTML =
        "再有効化しています...";

      const { data, error } =
        await supabaseClient
          .from("tickets")
          .update({
            status: "active",
            used_at: null
          })
          .eq("ticket_code", ticketCode)
          .eq("status", "used")
          .select()
          .maybeSingle();

      if (error) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "エラー：" + error.message;

        return;
      }

      if (!data) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "再有効化できませんでした。";

        return;
      }
      const {
  data: { user }
} = await supabaseClient.auth.getUser();

await supabaseClient
  .from("ticket_logs")
  .insert({
    ticket_code: data.ticket_code,
    action: "reactivated",
    actor_id: user?.id ?? null,
    actor_name: "管理者"
  });

      ticketArea.className = "success";

      ticketArea.innerHTML = `
        <h2>✅ 再有効化しました</h2>

        <p>
          ${data.ticket_code}
        </p>

        <p>
          状態：有効
        </p>
      `;
    }

async function saveNewPassword() {

  const newPassword =
    document.getElementById("newPassword").value;

  const passwordMessage =
    document.getElementById("passwordMessage");

  if (!newPassword) {
    passwordMessage.textContent =
      "新しいパスワードを入力してください。";
    return;
  }

  const { error } =
    await supabaseClient.auth.updateUser({
      password: newPassword
    });

  if (error) {
    passwordMessage.textContent =
      "エラー：" + error.message;
    return;
  }

  passwordMessage.textContent =
    "パスワードを設定しました。";
}
    supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (event === "PASSWORD_RECOVERY") {

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("adminArea")
        .style.display = "none";

      document.getElementById("newPasswordArea")
        .style.display = "block";
    }
  }
);
    async function loadLogs() {

  const logArea =
    document.getElementById("logArea");

  logArea.innerHTML =
    "履歴を読み込んでいます...";

  const { data, error } =
    await supabaseClient
      .from("ticket_logs")
      .select("*")
      .order("created_at", {
        ascending: false
      })
      .limit(50);

  if (error) {

    logArea.className = "danger";

    logArea.innerHTML =
      "エラー：" + error.message;

    return;
  }

  if (!data || data.length === 0) {

    logArea.className = "";

    logArea.innerHTML =
      "操作履歴はありません。";

    return;
  }

  logArea.className = "";

  let html = `
    <h2>操作履歴</h2>
  `;

  for (const log of data) {

    let actionText = "";

    if (log.action === "issued") {
      actionText = "🎫 発行";
    }

    else if (log.action === "used") {
      actionText = "✅ 使用";
    }

    else if (log.action === "reactivated") {
      actionText = "♻️ 再有効化";
    }

    else if (log.action === "invalidated") {
      actionText = "⛔ 無効化";
    }

    else {
      actionText = log.action;
    }

    const date =
      new Date(log.created_at)
        .toLocaleString("ja-JP");

    html += `
      <div style="
        border-top:1px solid #ccc;
        padding:12px 0;
        text-align:left;
      ">

        <strong>${actionText}</strong><br>

        チケット：
        ${log.ticket_code}<br>

        操作者：
        ${log.actor_name ?? "不明"}<br>

        日時：
        ${date}

      </div>
    `;
  }

  logArea.innerHTML = html;
}
    async function loadSalesSummary() {

  const summaryArea =
    document.getElementById("summaryArea");

  summaryArea.innerHTML =
    "販売状況を集計しています...";

  const { data, error } =
    await supabaseClient
      .from("tickets")
      .select("seller_name,status");

  if (error) {

    summaryArea.className = "danger";

    summaryArea.innerHTML =
      "エラー：" + error.message;

    return;
  }

  if (!data || data.length === 0) {

    summaryArea.className = "";

    summaryArea.innerHTML =
      "発行済みチケットはありません。";

    return;
  }

  const summary = {};

  for (const ticket of data) {

    const seller =
      ticket.seller_name || "不明";

    if (!summary[seller]) {

      summary[seller] = {
        total: 0,
        unused: 0,
        used: 0,
        invalid: 0
      };
    }

    summary[seller].total++;

    if (ticket.status === "unused") {
      summary[seller].unused++;
    }

    else if (ticket.status === "used") {
      summary[seller].used++;
    }

    else {
      summary[seller].invalid++;
    }
  }

  let html = `
    <h2>販売状況</h2>
  `;

  for (const seller in summary) {

    const item = summary[seller];

    html += `
      <div style="
        border-top:1px solid #ccc;
        padding:14px 0;
        text-align:left;
      ">

        <strong>${seller}</strong><br><br>

        発行：
        ${item.total}枚<br>

        🟢 未使用：
        ${item.unused}枚<br>

        🔴 使用済み：
        ${item.used}枚<br>

        ⛔ 無効：
        ${item.invalid}枚

      </div>
    `;
  }

  summaryArea.className = "";

  summaryArea.innerHTML = html;
}
    
    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();

      if (session) {
        showAdminArea();
      }
    }


    checkLogin();

  </script>

</body>
</html>
