<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 管理者画面</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    input,
select {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
}

    input[type="datetime-local"] {
  min-width: 0;
}

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #ticketArea,
    #loginArea,
    #logArea,
    #summaryArea {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 10px;
    }

    .danger {
      background: #ffe8e8;
    }

      background: #e8f7e8;

  </style>
</head>

<body>

  <h1>シグマ祭 管理者画面</h1>

  <div id="loginArea">

    <input
      id="email"
      type="email"

    >

    <input
      id="password"

</button>

    <p id="loginMessage"></p>

  </div>
  
  <div id="newPasswordArea" style="display:none;">

    <h2>新しいパスワードを設定</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="新しいパスワード"
    >

    <button onclick="saveNewPassword()">

  </div>

  <div id="adminArea" style="display:none;">

    </button>

    <h2>発行者を追加</h2>

<input
  id="newSellerName"
  type="text"
  placeholder="発行者名"
>

<input
  id="newSellerEmail"
  type="email"
  placeholder="メールアドレス"
>

<button onclick="createSeller()">
  発行者を追加
</button>

<p id="sellerCreateMessage"></p>

    <h2>発行者一覧</h2>

<button onclick="loadSellers()">

</button>

<div id="sellerList"></div>

    <h2>スタッフ管理</h2>

<button onclick="loadStaffMembers()">

</button>

<div id="staffMemberList"></div>
    
    <h2>ポイント設定</h2>

<input
  id="pointStart"
  type="datetime-local"
>

<input
  id="pointEnd"
  type="datetime-local"
>

<input
  id="pointValue"
  type="number"

>

<button onclick="savePointRule()">
  ポイント設定を保存
</button>

<p id="pointMessage"></p>

<button onclick="loadPointRules()">
  ポイント設定一覧を見る
</button>

<div id="pointRuleList"></div>

    >

    <button onclick="loadLogs()">

</button>
    <button onclick="loadSalesSummary()">
  販売状況を見る
</button>

<div id="summaryArea">
  販売状況はまだ表示されていません。
</div>

<div id="logArea">
  操作履歴はまだ表示されていません。
</div>

  <script>

    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const loginMessage =
        document.getElementById("loginMessage");

      loginMessage.textContent =
        "ログインしています...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        loginMessage.textContent =
          "ログイン失敗：" + error.message;

        return;
      }

      loginMessage.textContent = "";

      showAdminArea();
    }
async function resetPassword() {

  const email =
    document.getElementById("email").value;

  const loginMessage =
    document.getElementById("loginMessage");

  if (!email) {
    loginMessage.textContent =
      "メールアドレスを入力してください。";
    return;
  }

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          "https://masaya0206.github.io/sigma-ticket/admin.html"
      }
    );

  if (error) {
    loginMessage.textContent =
      "エラー：" + error.message;
    return;
  }

  loginMessage.textContent =
    "パスワード設定用メールを送信しました。";
}

    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("adminArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";
    }


    function showAdminArea() {

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("adminArea")
        .style.display = "block";
    }


    async function searchTicket() {

      const ticketCode =
        document
          .getElementById("ticketCode")
          .value
          .trim();

      const ticketArea =
        document.getElementById("ticketArea");

      if (!ticketCode) {

        ticketArea.innerHTML =
          "チケットIDを入力してください。";

        return;
      }

      ticketArea.innerHTML =
        "検索しています...";

      const { data, error } =
        await supabaseClient
          .from("tickets")
          .select("*")
          .eq("ticket_code", ticketCode)
          .maybeSingle();

      if (error) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "エラー：" + error.message;

        return;
      }

      if (!data) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "該当するチケットがありません。";

        return;
      }

      showTicket(data);
    }


    function showTicket(ticket) {

      const ticketArea =
        document.getElementById("ticketArea");

      let statusText = "";

      if (ticket.status === "pending") {
  statusText = "🟡 受け取り待ち";
}

else if (ticket.status === "active") {
  statusText = "🟢 有効";
}

      else if (ticket.status === "used") {
        statusText = "🔴 使用済み";
      }

      else {
        statusText = "⛔ 無効";
      }

      ticketArea.className = "";

      ticketArea.innerHTML = `
        <h2>${statusText}</h2>

        <p>
          <strong>商品</strong><br>
          ${ticket.product_name}
        </p>

        <p>
          <strong>販売者</strong><br>
          ${ticket.seller_name}
        </p>

        <p>
  <strong>購入者</strong><br>
  ${ticket.buyer_name ?? "未登録"}
</p>

        <p>
          <strong>チケットID</strong><br>
          ${ticket.ticket_code}
        </p>

        ${
          ticket.status === "used"
          ? `
            <button
              onclick="reactivateTicket(
                '${ticket.ticket_code}'
              )"
            >
              再有効化する
            </button>
          `
          : ""
        }
      `;
    }


    async function reactivateTicket(ticketCode) {

      const confirmed =
        confirm(
          "このチケットを未使用に戻しますか？"
        );

      if (!confirmed) return;

      const ticketArea =
        document.getElementById("ticketArea");

      ticketArea.innerHTML =
        "再有効化しています...";

      const { data, error } =
        await supabaseClient
          .from("tickets")
          .update({
            status: "active",
            used_at: null
          })
          .eq("ticket_code", ticketCode)
          .eq("status", "used")
          .select()
          .maybeSingle();

      if (error) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "エラー：" + error.message;

        return;
      }

      if (!data) {

        ticketArea.className = "danger";

        ticketArea.innerHTML =
          "再有効化できませんでした。";

        return;
      }
      const {
  data: { user }
} = await supabaseClient.auth.getUser();

await supabaseClient
  .from("ticket_logs")
  .insert({
    ticket_code: data.ticket_code,
    action: "reactivated",
    actor_id: user?.id ?? null,
    actor_name: "管理者"
  });

      ticketArea.className = "success";

      ticketArea.innerHTML = `
        <h2>✅ 再有効化しました</h2>

        <p>
          ${data.ticket_code}
        </p>

        <p>
          状態：有効
        </p>
      `;
    }

async function saveNewPassword() {

  const newPassword =
    document.getElementById("newPassword").value;

  const passwordMessage =
    document.getElementById("passwordMessage");

  if (!newPassword) {
    passwordMessage.textContent =
      "新しいパスワードを入力してください。";
    return;
  }

  const { error } =
    await supabaseClient.auth.updateUser({
      password: newPassword
    });

  if (error) {
    passwordMessage.textContent =
      "エラー：" + error.message;
    return;
  }

  passwordMessage.textContent =
    "パスワードを設定しました。";
}
    supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (event === "PASSWORD_RECOVERY") {

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("adminArea")
        .style.display = "none";

      document.getElementById("newPasswordArea")
        .style.display = "block";

  }
);
    async function loadLogs() {

  const logArea =
    document.getElementById("logArea");

  logArea.innerHTML =
    "履歴を読み込んでいます...";

  const { data, error } =
    await supabaseClient
      .from("ticket_logs")
      .select("*")
      .order("created_at", {
        ascending: false
      })
      .limit(50);

  if (error) {

    logArea.className = "danger";

    logArea.innerHTML =
      "エラー：" + error.message;

    return;
  }

  if (!data || data.length === 0) {

    logArea.className = "";

    logArea.innerHTML =
      "操作履歴はありません。";

    return;
  }

  logArea.className = "";

  let html = `
    <h2>操作履歴</h2>
  `;

  for (const log of data) {

    let actionText = "";

    if (log.action === "issued") {
      actionText = "🎫 発行";
    }

    else if (log.action === "used") {
      actionText = "✅ 使用";
    }

    else if (log.action === "reactivated") {
      actionText = "♻️ 再有効化";
    }

    else if (log.action === "invalidated") {
      actionText = "⛔ 無効化";
    }

    else {
      actionText = log.action;
    }

    const date =
      new Date(log.created_at)
        .toLocaleString("ja-JP");

    html += `
      <div style="
        border-top:1px solid #ccc;
        padding:12px 0;
        text-align:left;
      ">

        <strong>${actionText}</strong><br>

        チケット：
        ${log.ticket_code}<br>

        操作者：
        ${log.actor_name ?? "不明"}<br>

        日時：
        ${date}

      </div>
    `;
  }

  logArea.innerHTML = html;
}
    async function loadSalesSummary() {

  const summaryArea =
    document.getElementById("summaryArea");

  summaryArea.innerHTML =
    "販売状況を集計しています...";

  const { data, error } =
    await supabaseClient
      .from("tickets")
      .select("seller_name,status");

  if (error) {

    summaryArea.className = "danger";

    summaryArea.innerHTML =
      "エラー：" + error.message;

    return;
  }

  if (!data || data.length === 0) {

    summaryArea.className = "";

    summaryArea.innerHTML =
      "発行済みチケットはありません。";

    return;
  }

  const summary = {};

  for (const ticket of data) {

    const seller =
      ticket.seller_name || "不明";

    if (!summary[seller]) {

      summary[seller] = {
  total: 0,
  pending: 0,
  active: 0,
  used: 0,
  invalid: 0
};
    }

    summary[seller].total++;

if (ticket.status === "pending") {
  summary[seller].pending++;
}

else if (ticket.status === "active") {
  summary[seller].active++;
}

else if (ticket.status === "used") {
  summary[seller].used++;
}

else if (ticket.status === "invalid") {
  summary[seller].invalid++;
}

    else {
      summary[seller].invalid++;
    }
  }

  let html = `
    <h2>販売状況</h2>
  `;

  for (const seller in summary) {

    const item = summary[seller];

    html += `
      <div style="
        border-top:1px solid #ccc;
        padding:14px 0;
        text-align:left;
      ">

        <strong>${seller}</strong><br><br>

        発行：
        ${item.total}枚<br>

        🟡 受け取り待ち：
${item.pending}枚<br>

🟢 有効：
${item.active}枚<br>

🔴 使用済み：
${item.used}枚<br>

⛔ 無効：
${item.invalid}枚

      </div>
    `;
  }

  summaryArea.className = "";

  summaryArea.innerHTML = html;
}

    async function createSeller() {

  const sellerName =
    document.getElementById("newSellerName")
      .value
      .trim();

  const email =
    document.getElementById("newSellerEmail")
      .value
      .trim();

  const message =
    document.getElementById("sellerCreateMessage");

  if (!sellerName || !email) {
    message.textContent =
      "発行者名とメールアドレスを入力してください。";
    return;
  }

  message.textContent =
    "発行者を追加しています...";

  const { data, error } =
    await supabaseClient.functions.invoke(
      "create-seller",
      {
        body: {
          email: email,
          seller_name: sellerName
        }
      }
    );

  if (error) {

  let errorMessage = error.message;

  try {
    const errorBody =
      await error.context.json();

    if (errorBody?.error) {
      errorMessage = errorBody.error;
    } else {
      errorMessage =
        JSON.stringify(errorBody);
    }

  } catch (e) {
    console.log(e);
  }

  message.textContent =
    "追加エラー：" + errorMessage;

  return;
}

  if (data?.error) {
    message.textContent =
      "追加エラー：" + data.error;
    return;
  }

  message.innerHTML = `
  ✅ 登録URLを発行しました。<br><br>

  <a
    href="${data.invite_url}"
    target="_blank"
    style="word-break: break-all;"
  >
    ${data.invite_url}
  </a>

  <br><br>

  このURLを発行者本人に送ってください。
`;
      
      document.getElementById("newSellerName").value = "";
document.getElementById("newSellerEmail").value = "";
}

    async function loadSellers() {

  const sellerList =
    document.getElementById("sellerList");

  sellerList.innerHTML =
    "読み込み中...";

  const { data, error } =
    await supabaseClient
      .from("sellers")
      .select(
        "user_id,seller_name,is_active"
      )
      .order("seller_name");

  if (error) {
    sellerList.innerHTML =
      "取得エラー：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    sellerList.innerHTML =
      "発行者はまだ登録されていません。";
    return;
  }

  sellerList.innerHTML =
    data.map(seller => {

      const statusText =
        seller.is_active
          ? "🟢 有効"
          : "🔴 停止中";

      const buttonText =
        seller.is_active
          ? "停止する"
          : "再開する";

      return `
        <div
          style="
            border:1px solid #ccc;
            padding:12px;
            margin:10px 0;
            border-radius:8px;
          "
        >

          <strong>
            ${seller.seller_name}
          </strong>

          <br>

          状態：${statusText}

          <br><br>

          <button
            onclick="
              toggleSeller(
                '${seller.user_id}',
                ${seller.is_active}
              )
            "
          >
            ${buttonText}
          </button>

        </div>
      `;
    }).join("");
}

    document.getElementById("staffMemberList");

      "スタッフはまだ登録されていません。";

  }

            text-align:left;

          <strong>

              type="checkbox"

                  this.checked

              "

            チケットスキャン
          </label>

            staff.is_active

    async function updateStaffPermission(
  userId,
  field,
  value
) {

  const updates = {};

  updates[field] = value;

  const { error } =
    await supabaseClient
      .from("staff_members")
      .update(updates)
      .eq("user_id", userId);

  if (error) {
    alert(
      "変更エラー：" +
      error.message
    );

    await loadStaffMembers();
    return;
  }

  alert("権限を変更しました。");
}

    async function toggleSeller(userId, currentStatus) {

  const newStatus =
    !currentStatus;

  const actionText =
    newStatus
      ? "再開"
      : "停止";

  const confirmed =
    confirm(
      `この発行者を${actionText}しますか？`
    );

  if (!confirmed) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("sellers")
      .update({
        is_active: newStatus
      })
      .eq("user_id", userId);

  if (error) {
    alert(
      "変更エラー：" +
      error.message
    );
    return;
  }

  alert(
    `発行者を${actionText}しました。`
  );

  await loadSellers();
}

    async function savePointRule() {

  const startValue =
    document.getElementById("pointStart").value;

  const endValue =
    document.getElementById("pointEnd").value;

  const pointValue =
    document.getElementById("pointValue").value;

  const message =
    document.getElementById("pointMessage");

  if (
    !startValue ||
    !endValue ||
    pointValue === ""
  ) {
    message.textContent =
      "開始日時・終了日時・ポイントを入力してください。";
    return;
  }

  const startDate =
    new Date(startValue);

  const endDate =
    new Date(endValue);

  const pointPerTicket =
    Number(pointValue);

  if (endDate <= startDate) {
    message.textContent =
      "終了日時は開始日時より後にしてください。";
    return;
  }

  if (pointPerTicket < 0) {
    message.textContent =
      "ポイントは0以上にしてください。";
    return;
  }

  message.textContent =
    "保存しています...";

  const { error } =
    await supabaseClient
      .from("point_rules")
      .insert({
        start_at:
          startDate.toISOString(),

        end_at:
          endDate.toISOString(),

        point_per_ticket:
          pointPerTicket
      });

  if (error) {
    message.textContent =
      "保存エラー：" + error.message;
    return;
  }

  message.textContent =
    "✅ ポイント設定を保存しました。";

  document.getElementById(
    "pointStart"
  ).value = "";

  document.getElementById(
    "pointEnd"
  ).value = "";

  document.getElementById(
    "pointValue"
  ).value = "";

  await loadPointRules();
}
    async function loadPointRules() {

  const list =
    document.getElementById(
      "pointRuleList"
    );

  list.innerHTML =
    "読み込み中...";

  const { data, error } =
    await supabaseClient
      .from("point_rules")
      .select(
        "id,start_at,end_at,point_per_ticket"
      )
      .order("start_at");

  if (error) {
    list.innerHTML =
      "取得エラー：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML =
      "ポイント設定はまだありません。";
    return;
  }

  list.innerHTML =
    data.map(rule => {

      const start =
        new Date(rule.start_at)
          .toLocaleString(
            "ja-JP",
            {
              timeZone: "Asia/Tokyo"
            }
          );

      const end =
        new Date(rule.end_at)
          .toLocaleString(
            "ja-JP",
            {
              timeZone: "Asia/Tokyo"
            }
          );

      return `
        <div
          style="
            border:1px solid #ccc;
            padding:10px;
            margin:8px 0;
            border-radius:8px;
          "
        >
          <strong>${start}</strong>

          <br>

          〜 ${end}

          <br><br>

          1枚あたり
          <strong>
            ${rule.point_per_ticket} pt
          </strong>
        </div>
      `;
    }).join("");
}
