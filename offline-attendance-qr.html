<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>オフライン出勤QR</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="./offline-work-store.js"></script><style>
body{margin:0;background:#f7f4f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:30px 18px 24px;border-radius:0 0 28px 28px}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;text-align:center}.qr{display:flex;justify-content:center;padding:16px}.big{font-size:30px;font-weight:900}.small{font-size:12px;color:#6e6e73;line-height:1.55}.err{color:#b00020;font-weight:900}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;font-weight:900}</style></head><body><header><h1 style="margin:0">出勤用 時間式QR</h1><p style="margin:7px 0 0;opacity:.85">オフラインでも30秒ごとに自動更新</p></header><main><section class="card"><div id="state">QRデータを確認中...</div><div id="qr" class="qr"></div><div id="clock" class="big"></div><div id="slot" class="small"></div></section><section class="card"><p class="small">この端末に事前保存したQRバンクから表示しています。スタッフ端末はQR時刻と読み取り時刻を照合します。</p><button onclick="location.href='home.html'">ポータルへ戻る</button></section></main><script>
let bank=null,lastKey='';function fmt(d){return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}function nearestSlot(now){const rows=bank?.slots||[];if(!rows.length)return null;const t=now.getTime();let best=null,bd=Infinity;for(const r of rows){const d=Math.abs(new Date(r.slot_at).getTime()-t);if(d<bd){bd=d;best=r;}}return bd<=45000?best:null;}async function tick(){clock.textContent=fmt(new Date());if(!bank){bank=await SigmaOfflineWorkStore.getManagerQrBank();if(!bank){state.innerHTML='<span class="err">この端末に店長・管理者用QRデータが保存されていません。</span>';return;}}const r=nearestSlot(new Date());if(!r){state.innerHTML='<span class="err">現在時刻に対応するQRデータがありません。</span>';qr.innerHTML='';return;}const key=r.slot_at;if(key!==lastKey){lastKey=key;qr.innerHTML='';const epoch=Math.floor(new Date(r.slot_at).getTime()/1000);new QRCode(qr,{text:`MPA1|${epoch}|${r.token}`,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});}state.textContent='QR表示中';slot.textContent=`QR時刻 ${new Date(r.slot_at).toLocaleString('ja-JP')}`;}setInterval(tick,1000);tick();
</script></body></html>
