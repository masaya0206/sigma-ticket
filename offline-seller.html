<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非常用当日券発行 | シグマ祭</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./offline-store.js"></script>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{--red:#b5121b;--dark:#8f0e15;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--green:#15803d;--amber:#9a6700}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 22px;background:linear-gradient(145deg,var(--red),var(--dark));color:#fff;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#ffdede}
main{max-width:620px;margin:auto;padding:16px 16px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0}
label{display:block;font-weight:800;margin-bottom:7px}select,input,button{width:100%;padding:13px;border-radius:13px;font-size:16px}select,input{border:1px solid #ddd;background:#fff}input{margin-bottom:12px}button{border:0;font-weight:900;background:#fff1f2;color:var(--red);margin-top:10px}.primary{background:var(--red);color:#fff}.dark{background:#2c2c2e;color:#fff}.small{font-size:12px;color:var(--muted);line-height:1.55}.status{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#eee}.ok{background:#ecfdf3;color:var(--green)}.warn{background:#fff7df;color:var(--amber)}
.big{font-size:34px;font-weight:900}.qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:16px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;word-break:break-all;text-align:center}
.notice{background:#fff8e8;border-color:#efd39a}.success{background:#ecfdf3;border-color:#b7e7c5}.hidden{display:none}.ticket-preview{display:block;width:100%;height:auto;border-radius:16px;background:#fff;border:1px solid #e5e7eb}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-head h2{margin:0}.history-head button{width:auto;margin:0;padding:9px 12px}.history-list{display:grid;gap:10px;margin-top:12px}.history-item{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.history-name{font-size:17px;font-weight:900}.history-meta{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.6}.history-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.history-badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#f1f1f1}.history-badge.pending{background:#fff7df;color:#9a6700}.history-badge.synced{background:#ecfdf3;color:#15803d}.history-badge.used{background:#fff0f0;color:#b5121b}.history-badge.active{background:#eef5ff;color:#1d4f91}.history-actions{display:flex;gap:8px;margin-top:10px}.history-actions button{margin:0;flex:1;padding:10px}.history-empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><h1>非常用当日券発行</h1><p>通信障害時に、事前予約データから1枚ずつ発行</p></header>
<main>
<section class="card notice">
  <strong>ログイン不要の非常用機能です</strong>
  <p class="small">オンライン時に非常用バックアップを保存してある端末で使えます。発行者はスタッフ一覧から選択します。同じ名前を複数端末で同時に使わないでください。</p>
  <div class="status">
    <span id="netPill" class="pill">通信確認中</span>
    <span id="syncPill" class="pill">未同期確認中</span>
  </div>
</section>

<section class="card">
  <label for="sellerSelect">発行者を選択</label>
  <select id="sellerSelect"></select>
  <p id="selectedInfo" class="small"></p>

  <label for="buyerName">購入者名</label>
  <input id="buyerName" type="text" maxlength="40" placeholder="例：田中 太郎" autocomplete="off">
  <p class="small">この名前を当日券画像と復旧後のチケットデータに保存します。</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
    <div><div class="small">発行可能</div><div id="availableCount" class="big">-</div></div>
    <div><div class="small">この端末で未同期</div><div id="pendingCount" class="big">-</div></div>
  </div>
  <button id="issueBtn" class="primary" onclick="issueOne()">当日券を1枚発行</button>
</section>

<section id="ticketCard" class="card success hidden">
  <h2 style="margin-top:0">発行しました</h2>
  <div id="qrCode" style="position:absolute;left:-9999px;top:-9999px"></div>
  <canvas id="ticketCanvas" class="ticket-preview" width="800" height="1100"></canvas>
  <p id="ticketCode" class="code"></p>
  <p id="ticketMeta" class="small"></p>
  <button class="dark" onclick="shareQr()">名前入り当日券画像を共有（AirDrop等）</button>
  <button onclick="issueOne()">次の当日券を1枚発行</button>
</section>

<section class="card">
  <div class="history-head">
    <h2>自分の発行履歴</h2>
    <button type="button" onclick="refreshHistory()">更新</button>
  </div>
  <p class="small">未同期の券はこの端末にだけ保存されています。同期済みの券は別端末でもログイン後に確認できます。</p>
  <div id="historyList" class="history-list"><div class="history-empty">履歴を読み込んでいます...</div></div>
  <p id="historyMessage" class="small"></p>
</section>

<section class="card">
  <button onclick="location.href='offline-scanner.html'">非常用QR受付へ</button>
  <button onclick="location.href='home.html'">ホームへ戻る</button>
  <p id="message" class="small"></p>
</section>
</main>

<script>
const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";
const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";
const sb=(typeof supabase!=="undefined")?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let currentIssue=null;
let syncBusy=false;
let backupBusy=false;
let historyCache=new Map();
let historyBusy=false;

function fmt(v){return v?new Date(v).toLocaleString("ja-JP"):"-";}
function renderNet(){
  const p=document.getElementById("netPill");
  p.textContent=navigator.onLine?"オンライン":"オフライン";
  p.className="pill "+(navigator.onLine?"ok":"warn");
}

async function preferredSellerId(list){
  const rows=list||[];

  // 1. Supabaseの現在のログイン情報（ローカル保存されたセッションも利用）
  try{
    if(sb){
      const {data:{session}}=await sb.auth.getSession();
      const uid=session?.user?.id||"";
      if(uid && rows.some(x=>x.user_id===uid)) return {user_id:uid,source:"login"};
    }
  }catch(_){}

  // 2. home.htmlで最後に正常ログインした本人情報
  try{
    const identity=await SigmaOfflineStore.getMeta("offline_login_identity",null);
    if(identity?.user_id && rows.some(x=>x.user_id===identity.user_id)){
      return {user_id:identity.user_id,source:"login-cache"};
    }
  }catch(_){}

  // 3. ログイン情報が取れない場合のみ、以前の手動選択を保険として利用
  try{
    const saved=await SigmaOfflineStore.getMeta("offline_selected_seller",null);
    if(saved?.user_id && rows.some(x=>x.user_id===saved.user_id)){
      return {user_id:saved.user_id,source:"manual"};
    }
  }catch(_){}

  return {user_id:"",source:"none"};
}

async function loadStaff(){
  const list=await SigmaOfflineStore.getStaffList();
  const sel=document.getElementById("sellerSelect");
  const rows=list||[];

  if(!rows.length){
    sel.innerHTML='<option value="">スタッフ一覧が保存されていません</option>';
    issueBtn.disabled=true;
    selectedInfo.textContent="オンライン時にバックアップを更新してください。";
    await refreshCounts();
    return;
  }

  // 先頭スタッフが勝手に選ばれないよう、未選択項目を必ず先頭に置く。
  sel.innerHTML='<option value="">発行者を選択してください</option>'+
    rows.map(x=>`<option value="${x.user_id}">${x.staff_name}</option>`).join("");

  const preferred=await preferredSellerId(rows);
  sel.value=preferred.user_id||"";
  sel.dataset.selectionSource=preferred.source;

  sel.onchange=async()=>{
    sel.dataset.selectionSource="manual";
    await rememberSeller();
    await refreshCounts();
    await refreshHistory();
  };

  await rememberSeller(false);
  await refreshCounts();
}

async function rememberSeller(write=true){
  const sel=document.getElementById("sellerSelect");
  const user_id=sel.value;
  const staff_name=sel.options[sel.selectedIndex]?.textContent||"";
  if(write && user_id) await SigmaOfflineStore.setMeta("offline_selected_seller",{user_id,staff_name});

  if(!user_id){
    selectedInfo.textContent="ログイン情報を確認できない場合は、発行者を手動で選択してください。";
    return;
  }

  const source=sel.dataset.selectionSource||"manual";
  selectedInfo.textContent=(source==="login"||source==="login-cache")
    ? `ログイン情報から自動選択：${staff_name}`
    : `手動選択：${staff_name}`;
}

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function getHistoryOwner(){
  // オンライン時は現在ログイン中の本人を最優先
  try{
    if(sb){
      const {data:{session}}=await sb.auth.getSession();
      const uid=session?.user?.id||"";
      if(uid){
        const list=await SigmaOfflineStore.getStaffList();
        const me=(list||[]).find(x=>String(x.user_id)===String(uid));
        return {user_id:uid,staff_name:me?.staff_name||"",source:"login"};
      }
    }
  }catch(_){ }

  // 完全オフライン時は、home.html が保存した最後のログイン本人情報を使う
  try{
    const identity=await SigmaOfflineStore.getMeta("offline_login_identity",null);
    if(identity?.user_id) return {user_id:identity.user_id,staff_name:identity.staff_name||"",source:"login-cache"};
  }catch(_){ }

  // 最後の保険として、現在手動選択中の発行者を使う
  const sel=document.getElementById("sellerSelect");
  const uid=sel?.value||"";
  const name=sel?.options?.[sel.selectedIndex]?.textContent||"";
  return {user_id:uid,staff_name:name,source:uid?"manual":"none"};
}

function statusLabel(row){
  if(row.ticket_status==="used") return {text:"使用済み",cls:"used"};
  if(row.sync_status==="pending") return {text:row.sync_error?"同期待ち":"未同期",cls:"pending"};
  if(row.ticket_status==="active") return {text:"利用可能",cls:"active"};
  return {text:"同期済み",cls:"synced"};
}

function renderHistory(rows){
  const box=document.getElementById("historyList");
  if(!box) return;
  historyCache=new Map((rows||[]).map(x=>[x.ticket_code,x]));
  if(!rows?.length){
    box.innerHTML='<div class="history-empty">オフライン当日券の発行履歴はまだありません。</div>';
    return;
  }
  box.innerHTML=rows.map(row=>{
    const st=statusLabel(row);
    const syncBadge=row.sync_status==="pending"
      ? `<span class="history-badge pending">${row.sync_error?"同期待ち":"未同期"}</span>`
      : `<span class="history-badge synced">同期済み</span>`;
    const useBadge=row.ticket_status
      ? `<span class="history-badge ${row.ticket_status==="used"?"used":"active"}">${row.ticket_status==="used"?"使用済み":"利用可能"}</span>`
      : '';
    const item=row.redemption_item==="fried_rice"?"炒飯1個":row.redemption_item==="sesame_pair"?"胡麻団子2個":"";
    return `<div class="history-item">
      <div class="history-name">${esc(row.buyer_name||"オフライン当日券")}</div>
      <div class="history-meta">${esc(fmt(row.issued_at))}<br>${esc(row.ticket_code)}${item?`<br>交換：${esc(item)}`:""}</div>
      <div class="history-badges">${syncBadge}${useBadge}</div>
      <div class="history-actions"><button type="button" onclick="redisplayHistoryTicket('${encodeURIComponent(row.ticket_code)}')">券を再表示</button></div>
    </div>`;
  }).join("");
}

async function refreshHistory(){
  if(historyBusy) return;
  historyBusy=true;
  const msg=document.getElementById("historyMessage");
  try{
    const owner=await getHistoryOwner();
    if(!owner.user_id){
      renderHistory([]);
      if(msg) msg.textContent="本人情報を確認できません。ログインするか、発行者を選択してください。";
      return;
    }

    const merged=new Map();

    // 端末内履歴。未同期でも必ず見える。
    const local=await SigmaOfflineStore.listDayIssuesByStatus(["pending","synced","conflict"]);
    for(const x of local.filter(x=>String(x.seller_user_id)===String(owner.user_id))){
      merged.set(x.ticket_code,{...x,ticket_status:null,used_at:null,redemption_item:null,source:"local"});
    }

    // オンライン・ログイン済みなら、Supabase側の本人履歴を追加。
    if(navigator.onLine && sb){
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(session?.user?.id && String(session.user.id)===String(owner.user_id)){
          const {data,error}=await sb.rpc("my_offline_day_ticket_history");
          if(error) throw error;
          for(const x of (data||[])){
            const prev=merged.get(x.ticket_code)||{};
            merged.set(x.ticket_code,{
              ...x,
              ...prev,
              buyer_name:(prev.buyer_name && prev.buyer_name!=="オフライン当日券")?prev.buyer_name:(x.buyer_name||prev.buyer_name),
              issued_at:prev.issued_at||x.issued_at,
              unit_price:Number(prev.unit_price||x.unit_price||0),
              seller_name:prev.seller_name||x.seller_name||owner.staff_name||"",
              sync_status:prev.sync_status==="pending"?"pending":"synced",
              ticket_status:x.ticket_status||prev.ticket_status||null,
              used_at:x.used_at||prev.used_at||null,
              redemption_item:x.redemption_item||prev.redemption_item||null,
              source:"server"
            });
          }
        }
      }catch(e){
        if(msg) msg.textContent="同期済み履歴を取得できませんでした。端末内の履歴だけ表示しています。";
      }
    }

    const rows=[...merged.values()].sort((a,b)=>String(b.issued_at||"").localeCompare(String(a.issued_at||"")));
    renderHistory(rows);
    if(msg && !msg.textContent) msg.textContent=`${rows.length}件の履歴を表示中`;
  }finally{
    historyBusy=false;
  }
}

async function redisplayHistoryTicket(encodedCode){
  const code=decodeURIComponent(encodedCode||"");
  const row=historyCache.get(code);
  if(!row) return;
  currentIssue={
    ticket_code:row.ticket_code,
    buyer_name:row.buyer_name||"オフライン当日券",
    seller_name:row.seller_name||"",
    issued_at:row.issued_at,
    unit_price:Number(row.unit_price||0)
  };
  await renderTicket(currentIssue);
  const status=row.ticket_status==="used"?"使用済み":row.sync_status==="pending"?"未同期":"同期済み";
  ticketMeta.textContent+=` / 履歴から再表示（${status}）`;
}

async function refreshCounts(){
  const sel=document.getElementById("sellerSelect");
  const uid=sel.value;
  const reserves=uid?await SigmaOfflineStore.getDayReservesForSeller(uid):[];
  const pending=await SigmaOfflineStore.listDayIssuesByStatus(["pending"]);
  availableCount.textContent=reserves.length;
  pendingCount.textContent=pending.length;
  issueBtn.disabled=!uid || reserves.length===0;
  syncPill.textContent=`未同期 ${pending.length}件`;
  syncPill.className="pill "+(pending.length?"warn":"ok");
}

async function issueOne(){
  const sel=document.getElementById("sellerSelect");
  const uid=sel.value;
  const name=sel.options[sel.selectedIndex]?.textContent||"";
  const buyer=buyerName.value.trim();
  if(!uid)return;
  if(!buyer){message.textContent="購入者名を入力してください。";buyerName.focus();return;}
  if(!confirm(`${name}として「${buyer}」さんのオフライン当日券を1枚発行しますか？`))return;
  try{
    const x=await SigmaOfflineStore.issueOfflineDayTicket(uid,name,buyer);
    currentIssue=x;
    await SigmaOfflineStore.setMeta("offline_selected_seller",{user_id:uid,staff_name:name});
    await renderTicket(x);
    buyerName.value="";
    message.textContent="";
    await refreshCounts();
    await refreshHistory();
    if(navigator.onLine) setTimeout(()=>syncIssues(false),300);
  }catch(e){
    message.textContent=e?.message||e;
  }
}

async function renderTicket(x){
  ticketCard.classList.remove("hidden");
  qrCode.innerHTML="";
  new QRCode(qrCode,{text:x.ticket_code,width:520,height:520,correctLevel:QRCode.CorrectLevel.M});

  await new Promise(resolve=>setTimeout(resolve,40));
  const qCanvas=qrCode.querySelector("canvas");
  const qImg=qrCode.querySelector("img");

  const canvas=ticketCanvas;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,800,1100);
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,800,1100);

  ctx.fillStyle="#b5121b";
  ctx.fillRect(0,0,800,150);

  ctx.fillStyle="#ffffff";
  ctx.textAlign="center";
  ctx.font='900 58px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText("シグマ祭 当日券",400,96);

  ctx.fillStyle="#1c1c1e";
  ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText("購入者",400,215);

  ctx.font='900 52px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  const buyer=String(x.buyer_name||"").slice(0,40);
  ctx.fillText(buyer,400,278);

  if(qCanvas){
    ctx.drawImage(qCanvas,140,330,520,520);
  }else if(qImg){
    if(!qImg.complete) await new Promise(resolve=>{qImg.onload=resolve;qImg.onerror=resolve;});
    ctx.drawImage(qImg,140,330,520,520);
  }

  ctx.fillStyle="#1c1c1e";
  ctx.font='800 25px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.fillText(x.ticket_code,400,900);

  ctx.font='600 25px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(`発行者：${x.seller_name}`,400,955);
  ctx.fillText(`発行：${fmt(x.issued_at)}　${Number(x.unit_price||0).toLocaleString()}円`,400,998);

  ctx.fillStyle="#b5121b";
  ctx.font='800 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText("炒飯1個 または 胡麻団子2個 / 1回限り",400,1055);

  ticketCode.textContent=x.ticket_code;
  ticketMeta.textContent=`購入者：${x.buyer_name} / 発行者：${x.seller_name} / 発行時刻：${fmt(x.issued_at)} / ${Number(x.unit_price||0).toLocaleString()}円`;
  ticketCard.scrollIntoView({behavior:"smooth",block:"start"});
}

async function ticketBlob(){
  return await new Promise((resolve,reject)=>{
    ticketCanvas.toBlob(blob=>blob?resolve(blob):reject(new Error("当日券画像を作成できませんでした")),"image/png");
  });
}

async function shareQr(){
  if(!currentIssue)return;
  try{
    const blob=await ticketBlob();
    const file=new File([blob],`sigma-${currentIssue.ticket_code}.png`,{type:"image/png"});
    if(navigator.share && navigator.canShare?.({files:[file]})){
      await navigator.share({files:[file],title:"シグマ祭 当日券",text:`${currentIssue.buyer_name}さんのシグマ祭 当日券`});
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=file.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    message.textContent="共有シートが使えないため画像ファイルとして保存しました。";
  }catch(e){message.textContent="共有できませんでした："+(e?.message||e);}
}

async function refreshOfflinePool(){
  if(backupBusy||!navigator.onLine||!sb)return;
  backupBusy=true;
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return;
    const {data,error}=await sb.rpc('offline_ticket_backup_snapshot');
    if(error)throw error;
    await SigmaOfflineStore.saveSnapshot(data,{user_id:user.id,source:'offline-seller-auto'});
    await refreshCounts();
  }catch(e){
    // 既存のオフラインデータは消さず、次回オンライン時に再試行
  }finally{
    backupBusy=false;
  }
}

async function syncIssues(manual=false){
  if(syncBusy||!navigator.onLine||!sb)return;
  syncBusy=true;
  try{
    const rows=await SigmaOfflineStore.listDayIssuesByStatus(["pending"]);
    if(!rows.length){if(manual)message.textContent="未同期の発行履歴はありません。";return;}
    const {data:{user}}=await sb.auth.getUser();
    if(!user){if(manual)message.textContent="オンライン復旧後、通常アプリへログインすると自動同期されます。";return;}
    let ok=0,ng=0;
    for(const x of rows){
      try{
        const {data,error}=await sb.rpc("sync_offline_day_issue_v2",{
          p_ticket_code:x.ticket_code,p_seller_user_id:x.seller_user_id,p_buyer_name:x.buyer_name||null,p_issued_at:x.issued_at,p_device_id:x.device_id,p_local_id:x.local_id
        });
        if(error)throw error;
        await SigmaOfflineStore.updateDayIssue(x.local_id,{sync_status:"synced",synced_at:new Date().toISOString(),server_result:data,sync_error:null});
        ok++;
      }catch(e){
        await SigmaOfflineStore.updateDayIssue(x.local_id,{sync_error:e?.message||String(e)});
        ng++;
      }
    }
    message.textContent=`発行履歴の同期：成功 ${ok}件 / 再送待ち ${ng}件`;
    if(ok>0) await refreshOfflinePool();
  }finally{
    syncBusy=false;
    await refreshCounts();
    await refreshHistory();
  }
}

window.addEventListener("online",()=>{renderNet();setTimeout(async()=>{await syncIssues(false);await refreshOfflinePool();await refreshHistory();},1000);});
window.addEventListener("offline",renderNet);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(async()=>{if(navigator.onLine){await syncIssues(false);await refreshOfflinePool();}await refreshHistory();},200);});
window.addEventListener("load",async()=>{
  renderNet();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(()=>{});
  await loadStaff();
  await refreshHistory();
  if(navigator.onLine)setTimeout(async()=>{await syncIssues(false);await refreshOfflinePool();await refreshHistory();},700);
  setInterval(async()=>{if(navigator.onLine){await syncIssues(false);await refreshOfflinePool();}},10*60*1000);
});
</script>
</body>
</html>
