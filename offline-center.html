<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>オフライン対応</title><meta name="theme-color" content="#b5121b"><link rel="manifest" href="./manifest.webmanifest"><script src="./offline-store.js?v=57"></script><script src="./offline-work-store.js"></script><script src="./connection-status.js"></script><style>:root{--red:#b5121b;--dark:#8f0e15;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:28px}.hero{padding:42px 22px 34px;color:#fff;background:linear-gradient(145deg,var(--red),var(--dark));border-radius:0 0 30px 30px}.hero h1{margin:0;font-size:31px}.hero p{margin:8px 0 0;color:rgba(255,255,255,.82)}main{max-width:620px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:18px;margin:13px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}.status{padding:13px;border-radius:15px;background:#fff8dd;color:#6e5b34;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:16px 10px;font:inherit;font-weight:900;background:#fff1f2;color:var(--red);min-height:74px}.btn.dark{background:#2c2c2e;color:#fff}.btn.red{background:var(--red);color:#fff}.btn.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted);line-height:1.6}.title{font-size:18px;font-weight:900;margin-bottom:10px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff8dd;color:#8a5a00;font-size:11px;font-weight:900}.back{width:100%;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;background:#f0ece9;color:#3d3835}@media(max-width:390px){.grid{grid-template-columns:1fr}.btn.full{grid-column:auto}}</style></head><body><div class="hero"><h1>オフライン対応</h1><p>通信障害時に必要な操作をここへまとめています。</p></div><main><div class="card"><span class="badge">端末内データで動作</span><div id="summary" class="status" style="margin-top:10px;">保存状況を確認しています...</div><div class="small" style="margin-top:8px;">オンライン中はポータルが必要なデータを自動保存します。出勤には時間式QRの読み取りが必須です。</div></div><div class="card"><div class="title">勤怠</div><div class="grid"><button class="btn red full" onclick="location.href='offline-attendance.html'">出勤・退勤</button><button id="qrDisplayBtn" class="btn full" style="display:none" onclick="location.href='offline-attendance-qr.html'">出勤用時間式QRを表示</button></div><div class="small" style="margin-top:10px;">出勤：時間式QRを読み取って暫定勤務を開始します。<br>退勤：この端末で勤務中の場合はボタン操作で記録します。</div></div><div class="card"><div class="title">券・受付</div><div class="grid"><button class="btn red" onclick="location.href='offline-seller.html'">オフライン券発行</button><button class="btn dark" onclick="location.href='offline-scanner.html'">非常用QR受付</button></div><div class="small" style="margin-top:10px;">券発行は勤務役割に関係なくスタッフ全員が利用できます。</div></div><button class="back" onclick="location.href='home.html'">ポータルへ戻る</button></main><script>async function refresh(){let ticketText="券データ：未保存",workText="勤務データ：未保存",pending=0;try{if(window.SigmaOfflineStore){const s=await SigmaOfflineStore.stats();ticketText=`券データ：${Number(s.ticketCount||0)}枚 / 最終保存 ${s.savedAt?new Date(s.savedAt).toLocaleString("ja-JP"):"未保存"}`;pending+=Number(s.pending||0)+Number(s.conflicts||0);}}catch(_){}try{if(window.SigmaOfflineWorkStore){const snap=await SigmaOfflineWorkStore.getSnapshot();const events=await SigmaOfflineWorkStore.listPendingEvents();pending+=events.length;workText=`勤務データ：${snap?.saved_at?new Date(snap.saved_at).toLocaleString("ja-JP"):"未保存"}`;const identity=await SigmaOfflineWorkStore.getQrSigningIdentity();const canShowQr=!!identity||snap?.manager_qr_allowed===true;document.getElementById("qrDisplayBtn").style.display=canShowQr?"block":"none";}}catch(_){}summary.innerHTML=`<b>${ticketText}</b><br>${workText}<br>`+(pending?`<b style="color:#b5121b">未同期 ${pending}件</b>`:"未同期データなし");}refresh();</script></body></html>
