<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提携先スタッフ登録</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--red:#b5121b;--red2:#8f0e15;--soft:#fff1f2;--bg:#f7f4f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 24px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2));border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px} header p{margin:7px 0 0;color:#ffe0e2;font-size:13px;line-height:1.6}
main{max-width:680px;margin:auto;padding:16px 16px 36px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(55,20,20,.05)}
h2{margin:0 0 12px;font-size:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d8ceca;border-radius:13px;background:#fff;font:inherit}
textarea{min-height:88px;resize:vertical}
button,.btn{width:100%;display:block;text-align:center;padding:13px;border:0;border-radius:13px;background:var(--red);color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer;margin-top:10px}
.secondary{background:var(--soft);color:var(--red)}
.success{background:#edf9ef;border-color:#b9e5c1} .danger{background:#fff0f0;border-color:#f0b8b8}
.small{font-size:12px;color:var(--muted);line-height:1.6} .muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee} .row:last-child{border-bottom:0}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--red);font-size:11px;font-weight:900}
.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
pre{white-space:pre-wrap;word-break:break-all;background:#faf7f5;padding:10px;border-radius:10px;font-size:11px}
</style>

<style id="responsiveOverflowFixV1">
/* 共通：iPhone/Safariを含む横はみ出し防止 */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{overflow-wrap:anywhere}
main,.container,.wrap,.content,.page,.card,.panel,.row,.grid,.field,form,
main>*,.card>*,.panel>*,.grid>*{
  min-width:0;
  max-width:100%;
}
input,select,textarea,button{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
input[type="datetime-local"],
input[type="date"],
input[type="time"],
input[type="month"],
input[type="week"]{
  display:block;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
  -webkit-appearance:none;
  appearance:none;
}
img,video,canvas,svg,iframe{
  max-width:100%;
}
pre,code{
  max-width:100%;
  overflow-x:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
table{
  max-width:100%;
}
@media(max-width:600px){
  main{width:100%;max-width:100%}
  .card,.panel{max-width:100%;min-width:0}
  input,select,textarea{font-size:16px}
}
</style>

</head>
<body>

<header><h1>提携先スタッフ登録</h1><p>招待されたメールアドレスに、パスワードを設定して登録します。</p></header>
<main>
  <div id="loadingCard" class="card">
    招待情報を確認しています...
  </div>

  <div id="registerCard" class="card" style="display:none">
    <h2>パスワード設定</h2>

    <div id="inviteInfo" class="small" style="margin-bottom:14px"></div>

    <label>パスワード</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password"
           placeholder="8文字以上">

    <label>パスワード確認</label>
    <input id="passwordConfirm" type="password" minlength="8" autocomplete="new-password"
           placeholder="もう一度入力">

    <button id="registerBtn" onclick="registerPartner()">パスワードを設定して登録</button>
    <div id="msg" class="small" style="margin-top:12px"></div>
  </div>

  <div id="completeCard" class="card success" style="display:none">
    <h2>登録完了</h2>
    <div id="completeMessage" class="small"></div>
    <a class="btn" href="partner-login.html">ログイン画面へ</a>
  </div>

  <a class="btn secondary" href="partner-login.html">すでに登録済みの方</a>
</main>

<script>
const sb=supabase.createClient(
  "https://gsniytemgrbtgfywhqlu.supabase.co",
  "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
);

const token=new URLSearchParams(location.search).get("token");

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function functionErrorMessage(error){
  if(!error) return "不明なエラー";
  let text=error.message||"不明なエラー";
  try{
    const body=await error.context.json();
    text=body?.error||body?.message||text;
  }catch(_){}
  return text;
}

async function checkInvite(){
  if(!token){
    loadingCard.className="card danger";
    loadingCard.textContent="招待URLが正しくありません。";
    return;
  }

  const {data,error}=await sb.functions.invoke("register-partner",{
    body:{action:"check",token}
  });

  if(error){
    loadingCard.className="card danger";
    loadingCard.textContent="招待確認エラー："+await functionErrorMessage(error);
    return;
  }

  if(data?.error || !data?.usable){
    loadingCard.className="card danger";
    loadingCard.textContent=data?.error||data?.message||"この招待URLは利用できません。";
    return;
  }

  loadingCard.style.display="none";
  registerCard.style.display="block";

  inviteInfo.innerHTML=`
    <div style="padding:12px;border-radius:12px;background:#faf7f5">
      <b>スタッフ名</b><br>${esc(data.display_name)}
      <br><br>
      <b>メールアドレス</b><br>${esc(data.email)}
      <br><br>
      <span class="pill">${esc(data.partner_name||"提携先")}</span>
    </div>
    <div style="margin-top:10px">
      メールアドレスの入力や確認メールは不要です。<br>
      この招待URLは登録完了後に使用できなくなります。
    </div>
  `;

  if(data.existing_user){
    inviteInfo.innerHTML+=`
      <div style="margin-top:10px;padding:10px;border-radius:10px;background:#fff8e8;color:#6b4a00">
        このメールアドレスには既存アカウントがあります。<br>
        安全のため既存パスワードは変更せず、提携先スタッフ権限だけを追加します。
      </div>
    `;
    password.disabled=true;
    passwordConfirm.disabled=true;
    password.placeholder="既存アカウントのため変更しません";
    passwordConfirm.placeholder="既存アカウントのため変更しません";
    registerBtn.textContent="既存アカウントで参加登録";
  }
}

async function registerPartner(){
  registerBtn.disabled=true;
  msg.textContent="登録処理中...";

  const {data:check,error:checkError}=await sb.functions.invoke("register-partner",{
    body:{action:"check",token}
  });

  if(checkError || !check?.usable){
    registerBtn.disabled=false;
    msg.textContent=check?.message||check?.error||await functionErrorMessage(checkError);
    return;
  }

  let passwordValue=null;

  if(!check.existing_user){
    const p=password.value;
    const pc=passwordConfirm.value;

    if(p.length<8){
      registerBtn.disabled=false;
      msg.textContent="パスワードは8文字以上にしてください。";
      return;
    }

    if(p!==pc){
      registerBtn.disabled=false;
      msg.textContent="パスワードが一致していません。";
      return;
    }

    passwordValue=p;
  }

  const {data,error}=await sb.functions.invoke("register-partner",{
    body:{
      action:"register",
      token,
      password:passwordValue
    }
  });

  if(error){
    registerBtn.disabled=false;
    msg.textContent="登録エラー："+await functionErrorMessage(error);
    return;
  }

  if(data?.error){
    registerBtn.disabled=false;
    msg.textContent="登録エラー："+data.error;
    return;
  }

  registerCard.style.display="none";
  completeCard.style.display="block";

  completeMessage.innerHTML=data?.existing_user
    ? `提携先スタッフへの参加登録が完了しました。<br><br>
       <b>${esc(data.email)}</b> と、これまで使用していたパスワードでログインしてください。`
    : `アカウント登録が完了しました。<br><br>
       <b>${esc(data.email)}</b> と、今設定したパスワードでログインできます。<br>
       確認メールを開く必要はありません。`;
}

checkInvite();
</script>
</body>
</html>
