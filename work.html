<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#b5121b"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>勤怠・シフト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b5121b;--dark:#8f0e15;--soft:#fff1f2;--ink:#1c1c1e;--muted:#6e6e73;--line:#ece7e4;--bg:#f7f4f2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:var(--red);font-size:20px;font-weight:900;box-shadow:0 4px 15px #4a191912}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{width:100%;margin:10px 0;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left;box-shadow:0 5px 16px #2b16160b}
.card:active{transform:scale(.987)}.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:var(--soft);color:var(--red);font-weight:900;font-size:20px}
.name{display:block;margin-top:11px;font-size:18px;font-weight:900}.desc{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
</style>
<style id="globalBottomNavStyle">
  body{padding-bottom:82px!important}
  .global-bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(100%,620px);
    height:72px;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    z-index:9998;
    background:rgba(255,255,255,.96);
    border-top:1px solid #eadfdb;
    box-shadow:0 -5px 22px rgba(55,20,20,.08);
    backdrop-filter:blur(12px);
  }
  .global-bottom-nav.admin-nav{
    grid-template-columns:repeat(4,1fr);
  }
  .global-bottom-nav button{
    width:100%!important;
    min-width:0;
    margin:0!important;
    padding:7px 4px!important;
    border:0!important;
    border-radius:12px!important;
    background:transparent!important;
    color:#6e6e73!important;
    font:inherit;
    font-size:11px!important;
    font-weight:700!important;
    line-height:1.15;
    box-shadow:none!important;
  }
  .global-bottom-nav button .gicon{
    display:block;
    margin-bottom:4px;
    font-size:20px;
    line-height:1;
  }
  .global-bottom-nav button.active{
    color:#b5121b!important;
    background:#fff1f2!important;
  }
</style>


<style id="v80BottomNav">
body{padding-bottom:82px!important}
.global-bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);
width:min(100%,620px);min-height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:9998;background:rgba(255,255,255,.96);
border-top:1px solid #eadfdb;box-shadow:0 -5px 22px rgba(55,20,20,.08);backdrop-filter:blur(12px)}
.global-bottom-nav.admin-nav{grid-template-columns:repeat(4,1fr)}
.global-bottom-nav button{width:100%!important;margin:0!important;padding:7px 4px!important;border:0!important;
border-radius:12px!important;background:transparent!important;color:#6e6e73!important;font:inherit;font-size:11px!important;
font-weight:700!important;line-height:1.15;box-shadow:none!important}
.global-bottom-nav .gicon{display:block;margin-bottom:4px;font-size:20px;line-height:1}
.global-bottom-nav button.active{color:#b5121b!important;background:#fff1f2!important}
</style>


<style id="responsiveOverflowFixV1">
/* 共通：iPhone/Safariを含む横はみ出し防止 */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{overflow-wrap:anywhere}
main,.container,.wrap,.content,.page,.card,.panel,.row,.grid,.field,form,
main>*,.card>*,.panel>*,.grid>*{
  min-width:0;
  max-width:100%;
}
input,select,textarea,button{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
input[type="datetime-local"],
input[type="date"],
input[type="time"],
input[type="month"],
input[type="week"]{
  display:block;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
  -webkit-appearance:none;
  appearance:none;
}
img,video,canvas,svg,iframe{
  max-width:100%;
}
pre,code{
  max-width:100%;
  overflow-x:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
table{
  max-width:100%;
}
@media(max-width:600px){
  main{width:100%;max-width:100%}
  .card,.panel{max-width:100%;min-width:0}
  input,select,textarea{font-size:16px}
}
</style>

</head><body><main>
<div class="top"><button class="back" onclick="history.length>1?history.back():location.href='home.html'">←</button><div><h1>勤怠・シフト</h1><div class="sub">勤務と希望シフト</div></div></div>
<button class="card" onclick="location.href='staff.html'"><span class="icon">時</span><span class="name">勤怠</span><span class="desc">現在の勤務状態・出退勤の確認</span></button>
<button class="card" onclick="location.href='shift.html'"><span class="icon">予</span><span class="name">希望シフト</span><span class="desc">参加できる日・時間を提出・確認</span></button>
<button class="card" id="attendanceWatchCard" style="display:none" onclick="location.href='attendance-watch.html'"><span class="icon">確</span><span class="name">勤怠確認・勤務延長</span><span class="desc">店長・管理者用｜未出勤・退勤予定超過の確認、勤務時間の延長</span></button>
<button class="card" id="attendanceQrCard" style="display:none" onclick="location.href='attendance-qr.html'"><span class="icon">QR</span><span class="name">勤怠QR</span><span class="desc">管理者用｜出退勤を読み取るためのQRを表示</span></button>
<button class="card" id="activeStaffCard" style="display:none" onclick="location.href='active-staff.html'"><span class="icon">人</span><span class="name">現在出勤中・役割変更</span><span class="desc">店長・管理者用｜出勤中の人数確認と役割変更</span></button>
</main><nav class="global-bottom-nav"><button class="" onclick="location.href='home.html'"><span class="gicon">⌂</span>ホーム</button><button class="active" onclick="location.href='work.html'"><span class="gicon">時</span>勤怠・シフト</button><button class="" onclick="location.href='tickets.html'"><span class="gicon">券</span>チケット</button></nav>
<script>
(async()=>{
  const sb=window.supabase?.createClient(
    "https://gsniytemgrbtgfywhqlu.supabase.co",
    "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn"
  );
  if(!sb) return;
  try {
    // No privileged shortcut is shown without an authenticated session and verified RPC.
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError || !session?.user) return;
    const [manager,admin]=await Promise.all([
      sb.rpc("is_store_manager"),
      sb.rpc("is_admin")
    ]);
    const isAdmin=!admin.error && admin.data===true;
    const isManager=!manager.error && manager.data===true;
    if(isAdmin || isManager){
      document.getElementById("attendanceWatchCard").style.display="block";
      document.getElementById("activeStaffCard").style.display="block";
    }
    if(isAdmin){
      document.getElementById("attendanceQrCard").style.display="block";
    }
  }catch(e){console.warn("権限情報の読み込みに失敗しました",e);}
})();
</script>
</body></html>
