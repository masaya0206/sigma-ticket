<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 チケット受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 10px;
    }

    .valid {
      background: #e8f7e8;
    }

    .invalid {
      background: #ffe8e8;
    }
  </style>
</head>

<body>

  <h1>シグマ祭 チケット受付</h1>

  <button
  id="scanButton"
  onclick="startScanner()"
  style="display:none;"
>
  QRコードを読み取る
</button>

<p id="registerStatus">
  レジ勤務状態を確認しています...
</p>

  <div id="reader"></div>

  <div id="result">
    まだQRコードは読み取られていません。
  </div>

  <script>

    const SUPABASE_URL = "https://gsniytemgrbtgfywhqlu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanner;

    async function checkRegisterPermission() {

  const status =
    document.getElementById("registerStatus");

  const scanButton =
    document.getElementById("scanButton");

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {

    scanButton.style.display = "none";

    status.textContent =
      "スタッフ画面からログインしてください。";

    return false;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_attendance")
      .select("id")
      .eq("user_id", user.id)
      .eq("role", "register")
      .is("clock_out", null)
      .limit(1)
      .maybeSingle();

  if (error) {

    scanButton.style.display = "none";

    status.textContent =
      "レジ勤務状態を確認できませんでした。";

    return false;
  }

  if (!data) {

    scanButton.style.display = "none";

    status.textContent =
      "現在レジ勤務中ではありません。";

    return false;
  }

  scanButton.style.display = "block";

  status.textContent =
    "🟢 レジ勤務中";

  return true;
}

    async function startScanner() {

  const allowed =
    await checkRegisterPermission();

  if (!allowed) {

    document.getElementById("result")
      .innerHTML =
      "レジ勤務中のスタッフだけ使用できます。";

    return;
  }

  if (scanner) return;

  scanner =
    new Html5Qrcode("reader");

  scanner.start(
    {
      facingMode: "environment"
    },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    async function(decodedText) {

      await scanner.stop();

      scanner = null;

      checkTicket(decodedText);
    },

    function(error) {
    }
  );
}

    async function checkTicket(ticketCode) {

      const resultBox = document.getElementById("result");

      resultBox.className = "";
      resultBox.innerHTML = "チケットを確認しています...";

      const { data, error } = await supabaseClient
        .from("tickets")
        .select("*")
        .eq("ticket_code", ticketCode)
        .maybeSingle();

      if (error) {

        resultBox.className = "invalid";

        resultBox.innerHTML = `
          <h2>⚠️ エラー</h2>
          <p>${error.message}</p>
        `;

        return;
      }

      if (!data) {

        resultBox.className = "invalid";

        resultBox.innerHTML = `
          <h2>❌ 無効なチケット</h2>
          <p>登録されていないチケットです。</p>
        `;

        return;
      }

     if (data.status === "active") {

  resultBox.className = "valid";

  resultBox.innerHTML = `
    <h2>🟢 有効</h2>

    <p><strong>商品</strong><br>
    ${data.product_name}</p>

    <p><strong>販売者</strong><br>
    ${data.seller_name}</p>

    <p><strong>チケットID</strong><br>
    ${data.ticket_code}</p>

    <button onclick="useTicket('${data.ticket_code}')">
      使用する
    </button>
  `;

} else if (data.status === "used") {

        resultBox.className = "invalid";

        resultBox.innerHTML = `
          <h2>🔴 使用済み</h2>

          <p>${data.product_name}</p>
          <p>チケットID：${data.ticket_code}</p>
        `;

      } else {

        resultBox.className = "invalid";

        resultBox.innerHTML = `
          <h2>⛔ 無効</h2>

          <p>このチケットは使用できません。</p>
        `;
      }
    }

async function useTicket(ticketCode) {

  const resultBox =
    document.getElementById("result");

  const allowed =
    await checkRegisterPermission();

  if (!allowed) {

    resultBox.className = "invalid";

    resultBox.innerHTML = `
      <h2>⛔ 使用できません</h2>
      <p>
        現在レジ勤務中ではありません。
      </p>
    `;

    return;
  }

  resultBox.innerHTML = "使用処理中...";

  const { data, error } = await supabaseClient
    .from("tickets")
    .update({
      status: "used",
      used_at: new Date().toISOString()
    })
    .eq("ticket_code", ticketCode)
    .eq("status", "active")
    .select()
    .maybeSingle();

  if (error) {

    resultBox.className = "invalid";

    resultBox.innerHTML = `
      <h2>⚠️ エラー</h2>
      <p>${error.message}</p>
    `;

    return;
  }

  if (!data) {

    resultBox.className = "invalid";

    resultBox.innerHTML = `
      <h2>🔴 使用できません</h2>
      <p>すでに使用済み、または無効なチケットです。</p>
    `;

    return;
  }
  
const {
  data: { user }
} =
  await supabaseClient.auth.getUser();

const {
  data: staff
} =
  await supabaseClient
    .from("staff_members")
    .select("staff_name")
    .eq("user_id", user.id)
    .maybeSingle();

await supabaseClient
  .from("ticket_logs")
  .insert({
    ticket_code:
      data.ticket_code,

    action:
      "used",

    actor_id:
      user.id,

    actor_name:
      staff?.staff_name ??
      "受付スタッフ"
  });
  
  resultBox.className = "valid";

  resultBox.innerHTML = `
    <h2>✅ 使用完了</h2>

    <p>${data.product_name}</p>

    <p>
      ${new Date(data.used_at).toLocaleString("ja-JP")}
    </p>

    <button onclick="startScanner()">
      次のQRを読み取る
    </button>
  `;
}

    checkRegisterPermission();

</script>

</body>
</html>
