<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 チケット受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result,
    #registerPanel {
      margin-top: 20px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 10px;
    }

    .valid {
      background: #e8f7e8 !important;
    }

    .invalid {
      background: #ffe8e8 !important;
    }

    .warning {
      background: #fff4df !important;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <style id="sigma-red-theme">
    :root {
      --sigma-red: #b5121b;
      --sigma-red-dark: #8f0e15;
      --sigma-red-soft: #fff1f2;
      --sigma-gold: #d9a526;
      --sigma-bg: #f7f4f2;
      --sigma-surface: #ffffff;
      --sigma-ink: #1c1c1e;
      --sigma-muted: #6e6e73;
      --sigma-line: #ece7e4;
      --sigma-green: #15803d;
      --sigma-shadow: 0 8px 24px rgba(74, 25, 25, 0.08);
    }

    html {
      background: var(--sigma-bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif !important;
      color: var(--sigma-ink) !important;
      background: var(--sigma-bg) !important;
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 20px !important;
    }

    body > h1:first-of-type {
      margin: -20px -20px 22px !important;
      padding:
        max(36px, env(safe-area-inset-top))
        22px
        34px !important;
      color: #fff !important;
      background:
        radial-gradient(circle at 86% 18%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(145deg, var(--sigma-red), var(--sigma-red-dark)) !important;
      border-radius: 0 0 28px 28px !important;
      font-size: 30px !important;
      letter-spacing: .02em !important;
      text-align: left !important;
    }

    input,
    select,
    textarea {
      color: var(--sigma-ink) !important;
      background: #fff !important;
      border: 1px solid #ddd5d1 !important;
      border-radius: 14px !important;
      box-shadow: none !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none !important;
      border-color: var(--sigma-red) !important;
      box-shadow: 0 0 0 3px rgba(181,18,27,.10) !important;
    }

    button {
      border-radius: 14px !important;
      font-weight: 750 !important;
      color: var(--sigma-red) !important;
      background: var(--sigma-red-soft) !important;
      box-shadow: none !important;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .45 !important;
    }

    #loginArea,
    #sellerArea,
    #staffArea,
    #adminArea,
    #backArea,
    #frontArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card,
    .subcard {
      border-radius: 20px !important;
    }

    #loginArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card {
      background: var(--sigma-surface) !important;
      border: 1px solid rgba(181,18,27,.06) !important;
      box-shadow: var(--sigma-shadow) !important;
    }

    .subcard {
      background: #fff !important;
      border-color: var(--sigma-line) !important;
    }

    .success {
      background: #ecfdf3 !important;
      color: #14532d !important;
    }

    .danger {
      background: #fff0f0 !important;
      color: #7f1d1d !important;
    }

    .warning {
      background: #fff8e8 !important;
      color: #6b4a00 !important;
    }

    a {
      color: var(--sigma-red) !important;
    }

    strong {
      color: inherit;
    }

    hr {
      border-color: var(--sigma-line) !important;
    }

    .ticket-code {
      color: var(--sigma-red) !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px !important;
      }

      body > h1:first-of-type {
        margin-left: -16px !important;
        margin-right: -16px !important;
      }
    }
  </style>

</head>

<body>

  <h1>シグマ祭 チケット受付</h1>

  <div id="registerPanel">
    <p id="registerStatus">
      レジ勤務状態を確認しています...
    </p>

    <button
      id="backToStaffButton"
      onclick="location.href='home.html'"
    >
      🏠 ポータルに戻る
    </button>
  </div>

  <button
    id="scanButton"
    onclick="startScanner()"
    style="display:none;"
  >
    QRコードを読み取る
  </button>

  <button
    id="stopButton"
    onclick="stopScanner()"
    style="display:none;"
  >
    スキャンを停止
  </button>

  <div id="reader"></div>

  <div id="result">
    まだQRコードは読み取られていません。
  </div>

  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let scanner = null;
    let scannerBusy = false;


    async function getCurrentUser() {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      return user;
    }


    async function checkRegisterPermission() {

      const status =
        document.getElementById(
          "registerStatus"
        );

      const scanButton =
        document.getElementById(
          "scanButton"
        );

      const user =
        await getCurrentUser();

      if (!user) {

        scanButton.style.display =
          "none";

        status.textContent =
          "スタッフ画面からログインしてください。";

        return false;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("staff_attendance")
          .select(
            "id,clock_in,attendance_state"
          )
          .eq("user_id", user.id)
          .eq("role", "register")
          .eq(
            "attendance_state",
            "working"
          )
          .is("clock_out", null)
          .order(
            "clock_in",
            { ascending: false }
          )
          .limit(1)
          .maybeSingle();

      if (error) {

        scanButton.style.display =
          "none";

        status.textContent =
          "レジ勤務状態を確認できませんでした。";

        return false;
      }

      if (!data) {

        scanButton.style.display =
          "none";

        status.textContent =
          "現在レジ勤務中ではありません。";

        return false;
      }

      scanButton.style.display =
        scanner
          ? "none"
          : "block";

      status.textContent =
        "🟢 レジ勤務中";

      return true;
    }


    async function startScanner() {

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        const result =
          document.getElementById(
            "result"
          );

        result.className =
          "warning";

        result.innerHTML =
          "レジ勤務中のスタッフだけ使用できます。";

        return;
      }

      if (
        scanner ||
        scannerBusy
      ) {
        return;
      }

      scannerBusy = true;

      try {

        scanner =
          new Html5Qrcode(
            "reader"
          );

        document.getElementById(
          "scanButton"
        ).style.display =
          "none";

        document.getElementById(
          "stopButton"
        ).style.display =
          "block";

        const result =
          document.getElementById(
            "result"
          );

        result.className = "";
        result.textContent =
          "QRコードをカメラにかざしてください。";

        await scanner.start(
          {
            facingMode:
              "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          async function(
            decodedText
          ) {

            if (scannerBusy) {
              return;
            }

            scannerBusy = true;

            try {

              await stopScanner(
                false
              );

              await checkTicket(
                decodedText
              );

            } finally {

              scannerBusy = false;
            }
          },

          function() {
          }
        );

      } catch (error) {

        scanner = null;

        document.getElementById(
          "stopButton"
        ).style.display =
          "none";

        const result =
          document.getElementById(
            "result"
          );

        result.className =
          "invalid";

        result.innerHTML = `
          <h2>⚠️ カメラエラー</h2>
          <p>${error.message}</p>
        `;

        await checkRegisterPermission();

      } finally {

        scannerBusy = false;
      }
    }


    async function stopScanner(
      refreshPermission = true
    ) {

      if (!scanner) {

        document.getElementById(
          "stopButton"
        ).style.display =
          "none";

        if (refreshPermission) {
          await checkRegisterPermission();
        }

        return;
      }

      const currentScanner =
        scanner;

      scanner = null;

      try {

        await currentScanner.stop();

      } catch (error) {
      }

      try {

        await currentScanner.clear();

      } catch (error) {
      }

      document.getElementById(
        "stopButton"
      ).style.display =
        "none";

      if (refreshPermission) {
        await checkRegisterPermission();
      }
    }


    async function checkTicket(
      ticketCode
    ) {

      const resultBox =
        document.getElementById(
          "result"
        );

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⛔ 使用できません</h2>
          <p>
            現在レジ勤務中ではありません。
          </p>
        `;

        return;
      }

      resultBox.className = "";

      resultBox.innerHTML =
        "チケットを確認しています...";

      const {
        data,
        error
      } =
        await supabaseClient
          .from("tickets")
          .select("*")
          .eq(
            "ticket_code",
            ticketCode
          )
          .maybeSingle();

      if (error) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⚠️ エラー</h2>
          <p>${error.message}</p>
          <button onclick="startScanner()">
            もう一度読み取る
          </button>
        `;

        return;
      }

      if (!data) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>❌ 無効なチケット</h2>
          <p>
            登録されていないチケットです。
          </p>
          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (
        data.status === "active"
      ) {

        resultBox.className =
          "valid";

        resultBox.innerHTML = `
          <h2>🟢 有効</h2>

          <p>
            <strong>商品</strong><br>
            ${data.product_name}
          </p>

          <p>
            <strong>販売者</strong><br>
            ${data.seller_name}
          </p>

          <p>
            <strong>購入者</strong><br>
            ${data.buyer_name ?? "未登録"}
          </p>

          <p>
            <strong>チケットID</strong><br>
            ${data.ticket_code}
          </p>

          <div class="subcard">
            <strong>交換する商品を選択</strong><br><br>
            <button id="useRiceButton" onclick="useTicket('${data.ticket_code}','fried_rice')">
              🍚 炒飯1個と交換
            </button>
            <button id="useSesameButton" onclick="useTicket('${data.ticket_code}','sesame_pair')">
              ● 胡麻団子2個と交換
            </button>
            <div id="registerPriceInfo" class="small">現在価格を確認しています...</div>
          </div>

          <button onclick="startScanner()">
            キャンセルして次を読む
          </button>
        `;

        await showRegisterPriceInfo();
        return;
      }

      if (
        data.status === "used"
      ) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>🔴 使用済み</h2>

          <p>
            ${data.product_name}
          </p>

          <p>
            チケットID：
            ${data.ticket_code}
          </p>

          <p class="small">
            ${
              data.used_at
                ? new Date(
                    data.used_at
                  ).toLocaleString(
                    "ja-JP"
                  )
                : ""
            }
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (
        data.status === "pending"
      ) {

        resultBox.className =
          "warning";

        resultBox.innerHTML = `
          <h2>🟡 受け取り待ち</h2>

          <p>
            購入者側で受け取りが完了していません。
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      resultBox.className =
        "invalid";

      resultBox.innerHTML = `
        <h2>⛔ 無効</h2>

        <p>
          このチケットは使用できません。
        </p>

        <button onclick="startScanner()">
          次のQRを読み取る
        </button>
      `;
    }



    async function showRegisterPriceInfo() {
      const box = document.getElementById("registerPriceInfo");
      if (!box) return;
      const { data } = await supabaseClient.from("menu_state").select("*").eq("id",1).maybeSingle();
      if (!data) return;
      const pair = data.sesame_pair_enabled && data.sesame_pair_price != null
        ? data.sesame_pair_price : data.sesame_single_price * 2;
      const riceRefund = Math.max(450 - data.fried_rice_price,0);
      const sesameRefund = Math.max(450 - pair,0);
      box.innerHTML = `
        炒飯：${data.fried_rice_price}円${riceRefund ? ` → <strong>${riceRefund}円返金</strong>` : ""}<br>
        胡麻団子2個：${pair}円${sesameRefund ? ` → <strong>${sesameRefund}円返金</strong>` : ""}
      `;
      const rb=document.getElementById("useRiceButton"), sb=document.getElementById("useSesameButton");
      if(rb && data.fried_rice_status==='sold_out'){ rb.disabled=true; rb.textContent='🍚 炒飯 売り切れ'; }
      if(sb && data.sesame_status==='sold_out'){ sb.disabled=true; sb.textContent='● 胡麻団子 売り切れ'; }
    }

    async function useTicket(
      ticketCode,
      item
    ) {

      const resultBox =
        document.getElementById(
          "result"
        );

      const useButton = document.getElementById(item === "fried_rice" ? "useRiceButton" : "useSesameButton");
      document.querySelectorAll("#useRiceButton,#useSesameButton").forEach((button) => button.disabled = true);

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⛔ 使用できません</h2>
          <p>
            現在レジ勤務中ではありません。
          </p>
        `;

        return;
      }

      resultBox.className = "";
      resultBox.innerHTML =
        "使用処理中...";

      const { data: rpcData, error } = await supabaseClient.rpc("use_ticket", {
        p_ticket_code: ticketCode,
        p_item: item
      });
      const data = rpcData?.[0] || null;

      if (error) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⚠️ エラー</h2>
          <p>${error.message}</p>
          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (!data) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>🔴 使用できません</h2>

          <p>
            すでに使用済み、
            または無効なチケットです。
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      const user =
        await getCurrentUser();

      let staffName =
        "受付スタッフ";

      if (user) {

        const {
          data: staff
        } =
          await supabaseClient
            .from("staff_members")
            .select("staff_name")
            .eq(
              "user_id",
              user.id
            )
            .maybeSingle();

        if (staff?.staff_name) {
          staffName =
            staff.staff_name;
        }
      }

      const {
        error: logError
      } =
        await supabaseClient
          .from("ticket_logs")
          .insert({
            ticket_code:
              data.ticket_code,
            action:
              "used",
            actor_id:
              user?.id ?? null,
            actor_name:
              staffName
          });

      resultBox.className =
        "valid";

      resultBox.innerHTML = `
        <h2>✅ 使用完了</h2>

        <p>
          ${data.redemption_item === "fried_rice" ? "炒飯1個" : "胡麻団子2個"}
        </p>

        <p><strong>当日価格：</strong>${data.redemption_price}円</p>
        ${data.cashback_amount > 0 ? `<p class="warning"><strong>💴 ${data.cashback_amount}円を購入者へ返金してください</strong></p>` : `<p>追加返金なし</p>`}

        <p>
          ${new Date(
            data.used_at
          ).toLocaleString(
            "ja-JP"
          )}
        </p>

        ${
          logError
            ? `
              <p class="small">
                ※使用処理は完了しましたが、
                操作履歴の保存に失敗しました。
              </p>
            `
            : ""
        }

        <button onclick="startScanner()">
          次のQRを読み取る
        </button>

        <button
          onclick="
            location.href='home.html'
          "
        >
          🏠 ポータルに戻る
        </button>
      `;
    }


    async function initialize() {

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (!session) {

        document.getElementById(
          "registerStatus"
        ).textContent =
          "スタッフ画面からログインしてください。";

        document.getElementById(
          "scanButton"
        ).style.display =
          "none";

        return;
      }

      await checkRegisterPermission();
    }


    window.addEventListener(
      "pagehide",
      () => {

        if (scanner) {

          try {
            scanner.stop();
          } catch (error) {
          }
        }
      }
    );


    initialize();

  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
