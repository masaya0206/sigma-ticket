<body>

  <h1>シグマ祭 チケット受付</h1>

  <div id="registerPanel">
    <p id="registerStatus">
      レジ勤務状態を確認しています...
    </p>

    <button
      id="backToStaffButton"
      onclick="location.href='home.html'"
    >
      🏠 ポータルに戻る
    </button>
  </div>

  
  
  <div class="pickup-box">
    <label for="pickupNumber">受け取り番号</label>
    <input id="pickupNumber" type="text" inputmode="numeric" maxlength="12"
           placeholder="例：123" autocomplete="off">
    <div class="small">お客さんに伝える番号を入力してください。</div>
  </div>
  <div class="cash-order">
    <h2>現金会計</h2>
    <div id="myRegisterLabel" class="small">レジ情報を確認中...</div>

    <div class="cash-grid">
      <div class="cash-item">
        <strong>炒飯</strong>
        <div id="ricePriceLabel" class="small">-円</div>
        <div class="qty-row">
          <button type="button" onclick="changeCashQty('rice',-1)">−</button>
          <div id="cashRiceQty" class="qty-value">0</div>
          <button type="button" onclick="changeCashQty('rice',1)">＋</button>
        </div>
      </div>

      <div class="cash-item">
        <strong>胡麻団子</strong>
        <div id="sesamePriceLabel" class="small">-円/個</div>
        <div class="qty-row">
          <button type="button" onclick="changeCashQty('sesame',-1)">−</button>
          <div id="cashSesameQty" class="qty-value">0</div>
          <button type="button" onclick="changeCashQty('sesame',1)">＋</button>
        </div>
      </div>
    </div>

    <div id="cashTotal" class="cash-total">合計 0円</div>
    <button id="cashOrderButton" onclick="recordCashOrder()">現金会計を確定</button>
    <div id="cashOrderMessage" class="small"></div>
  </div>

  <h2 style="margin-top:24px">QR商品交換</h2>
<button
    id="scanButton"
    onclick="startScanner()"
    style="display:none;"
  >
    QRコードを読み取る
  </button>

  <button
    id="stopButton"
    onclick="stopScanner()"
    style="display:none;"
  >
    スキャンを停止
  </button>

  <div id="reader"></div>

  <div id="result">
    まだQRコードは読み取られていません。
  </div>

  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let scanner = null;
    let scannerBusy = false;


    async function getCurrentUser() {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      return user;
    }


    async function checkRegisterPermission() {

      const status =
        document.getElementById("registerStatus");

      const scanButton =
        document.getElementById("scanButton");

      const user = await getCurrentUser();

      if (!user) {
        location.href = "home.html";
        return false;
      }

      const { data: allowed, error } =
        await supabaseClient.rpc("is_current_register");

      if (error) {
        scanButton.style.display = "none";
        status.textContent =
          "レジ権限を確認できませんでした。";
        return false;
      }

      if (!allowed) {
        scanButton.style.display = "none";
        status.textContent =
          "レジ勤務中または管理者のみ利用できます。";
        return false;
      }

      scanButton.style.display =
        scanner ? "none" : "block";

      status.textContent =
        "🟢 レジ利用可能";

      return true;
    }

    async function startScanner() {

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        const result =
          document.getElementById(
            "result"
          );

        result.className =
          "warning";

        result.innerHTML =
          "レジ勤務中のスタッフだけ使用できます。";

        return;
      }

      if (
        scanner ||
        scannerBusy
      ) {
        return;
      }

      scannerBusy = true;

      try {

        scanner =
          new Html5Qrcode(
            "reader"
          );

        document.getElementById(
          "scanButton"
        ).style.display =
          "none";

        document.getElementById(
          "stopButton"
        ).style.display =
          "block";

        const result =
          document.getElementById(
            "result"
          );

        result.className = "";
        result.textContent =
          "QRコードをカメラにかざしてください。";

        await scanner.start(
          {
            facingMode:
              "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          async function(
            decodedText
          ) {

            if (scannerBusy) {
              return;
            }

            scannerBusy = true;

            try {

              await stopScanner(
                false
              );

              await checkTicket(
                decodedText
              );

            } finally {

              scannerBusy = false;
            }
          },

          function() {
          }
        );

      } catch (error) {

        scanner = null;

        document.getElementById(
          "stopButton"
        ).style.display =
          "none";

        const result =
          document.getElementById(
            "result"
          );

        result.className =
          "invalid";

        result.innerHTML = `
          <h2>⚠️ カメラエラー</h2>
          <p>${error.message}</p>
        `;

        await checkRegisterPermission();

      } finally {

        scannerBusy = false;
      }
    }


    async function stopScanner(
      refreshPermission = true
    ) {

      if (!scanner) {

        document.getElementById(
          "stopButton"
        ).style.display =
          "none";

        if (refreshPermission) {
          await checkRegisterPermission();
        }

        return;
      }

      const currentScanner =
        scanner;

      scanner = null;

      try {

        await currentScanner.stop();

      } catch (error) {
      }

      try {

        await currentScanner.clear();

      } catch (error) {
      }

      document.getElementById(
        "stopButton"
      ).style.display =
        "none";

      if (refreshPermission) {
        await checkRegisterPermission();
      }
    }


    async function checkTicket(
      ticketCode
    ) {

      const resultBox =
        document.getElementById(
          "result"
        );

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⛔ 使用できません</h2>
          <p>
            現在レジ勤務中ではありません。
          </p>
        `;

        return;
      }

      resultBox.className = "";

      resultBox.innerHTML =
        "チケットを確認しています...";

      const {
        data,
        error
      } =
        await supabaseClient
          .from("tickets")
          .select("*")
          .eq(
            "ticket_code",
            ticketCode
          )
          .maybeSingle();

      if (error) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⚠️ エラー</h2>
          <p>${error.message}</p>
          <button onclick="startScanner()">
            もう一度読み取る
          </button>
        `;

        return;
      }

      if (!data) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>❌ 無効なチケット</h2>
          <p>
            登録されていないチケットです。
          </p>
          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (
        data.status === "active"
      ) {

        resultBox.className =
          "valid";

        resultBox.innerHTML = `
          <h2>🟢 有効</h2>

          <p>
            <strong>商品</strong><br>
            ${data.product_name}
          </p>

          <p>
            <strong>販売者</strong><br>
            ${data.seller_name}
          </p>

          <p>
            <strong>購入者</strong><br>
            ${data.buyer_name ?? "未登録"}
          </p>

          <p>
            <strong>チケットID</strong><br>
            ${data.ticket_code}
          </p>

          <div class="subcard">
            <strong>交換する商品を選択</strong><br><br>
            <button id="useRiceButton" onclick="useTicket('${data.ticket_code}','fried_rice')">
              🍚 炒飯1個と交換
            </button>
            <button id="useSesameButton" onclick="useTicket('${data.ticket_code}','sesame_pair')">
              ● 胡麻団子2個と交換
            </button>
            <div id="registerPriceInfo" class="small">現在価格を確認しています...</div>
          </div>

          <button onclick="startScanner()">
            キャンセルして次を読む
          </button>
        `;

        await showRegisterPriceInfo();
        return;
      }

      if (
        data.status === "used"
      ) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>🔴 使用済み</h2>

          <p>
            ${data.product_name}
          </p>

          <p>
            チケットID：
            ${data.ticket_code}
          </p>

          <p class="small">
            ${
              data.used_at
                ? new Date(
                    data.used_at
                  ).toLocaleString(
                    "ja-JP"
                  )
                : ""
            }
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (
        data.status === "pending"
      ) {

        resultBox.className =
          "warning";

        resultBox.innerHTML = `
          <h2>🟡 受け取り待ち</h2>

          <p>
            購入者側で受け取りが完了していません。
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      resultBox.className =
        "invalid";

      resultBox.innerHTML = `
        <h2>⛔ 無効</h2>

        <p>
          このチケットは使用できません。
        </p>

        <button onclick="startScanner()">
          次のQRを読み取る
        </button>
      `;
    }



    async function showRegisterPriceInfo() {
      const box = document.getElementById("registerPriceInfo");
      if (!box) return;
      const { data } = await supabaseClient.from("menu_state").select("*").eq("id",1).maybeSingle();
      if (!data) return;
      const pair = data.sesame_pair_enabled && data.sesame_pair_price != null
        ? data.sesame_pair_price : data.sesame_single_price * 2;
      const riceRefund = Math.max(450 - data.fried_rice_price,0);
      const sesameRefund = Math.max(450 - pair,0);
      box.innerHTML = `
        炒飯：${data.fried_rice_price}円${riceRefund ? ` → <strong>${riceRefund}円返金</strong>` : ""}<br>
        胡麻団子2個：${pair}円${sesameRefund ? ` → <strong>${sesameRefund}円返金</strong>` : ""}
      `;
      const rb=document.getElementById("useRiceButton"), sb=document.getElementById("useSesameButton");
      if(rb && data.fried_rice_status==='sold_out'){ rb.disabled=true; rb.textContent='🍚 炒飯 売り切れ'; }
      if(sb && data.sesame_status==='sold_out'){ sb.disabled=true; sb.textContent='● 胡麻団子 売り切れ'; }
    }

    async function useTicket(
      ticketCode,
      item
    ) {
      const pickup=
        document.getElementById("pickupNumber").value.trim();

      if(!pickup){
        alert("受け取り番号を入力してください。");
        document.getElementById("pickupNumber").focus();
        return;
      }

      const resultBox =
        document.getElementById(
          "result"
        );

      const useButton = document.getElementById(item === "fried_rice" ? "useRiceButton" : "useSesameButton");
      document.querySelectorAll("#useRiceButton,#useSesameButton").forEach((button) => button.disabled = true);

      const allowed =
        await checkRegisterPermission();

      if (!allowed) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⛔ 使用できません</h2>
          <p>
            現在レジ勤務中ではありません。
          </p>
        `;

        return;
      }

      resultBox.className = "";
      resultBox.innerHTML =
        "使用処理中...";

      const { data: rpcData, error } = await supabaseClient.rpc("use_ticket_and_record_order", {
        p_ticket_code: ticketCode,
        p_item: item,
        p_pickup_number: pickup
      });
      const data = rpcData?.[0] || null;

      if (error) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>⚠️ エラー</h2>
          <p>${error.message}</p>
          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      if (!data) {

        resultBox.className =
          "invalid";

        resultBox.innerHTML = `
          <h2>🔴 使用できません</h2>

          <p>
            すでに使用済み、
            または無効なチケットです。
          </p>

          <button onclick="startScanner()">
            次のQRを読み取る
          </button>
        `;

        return;
      }

      const user =
        await getCurrentUser();

      let staffName =
        "受付スタッフ";

      if (user) {

        const {
          data: staff
        } =
          await supabaseClient
            .from("staff_members")
            .select("staff_name")
            .eq(
              "user_id",
              user.id
            )
            .maybeSingle();

        if (staff?.staff_name) {
          staffName =
            staff.staff_name;
        }
      }

      const {
        error: logError
      } =
        await supabaseClient
          .from("ticket_logs")
          .insert({
            ticket_code:
              data.ticket_code,
            action:
              "used",
            actor_id:
              user?.id ?? null,
            actor_name:
              staffName
          });

      resultBox.className =
        "valid";

      resultBox.innerHTML = `
        <h2>✅ 使用完了</h2>

        <p>
          ${data.redemption_item === "fried_rice" ? "炒飯1個" : "胡麻団子2個"}
        </p>

        <p><strong>当日価格：</strong>${data.redemption_price}円</p>
        ${data.cashback_amount > 0 ? `<p class="warning"><strong>💴 ${data.cashback_amount}円を購入者へ返金してください</strong></p>` : `<p>追加返金なし</p>`}

        <p>
          ${new Date(
            data.used_at
          ).toLocaleString(
            "ja-JP"
          )}
        </p>

        ${
          logError
            ? `
              <p class="small">
                ※使用処理は完了しましたが、
                操作履歴の保存に失敗しました。
              </p>
            `
            : ""
        }

        <button onclick="startScanner()">
          次のQRを読み取る
        </button>

        <button
          onclick="
            location.href='home.html'
          "
        >
          🏠 ポータルに戻る
        </button>
      `;
    }



    let cashRice=0;
    let cashSesame=0;
    let registerMenu={
      rice:500,
      sesameSingle:300,
      sesamePair:500,
      pairEnabled:true
    };

    function changeCashQty(kind,delta){
      if(kind==="rice") cashRice=Math.max(0,cashRice+delta);
      if(kind==="sesame") cashSesame=Math.max(0,cashSesame+delta);
      renderCashOrder();
    }

    function cashSesameAmount(qty){
      // 現金販売は1個単価×個数。
      // 2個セット価格はQR交換時の価値判定用として扱う。
      return qty * registerMenu.sesameSingle;
    }

    function renderCashOrder(){
      const r=document.getElementById("cashRiceQty");
      const s=document.getElementById("cashSesameQty");
      if(r) r.textContent=cashRice;
      if(s) s.textContent=cashSesame;

      const total=
        cashRice*registerMenu.rice+
        cashSesameAmount(cashSesame);

      const t=document.getElementById("cashTotal");
      if(t) t.textContent=`合計 ${total.toLocaleString()}円`;

      const b=document.getElementById("cashOrderButton");
      if(b) b.disabled=(cashRice+cashSesame===0);
    }

    async function loadCashOrderSettings(){
      const {data:menu}=await supabaseClient
        .from("menu_state")
        .select("*")
        .eq("id",1)
        .maybeSingle();

      if(menu){
        registerMenu.rice=Number(menu.fried_rice_price||500);
        registerMenu.sesameSingle=Number(menu.sesame_single_price||300);
        registerMenu.sesamePair=Number(
          menu.sesame_pair_enabled && menu.sesame_pair_price!=null
            ? menu.sesame_pair_price
            : (menu.sesame_single_price||300)*2
        );
        registerMenu.pairEnabled=!!menu.sesame_pair_enabled;

        document.getElementById("ricePriceLabel").textContent=
          `${registerMenu.rice}円`;
        document.getElementById("sesamePriceLabel").textContent=
          `${registerMenu.sesameSingle}円/個`;
      }

      const {data:team}=await supabaseClient.rpc("my_register_team");
      const row=team?.[0];
      document.getElementById("myRegisterLabel").textContent=
        row ? `${row.team_name}で会計中` : "レジチーム未設定";

      renderCashOrder();
    }

    async function recordCashOrder(){
      const msg=document.getElementById("cashOrderMessage");
      const btn=document.getElementById("cashOrderButton");

      const pickup=document.getElementById("pickupNumber").value.trim();
      if(!pickup){
        msg.textContent="受け取り番号を入力してください。";
        document.getElementById("pickupNumber").focus();
        return;
      }

      if(cashRice+cashSesame<=0){
        msg.textContent="商品数を入力してください。";
        return;
      }

      const total=
        cashRice*registerMenu.rice+
        cashSesameAmount(cashSesame);

      btn.disabled=true;
      msg.textContent="会計を記録しています...";

      const {data,error}=await supabaseClient.rpc(
        "record_cash_order",
        {
          p_rice:cashRice,
          p_sesame:cashSesame,
          p_cash_amount:total,
          p_pickup_number:pickup
        }
      );

      if(error){
        msg.textContent="エラー："+error.message;
        renderCashOrder();
        return;
      }

      msg.textContent=`✅ 注文 #${data} を送信しました`;
      cashRice=0;
      cashSesame=0;
      document.getElementById("pickupNumber").value="";
      renderCashOrder();

      setTimeout(()=>{msg.textContent="";},2200);
    }



    let menuStateChannel = null;

    async function refreshRegisterPrices(){
      await loadCashOrderSettings();
      await showRegisterPriceInfo();
    }

    function startMenuStateRealtime(){
      if(menuStateChannel) return;

      menuStateChannel =
        supabaseClient
          .channel("register-menu-state")
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "menu_state",
              filter: "id=eq.1"
            },
            async () => {
              await refreshRegisterPrices();
            }
          )
          .subscribe();
    }

    // アプリへ戻った時も最新価格を取得
    document.addEventListener(
      "visibilitychange",
      async () => {
        if(document.visibilityState === "visible"){
          await refreshRegisterPrices();
        }
      }
    );

    window.addEventListener(
      "focus",
      refreshRegisterPrices
    );


    async function initialize() {

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (!session) {
        location.href = "home.html";
        return;
      }

      await checkRegisterPermission();
      await loadCashOrderSettings();
      await showRegisterPriceInfo();
      startMenuStateRealtime();
    }


    window.addEventListener(
      "pagehide",
      () => {

        if (scanner) {

          try {
            scanner.stop();
          } catch (error) {
          }
        }
      }
    );


    initialize();

  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>
