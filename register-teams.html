<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レジチーム</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🧾 レジチーム</h1></header><main><div class="card"><h2>チーム編成</h2><p class="small">最大3チーム・各チーム最低2人。編成変更時刻から新しい均等割りになります。</p><label>スタッフ<select id="staff"></select></label><label>派遣先<select id="team"><option value="1">レジ1</option><option value="2">レジ2</option><option value="3">レジ3</option></select></label><button class="primary" id="assign">レジへ派遣</button><button id="release">売り子へ戻す</button><div id="msg"></div></div><div class="card"><h2>現在の編成</h2><div id="teams"></div></div><div class="card"><h2>レジ会計</h2><label>自分のチーム<select id="checkoutTeam"><option value="1">レジ1</option><option value="2">レジ2</option><option value="3">レジ3</option></select></label><button class="primary" id="checkout">会計完了 +1</button><div id="checkoutMsg"></div></div><button onclick="location.href='home.html'">ポータルへ戻る</button></main><script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){const {data:s}=await sb.from('staff_members').select('user_id,staff_name').eq('is_active',true).order('staff_name');staff.innerHTML=(s||[]).map(x=>`<option value="${x.user_id}">${x.staff_name}</option>`).join('');const {data:m,error}=await sb.from('register_team_memberships').select('team_id,user_id,started_at').is('ended_at',null).order('team_id');if(error){teams.textContent=error.message;return}const map=new Map((s||[]).map(x=>[x.user_id,x.staff_name]));teams.innerHTML=[1,2,3].map(t=>`<div class="row"><b>レジ${t}</b><br>${(m||[]).filter(x=>x.team_id===t).map(x=>map.get(x.user_id)||x.user_id).join('・')||'未編成'}</div>`).join('')}assign.onclick=async()=>{const {error}=await sb.rpc('assign_register_member',{p_user:staff.value,p_team:+team.value});msg.textContent=error?'エラー：'+error.message:'✅ 派遣しました';if(!error)load()};release.onclick=async()=>{const {error}=await sb.rpc('release_register_member',{p_user:staff.value});msg.textContent=error?'エラー：'+error.message:'✅ 売り子へ戻しました';if(!error)load()};checkout.onclick=async()=>{const {error}=await sb.rpc('record_register_checkout',{p_team_id:+checkoutTeam.value});checkoutMsg.textContent=error?'エラー：'+error.message:'✅ 会計を記録しました'};load();</script></body></html>
