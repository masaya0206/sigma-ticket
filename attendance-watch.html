<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勤怠確認 | シグマ祭</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#292021;background:#f7f4f2}*{box-sizing:border-box}body{margin:0}header{background:#b5121b;color:white;padding:22px 16px}main{max-width:760px;margin:auto;padding:16px}a{color:inherit}h1{font-size:23px;margin:0 0 5px}.panel{background:#fff;border:1px solid #e6dbdb;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:10px;border:1px solid #d6c8c8;border-radius:9px}button{background:#b5121b;color:white;border:0;font-weight:650;cursor:pointer}.muted{color:#71696b;font-size:13px}.item{border-bottom:1px solid #eee;padding:12px 0}.item:last-child{border:0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.alert{color:#b5121b;font-weight:bold}.label{font-size:13px;color:#666}input{max-width:100%}#msg{white-space:pre-wrap}small{color:#6a6262}</style></head><body><header><h1>出勤・退勤確認</h1><a href="manager.html">← 店長画面</a></header><main><div class="panel"><div class="row"><label>対象日 <input id="day" type="date"></label><button id="reload">再読み込み</button></div><p class="muted">30秒ごとに自動更新。出勤予定時刻を過ぎた未出勤者と、退勤予定を過ぎても勤務中のスタッフだけ表示します。</p><div id="msg" class="muted"></div></div><div class="panel"><h2>出勤待ち <span id="inCount">0</span>人</h2><div id="missing"></div></div><div class="panel"><h2>退勤確認 <span id="outCount">0</span>人</h2><div id="overdue"></div></div><div class="panel"><h2>勤務中・延長可能 <span id="workingCount">0</span>人</h2><div id="working"></div></div><p class="muted">延長は元のシフト・実際の出退勤・ポイントを変更しません。実際の退勤処理は別途必要です。通信できないときは最新状況を表示できません。</p></main><script>
const sb=supabase.createClient('https://gsniytemgrbtgfywhqlu.supabase.co','sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn');
const $=id=>document.getElementById(id);const fmt=t=>new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});const dt=t=>new Date(t);
const dayJST=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];let busy=false;
function draw(){const missing=rows.filter(x=>x.status==='not_arrived'),overdue=rows.filter(x=>x.status==='overtime');$('inCount').textContent=missing.length;$('outCount').textContent=overdue.length;const working=rows.filter(x=>x.status==='working');$('workingCount').textContent=working.length;
 $('missing').innerHTML=missing.length?missing.map(x=>`<div class="item"><strong>${esc(x.name)}</strong> <span class="alert">未出勤</span><div class="label">${esc(x.role)} ・ ${fmt(x.starts_at)}〜${fmt(x.original_end)}</div><small>開始から${Math.max(0,Math.floor((Date.now()-dt(x.starts_at))/60000))}分</small></div>`).join(''):'<p class="muted">該当者はいません</p>';
 $('overdue').innerHTML=overdue.length?overdue.map((x,i)=>`<div class="item"><strong>${esc(x.name)}</strong> <span class="alert">退勤予定超過</span><div class="label">${esc(x.role)} ・ ${fmt(x.starts_at)}〜${fmt(x.effective_end)}（元の終了 ${fmt(x.original_end)}）</div><small>${Math.max(0,Math.floor((Date.now()-dt(x.effective_end))/60000))}分超過</small><div class="row"><label>新しい終了予定 <input type="time" data-time="${i}" value="${fmt(new Date(Math.max(Date.now()+3600000,dt(x.effective_end).getTime()+3600000))).replace(/[^0-9:]/g,'')}"></label><button data-extend="${i}">延長する</button></div></div>`).join(''):'<p class="muted">該当者はいません</p>';
 $('overdue').querySelectorAll('[data-extend]').forEach(b=>b.onclick=()=>extend(overdue[Number(b.dataset.extend)],b));
 $('working').innerHTML=working.length?working.map((x,i)=>`<div class="item"><strong>${esc(x.name)}</strong><div class="label">${esc(x.role)} ・終了予定 ${fmt(x.effective_end)}</div><div class="row"><label>延長後 <input type="time" value="${fmt(new Date(dt(x.effective_end).getTime()+3600000))}"></label><button data-working="${i}">延長する</button></div></div>`).join(''):'<p class="muted">該当者はいません</p>';
 $('working').querySelectorAll('[data-working]').forEach(b=>b.onclick=()=>extend(working[Number(b.dataset.working)],b));}
async function load(){if(busy)return;busy=true;try{const {data,error}=await sb.rpc('manager_shift_attendance_watch',{p_day:$('day').value});if(error)throw error;rows=data.items||[];draw();$('msg').textContent='最終更新：'+new Date(data.server_now).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'});}catch(e){$('msg').textContent='取得できません：'+e.message+'（最新状態ではありません）';}finally{busy=false;}}
async function extend(row,btn){const t=btn.parentElement.querySelector('input').value;if(!t){alert('時刻を選んでください');return;}const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(dt(row.effective_end));const newEnd=new Date(`${date}T${t}:00+09:00`);if(!(newEnd>dt(row.effective_end))){alert('現在の終了予定より後の時刻を指定してください');return;}const reason=prompt('延長理由を入力してください','本人希望による延長');if(reason===null)return;if(!confirm(`${row.name}さんの退勤予定を${t}に延長しますか？`))return;btn.disabled=true;try{const {error}=await sb.rpc('manager_extend_shift_attendance',{p_source:row.source,p_assignment_id:row.assignment_id,p_new_end:newEnd.toISOString(),p_reason:reason});if(error)throw error;await load();}catch(e){alert('延長に失敗：'+e.message);}finally{btn.disabled=false;}}
$('day').value=dayJST();$('reload').onclick=load;load();setInterval(()=>{if(!document.hidden)load()},30000);
</script></body></html>
