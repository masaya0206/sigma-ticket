<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>希望シフト調整</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --red:#b5121b;--red2:#8f0e15;--bg:#f7f4f2;--line:#e9e1dd;--ink:#1c1c1e;--muted:#6e6e73;
  --manager:#8b5cf6;--register:#3b82f6;--cook:#ef5350;--support:#34a853;
  --shopping_helper:#22a6b3;--shopping_driver:#6366f1;--seller:#d9a40e;
  --namew:178px;--pxpermin:1.55px;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;padding:26px 18px 22px;border-radius:0 0 26px 26px}
header h1{font-size:24px;margin:0}header p{margin:7px 0 0;font-size:13px;opacity:.9}
main{max-width:1180px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 6px 20px rgba(74,25,25,.055)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.field{min-width:150px;flex:1}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}
select,input,button{font:inherit}
select,input{width:100%;border:1px solid #d9d1cd;border-radius:11px;padding:10px 11px;background:#fff;color:var(--ink)}
button{border:0;border-radius:12px;padding:11px 14px;background:#f5efed;color:var(--red);font-weight:900;cursor:pointer}
button.primary{background:var(--red);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:11px;color:var(--muted);line-height:1.55}
.status{font-size:12px;font-weight:800;min-height:18px}.ok{color:#15803d}.warn{color:#9a6700}.err{color:#b00020}
.legend{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:800}
.dot{width:10px;height:10px;border-radius:3px}
.editor-shell{padding:0;overflow:hidden}
.editor-topline{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.editor-wrap{overflow:auto;max-height:72vh;position:relative;background:#fff}
.timeline{position:relative;min-width:100%;width:max-content}
.time-header{height:43px;display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:24;width:var(--namew);min-width:var(--namew);padding:13px 10px;font-size:12px;font-weight:900;background:#fff;border-right:1px solid var(--line)}
.time-track{position:relative;height:43px}
.hour-label{position:absolute;top:0;height:43px;border-left:1px solid #ddd;padding:11px 0 0 5px;font-size:11px;color:#5f6368;white-space:nowrap}
.half-line{position:absolute;top:0;bottom:0;border-left:1px dashed #eee}
.group-row{display:flex;min-height:42px;border-bottom:1px solid #efe8e5;background:#faf7f5}
.group-name{position:sticky;left:0;z-index:12;width:var(--namew);min-width:var(--namew);padding:7px 8px;font-weight:950;font-size:12px;background:#faf7f5;border-right:1px solid var(--line)}
.group-name-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.group-sort{width:auto;min-width:88px;max-width:112px;padding:5px 6px;margin:0;border-radius:8px;font-size:9px;font-weight:800;background:#fff}
.group-track{height:42px;position:relative}
.person-row{display:flex;min-height:58px;border-bottom:1px solid #f0ece9}
.person-name{position:sticky;left:0;z-index:11;width:var(--namew);min-width:var(--namew);background:#fff;border-right:1px solid var(--line);padding:7px 9px}
.person-name b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-name .pref{display:block;color:var(--muted);font-size:8.5px;line-height:1.45;margin-top:3px;white-space:normal}
.person-track{height:58px;position:relative;background-image:linear-gradient(to right,rgba(0,0,0,.035) 1px,transparent 1px);background-size:calc(60 * var(--pxpermin)) 100%}
.hope-range{position:absolute;top:4px;height:50px;background:rgba(21,128,61,.045);border:1px dashed rgba(21,128,61,.28);border-radius:7px;pointer-events:none}
.segbar{position:absolute;top:14px;height:30px;border-radius:8px;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;white-space:nowrap;overflow:visible;touch-action:none;user-select:none;cursor:grab}
.segbar.selected{outline:3px solid rgba(181,18,27,.30);outline-offset:2px;z-index:8}
.seg-label{pointer-events:none;overflow:hidden;text-overflow:ellipsis;padding:0 13px;max-width:100%}
.handle{position:absolute;top:0;width:12px;height:100%;cursor:ew-resize;z-index:3}
.handle.left{left:0}.handle.right{right:0}
.handle:after{content:"";position:absolute;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.82);border-radius:2px}
.handle.left:after{left:4px}.handle.right:after{right:4px}
.role-manager{background:var(--manager)}.role-register{background:var(--register)}.role-cook{background:var(--cook)}
.role-support{background:var(--support)}.role-shopping_helper{background:var(--shopping_helper)}
.role-shopping_driver{background:var(--shopping_driver)}.role-seller{background:var(--seller)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 36px rgba(0,0,0,.16);padding:12px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.2s ease;max-height:80vh;overflow:auto}
.sheet.open{transform:translateY(0)}
.sheet-grab{width:44px;height:5px;background:#ccc;border-radius:999px;margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.sheet-head h2{font-size:18px;margin:0}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sheet .actions button{width:100%}
.cover{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:90;display:none}.cover.open{display:block}
.warningbox{border:1px solid #f0d59a;background:#fff8e8;border-radius:13px;padding:10px;margin-top:10px;font-size:11px;line-height:1.55}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.summary div{background:#faf7f5;border-radius:10px;padding:8px;text-align:center}.summary b{display:block;font-size:18px}.summary span{font-size:9px;color:var(--muted)}
.note-box{background:#f7fbff;border:1px solid #d8e8f5;border-radius:13px;padding:10px;margin-top:10px;font-size:11px;line-height:1.6;color:#4b5563}
.split-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:end}
@media(max-width:700px){
 :root{--namew:145px;--pxpermin:1.35px}
 main{padding:10px}
 .toolbar{display:grid;grid-template-columns:1fr 1fr}
 .toolbar .field{min-width:0}
 .toolbar button{width:100%}
 .summary{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<header>
  <h1>✏️ 希望シフト調整</h1>
  <p>提出された参加可能時間と希望職種だけを使って、管理者がシフトを組みます。</p>
</header>

<main>
  <div class="card">
    <div class="toolbar">
      <div class="field"><label>対象日</label><select id="daySelect"></select></div>
      <div class="field"><label>調整単位</label><select id="snapSelect"><option value="15">15分</option><option value="30" selected>30分</option></select></div>
      <div class="field"><label>表示倍率</label><select id="zoomSelect"><option value="1.05">コンパクト</option><option value="1.35" selected>標準</option><option value="1.75">拡大</option></select></div>
      <button id="undoBtn">↶ 元に戻す</button>
      <button id="resetBtn">↺ 希望から作り直す</button>
      <button class="primary" id="saveBtn">💾 この日のシフトを保存</button>
    </div>
    <div id="status" class="status"></div>
    <div id="summary" class="summary"></div>
    <div class="legend" id="legend"></div>
    <div class="note-box">
      初期配置だけ「第1希望」を使います。微調整後は全役職を保存でき、第1〜第3希望に入っていない役職でも再読込後そのまま残ります。希望職種は参考表示にだけ使います。重複した参加可能時間は自動で1本に統合します。
    </div>
  </div>

  <div class="card editor-shell">
    <div class="editor-topline"><b>スタッフ別タイムライン</b><span class="small">左：名前・希望 / 横：時間 / 色：現在の役職</span></div>
    <div class="editor-wrap"><div id="timeline" class="timeline"><div class="empty">読み込み中...</div></div></div>
  </div>

  <div class="card"><button onclick="location.href='event-admin.html'">← シフト管理へ戻る</button></div>
</main>

<div id="cover" class="cover"></div>
<div id="sheet" class="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div><h2 id="sheetTitle">シフト詳細</h2><div id="sheetSub" class="small"></div></div>
    <button id="closeSheet" style="width:auto">×</button>
  </div>
  <div id="prefText" class="note-box"></div>
  <div class="sheet-grid">
    <div class="field"><label>役職</label><select id="editRole"></select></div>
    <div class="field"><label>開始</label><input id="editStart" type="time" step="900"></div>
    <div class="field"><label>終了</label><input id="editEnd" type="time" step="900"></div>
  </div>
  <div id="sheetWarning"></div>

  <div class="split-row">
    <div class="field"><label>この時刻で区切る</label><input id="splitTime" type="time" step="900"></div>
    <button id="splitSeg">区切る</button>
  </div>

  <div class="actions">
    <button id="deleteSeg">削除</button>
    <button class="primary" id="applyEdit">変更を反映</button>
  </div>
</div>

<script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");

const roles=[
  ["manager","店長"],["register","レジ"],["cook","調理"],["support","サポート"],
  ["shopping_helper","買い出し補助"],["shopping_driver","ドライバー"],["seller","売り子"]
];
const roleLabel=Object.fromEntries(roles);
const roleOrder=roles.map(x=>x[0]);
const roleColor={manager:"#8b5cf6",register:"#3b82f6",cook:"#ef5350",support:"#34a853",shopping_helper:"#22a6b3",shopping_driver:"#6366f1",seller:"#d9a40e"};

let days=[],staff=[],availability=[],prefs={},draft=[],history=[],selectedId=null,pxPerMin=1.35;
const groupSorts=Object.fromEntries(roleOrder.map(r=>[r,"name"]));

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function currentDay(){return days.find(x=>String(x.id)===String(daySelect.value));}
function staffName(uid){return staff.find(x=>x.user_id===uid)?.staff_name||uid;}
function prefFor(uid){return prefs[uid]||{};}
function allowedRoles(uid){const p=prefFor(uid);return [p.first_role,p.second_role,p.third_role].filter(Boolean);}
function prefLabel(uid){const xs=allowedRoles(uid).map((r,i)=>`${i+1}.${roleLabel[r]||r}`);return xs.length?xs.join(" / "):"希望職種未提出";}
function firstRole(uid){return prefFor(uid).first_role||null;}
function ms(v){return new Date(v).getTime();}
function iso(v){return new Date(v).toISOString();}
function minDiff(a,b){return (ms(b)-ms(a))/60000;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function snapMs(t){const step=Number(snapSelect.value||30)*60000;return Math.round(t/step)*step;}
function fmtTime(v){return new Date(v).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});}
function localTimeValue(v){const d=new Date(v);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function timeOnDay(hm){const b=new Date(currentDay().starts_at);const [h,m]=hm.split(":").map(Number);b.setHours(h,m,0,0);return b.getTime();}
function makeKey(){return "local-"+Date.now()+"-"+Math.random().toString(16).slice(2);}
function dayBounds(){return {start:ms(currentDay().starts_at),end:ms(currentDay().ends_at)};}
function availForUser(uid){return availability.filter(x=>x.user_id===uid);}

function mergedAvailabilityForUser(uid){
  const xs=availForUser(uid)
    .map(a=>({start:ms(a.available_from),end:ms(a.available_to)}))
    .filter(x=>x.end>x.start)
    .sort((a,b)=>a.start-b.start);

  const merged=[];
  for(const cur of xs){
    if(!merged.length || cur.start>merged[merged.length-1].end){
      merged.push({...cur});
    }else{
      merged[merged.length-1].end=Math.max(merged[merged.length-1].end,cur.end);
    }
  }
  return merged;
}

function planForUser(uid){return draft.filter(x=>x.user_id===uid).sort((a,b)=>ms(a.starts_at)-ms(b.starts_at));}
function isWithinAvailability(seg){
  return mergedAvailabilityForUser(seg.user_id)
    .some(a=>ms(seg.starts_at)>=a.start&&ms(seg.ends_at)<=a.end);
}

function normalizeSavedSegments(rows){
  const sorted=(rows||[]).map(x=>({...x,_key:String(x.id)}))
    .sort((a,b)=>String(a.user_id).localeCompare(String(b.user_id))
      || String(a.role).localeCompare(String(b.role))
      || ms(a.starts_at)-ms(b.starts_at)
      || ms(a.ends_at)-ms(b.ends_at));

  const out=[];
  for(const cur of sorted){
    const prev=out[out.length-1];
    if(prev
      && prev.user_id===cur.user_id
      && prev.role===cur.role
      && ms(cur.starts_at)<=ms(prev.ends_at)){
      prev.ends_at=iso(Math.max(ms(prev.ends_at),ms(cur.ends_at)));
      continue;
    }
    out.push({...cur});
  }
  return out;
}
function hasOverlap(seg,key=null){return draft.some(x=>x.user_id===seg.user_id&&(x._key||String(x.id))!==key&&ms(x.starts_at)<ms(seg.ends_at)&&ms(x.ends_at)>ms(seg.starts_at));}
function validateSegment(seg,key=null){
  const b=dayBounds();
  if(ms(seg.starts_at)>=ms(seg.ends_at))return "終了は開始より後にしてください。";
  if(ms(seg.starts_at)<b.start||ms(seg.ends_at)>b.end)return "開催時間の外には配置できません。";
  if(!isWithinAvailability(seg))return "本人の参加可能時間の外です。";
  if(!roleOrder.includes(seg.role))return "役職が不正です。";
  if(hasOverlap(seg,key))return "同じスタッフの別区間と重なっています。";
  return "";
}
function setOk(t){status.className="status ok";status.textContent=t}
function setErr(t){status.className="status err";status.textContent=t}
function setDirty(t="未保存の変更があります"){status.className="status warn";status.textContent=t}
function pushHistory(){history.push(clone(draft));if(history.length>40)history.shift();undoBtn.disabled=history.length===0;}

async function requireAdmin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){location.href="home.html";return false}
  const {data,error}=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error)throw error;
  if(!data){document.body.innerHTML="<main><div class='card'>管理者権限が必要です。</div></main>";return false}
  return true;
}

async function loadBase(){
  const [d,s,p]=await Promise.all([
    sb.from("event_days").select("*").eq("is_enabled",true).order("id"),
    sb.from("staff_members").select("user_id,staff_name,is_active").eq("is_active",true).order("staff_name"),
    sb.rpc("admin_staff_role_preferences")
  ]);
  if(d.error)throw d.error;if(s.error)throw s.error;if(p.error)throw p.error;
  days=d.data||[];staff=s.data||[];prefs=Object.fromEntries((p.data||[]).map(x=>[x.user_id,x]));
  daySelect.innerHTML=days.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join("");
}

function buildFromHope(){
  const rows=[];
  const users=[...new Set(availability.map(a=>a.user_id))];

  for(const uid of users){
    const role=firstRole(uid);
    if(!role)continue;

    for(const a of mergedAvailabilityForUser(uid)){
      rows.push({
        id:null,_key:makeKey(),event_day_id:+daySelect.value,user_id:uid,
        role,
        starts_at:iso(a.start),ends_at:iso(a.end)
      });
    }
  }

  return rows.sort((a,b)=>
    staffName(a.user_id).localeCompare(staffName(b.user_id),"ja")
    || ms(a.starts_at)-ms(b.starts_at)
  );
}

async function loadDay(){
  const d=currentDay();if(!d)return;
  status.textContent="読み込み中...";
  const [a,m]=await Promise.all([
    sb.from("staff_availability").select("id,user_id,event_day_id,available_from,available_to,note").eq("event_day_id",d.id).order("available_from"),
    sb.from("shift_manual_assignments").select("*").eq("event_day_id",d.id).order("starts_at")
  ]);
  if(a.error)throw a.error;if(m.error)throw m.error;
  availability=a.data||[];
  // 保存済みの手動配置は本人の希望職種に関係なく、そのまま復元する。
  // 希望職種は初期配置・参考表示にだけ使う。
  const saved=normalizeSavedSegments(m.data||[]);
  draft=saved.length
    ? saved.map(x=>({...x,role:String(x.role)}))
    : buildFromHope();

  history=[];undoBtn.disabled=true;selectedId=null;
  setOk(saved.length
    ?"保存済みの手動シフトをそのまま読み込みました。希望外の役職も保持します。"
    :"希望提出から編集用シフトを作成しました。まだ未保存です。");
  render();
}

function groupRole(uid){
  const segs=planForUser(uid);
  if(!segs.length)return firstRole(uid)||"seller";
  const totals={}, earliest={};
  for(const r of roleOrder){totals[r]=0;earliest[r]=Number.POSITIVE_INFINITY}
  for(const s of segs){
    const dur=Math.max(0,minDiff(s.starts_at,s.ends_at));
    totals[s.role]=(totals[s.role]||0)+dur;
    const st=ms(s.starts_at);
    if(st<earliest[s.role])earliest[s.role]=st;
  }
  let best=firstRole(uid)||segs[0].role||"seller";
  for(const r of roleOrder){
    const tb=totals[best]||0, tr=totals[r]||0;
    if(tr>tb)best=r;
    else if(tr===tb && tr>0){
      const eb=earliest[best]||Number.POSITIVE_INFINITY, er=earliest[r]||Number.POSITIVE_INFINITY;
      if(er<eb)best=r;
    }
  }
  return best;
}

function userStats(uid,groupRoleCode){
  const segs=planForUser(uid);
  const relevant=segs.filter(s=>s.role===groupRoleCode);
  const base=relevant.length?relevant:segs;

  const totalMinutes=base.reduce((sum,s)=>sum+Math.max(0,minDiff(s.starts_at,s.ends_at)),0);
  const firstStart=base.length?Math.min(...base.map(s=>ms(s.starts_at))):Number.POSITIVE_INFINITY;
  const lastEnd=base.length?Math.max(...base.map(s=>ms(s.ends_at))):Number.POSITIVE_INFINITY;

  return {totalMinutes,firstStart,lastEnd};
}

function sortUsersForGroup(role,arr){
  const mode=groupSorts[role]||"name";
  return [...arr].sort((a,b)=>{
    const sa=userStats(a,role), sb=userStats(b,role);

    if(mode==="long"){
      return sb.totalMinutes-sa.totalMinutes
        || sa.firstStart-sb.firstStart
        || staffName(a).localeCompare(staffName(b),"ja");
    }
    if(mode==="short"){
      return sa.totalMinutes-sb.totalMinutes
        || sa.firstStart-sb.firstStart
        || staffName(a).localeCompare(staffName(b),"ja");
    }
    if(mode==="early"){
      return sa.firstStart-sb.firstStart
        || sb.totalMinutes-sa.totalMinutes
        || staffName(a).localeCompare(staffName(b),"ja");
    }
    if(mode==="late"){
      return sb.firstStart-sa.firstStart
        || sb.totalMinutes-sa.totalMinutes
        || staffName(a).localeCompare(staffName(b),"ja");
    }
    if(mode==="finishEarly"){
      return sa.lastEnd-sb.lastEnd
        || sa.firstStart-sb.firstStart
        || staffName(a).localeCompare(staffName(b),"ja");
    }
    if(mode==="finishLate"){
      return sb.lastEnd-sa.lastEnd
        || sa.firstStart-sb.firstStart
        || staffName(a).localeCompare(staffName(b),"ja");
    }

    return staffName(a).localeCompare(staffName(b),"ja");
  });
}

function setGroupSort(role,value){
  groupSorts[role]=value;
  render();
}

function groupSortOptions(role){
  const value=groupSorts[role]||"name";
  const opts=[
    ["name","名前順"],
    ["long","時間が長い"],
    ["short","時間が短い"],
    ["early","入りが早い"],
    ["late","入りが遅い"],
    ["finishEarly","上がりが早い"],
    ["finishLate","上がりが遅い"]
  ];
  return opts.map(([v,l])=>`<option value="${v}" ${value===v?"selected":""}>${l}</option>`).join("");
}

function renderLegend(){legend.innerHTML=roles.map(([r,l])=>`<span><i class="dot" style="background:${roleColor[r]}"></i>${l}</span>`).join("")}

function renderSummary(){
  const people=new Set(draft.map(x=>x.user_id)).size;
  const hours=draft.reduce((s,x)=>s+minDiff(x.starts_at,x.ends_at),0)/60;
  const unsubmitted=staff.filter(s=>!availability.some(a=>a.user_id===s.user_id)).length;
  summary.innerHTML=`<div><b>${people}</b><span>この日の希望提出者</span></div><div><b>${Math.round(hours*10)/10}</b><span>延べ配置時間</span></div><div><b>${unsubmitted}</b><span>この日未提出</span></div>`;
}

function render(){
  renderLegend();renderSummary();
  if(!draft.length){timeline.innerHTML='<div class="empty">この日の希望提出がありません。</div>';return}
  const b=dayBounds(),trackW=Math.max(680,((b.end-b.start)/60000)*pxPerMin);
  document.documentElement.style.setProperty("--pxpermin",pxPerMin+"px");

  const users=[...new Set(draft.map(x=>x.user_id))];
  const grouped={};for(const r of roleOrder)grouped[r]=[];
  for(const uid of users)(grouped[groupRole(uid)]??=[]).push(uid);

  let html=`<div class="time-header"><div class="corner">スタッフ</div><div class="time-track" style="width:${trackW}px">`;
  let tick=new Date(b.start);tick.setMinutes(0,0,0);if(tick.getTime()<b.start)tick.setHours(tick.getHours()+1);
  for(let t=tick.getTime();t<=b.end;t+=3600000){
    const left=((t-b.start)/60000)*pxPerMin;
    html+=`<div class="hour-label" style="left:${left}px">${fmtTime(t)}</div>`;
    const half=left-30*pxPerMin;if(half>0)html+=`<div class="half-line" style="left:${half}px"></div>`;
  }
  html+=`</div></div>`;

  for(const r of roleOrder){
    const raw=grouped[r]||[];if(!raw.length)continue;
    const arr=sortUsersForGroup(r,raw);
    html+=`<div class="group-row">
      <div class="group-name" style="color:${roleColor[r]}">
        <div class="group-name-top">
          <span>${esc(roleLabel[r])}（${arr.length}人）</span>
          <select class="group-sort" onchange="setGroupSort('${r}',this.value)" aria-label="${esc(roleLabel[r])}の並び順">
            ${groupSortOptions(r)}
          </select>
        </div>
      </div>
      <div class="group-track" style="width:${trackW}px"></div>
    </div>`;
    for(const uid of arr){
      html+=`<div class="person-row"><div class="person-name"><b>${esc(staffName(uid))}</b><span class="pref">希望：${esc(prefLabel(uid))}</span></div><div class="person-track" style="width:${trackW}px">`;
      for(const a of mergedAvailabilityForUser(uid)){
        const l=((a.start-b.start)/60000)*pxPerMin,w=((a.end-a.start)/60000)*pxPerMin;
        html+=`<div class="hope-range" style="left:${l}px;width:${w}px"></div>`;
      }
      for(const s of planForUser(uid)){
        const key=s._key||String(s.id),l=((ms(s.starts_at)-b.start)/60000)*pxPerMin,w=((ms(s.ends_at)-ms(s.starts_at))/60000)*pxPerMin;
        html+=`<div class="segbar role-${s.role} ${selectedId===key?"selected":""}" data-key="${esc(key)}" style="left:${l}px;width:${Math.max(18,w)}px">
          <span class="handle left" data-edge="left"></span><span class="seg-label">${esc(roleLabel[s.role])} ${fmtTime(s.starts_at)}–${fmtTime(s.ends_at)}</span><span class="handle right" data-edge="right"></span>
        </div>`;
      }
      html+=`</div></div>`;
    }
  }
  timeline.innerHTML=html;bindBars();
}

function bindBars(){
  document.querySelectorAll(".segbar").forEach(el=>{
    el.addEventListener("click",()=>openSheet(el.dataset.key));
    el.addEventListener("pointerdown",startPointerEdit);
  });
}

function startPointerEdit(e){
  const key=e.currentTarget.dataset.key,seg=draft.find(x=>(x._key||String(x.id))===key);if(!seg)return;
  e.preventDefault();
  const edge=e.target?.dataset?.edge||"move",startX=e.clientX,os=ms(seg.starts_at),oe=ms(seg.ends_at),before=clone(draft),b=dayBounds(),minDur=Number(snapSelect.value)*60000;
  let moved=false;
  const move=ev=>{
    const delta=Math.round(((ev.clientX-startX)/pxPerMin)/Number(snapSelect.value))*Number(snapSelect.value)*60000;
    if(Math.abs(ev.clientX-startX)>3)moved=true;
    let ns=os,ne=oe;
    if(edge==="left")ns=clamp(snapMs(os+delta),b.start,oe-minDur);
    else if(edge==="right")ne=clamp(snapMs(oe+delta),os+minDur,b.end);
    else{const dur=oe-os;ns=clamp(snapMs(os+delta),b.start,b.end-dur);ne=ns+dur}
    const cand={...seg,starts_at:iso(ns),ends_at:iso(ne)};
    if(!validateSegment(cand,key)){Object.assign(seg,cand);setDirty();render()}
  };
  const up=()=>{document.removeEventListener("pointermove",move);if(moved){history.push(before);if(history.length>40)history.shift();undoBtn.disabled=false}};
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up,{once:true});
}

function openSheet(key){
  const seg=draft.find(x=>(x._key||String(x.id))===key);if(!seg)return;
  selectedId=key;sheetTitle.textContent=staffName(seg.user_id);sheetSub.textContent=`${roleLabel[seg.role]} ${fmtTime(seg.starts_at)}〜${fmtTime(seg.ends_at)}`;
  prefText.textContent="本人の希望："+prefLabel(seg.user_id)+" ／ 微調整では希望外の役職にも変更できます。";
  const wanted=allowedRoles(seg.user_id);
  editRole.innerHTML=roles.map(([r,l])=>{
    const n=wanted.indexOf(r);
    const suffix=n>=0?`（第${n+1}希望）`:"";
    return `<option value="${r}">${l}${suffix}</option>`;
  }).join("");
  editRole.value=seg.role;editStart.value=localTimeValue(seg.starts_at);editEnd.value=localTimeValue(seg.ends_at);
  const mid=ms(seg.starts_at)+(ms(seg.ends_at)-ms(seg.starts_at))/2;splitTime.value=localTimeValue(mid);
  sheetWarning.innerHTML="";cover.classList.add("open");sheet.classList.add("open");render();
}
function closeSheetFn(){cover.classList.remove("open");sheet.classList.remove("open");selectedId=null;render()}
closeSheet.onclick=closeSheetFn;cover.onclick=closeSheetFn;

applyEdit.onclick=()=>{
  const seg=draft.find(x=>(x._key||String(x.id))===selectedId);if(!seg)return;
  const cand={...seg,role:editRole.value,starts_at:iso(timeOnDay(editStart.value)),ends_at:iso(timeOnDay(editEnd.value))};
  const err=validateSegment(cand,selectedId);if(err){sheetWarning.innerHTML=`<div class="warningbox">${esc(err)}</div>`;return}
  pushHistory();Object.assign(seg,cand);setDirty();closeSheetFn();
};

splitSeg.onclick=()=>{
  const seg=draft.find(x=>(x._key||String(x.id))===selectedId);if(!seg)return;
  const t=timeOnDay(splitTime.value);
  if(t<=ms(seg.starts_at)||t>=ms(seg.ends_at)){sheetWarning.innerHTML='<div class="warningbox">区切り時刻は現在の区間の途中にしてください。</div>';return}
  pushHistory();
  const a={...seg,id:null,_key:makeKey(),ends_at:iso(t)};
  const b={...seg,id:null,_key:makeKey(),starts_at:iso(t)};
  draft=draft.filter(x=>(x._key||String(x.id))!==selectedId).concat([a,b]);
  setDirty();closeSheetFn();
};

deleteSeg.onclick=()=>{
  const seg=draft.find(x=>(x._key||String(x.id))===selectedId);if(!seg)return;
  if(!confirm(`${staffName(seg.user_id)} の区間を削除しますか？`))return;
  pushHistory();draft=draft.filter(x=>(x._key||String(x.id))!==selectedId);setDirty();closeSheetFn();
};

undoBtn.onclick=()=>{if(!history.length)return;draft=history.pop();undoBtn.disabled=history.length===0;setDirty("1つ前に戻しました。");render()};
resetBtn.onclick=()=>{if(!confirm("保存前の調整内容を破棄して、第1希望から作り直しますか？"))return;pushHistory();draft=buildFromHope();setDirty("希望から作り直しました。");render()};

async function saveDraft(){
  for(const s of draft){const err=validateSegment(s,s._key||String(s.id));if(err){setErr(`${staffName(s.user_id)}：${err}`);return}}
  if(!confirm(`${currentDay().label} のシフトを保存しますか？`))return;
  saveBtn.disabled=true;setOk("保存中...");
  try{
    const {error:e1}=await sb.from("shift_manual_assignments").delete().eq("event_day_id",+daySelect.value);if(e1)throw e1;
    if(draft.length){
      const payload=draft.map(x=>({
        event_day_id:+daySelect.value,
        user_id:x.user_id,
        role:String(x.role),
        starts_at:x.starts_at,
        ends_at:x.ends_at
      }));
      const {error:e2}=await sb.from("shift_manual_assignments").insert(payload);if(e2)throw e2;
    }
    const expectedCount=draft.length;
    await loadDay();

    const {data:verify,error:verifyError}=await sb
      .from("shift_manual_assignments")
      .select("id,user_id,role,starts_at,ends_at")
      .eq("event_day_id",+daySelect.value);

    if(verifyError)throw verifyError;

    if((verify||[]).length<expectedCount){
      setErr(`保存確認エラー：${expectedCount}区間中 ${(verify||[]).length}区間しかDBに残っていません。`);
    }else{
      setOk("✅ 手動シフトを保存しました。希望外の役職も保持されます。");
    }
  }catch(e){setErr("保存エラー："+(e.message||String(e)))}finally{saveBtn.disabled=false}
}
saveBtn.onclick=saveDraft;

daySelect.onchange=()=>loadDay().catch(e=>setErr(e.message||String(e)));
snapSelect.onchange=render;zoomSelect.onchange=()=>{pxPerMin=Number(zoomSelect.value);render()};

(async()=>{
  try{if(!await requireAdmin())return;await loadBase();pxPerMin=Number(zoomSelect.value);await loadDay()}
  catch(e){document.querySelector("main").insertAdjacentHTML("afterbegin",`<div class="card err">読み込みエラー：${esc(e.message||String(e))}</div>`)}
})();
</script>
</body>
