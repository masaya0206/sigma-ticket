<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 ポータル</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta name="theme-color" content="#b5121b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <!-- URL共有時のプレビュー -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="シグマ祭 Match Point">
  <meta property="og:description" content="Match Point シグマ祭スタッフポータル">
  <meta property="og:url" content="https://masaya0206.github.io/sigma-ticket/home.html">
  <meta property="og:image" content="https://masaya0206.github.io/sigma-ticket/social-preview.png?v=77">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="シグマ祭 Match Point">
  <meta name="twitter:description" content="Match Point シグマ祭スタッフポータル">
  <meta name="twitter:image" content="https://masaya0206.github.io/sigma-ticket/social-preview.png?v=77">

  <style>
    :root {
      --red: #b5121b;
      --red-dark: #8f0e15;
      --red-soft: #fff1f2;
      --gold: #d9a526;
      --ink: #1c1c1e;
      --muted: #6e6e73;
      --line: #ece7e4;
      --surface: #ffffff;
      --bg: #f7f4f2;
      --green: #15803d;
      --green-soft: #ecfdf3;
      --shadow: 0 8px 24px rgba(74, 25, 25, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 34px;
      background: var(--bg);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding:
        max(34px, env(safe-area-inset-top))
        22px
        38px;
      color: #fff;
      background:
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.13), transparent 28%),
        radial-gradient(circle at 10% 92%, rgba(255,210,90,.16), transparent 30%),
        linear-gradient(145deg, var(--red), var(--red-dark));
      border-radius: 0 0 30px 30px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -58px;
      bottom: -72px;
      width: 190px;
      height: 190px;
      border: 2px solid rgba(217,165,38,.35);
      border-radius: 50%;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 15px;
      color: #fff;
      font-size: 29px;
      font-weight: 900;
      background: rgba(255,255,255,.09);
      backdrop-filter: blur(8px);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: .02em;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: rgba(255,255,255,.78);
      font-size: 13px;
      letter-spacing: .08em;
    }

    .content {
      padding: 0 16px 26px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(181,18,27,.06);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .login-card {
      margin-top: -18px;
      position: relative;
      z-index: 2;
      padding: 22px;
    }

    .login-title {
      margin: 0 0 14px;
      font-size: 23px;
    }

    input {
      width: 100%;
      margin-top: 10px;
      padding: 15px 16px;
      color: var(--ink);
      border: 1px solid #ded8d4;
      border-radius: 14px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(181,18,27,.10);
    }

    .primary-button,
    .secondary-button,
    .ghost-button {
      width: 100%;
      margin-top: 12px;
      padding: 15px 16px;
      border-radius: 14px;
      font-weight: 800;
    }

    .primary-button {
      color: #fff;
      background: var(--red);
    }

    .primary-button:active {
      background: var(--red-dark);
    }

    .secondary-button {
      color: var(--red);
      background: var(--red-soft);
    }

    .ghost-button {
      color: var(--ink);
      background: #f3efec;
    }

    .message {
      margin: 14px 2px 0;
      color: var(--muted);
      line-height: 1.55;
    }

    #portalArea,
    #newPasswordArea {
      display: none;
    }

    .profile-card {
      margin-top: -18px;
      position: relative;
      z-index: 2;
      padding: 18px;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      flex: 0 0 auto;
      width: 66px;
      height: 66px;
      position: relative;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #e7e4e2;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }

    /* よくある無地の人型デフォルトアイコン */
    .avatar::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 13px;
      width: 23px;
      height: 23px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #88827f;
    }

    .avatar::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 42px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 24px 24px 10px 10px;
      background: #88827f;
    }

    .profile-copy {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .11em;
    }

    .staff-name {
      margin-top: 2px;
      font-size: 25px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .working-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      padding: 7px 10px;
      color: var(--green);
      border-radius: 999px;
      background: var(--green-soft);
      font-size: 13px;
      font-weight: 800;
    }

    .working-badge.off {
      color: var(--muted);
      background: #f2f2f2;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .mini-stat {
      padding: 12px;
      border-radius: 14px;
      background: #faf7f5;
    }

    .mini-label {
      color: var(--muted);
      font-size: 12px;
    }

    .mini-value {
      margin-top: 5px;
      font-size: 16px;
      font-weight: 900;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
    }

    .section-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .menu-card {
      min-height: 122px;
      padding: 16px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(43,22,22,.045);
    }

    .menu-card:active {
      transform: scale(.985);
    }

    .menu-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      color: var(--red);
      border-radius: 12px;
      background: var(--red-soft);
      font-size: 21px;
      font-weight: 900;
    }

    .menu-name {
      display: block;
      margin-top: 12px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
    }

    .menu-desc {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .notice {
      margin-top: 16px;
      padding: 15px 16px;
      color: #5d4b42;
      border: 1px solid #f1dfd1;
      border-radius: 16px;
      background: #fffaf5;
      font-size: 13px;
      line-height: 1.6;
    }

    .portal-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .portal-actions button {
      margin: 0;
    }

    .recovery-card {
      margin-top: -18px;
      position: relative;
      z-index: 2;
      padding: 22px;
    }

    @media (max-width: 390px) {
      .hero {
        padding-left: 18px;
        padding-right: 18px;
      }

      .brand-title {
        font-size: 25px;
      }

      .content {
        padding-left: 12px;
        padding-right: 12px;
      }

      .menu-grid {
        gap: 8px;
      }

      .menu-card {
        padding: 14px;
      }
    }

    .core-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .core-card{min-height:138px;padding:18px;text-align:left;border:1px solid var(--line);
      border-radius:21px;background:#fff;box-shadow:0 5px 16px rgba(43,22,22,.05)}
    .core-card:active{transform:scale(.985)}
    .core-icon{width:44px;height:44px;display:grid;place-items:center;color:var(--red);
      border-radius:14px;background:var(--red-soft);font-size:21px;font-weight:900}
    .core-name{display:block;margin-top:13px;font-size:17px;font-weight:900;color:var(--ink)}
    .core-desc{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
    .role-section{display:none;margin-top:18px}
    .role-card{width:100%;min-height:96px;padding:17px;text-align:left;border:0;border-radius:19px;
      color:#fff;background:linear-gradient(145deg,var(--red),var(--red-dark));box-shadow:var(--shadow)}
    .role-card+.role-card{margin-top:10px}
    .role-title{display:block;font-size:20px;font-weight:900}
    .role-desc{display:block;margin-top:5px;color:rgba(255,255,255,.82);font-size:13px}
    .admin-entry{display:none;margin-top:18px}
    @media(max-width:390px){.core-grid{gap:9px}.core-card{padding:15px}}

  </style>
</head>

<body>
  <main class="app">

    <header class="hero">
      <div class="brand">
        <div class="brand-mark">Σ</div>

        <div class="brand-copy">
          <h1 class="brand-title">
            シグマ祭
          </h1>

          <div class="brand-subtitle">
            MATCH POINT · 中華屋台
          </div>
        </div>
      </div>
    </header>


    <div class="content">

      <section
        id="loginArea"
        class="card login-card"
      >
        <h2 class="login-title">
          ログイン
        </h2>

        <input
          id="email"
          type="email"
          placeholder="メールアドレス"
          autocomplete="email"
        >

        <input
          id="password"
          type="password"
          placeholder="パスワード"
          autocomplete="current-password"
        >

        <button
          class="primary-button"
          onclick="login()"
        >
          ログイン
        </button>

        <button
          class="secondary-button"
          onclick="location.href='reset-password.html'"
        >
          パスワードを忘れた方
        </button>

        <p
          id="loginMessage"
          class="message"
        ></p>
      </section>


      <section
        id="newPasswordArea"
        class="card recovery-card"
      >
        <h2 class="login-title">
          新しいパスワード
        </h2>

        <input
          id="newPassword"
          type="password"
          placeholder="新しいパスワード"
        >

        <button
          class="primary-button"
          onclick="saveNewPassword()"
        >
          パスワードを保存
        </button>

        <p
          id="passwordMessage"
          class="message"
        ></p>
      </section>


      <div id="portalArea">

        <section class="card profile-card">
          <div class="profile-main">

            <div
              class="avatar"
              aria-label="デフォルトプロフィールアイコン"
            ></div>

            <div class="profile-copy">

              <div class="eyebrow">
                STAFF
              </div>

              <div
                id="staffName"
                class="staff-name"
              >
                -
              </div>

              <div
                id="workingBadge"
                class="working-badge off"
              >
                <span class="dot"></span>
                <span id="workingBadgeText">
                  勤務していません
                </span>
              </div>

            </div>
          </div>


          <div class="schedule-row" style="margin-top:18px;">
            <div class="mini-stat"><div class="mini-label">前売りpt</div><div id="homePresalePt" class="mini-value">-</div></div>
            <div class="mini-stat"><div class="mini-label">当日pt</div><div id="homeDayPt" class="mini-value">-</div></div>
            <div class="mini-stat"><div class="mini-label">残券</div><div id="homeResidual" class="mini-value">-</div></div>
          </div>
          <div id="homeResidualValue" class="section-hint" style="margin-top:8px;"></div>

          <div class="schedule-row">

            <div class="mini-stat">
              <div class="mini-label">
                現在の予定
              </div>

              <div
                id="plannedRole"
                class="mini-value"
              >
                -
              </div>
            </div>

            <div class="mini-stat">
              <div class="mini-label">
                現在の勤務
              </div>

              <div
                id="workingRole"
                class="mini-value"
              >
                -
              </div>
            </div>

          </div>

          <div class="portal-actions">
            <button
              class="secondary-button"
              onclick="refreshPortal()"
            >
              状態を更新
            </button>

            <button
              class="ghost-button"
              onclick="logout()"
            >
              ログアウト
            </button>
          </div>
        </section>
        <section class="section">
          <div class="section-title">
            <h2>メニュー</h2>
            <span id="adminStatus" class="section-hint"></span>
          </div>

          <div class="core-grid">
            <button class="core-card" onclick="location.href='work.html'">
              <span class="core-icon">時</span>
              <span class="core-name">勤怠・シフト</span>
              <span class="core-desc">出退勤の確認・希望シフト</span>
            </button>

            <button class="core-card" onclick="location.href='tickets.html'">
              <span class="core-icon">券</span>
              <span class="core-name">前売り券・当日券</span>
              <span class="core-desc">券の発行・ノルマ・販売状況</span>
            </button>
          </div>

          <div id="roleSection" class="role-section">
            <div class="section-title" style="margin-top:0;">
              <h2>勤務中の機能</h2>
              <span class="section-hint">現在の役割に応じて表示</span>
            </div>
            <div id="roleMenu"></div>
          </div>

          <div id="adminEntry" class="admin-entry">
            <button class="core-card" style="width:100%;min-height:104px;" onclick="location.href='admin-menu.html'">
              <span class="core-icon">管</span>
              <span class="core-name">管理者メニュー</span>
              <span class="core-desc">全機能・設定・運営操作</span>
            </button>
          </div>
        </section>

        <div class="notice">
          通常は「勤怠・シフト」「前売り券・当日券」の2つだけ表示します。
          出勤中は必要な役割機能だけ自動で追加されます。
          売り子・調理・サポートには専用メニューを追加しません。
        </div>

      </div>
    </div>
  </main>


  <script>
    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function roleText(role) {

      if (role === "seller") {
        return "売り子";
      }

      if (role === "tent") {
        return "テント内";
      }

      if (role === "front") {
        return "表番";
      }

      if (role === "back") {
        return "裏番";
      }

      if (role === "register") return "レジ";
      if (role === "shopping_driver" || role === "shopping_helper") return "買い出し";
      if (role === "cook") return "調理";
      if (role === "support") return "サポート";
      return "なし";
    }


    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value;

      const password =
        document.getElementById(
          "password"
        ).value;

      const message =
        document.getElementById(
          "loginMessage"
        );

      message.textContent =
        "ログインしています...";

      const {
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {

        message.textContent =
          "ログイン失敗：" +
          error.message;

        return;
      }

      message.textContent = "";

      await showPortal();
    }

    async function saveNewPassword() {

      const password =
        document.getElementById(
          "newPassword"
        ).value;

      const message =
        document.getElementById(
          "passwordMessage"
        );

      if (!password) {

        message.textContent =
          "新しいパスワードを入力してください。";

        return;
      }

      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password
          });

      if (error) {

        message.textContent =
          "エラー：" +
          error.message;

        return;
      }

      message.textContent =
        "✅ パスワードを設定しました。";

      await showPortal();
    }


    supabaseClient.auth
      .onAuthStateChange(
        async (event) => {

          if (
            event ===
            "PASSWORD_RECOVERY"
          ) {

            document.getElementById(
              "loginArea"
            ).style.display =
              "none";

            document.getElementById(
              "portalArea"
            ).style.display =
              "none";

            document.getElementById(
              "newPasswordArea"
            ).style.display =
              "block";
          }
        }
      );


    async function showPortal() {

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      if (!user) {
        return;
      }

      const {
        data: staff,
        error
      } =
        await supabaseClient
          .from("staff_members")
          .select(
            "staff_name,is_active"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();

      if (
        error ||
        !staff
      ) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "スタッフ情報が見つかりません。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      if (!staff.is_active) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "このスタッフアカウントは停止中です。";

        await supabaseClient.auth
          .signOut();

        return;
      }

      document.getElementById(
        "staffName"
      ).textContent =
        staff.staff_name;

      document.getElementById(
        "loginArea"
      ).style.display =
        "none";

      document.getElementById(
        "newPasswordArea"
      ).style.display =
        "none";

      document.getElementById(
        "portalArea"
      ).style.display =
        "block";

      await refreshPortal();
    }


    async function refreshPortal() {

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      if (!user) {
        return;
      }

      const now =
        new Date().toISOString();

      const [
        assignmentResult,
        attendanceResult,
        adminResult,
        presaleResult,
        finalPointResult,
        provisionalPointResult
      ] =
        await Promise.all([

          supabaseClient
            .from("staff_assignments")
            .select(
              "role,start_at,end_at"
            )
            .eq(
              "user_id",
              user.id
            )
            .lte(
              "start_at",
              now
            )
            .gte(
              "end_at",
              now
            )
            .order(
              "start_at",
              {
                ascending:
                  false
              }
            )
            .limit(1)
            .maybeSingle(),

          supabaseClient
            .from("staff_attendance")
            .select(
              "role,attendance_state,clock_in"
            )
            .eq(
              "user_id",
              user.id
            )
            .eq(
              "attendance_state",
              "working"
            )
            .is(
              "clock_out",
              null
            )
            .order(
              "clock_in",
              {
                ascending:
                  false
              }
            )
            .limit(1)
            .maybeSingle(),

          supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle(),

          supabaseClient.rpc("my_presale_status"),
          supabaseClient.rpc("my_point_summary", { p_final: true }),
          supabaseClient.rpc("my_point_summary", { p_final: false })
        ]);

      const assignment =
        assignmentResult.data;

      const attendance =
        attendanceResult.data;

      const isAdmin =
        !!adminResult.data;

      const presaleData = presaleResult.data || {};
      document.getElementById("homePresalePt").textContent =
        Number(presaleData.presale_points || 0).toFixed(1) + " pt";
      document.getElementById("homeResidual").textContent =
        Number(presaleData.residual_remaining || 0) + " 枚";
      document.getElementById("homeResidualValue").textContent =
        Number(presaleData.residual_remaining || 0) > 0
          ? "残券相当額 " + Number(presaleData.residual_value || 0).toLocaleString() + "円"
          : "残券なし";

      const pointRows = finalPointResult.data?.length
        ? finalPointResult.data
        : (provisionalPointResult.data || []);
      const dayPoints = pointRows.reduce(
        (sum,row)=>sum+Number(row.points||0),0
      );
      document.getElementById("homeDayPt").textContent =
        dayPoints.toFixed(1) + " pt " +
        (finalPointResult.data?.length ? "確定" : "暫定");

      portalIsAdmin = isAdmin;

      const {
        data: currentRoleData
      } = await supabaseClient.rpc(
        "current_work_role",
        { p_user: user.id }
      );

      portalCurrentRole =
        currentRoleData ||
        attendance?.role ||
        null;

      await renderHomeMenus(
        user.id,
        portalCurrentRole,
        isAdmin
      );

      const planned =
        assignment
          ? roleText(
              assignment.role
            )
          : "なし";

      const working =
        attendance
          ? roleText(
              portalCurrentRole
            )
          : "勤務なし";

      document.getElementById(
        "plannedRole"
      ).textContent =
        planned;

      document.getElementById(
        "workingRole"
      ).textContent =
        working;

      document.getElementById(
        "adminStatus"
      ).textContent =
        isAdmin
          ? "管理者"
          : "";

      const badge =
        document.getElementById(
          "workingBadge"
        );

      const badgeText =
        document.getElementById(
          "workingBadgeText"
        );

      if (attendance) {

        badge.classList.remove(
          "off"
        );

        badgeText.textContent =
          working +
          "勤務中";

      } else {

        badge.classList.add(
          "off"
        );

        badgeText.textContent =
          "勤務していません";
      }

      

      

      

      

      

      

      

      

      

      
    }



    let portalIsAdmin = false;
    let portalCurrentRole = null;

    function showAccessToast(message) {
      const toast = document.getElementById("accessToast");
      toast.textContent = message;
      toast.style.display = "block";
      clearTimeout(window.__accessToastTimer);
      window.__accessToastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 2600);
    }

    function protectedNavigate(page, roles = [], message = "この機能は利用できません。", adminOnly = false) {
      if (portalIsAdmin) {
        location.href = page;
        return;
      }

      if (adminOnly) {
        showAccessToast(message);
        return;
      }

      if (roles.includes(portalCurrentRole)) {
        location.href = page;
        return;
      }

      showAccessToast(message);
    }


    function roleMenuCard(title,desc,page){
      return `<button class="role-card" onclick="location.href='${page}'">
        <span class="role-title">${title}</span>
        <span class="role-desc">${desc}</span>
      </button>`;
    }

    async function renderHomeMenus(userId,currentRole,isAdmin){
      const roleSection=document.getElementById("roleSection");
      const roleMenu=document.getElementById("roleMenu");
      const adminEntry=document.getElementById("adminEntry");

      roleMenu.innerHTML="";
      roleSection.style.display="none";
      adminEntry.style.display=isAdmin?"block":"none";

      const cards=[];

      if(currentRole==="front"){
        cards.push(roleMenuCard("表番","伝票・レジ編成・役職変更など","front.html"));
      }
      if(currentRole==="back"){
        cards.push(roleMenuCard("裏番","全体状況・買い出し・人員管理など","back.html"));
      }
      if(currentRole==="register"){
        cards.push(roleMenuCard("レジ","QR受付・会計処理","index.html"));
      }
      if(currentRole==="shopping_driver"||currentRole==="shopping_helper"){
        cards.push(roleMenuCard("買い出し","買い出しミッション・帰還処理","shopping.html"));
      }

      // 出発前の買い出し招待・運転手募集でも買い出しメニューを表示
      try{
        const {data:board,error}=await supabaseClient.rpc("shopping_board");
        if(!error&&board){
          const team=(board.team||[]).some(x=>x.user_id===userId);
          const relevant=(board.missions||[]).some(m=>{
            const driver=m.driver_user_id===userId &&
              ["driver_selected","departed"].includes(m.status);
            const helper=(m.helpers||[]).some(h=>
              h.user_id===userId && ["pending","accepted"].includes(h.status)
            );
            const canClaim=team&&m.status==="approved";
            return driver||helper||canClaim;
          });

          if(relevant && !cards.some(x=>x.includes(">買い出し<"))){
            cards.push(roleMenuCard("買い出し","招待・運転手選択・ミッション確認","shopping.html"));
          }
        }
      }catch(_){}

      if(cards.length){
        roleMenu.innerHTML=cards.join("");
        roleSection.style.display="block";
      }
    }

    async function logout() {

      await supabaseClient.auth
        .signOut();

      document.getElementById(
        "portalArea"
      ).style.display =
        "none";

      document.getElementById(
        "loginArea"
      ).style.display =
        "block";

      document.getElementById(
        "password"
      ).value = "";
    }


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (session) {
        await showPortal();
      }
    }


    if (
      "serviceWorker"
      in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./service-worker.js",
              {
                scope:
                  "./"
              }
            )
            .catch(
              error => {
                console.log(
                  "Service Worker registration failed:",
                  error
                );
              }
            );
        }
      );
    }


    checkLogin();
  </script>

font-weight:700;max-width:88%;text-align:center;display:none;z-index:9999;
box-shadow:0 8px 28px rgba(0,0,0,.25);"></div>
