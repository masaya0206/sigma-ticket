<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者 パスワード再設定</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf6f4;
      color: #171717;
    }
    header {
      background: #b5121b;
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 28px 28px;
    }
    header h1 { margin: 0; font-size: 28px; }
    main {
      max-width: 680px;
      margin: 24px auto;
      padding: 0 18px 40px;
    }
    .card {
      background: white;
      border: 1px solid #eadfdb;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.05);
    }
    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }
    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d9cfcb;
      border-radius: 14px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #c7111b;
      color: white;
      font-size: 18px;
      font-weight: 800;
    }
    .secondary {
      background: #fceff0;
      color: #b5121b;
    }
    #message {
      margin-top: 18px;
      line-height: 1.6;
      word-break: break-word;
    }
    .small {
      color: #6b625f;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>管理者 パスワード再設定</h1>
  </header>

  <main>
    <div class="card">
      <p class="small">
        管理者としてログイン済みの状態で使用してください。
        作業が終わったら、このページはGitHubから削除して構いません。
      </p>

      <label for="userId">対象ユーザーID</label>
      <input
        id="userId"
        type="text"
        value="4c988d50-baef-4875-a8a7-5ee20a34e885"
      >

      <label for="newPassword">新しい一時パスワード</label>
      <input
        id="newPassword"
        type="password"
        placeholder="8文字以上"
        autocomplete="new-password"
      >

      <button id="resetButton">
        パスワードを変更
      </button>

      <button
        class="secondary"
        onclick="location.href='home.html'"
      >
        ポータルへ戻る
      </button>

      <div id="message"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    async function ensureAdmin() {
      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {
        document.getElementById("message")
          .textContent =
          "管理者としてログインしてください。";
        return false;
      }

      const {
        data: adminRow,
        error: adminError
      } =
        await supabaseClient
          .from("admins")
          .select("user_id")
          .eq("user_id", user.id)
          .maybeSingle();

      if (adminError || !adminRow) {
        document.getElementById("message")
          .textContent =
          "このアカウントには管理者権限がありません。";
        return false;
      }

      return true;
    }

    async function resetPassword() {
      const message =
        document.getElementById("message");

      const ok =
        await ensureAdmin();

      if (!ok) return;

      const userId =
        document.getElementById("userId")
          .value.trim();

      const newPassword =
        document.getElementById("newPassword")
          .value;

      if (!userId) {
        message.textContent =
          "ユーザーIDを入力してください。";
        return;
      }

      if (newPassword.length < 8) {
        message.textContent =
          "パスワードは8文字以上にしてください。";
        return;
      }

      message.textContent =
        "変更中...";

      const {
        data,
        error
      } =
        await supabaseClient
          .functions
          .invoke(
            "admin-reset-password",
            {
              body: {
                user_id:
                  userId,
                new_password:
                  newPassword
              }
            }
          );

      if (error) {
        message.textContent =
          "変更失敗：" +
          error.message;
        return;
      }

      if (data?.error) {
        message.textContent =
          "変更失敗：" +
          data.error;
        return;
      }

      message.textContent =
        "✅ パスワードを変更しました。対象スタッフに新しいパスワードを伝えてください。";
    }

    document.getElementById(
      "resetButton"
    ).addEventListener(
      "click",
      resetPassword
    );

    ensureAdmin();
  </script>
</body>
</html>
