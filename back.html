<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 裏番</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .card {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: left;
    }

    .warning {
      background: #fff4df;
    }

    .working {
      background: #e8f7e8;
    }

    .detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #ccc;
    }


    .timeline-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }

    .timeline-grid {
      min-width: 980px;
    }

    .timeline-header,
    .timeline-row {
      display: grid;
      grid-template-columns: 120px 1fr;
    }

    .timeline-name {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 8px;
      min-width: 0;
    }

    .timeline-header .timeline-name {
      z-index: 6;
      font-weight: bold;
    }

    .timeline-hours {
      position: relative;
      height: 36px;
      border-bottom: 1px solid #ddd;
    }

    .timeline-hour {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 12px;
      white-space: nowrap;
    }

    .timeline-track {
      position: relative;
      height: 62px;
      border-bottom: 1px solid #eee;
      background-image:
        linear-gradient(
          to right,
          transparent calc(100% - 1px),
          #e5e5e5 calc(100% - 1px)
        );
      background-size: calc(100% / 12) 100%;
    }

    .timeline-bar {
      position: absolute;
      border-radius: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 2px 5px;
      box-sizing: border-box;
      font-size: 11px;
      line-height: 18px;
      cursor: pointer;
    }

    .timeline-plan {
      top: 7px;
      height: 22px;
      background: #cfcfcf;
    }

    .timeline-actual {
      top: 34px;
      height: 22px;
      background: #333;
      color: #fff;
    }

    .timeline-name-button {
      width: 100%;
      margin: 0;
      padding: 8px;
      text-align: left;
      font-size: 14px;
      background: #f5f5f5;
    }

    #backArea {
      display: none;
    }
  </style>
</head>

<body>

  <h1>シグマ祭 裏番</h1>

  <div id="loginArea">

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>

    <p id="loginMessage"></p>

  </div>


  <div id="backArea">

    <button onclick="logout()">
      ログアウト
    </button>

    <div class="card">

      <h2>現在の勤務状況</h2>

      <p id="summary">
        集計しています...
      </p>

    </div>


    <button onclick="loadStaffStatus()">
      スタッフ状況を更新
    </button>

    <div
      id="timelineArea"
      class="card"
      style="margin-top:15px;"
    >
      <h2>予定・確定勤怠</h2>

      <p style="font-size:13px; color:#666;">
        上段：予定　／　下段：確定勤怠
      </p>

      <div id="timelineContent">
        読み込み前です。
      </div>
    </div>

   
    <div id="staffList"></div>

<div
  id="attendanceEditor"
  class="card"
  style="display:none;"
>

  <h2 id="editorStaffName">
    勤怠編集
  </h2>

  <div id="attendanceHistory"></div>

<hr style="margin:20px 0;">

  <input
    id="editorClockIn"
    type="datetime-local"
  >

  <input
    id="editorClockOut"
    type="datetime-local"
  >

  <select id="editorRole">
    <option value="">役割未確定</option>
    <option value="seller">売り子</option>
    <option value="tent">テント内</option>
    <option value="front">表番</option>
    <option value="back">裏番</option>
    <option value="register">レジ</option>
  </select>

  <div
  id="quickRoleButtons"
  style="
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  "
>
  <button
    type="button"
    onclick="setQuickRole('seller')"
  >
    売り子
  </button>

  <button
    type="button"
    onclick="setQuickRole('tent')"
  >
    テント内
  </button>

  <button
    type="button"
    onclick="setQuickRole('front')"
  >
    表番
  </button>

  <button
    type="button"
    onclick="setQuickRole('back')"
  >
    裏番
  </button>

  <button
    type="button"
    onclick="setQuickRole('register')"

    レジ
  </button>
</div>

  <input

  >

  <button onclick="saveAttendanceEdit()">
    修正を保存
  </button>

  <button onclick="prepareNewAttendance()">
  新しい勤務を入力
</button>

<button onclick="addAttendance()">
  この内容で勤務を追加
</button>

  <button onclick="deleteAttendance()">
    この勤怠を削除
  </button>

  <button onclick="closeAttendanceEditor()">

  </button>

  <p id="editorMessage"></p>

</div>
    
  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      const { error } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {
        message.textContent =
          "ログイン失敗：" +
          error.message;
        return;
      }

      await showBackArea();
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("backArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";
    }


    async function showBackArea() {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {
        return;
      }

      const { data: allowed } =
        await supabaseClient
          .rpc("is_current_back");

      if (!allowed) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "現在、裏番として利用できません。";

        await supabaseClient.auth.signOut();

        return;
      }

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("backArea")
        .style.display = "block";

      await loadStaffStatus();
    }


    function roleText(role) {

      if (role === "seller") {
        return "売り子";
      }

      if (role === "tent") {
        return "テント内";
      }

      if (role === "front") {
        return "表番";
      }

      if (role === "back") {
        return "裏番";
      }

      if (role === "register") {
        return "レジ";
      }

      return "未確定";
    }


    function timeText(value) {

      if (!value) {
        return "勤務中";
      }

      return new Date(value)
        .toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );
    }

    let currentStatusFilter = "all";

function setStatusFilter(filter) {

  currentStatusFilter = filter;

  loadStaffStatus();
}


    async function loadStaffStatus() {

      const list =
        document.getElementById("staffList");

      const summary =
        document.getElementById("summary");

      list.innerHTML =
        "読み込み中...";

      const nowDate =
        new Date();

      const startOfDay =
        new Date(
          nowDate.getFullYear(),
          nowDate.getMonth(),
          nowDate.getDate(),
          0, 0, 0, 0
        );

      const endOfDay =
        new Date(
          nowDate.getFullYear(),
          nowDate.getMonth(),
          nowDate.getDate() + 1,
          0, 0, 0, 0
        );


      const {
        data: staffMembers,
        error: staffError
      } =
        await supabaseClient
          .from("staff_members")
          .select(
            "user_id,staff_name,is_active"
          )
          .eq("is_active", true)
          .order("staff_name");


      if (staffError) {

        list.innerHTML =
          "スタッフ取得エラー：" +
          staffError.message;

        return;
      }


      const {
        data: assignments,
        error: assignmentError
      } =
        await supabaseClient
          .from("staff_assignments")
          .select(
            "id,user_id,role,start_at,end_at"
          )
          .lt(
            "start_at",
            endOfDay.toISOString()
          )
          .gt(
            "end_at",
            startOfDay.toISOString()
          )
          .order(
            "start_at",
            { ascending: true }
          );


      if (assignmentError) {

        list.innerHTML =
          "予定取得エラー：" +
          assignmentError.message;

        return;
      }


      const {
        data: attendance,
        error: attendanceError
      } =
        await supabaseClient
          .from("staff_attendance")
          .select(
            "id,user_id,role,clock_in,clock_out,attendance_state"
          )
          .gte(
            "clock_in",
            startOfDay.toISOString()
          )
          .lt(
            "clock_in",
            endOfDay.toISOString()
          )
          .order(
            "clock_in",
            { ascending: true }
          );


      if (attendanceError) {

        list.innerHTML =
          "勤怠取得エラー：" +
          attendanceError.message;

        return;
      }


      const assignmentsByUser = {};

      for (const item of assignments || []) {

        if (!assignmentsByUser[item.user_id]) {
          assignmentsByUser[item.user_id] = [];
        }

        assignmentsByUser[item.user_id].push(item);
      }


      const attendanceByUser = {};

      for (const item of attendance || []) {

        if (!attendanceByUser[item.user_id]) {
          attendanceByUser[item.user_id] = [];
        }

        attendanceByUser[item.user_id].push(item);
      }


      const latestAttendanceMap = {};

      for (const item of attendance || []) {
        latestAttendanceMap[item.user_id] =
          item;
      }


      let workingCount = 0;
      let breakCount = 0;
      let registerCount = 0;
      let unconfirmedCount = 0;
      let lateCount = 0;
      let overtimeCount = 0;


      for (
        const item of Object.values(
          latestAttendanceMap
        )
      ) {

        if (
          item.attendance_state ===
          "working"
        ) {
          workingCount++;
        }

        if (
          item.attendance_state ===
          "break"
        ) {
          breakCount++;
        }

        if (
          item.attendance_state ===
            "working" &&
          item.role === "register"
        ) {
          registerCount++;
        }

        if (!item.role) {
          unconfirmedCount++;
        }
      }


      const statusByUser = {};

      for (const staff of staffMembers || []) {

        const userAssignments =
          assignmentsByUser[
            staff.user_id
          ] || [];

        const currentAssignment =
          userAssignments.find(
            item =>
              new Date(item.start_at) <=
                nowDate &&
              new Date(item.end_at) >=
                nowDate
          ) || null;

        const pastAssignments =
          userAssignments.filter(
            item =>
              new Date(item.end_at) <
              nowDate
          );

        const lastPastAssignment =
          pastAssignments.length
            ? pastAssignments[
                pastAssignments.length - 1
              ]
            : null;

        const actual =
          latestAttendanceMap[
            staff.user_id
          ] || null;

        const userAttendance =
          attendanceByUser[
            staff.user_id
          ] || [];

        const hasStartedCurrentShift =
          currentAssignment
            ? userAttendance.some(
                item => {
                  const clockIn =
                    new Date(
                      item.clock_in
                    );

                  return (
                    clockIn >=
                      new Date(
                        currentAssignment.start_at
                      ) &&
                    clockIn <=
                      new Date(
                        currentAssignment.end_at
                      )
                  );
                }
              )
            : false;

        const isLate =
          !!currentAssignment &&
          !hasStartedCurrentShift &&
          !(
            actual?.attendance_state ===
            "working"
          );

        const referenceAssignment =
          currentAssignment ||
          lastPastAssignment;

        const isOvertime =
          !!referenceAssignment &&
          nowDate >
            new Date(
              referenceAssignment.end_at
            ) &&
          actual?.attendance_state ===
            "working";

        if (isLate) {
          lateCount++;
        }

        if (isOvertime) {
          overtimeCount++;
        }

        statusByUser[staff.user_id] = {
          currentAssignment,
          actual,
          isLate,
          isOvertime
        };
      }


      summary.innerHTML = `
        <button onclick="setStatusFilter('working')">
          現在勤務中：
          <strong>${workingCount}人</strong>
        </button>

        <button onclick="setStatusFilter('break')">
          休憩中：
          <strong>${breakCount}人</strong>
        </button>

        <button onclick="setStatusFilter('register')">
          レジ：
          <strong>${registerCount}人</strong>
        </button>

        <button onclick="setStatusFilter('late')">
          🔴 遅刻中：
          <strong>${lateCount}人</strong>
        </button>

        <button onclick="setStatusFilter('overtime')">
          🟠 残業中：
          <strong>${overtimeCount}人</strong>
        </button>

        <button onclick="setStatusFilter('unconfirmed')">
          ⚠️ 未確定勤務：
          <strong>${unconfirmedCount}件</strong>
        </button>

        <button onclick="setStatusFilter('all')">
          全員表示
        </button>
      `;


      renderTimeline(
        staffMembers,
        assignments,
        attendance
      );


      let html = "";


      for (const staff of staffMembers || []) {

        const status =
          statusByUser[
            staff.user_id
          ];

        const assignment =
          status.currentAssignment;

        const actual =
          status.actual;

        if (
          currentStatusFilter ===
            "working" &&
          actual?.attendance_state !==
            "working"
        ) {
          continue;
        }

        if (
          currentStatusFilter ===
            "break" &&
          actual?.attendance_state !==
            "break"
        ) {
          continue;
        }

        if (
          currentStatusFilter ===
            "register" &&
          !(
            actual?.attendance_state ===
              "working" &&
            actual?.role === "register"
          )
        ) {
          continue;
        }

        if (
          currentStatusFilter ===
            "late" &&
          !status.isLate
        ) {
          continue;
        }

        if (
          currentStatusFilter ===
            "overtime" &&
          !status.isOvertime
        ) {
          continue;
        }

        if (
          currentStatusFilter ===
            "unconfirmed" &&
          !(
            actual &&
            !actual.role
          )
        ) {
          continue;
        }


        const plannedText =
          assignment
            ? `${roleText(
                assignment.role
              )} ${
                timeText(
                  assignment.start_at
                )
              }〜${
                timeText(
                  assignment.end_at
                )
              }`
            : "現在の予定なし";


        let actualText =
          "未出勤";

        let statusText =
          "⚪ 未出勤";

        let cardClass =
          "card";


        if (actual) {

          if (
            actual.attendance_state ===
            "working"
          ) {

            cardClass += " working";

            statusText =
              actual.role === "register"
                ? "🧾 レジ勤務中"
                : "🟢 勤務中";

            actualText =
              `${roleText(
                actual.role
              )} ${
                timeText(
                  actual.clock_in
                )
              }〜勤務中`;

          } else if (
            actual.attendance_state ===
            "break"
          ) {

            statusText =
              "☕ 休憩中";

            actualText =
              `${timeText(
                actual.clock_out
              )}から休憩中`;

          } else {

            statusText =
              "🔵 退勤済み";

            actualText =
              `${roleText(
                actual.role
              )} ${
                timeText(
                  actual.clock_in
                )
              }〜${
                timeText(
                  actual.clock_out
                )
              }`;
          }


          if (!actual.role) {

            cardClass =
              "card warning";

            statusText =
              "⚠️ 予定外・役割未確定";
          }

        } else if (status.isLate) {

          statusText =
            "🔴 未出勤・遅刻の可能性";

          actualText =
            "予定開始時刻を過ぎています";

        } else if (assignment) {

          statusText =
            "⚪ 未出勤";

          actualText =
            "現在の予定時間内です";
        }


        if (status.isOvertime) {
          statusText =
            "🟠 残業中";
        }


        html += `
          <div class="${cardClass}">

            <button
              onclick="
                toggleStaffDetail(
                  '${staff.user_id}'
                )
              "
            >
              ${staff.staff_name}
            </button>

            <div
              id="detail-${staff.user_id}"
              class="detail"
              style="display:none;"
            >

              <strong>現在の予定</strong>
              <br>
              ${plannedText}

              <br><br>

              <strong>状態</strong>
              <br>
              ${statusText}

              <br><br>

              <strong>最新の実績</strong>
              <br>
              ${actualText}

              <br><br>

              <button
                onclick="
                  openAttendanceEditor(
                    '${staff.user_id}',
                    '${staff.staff_name}'
                  )
                "
              >
                勤怠を編集
              </button>

            </div>

          </div>
        `;
      }


      list.innerHTML =
        html ||
        "該当するスタッフはいません。";
    }


    function toggleStaffDetail(userId) {

      const target =
        document.getElementById(
          "detail-" + userId
        );

      const details =
        document.querySelectorAll(
          ".detail"
        );

      for (const item of details) {

        if (item !== target) {
          item.style.display =
            "none";
        }
      }

      if (
        target.style.display ===
        "none"
      ) {
        target.style.display =
          "block";
      } else {
        target.style.display =
          "none";
      }
    }

let editingUserId = null;
let editingAttendanceId = null;


function toLocalDateTimeInput(value) {

  const date =
    new Date(value);

  const local =
    new Date(
      date.getTime() -
      date.getTimezoneOffset() *
      60000
    );

  return local
    .toISOString()
    .slice(0, 16);
}


async function saveAttendanceEdit() {

  if (!editingAttendanceId) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "修正する勤怠がありません。";

    return;
  }

  const clockInValue =
    document.getElementById(
      "editorClockIn"
    ).value;

  const clockOutValue =
    document.getElementById(
      "editorClockOut"
    ).value;

  const roleValue =
    document.getElementById(
      "editorRole"
    ).value;

  const note =
    document.getElementById(
      "editorNote"
    ).value.trim();

  if (!clockInValue) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "開始時刻を入力してください。";

    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth
      .getUser();

  const updates = {
    clock_in:
      new Date(
        clockInValue
      ).toISOString(),

    clock_out:
      clockOutValue
        ? new Date(
            clockOutValue
          ).toISOString()
        : null,

    role:
      roleValue || null,

    corrected_by:
      user.id,

    corrected_at:
      new Date().toISOString(),

    correction_note:
      note || null
  };

  const { error } =
    await supabaseClient
      .from("staff_attendance")
      .update(updates)
      .eq(
        "id",
        editingAttendanceId
      );

  if (error) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "保存エラー：" +
      error.message;

    return;
  }

  document.getElementById(
    "editorMessage"
  ).textContent =
    "✅ 勤怠を修正しました。";

  await loadStaffStatus();
}


async function addAttendance() {

  if (!editingUserId) {
    return;
  }

  const clockInValue =
    document.getElementById(
      "editorClockIn"
    ).value;

  const clockOutValue =
    document.getElementById(
      "editorClockOut"
    ).value;

  const roleValue =
    document.getElementById(
      "editorRole"
    ).value;

  const note =
    document.getElementById(
      "editorNote"
    ).value.trim();

  if (!clockInValue) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "開始時刻を入力してください。";

    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth
      .getUser();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_attendance")
      .insert({
        user_id:
          editingUserId,

        role:
          roleValue || null,

        clock_in:
          new Date(
            clockInValue
          ).toISOString(),

        clock_out:
          clockOutValue
            ? new Date(
                clockOutValue
              ).toISOString()
            : null,

        corrected_by:
          user.id,

        corrected_at:
          new Date().toISOString(),

        correction_note:
          note || "裏番による追加",

        attendance_state:
          clockOutValue
            ? "finished"
            : "working"
      })
      .select("id")
      .single();

  if (error) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "追加エラー：" +
      error.message;

    return;
  }

  editingAttendanceId =
    data.id;

  document.getElementById(
    "editorMessage"
  ).textContent =
    "✅ 勤務を追加しました。";

  await loadStaffStatus();
}


async function deleteAttendance() {

  if (!editingAttendanceId) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "削除する勤怠がありません。";

    return;
  }

  const confirmed =
    confirm(
      "この勤怠記録を削除しますか？"
    );

  if (!confirmed) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("staff_attendance")
      .delete()
      .eq(
        "id",
        editingAttendanceId
      );

  if (error) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "削除エラー：" +
      error.message;

    return;
  }

  editingAttendanceId = null;

  document.getElementById(
    "editorMessage"
  ).textContent =
    "✅ 勤怠を削除しました。";

  await loadStaffStatus();
}


function closeAttendanceEditor() {

  document.getElementById(
    "attendanceEditor"
  ).style.display =
    "none";

  editingUserId = null;
  editingAttendanceId = null;
}

    async function openAttendanceEditor(
  userId,
  staffName
) {

  editingUserId = userId;
  editingAttendanceId = null;

  document.getElementById(
    "editorStaffName"
  ).textContent =
    staffName + " の勤怠編集";

  document.getElementById(
    "attendanceEditor"
  ).style.display =
    "block";

  document.getElementById(
    "editorMessage"
  ).textContent =
    "今日の勤怠を読み込んでいます...";

  const now =
    new Date();

  const startOfDay =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      0,
      0,
      0,
      0
    );

  const endOfDay =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0,
      0,
      0,
      0
    );

  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff_attendance")
      .select(
        "id,role,clock_in,clock_out"
      )
      .eq("user_id", userId)
      .gte(
        "clock_in",
        startOfDay.toISOString()
      )
      .lt(
        "clock_in",
        endOfDay.toISOString()
      )
      .order(
        "clock_in",
        { ascending: true }
      );

  if (error) {

    document.getElementById(
      "editorMessage"
    ).textContent =
      "取得エラー：" +
      error.message;

    return;
  }

  showAttendanceHistory(
    data || []
  );
}

    function showAttendanceHistory(
  attendance
) {

  const area =
    document.getElementById(
      "attendanceHistory"
    );

  if (
    !attendance ||
    attendance.length === 0
  ) {

    area.innerHTML =
      "今日の勤怠記録はありません。";

    return;
  }

  let html =
    "<h3>今日の実績</h3>";

  for (const item of attendance) {

    const start =
      timeText(
        item.clock_in
      );

    const end =
      item.clock_out
        ? timeText(
            item.clock_out
          )
        : "勤務中";

    html += `
      <button
        onclick="
          selectAttendance(
            '${item.id}',
            '${item.role ?? ""}',
            '${item.clock_in}',
            '${item.clock_out ?? ""}'
          )
        "
        style="
          text-align:left;
          margin-top:8px;
        "
      >
        ${start}〜${end}
        ／
        ${roleText(item.role)}
      </button>
    `;
  }

  area.innerHTML = html;
}

    function selectAttendance(
  id,
  role,
  clockIn,
  clockOut
) {

  editingAttendanceId =
    id;

  document.getElementById(
    "editorClockIn"
  ).value =
    toLocalDateTimeInput(
      clockIn
    );

  document.getElementById(
    "editorClockOut"
  ).value =
    clockOut
      ? toLocalDateTimeInput(
          clockOut
        )
      : "";

  document.getElementById(
    "editorRole"
  ).value =
    role || "";

  document.getElementById(
    "editorMessage"
  ).textContent =
    "この勤務を編集中です。";
}

    function clearAttendanceEditor() {

  editingAttendanceId =
    null;

  document.getElementById(
    "editorClockIn"
  ).value = "";

  document.getElementById(
    "editorClockOut"
  ).value = "";

  document.getElementById(
    "editorRole"
  ).value = "";

  document.getElementById(
    "editorNote"
  ).value = "";

  document.getElementById(
    "editorMessage"
  ).textContent =
    "新しい勤務を入力してください。";
}

    function prepareNewAttendance() {

  clearAttendanceEditor();

  document.getElementById(
    "editorMessage"
  ).textContent =
    "新しい勤務を入力してください。";
}

    function setQuickRole(role) {

  document.getElementById(
    "editorRole"
  ).value = role;

  document.getElementById(
    "editorMessage"
  ).textContent =
    "役割を選択しました。保存すると確定します。";
}

    function minutesFromStart(
  date,
  dayStart
) {

  return (
    new Date(date).getTime() -
    dayStart.getTime()
  ) / 60000;
}


function renderTimeline(
  staffMembers,
  assignments,
  attendance
) {

  const area =
    document.getElementById(
      "timelineContent"
    );

  const today =
    new Date();

  const dayStart =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate(),
      8, 0, 0, 0
    );

  const dayEnd =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate(),
      20, 0, 0, 0
    );

  const totalMinutes =
    (
      dayEnd.getTime() -
      dayStart.getTime()
    ) / 60000;

  const clampPercent =
    value =>
      Math.max(
        0,
        Math.min(100, value)
      );

  let html = `
    <div class="timeline-scroll">
      <div class="timeline-grid">

        <div class="timeline-header">
          <div class="timeline-name">
            名前
          </div>

          <div class="timeline-hours">
  `;

  for (let hour = 8; hour <= 20; hour++) {

    const minutes =
      (hour - 8) * 60;

    const left =
      clampPercent(
        minutes /
        totalMinutes *
        100
      );

    html += `
      <span
        class="timeline-hour"
        style="left:${left}%"
      >
        ${hour}:00
      </span>
    `;
  }

  html += `
          </div>
        </div>
  `;


  for (
    const staff of staffMembers || []
  ) {

    const staffAssignments =
      (assignments || [])
        .filter(
          item =>
            item.user_id ===
            staff.user_id
        );

    const staffAttendance =
      (attendance || [])
        .filter(
          item =>
            item.user_id ===
            staff.user_id
        );


    html += `
      <div class="timeline-row">

        <div class="timeline-name">
          <button
            class="timeline-name-button"
            onclick="
              openAttendanceEditor(
                '${staff.user_id}',
                '${staff.staff_name}'
              )
            "
          >
            ${staff.staff_name}
          </button>
        </div>

        <div class="timeline-track">
    `;


    for (
      const item of staffAssignments
    ) {

      const rawStart =
        minutesFromStart(
          item.start_at,
          dayStart
        );

      const rawEnd =
        minutesFromStart(
          item.end_at,
          dayStart
        );

      const startMin =
        Math.max(
          0,
          Math.min(
            totalMinutes,
            rawStart
          )
        );

      const endMin =
        Math.max(
          0,
          Math.min(
            totalMinutes,
            rawEnd
          )
        );

      if (endMin <= startMin) {
        continue;
      }

      const left =
        startMin /
        totalMinutes *
        100;

      const width =
        (
          endMin -
          startMin
        ) /
        totalMinutes *
        100;

      html += `
        <div
          class="
            timeline-bar
            timeline-plan
          "
          style="
            left:${left}%;
            width:${width}%;
          "
          title="
            予定：
            ${timeText(item.start_at)}
            〜
            ${timeText(item.end_at)}
            /
            ${roleText(item.role)}
          "
        >
          ${roleText(item.role)}
        </div>
      `;
    }


    for (
      const item of staffAttendance
    ) {

      const rawStart =
        minutesFromStart(
          item.clock_in,
          dayStart
        );

      const actualEnd =
        item.clock_out
          ? new Date(item.clock_out)
          : new Date();

      const rawEnd =
        minutesFromStart(
          actualEnd,
          dayStart
        );

      const startMin =
        Math.max(
          0,
          Math.min(
            totalMinutes,
            rawStart
          )
        );

      const endMin =
        Math.max(
          0,
          Math.min(
            totalMinutes,
            rawEnd
          )
        );

      if (endMin <= startMin) {
        continue;
      }

      const left =
        startMin /
        totalMinutes *
        100;

      const width =
        (
          endMin -
          startMin
        ) /
        totalMinutes *
        100;

      html += `
        <div
          class="
            timeline-bar
            timeline-actual
          "
          onclick="
            openAttendanceEditor(
              '${staff.user_id}',
              '${staff.staff_name}'
            )
          "
          style="
            left:${left}%;
            width:${width}%;
          "
          title="
            実績：
            ${timeText(item.clock_in)}
            〜
            ${
              item.clock_out
                ? timeText(item.clock_out)
                : "勤務中"
            }
            /
            ${roleText(item.role)}
          "
        >
          ${roleText(item.role)}
        </div>
      `;
    }


    html += `
        </div>
      </div>
    `;
  }


  html += `
      </div>
    </div>
  `;

  area.innerHTML = html;
}


    async function checkLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (session) {
        await showBackArea();
      }
    }


    checkLogin();

  </script>
