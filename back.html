<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シグマ祭 裏番</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      text-align: center;
      color: #111;
    }

    h1 {
      margin: 20px 0 28px;
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #f0f0f0;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      text-align: left;
      background: #fff;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .warning {
      background: #fff4df;
    }

    .working {
      background: #e8f7e8;
    }

    .danger-text {
      color: #b42318;
    }

    .success-text {
      color: #087443;
    }

    #backArea {
      display: none;
    }

    /* 日付 */
    .date-toolbar {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      gap: 8px;
      align-items: center;
    }

    .date-toolbar button {
      margin-top: 0;
      padding: 11px 6px;
    }

    .date-toolbar input {
      margin-top: 0;
    }

    .quick-days {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .quick-days button {
      padding: 10px 4px;
      margin-top: 0;
      font-size: 13px;
    }

    .calendar-head {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }

    .calendar-head button {
      margin-top: 0;
      padding: 9px 4px;
    }

    .calendar-title {
      text-align: center;
      font-weight: bold;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }

    .calendar-week {
      font-size: 12px;
      text-align: center;
      padding: 4px 0;
      color: #666;
    }

    .calendar-day {
      margin-top: 0;
      padding: 9px 2px;
      min-height: 40px;
      font-size: 13px;
      background: #f5f5f5;
    }

    .calendar-day.selected {
      outline: 2px solid #333;
      font-weight: bold;
      background: #fff;
    }

    .calendar-day.other-month {
      opacity: .35;
    }

    /* 集計 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-grid button {
      margin-top: 0;
      min-height: 58px;
      padding: 10px;
    }

    .summary-grid button.active {
      outline: 2px solid #333;
    }

    .summary-grid strong {
      font-size: 20px;
    }

    /* タイムライン */
    .timeline-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }

    .timeline-grid {
      min-width: 1080px;
    }

    .timeline-header,
    .timeline-row {
      display: grid;
      grid-template-columns: 116px 1fr;
    }

    .timeline-name {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 6px;
      min-width: 0;
    }

    .timeline-header .timeline-name {
      z-index: 6;
      font-weight: bold;
    }

    .timeline-hours {
      position: relative;
      height: 38px;
      border-bottom: 1px solid #ddd;
    }

    .timeline-hour {
      position: absolute;
      top: 10px;
      transform: translateX(-50%);
      font-size: 11px;
      white-space: nowrap;
    }

    .timeline-track {
      position: relative;
      height: 66px;
      border-bottom: 1px solid #eee;
      background-image:
        linear-gradient(
          to right,
          transparent calc(100% - 1px),
          #e5e5e5 calc(100% - 1px)
        );
      background-size: calc(100% / 12) 100%;
    }

    .timeline-bar {
      position: absolute;
      border-radius: 7px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 2px 5px;
      box-sizing: border-box;
      font-size: 11px;
      line-height: 18px;
      cursor: pointer;
      border: none;
      margin: 0;
      text-align: left;
    }

    .timeline-plan {
      top: 7px;
      height: 23px;
      background: #d3d3d3;
      color: #111;
    }

    .timeline-actual {
      top: 36px;
      height: 23px;
      background: #333;
      color: #fff;
    }

    .timeline-name-button {
      width: 100%;
      margin: 0;
      padding: 8px 5px;
      text-align: left;
      font-size: 13px;
      background: #f5f5f5;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      margin: 8px 0 12px;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 8px;
      border-radius: 5px;
      margin-right: 5px;
    }

    .legend-plan::before {
      background: #d3d3d3;
    }

    .legend-actual::before {
      background: #333;
    }

    /* 詳細 */
    .detail-panel {
      display: none;
      margin-top: 12px;
    }

    .shift-block {
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    .shift-block:first-child {
      border-top: none;
    }

    .name-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .name-list button {
      margin-top: 0;
      text-align: left;
    }

    .filter-note {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }

    .quick-role-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .quick-role-buttons button {
      margin-top: 0;
      padding: 10px 5px;
    }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .editor-actions button {
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .quick-days {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <h1>シグマ祭 裏番</h1>

  <div id="loginArea">
    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button onclick="login()">
      ログイン
    </button>

    <p id="loginMessage"></p>
  </div>


  <div id="backArea">

    <button onclick="logout()">
      ログアウト
    </button>

    <div class="card">
      <h2>日付</h2>

      <div class="date-toolbar">
        <button onclick="moveSelectedDate(-1)" aria-label="前日">◀</button>

        <input
          id="selectedDate"
          type="date"
          onchange="onDateChanged()"
        >

        <button onclick="moveSelectedDate(1)" aria-label="翌日">▶</button>
      </div>

      <div class="quick-days">
        <button onclick="selectDate('2026-10-31')">10/31</button>
        <button onclick="selectDate('2026-11-01')">11/1</button>
        <button onclick="selectDate('2026-11-02')">11/2</button>
        <button onclick="selectDate('2026-11-03')">11/3</button>
        <button onclick="selectDate('2026-11-04')">11/4</button>
      </div>

      <div class="calendar-head">
        <button onclick="moveCalendarMonth(-1)">‹</button>
        <div id="calendarTitle" class="calendar-title"></div>
        <button onclick="moveCalendarMonth(1)">›</button>
      </div>

      <div class="calendar-grid">
        <div class="calendar-week">日</div>
        <div class="calendar-week">月</div>
        <div class="calendar-week">火</div>
        <div class="calendar-week">水</div>
        <div class="calendar-week">木</div>
        <div class="calendar-week">金</div>
        <div class="calendar-week">土</div>
      </div>

      <div id="calendarDays" class="calendar-grid"></div>
    </div>


    <div class="card">
      <h2 id="summaryTitle">勤務状況</h2>

      <div id="summary">
        集計しています...
      </div>

      <p id="filterNote" class="filter-note">
        全員を表示中
      </p>
    </div>


    <div
      id="timelineArea"
      class="card"
    >
      <h2>予定・確定勤怠</h2>

      <div class="legend">
        <span class="legend-plan">予定</span>
        <span class="legend-actual">確定勤怠</span>
      </div>

      <p class="muted">
        名前または棒をタップすると詳細を確認できます。時間は分単位で反映されます。
      </p>

      <div id="timelineContent">
        読み込み前です。
      </div>

      <div
        id="barDetail"
        class="card detail-panel"
      ></div>
    </div>


    <div class="card">
      <h2>スタッフ個別確認</h2>

      <button onclick="loadStaffStatus()">
        最新情報に更新
      </button>

      <div id="staffList"></div>

      <div
        id="staffDetail"
        class="card detail-panel"
      ></div>
    </div>


    <div
      id="attendanceEditor"
      class="card"
      style="display:none;"
    >
      <h2 id="editorStaffName">
        勤怠編集
      </h2>

      <div id="attendanceHistory"></div>

      <hr style="margin:20px 0;">

      <label>
        開始日時
        <input
          id="editorClockIn"
          type="datetime-local"
        >
      </label>

      <label>
        終了日時
        <input
          id="editorClockOut"
          type="datetime-local"
        >
      </label>

      <label>
        役割
        <select id="editorRole">
          <option value="">役割未確定</option>
          <option value="seller">売り子</option>
          <option value="tent">テント内</option>
          <option value="front">表番</option>
          <option value="back">裏番</option>
          <option value="register">レジ</option>
        </select>
      </label>

      <div class="quick-role-buttons">
        <button type="button" onclick="setQuickRole('seller')">売り子</button>
        <button type="button" onclick="setQuickRole('tent')">テント内</button>
        <button type="button" onclick="setQuickRole('front')">表番</button>
        <button type="button" onclick="setQuickRole('back')">裏番</button>
        <button type="button" onclick="setQuickRole('register')">レジ</button>
        <button type="button" onclick="setQuickRole('')">未確定</button>
      </div>

      <label>
        勤怠状態
        <select id="editorState">
          <option value="working">勤務中</option>
          <option value="break">休憩中</option>
          <option value="finished">勤務終了</option>
        </select>
      </label>

      <input
        id="editorNote"
        type="text"
        placeholder="修正理由 例：打刻忘れ"
      >

      <div class="editor-actions">
        <button onclick="saveAttendanceEdit()">
          修正を保存
        </button>

        <button onclick="prepareNewAttendance()">
          新しい勤務
        </button>

        <button onclick="addAttendance()">
          勤務を追加
        </button>

        <button onclick="deleteAttendance()">
          この勤怠を削除
        </button>
      </div>

      <button onclick="closeAttendanceEditor()">
        閉じる
      </button>

      <p id="editorMessage"></p>
    </div>

  </div>


  <script>
    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let currentStatusFilter = "all";
    let selectedDateString = "";
    let calendarYear = 0;
    let calendarMonth = 0;

    let editingUserId = null;
    let editingAttendanceId = null;

    let cachedStaffMembers = [];
    let cachedAssignments = [];
    let cachedAttendance = [];


    function pad2(value) {
      return String(value).padStart(2, "0");
    }


    function dateToYmd(date) {
      return (
        date.getFullYear() +
        "-" +
        pad2(date.getMonth() + 1) +
        "-" +
        pad2(date.getDate())
      );
    }


    function ymdToLocalDate(value) {
      const [year, month, day] =
        value.split("-").map(Number);

      return new Date(
        year,
        month - 1,
        day,
        0, 0, 0, 0
      );
    }


    function selectedDayRange() {
      const start =
        ymdToLocalDate(selectedDateString);

      const end =
        new Date(
          start.getFullYear(),
          start.getMonth(),
          start.getDate() + 1,
          0, 0, 0, 0
        );

      return { start, end };
    }


    function isSelectedToday() {
      return (
        selectedDateString ===
        dateToYmd(new Date())
      );
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function roleText(role) {
      if (role === "seller") return "売り子";
      if (role === "tent") return "テント内";
      if (role === "front") return "表番";
      if (role === "back") return "裏番";
      if (role === "register") return "レジ";
      return "未確定";
    }


    function stateText(state) {
      if (state === "working") return "勤務中";
      if (state === "break") return "休憩中";
      if (state === "finished") return "勤務終了";
      return "不明";
    }


    function timeText(value) {
      if (!value) return "勤務中";

      return new Date(value)
        .toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );
    }


    function dateTimeText(value) {
      if (!value) return "未入力";

      return new Date(value)
        .toLocaleString(
          "ja-JP",
          {
            month: "numeric",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );
    }


    async function login() {
      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      message.textContent =
        "ログインしています...";

      const { error } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {
        message.textContent =
          "ログイン失敗：" +
          error.message;
        return;
      }

      message.textContent = "";

      await showBackArea();
    }


    async function logout() {
      await supabaseClient.auth.signOut();

      document.getElementById("backArea")
        .style.display = "none";

      document.getElementById("loginArea")
        .style.display = "block";
    }


    async function showBackArea() {
      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {
        return;
      }

      const {
        data: allowed,
        error
      } =
        await supabaseClient
          .rpc("is_current_back");

      if (error || !allowed) {
        document.getElementById(
          "loginMessage"
        ).textContent =
          "現在、裏番として利用できません。";

        await supabaseClient.auth.signOut();
        return;
      }

      document.getElementById("loginArea")
        .style.display = "none";

      document.getElementById("backArea")
        .style.display = "block";

      initializeDate();

      await loadStaffStatus();
    }


    function initializeDate() {
      if (!selectedDateString) {
        selectedDateString =
          dateToYmd(new Date());
      }

      document.getElementById(
        "selectedDate"
      ).value =
        selectedDateString;

      const date =
        ymdToLocalDate(selectedDateString);

      calendarYear =
        date.getFullYear();

      calendarMonth =
        date.getMonth();

      renderCalendar();
    }


    function selectDate(value) {
      selectedDateString = value;

      document.getElementById(
        "selectedDate"
      ).value = value;

      const date =
        ymdToLocalDate(value);

      calendarYear =
        date.getFullYear();

      calendarMonth =
        date.getMonth();

      currentStatusFilter = "all";

      renderCalendar();
      clearOpenPanels();
      loadStaffStatus();
    }


    function onDateChanged() {
      const value =
        document.getElementById(
          "selectedDate"
        ).value;

      if (!value) return;

      selectDate(value);
    }


    function moveSelectedDate(days) {
      const date =
        ymdToLocalDate(selectedDateString);

      date.setDate(
        date.getDate() + days
      );

      selectDate(
        dateToYmd(date)
      );
    }


    function moveCalendarMonth(amount) {
      calendarMonth += amount;

      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      }

      if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      }

      renderCalendar();
    }


    function renderCalendar() {
      const title =
        document.getElementById(
          "calendarTitle"
        );

      const daysArea =
        document.getElementById(
          "calendarDays"
        );

      title.textContent =
        `${calendarYear}年${calendarMonth + 1}月`;

      const first =
        new Date(
          calendarYear,
          calendarMonth,
          1
        );

      const gridStart =
        new Date(
          calendarYear,
          calendarMonth,
          1 - first.getDay()
        );

      let html = "";

      for (let i = 0; i < 42; i++) {
        const day =
          new Date(
            gridStart.getFullYear(),
            gridStart.getMonth(),
            gridStart.getDate() + i
          );

        const value =
          dateToYmd(day);

        const classes = [
          "calendar-day"
        ];

        if (
          day.getMonth() !==
          calendarMonth
        ) {
          classes.push("other-month");
        }

        if (
          value ===
          selectedDateString
        ) {
          classes.push("selected");
        }

        html += `
          <button
            class="${classes.join(" ")}"
            onclick="selectDate('${value}')"
          >
            ${day.getDate()}
          </button>
        `;
      }

      daysArea.innerHTML = html;
    }


    function clearOpenPanels() {
      document.getElementById(
        "barDetail"
      ).style.display = "none";

      document.getElementById(
        "staffDetail"
      ).style.display = "none";

      closeAttendanceEditor();
    }


    function setStatusFilter(filter) {
      currentStatusFilter = filter;

      renderStaffList();
      renderSummary();
    }


    async function loadStaffStatus() {
      const list =
        document.getElementById(
          "staffList"
        );

      const timeline =
        document.getElementById(
          "timelineContent"
        );

      list.innerHTML =
        "読み込み中...";

      timeline.innerHTML =
        "読み込み中...";

      const { start, end } =
        selectedDayRange();

      const {
        data: staffMembers,
        error: staffError
      } =
        await supabaseClient
          .from("staff_members")
          .select(
            "user_id,staff_name,is_active"
          )
          .eq("is_active", true)
          .order("staff_name");

      if (staffError) {
        list.innerHTML =
          "スタッフ取得エラー：" +
          staffError.message;
        return;
      }

      const {
        data: assignments,
        error: assignmentError
      } =
        await supabaseClient
          .from("staff_assignments")
          .select(
            "id,user_id,role,start_at,end_at"
          )
          .lt(
            "start_at",
            end.toISOString()
          )
          .gt(
            "end_at",
            start.toISOString()
          )
          .order(
            "start_at",
            { ascending: true }
          );

      if (assignmentError) {
        list.innerHTML =
          "予定取得エラー：" +
          assignmentError.message;
        return;
      }

      const {
        data: attendance,
        error: attendanceError
      } =
        await supabaseClient
          .from("staff_attendance")
          .select(
            "id,user_id,role,clock_in,clock_out,attendance_state,corrected_at,correction_note"
          )
          .gte(
            "clock_in",
            start.toISOString()
          )
          .lt(
            "clock_in",
            end.toISOString()
          )
          .order(
            "clock_in",
            { ascending: true }
          );

      if (attendanceError) {
        list.innerHTML =
          "勤怠取得エラー：" +
          attendanceError.message;
        return;
      }

      cachedStaffMembers =
        staffMembers || [];

      cachedAssignments =
        assignments || [];

      cachedAttendance =
        attendance || [];

      renderSummary();
      renderTimeline();
      renderStaffList();
    }


    function buildMaps() {
      const assignmentsByUser = {};
      const attendanceByUser = {};
      const latestAttendanceMap = {};

      for (
        const item of cachedAssignments
      ) {
        if (
          !assignmentsByUser[
            item.user_id
          ]
        ) {
          assignmentsByUser[
            item.user_id
          ] = [];
        }

        assignmentsByUser[
          item.user_id
        ].push(item);
      }

      for (
        const item of cachedAttendance
      ) {
        if (
          !attendanceByUser[
            item.user_id
          ]
        ) {
          attendanceByUser[
            item.user_id
          ] = [];
        }

        attendanceByUser[
          item.user_id
        ].push(item);

        latestAttendanceMap[
          item.user_id
        ] = item;
      }

      return {
        assignmentsByUser,
        attendanceByUser,
        latestAttendanceMap
      };
    }


    function getStatusForStaff(
      staff,
      maps
    ) {
      const userAssignments =
        maps.assignmentsByUser[
          staff.user_id
        ] || [];

      const userAttendance =
        maps.attendanceByUser[
          staff.user_id
        ] || [];

      const actual =
        maps.latestAttendanceMap[
          staff.user_id
        ] || null;

      let currentAssignment = null;
      let isLate = false;
      let isOvertime = false;

      if (isSelectedToday()) {
        const now =
          new Date();

        currentAssignment =
          userAssignments.find(
            item =>
              new Date(item.start_at) <=
                now &&
              new Date(item.end_at) >=
                now
          ) || null;

        if (currentAssignment) {
          const started =
            userAttendance.some(
              item => {
                const clockIn =
                  new Date(item.clock_in);

                return (
                  clockIn >=
                    new Date(
                      currentAssignment.start_at
                    ) &&
                  clockIn <=
                    new Date(
                      currentAssignment.end_at
                    )
                );
              }
            );

          isLate =
            !started &&
            !(
              actual?.attendance_state ===
              "working"
            );
        }

        const pastAssignments =
          userAssignments.filter(
            item =>
              new Date(item.end_at) <
              now
          );

        const reference =
          currentAssignment ||
          (
            pastAssignments.length
              ? pastAssignments[
                  pastAssignments.length - 1
                ]
              : null
          );

        isOvertime =
          !!reference &&
          now >
            new Date(reference.end_at) &&
          actual?.attendance_state ===
            "working";
      }

      return {
        userAssignments,
        userAttendance,
        actual,
        currentAssignment,
        isLate,
        isOvertime
      };
    }


    function filterMatches(status) {
      if (
        currentStatusFilter === "all"
      ) {
        return true;
      }

      if (
        currentStatusFilter ===
        "working"
      ) {
        return (
          status.actual
            ?.attendance_state ===
          "working"
        );
      }

      if (
        currentStatusFilter ===
        "break"
      ) {
        return (
          status.actual
            ?.attendance_state ===
          "break"
        );
      }

      if (
        currentStatusFilter ===
        "register"
      ) {
        return (
          status.actual
            ?.attendance_state ===
            "working" &&
          status.actual?.role ===
            "register"
        );
      }

      if (
        currentStatusFilter ===
        "late"
      ) {
        return status.isLate;
      }

      if (
        currentStatusFilter ===
        "overtime"
      ) {
        return status.isOvertime;
      }

      if (
        currentStatusFilter ===
        "unconfirmed"
      ) {
        return (
          status.userAttendance
            .some(
              item => !item.role
            )
        );
      }

      return true;
    }

    function minutesFromStart(
      value,
      dayStart
    ) {
      return (
        new Date(value).getTime() -
        dayStart.getTime()
      ) / 60000;
    }


    function renderTimeline() {
      const area =
        document.getElementById(
          "timelineContent"
        );

      const selected =
        ymdToLocalDate(
          selectedDateString
        );

      const dayStart =
        new Date(
          selected.getFullYear(),
          selected.getMonth(),
          selected.getDate(),
          8, 0, 0, 0
        );

      const dayEnd =
        new Date(
          selected.getFullYear(),
          selected.getMonth(),
          selected.getDate(),
          20, 0, 0, 0
        );

      const totalMinutes =
        (
          dayEnd.getTime() -
          dayStart.getTime()
        ) / 60000;

      const clampMinutes =
        value =>
          Math.max(
            0,
            Math.min(
              totalMinutes,
              value
            )
          );

      const maps =
        buildMaps();

      let html = `
        <div class="timeline-scroll">
          <div class="timeline-grid">

            <div class="timeline-header">
              <div class="timeline-name">
                名前
              </div>

              <div class="timeline-hours">
      `;

      for (
        let hour = 8;
        hour <= 20;
        hour++
      ) {
        const minutes =
          (hour - 8) * 60;

        const left =
          minutes /
          totalMinutes *
          100;

        html += `
          <span
            class="timeline-hour"
            style="left:${left}%"
          >
            ${hour}:00
          </span>
        `;
      }

      html += `
              </div>
            </div>
      `;

      let shown = 0;

      for (
        const staff of cachedStaffMembers
      ) {
        const status =
          getStatusForStaff(
            staff,
            maps
          );

        if (!filterMatches(status)) {
          continue;
        }

        shown++;

        const userId =
          staff.user_id;

        const safeName =
          escapeHtml(
            staff.staff_name
          );

        html += `
          <div class="timeline-row">

            <div class="timeline-name">
              <button
                class="timeline-name-button"
                onclick="
                  showStaffDetail(
                    '${userId}'
                  )
                "
              >
                ${safeName}
              </button>
            </div>

            <div class="timeline-track">
        `;

        for (
          const item of
            status.userAssignments
        ) {
          const startMin =
            clampMinutes(
              minutesFromStart(
                item.start_at,
                dayStart
              )
            );

          const endMin =
            clampMinutes(
              minutesFromStart(
                item.end_at,
                dayStart
              )
            );

          if (
            endMin <= startMin
          ) {
            continue;
          }

          const left =
            startMin /
            totalMinutes *
            100;

          const width =
            (
              endMin -
              startMin
            ) /
            totalMinutes *
            100;

          html += `
            <button
              class="
                timeline-bar
                timeline-plan
              "
              style="
                left:${left}%;
                width:${width}%;
              "
              onclick="
                showBarDetail(
                  'plan',
                  '${userId}',
                  '${item.id}'
                )
              "
            >
              ${escapeHtml(
                roleText(item.role)
              )}
            </button>
          `;
        }

        for (
          const item of
            status.userAttendance
        ) {
          const actualEnd =
            item.clock_out
              ? new Date(
                  item.clock_out
                )
              : (
                  isSelectedToday()
                    ? new Date()
                    : dayEnd
                );

          const startMin =
            clampMinutes(
              minutesFromStart(
                item.clock_in,
                dayStart
              )
            );

          const endMin =
            clampMinutes(
              minutesFromStart(
                actualEnd,
                dayStart
              )
            );

          if (
            endMin <= startMin
          ) {
            continue;
          }

          const left =
            startMin /
            totalMinutes *
            100;

          const width =
            (
              endMin -
              startMin
            ) /
            totalMinutes *
            100;

          html += `
            <button
              class="
                timeline-bar
                timeline-actual
              "
              style="
                left:${left}%;
                width:${width}%;
              "
              onclick="
                showBarDetail(
                  'actual',
                  '${userId}',
                  '${item.id}'
                )
              "
            >
              ${escapeHtml(
                roleText(item.role)
              )}
            </button>
          `;
        }

        html += `
            </div>
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;

      if (shown === 0) {
        html += `
          <p>
            この条件に該当するスタッフはいません。
          </p>
        `;
      }

      area.innerHTML = html;
    }

    function toLocalDateTimeInput(
      value
    ) {
      const date =
        new Date(value);

      const local =
        new Date(
          date.getTime() -
          date.getTimezoneOffset() *
          60000
        );

      return local
        .toISOString()
        .slice(0, 16);
    }


    async function openAttendanceEditor(
      userId,
      attendanceId = null
    ) {
      editingUserId = userId;
      editingAttendanceId = null;

      const staff =
        getStaff(userId);

      document.getElementById(
        "editorStaffName"
      ).textContent =
        (
          staff?.staff_name ||
          "スタッフ"
        ) +
        " の勤怠編集";

      document.getElementById(
        "attendanceEditor"
      ).style.display =
        "block";

      document.getElementById(
        "editorMessage"
      ).textContent =
        "勤怠を読み込んでいます...";

      const { start, end } =
        selectedDayRange();

      const {
        data,
        error
      } =
        await supabaseClient
          .from("staff_attendance")
          .select(
            "id,role,clock_in,clock_out,attendance_state,corrected_at,correction_note"
          )
          .eq("user_id", userId)
          .gte(
            "clock_in",
            start.toISOString()
          )
          .lt(
            "clock_in",
            end.toISOString()
          )
          .order(
            "clock_in",
            { ascending: true }
          );

      if (error) {
        document.getElementById(
          "editorMessage"
        ).textContent =
          "取得エラー：" +
          error.message;

        return;
      }

      showAttendanceHistory(
        data || []
      );

      if (attendanceId) {
        const selected =
          (data || []).find(
            item =>
              String(item.id) ===
              String(attendanceId)
          );

        if (selected) {
          selectAttendance(
            selected.id,
            selected.role,
            selected.clock_in,
            selected.clock_out,
            selected.attendance_state
          );
        }
      } else {
        clearAttendanceEditor();
      }

      document.getElementById(
        "attendanceEditor"
      ).scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function validateEditorTimes(
      clockInValue,
      clockOutValue,
      stateValue
    ) {
      if (!clockInValue) {
        return "開始時刻を入力してください。";
      }

      if (
        clockOutValue &&
        new Date(clockOutValue) <=
          new Date(clockInValue)
      ) {
        return "終了時刻は開始時刻より後にしてください。";
      }

      if (
        stateValue !== "working" &&
        !clockOutValue
      ) {
        return "休憩中・勤務終了にする場合は終了時刻を入力してください。";
      }

      return "";
    }

        document.getElementById(

        ).value;

      const stateValue =
        document.getElementById(
          "editorState"
        ).value;

      const note =
        document.getElementById(
          "editorNote"
        ).value.trim();

      const validation =
        validateEditorTimes(
          clockInValue,
          clockOutValue,
          stateValue
        );

      if (validation) {
        message.textContent =
          validation;
        return;
      }

      const {

      const { error } =

          .from("staff_attendance")
          .update({
            clock_in:
              new Date(
                clockInValue
              ).toISOString(),

            clock_out:
              clockOutValue
                ? new Date(
                    clockOutValue
                  ).toISOString()
                : null,

            role:
              roleValue || null,

            attendance_state:
              stateValue,

            corrected_by:
              user.id,

            corrected_at:
              new Date().toISOString(),

            correction_note:
              note || null
          })
          .eq(
            "id",
            editingAttendanceId
          );

      if (error) {
        message.textContent =
          "保存エラー：" +
          error.message;
        return;
      }

      message.textContent =
        "✅ 勤怠を修正しました。";

      await loadStaffStatus();

      await openAttendanceEditor(
        editingUserId,
        editingAttendanceId
      );
    }


    async function addAttendance() {
      const message =
        document.getElementById(
          "editorMessage"
        );

      if (!editingUserId) {
        return;
      }

      if (editingAttendanceId) {
        message.textContent =
          "既存勤怠を選択中です。「新しい勤務」を押してから追加してください。";
        return;
      }

      const clockInValue =
        document.getElementById(
          "editorClockIn"
        ).value;

      const clockOutValue =
        document.getElementById(
          "editorClockOut"
        ).value;

      const roleValue =
        document.getElementById(
          "editorRole"
        ).value;

      const stateValue =
        document.getElementById(
          "editorState"
        ).value;

      const note =
        document.getElementById(
          "editorNote"
        ).value.trim();

      const validation =
        validateEditorTimes(
          clockInValue,
          clockOutValue,
          stateValue
        );

      if (validation) {
        message.textContent =
          validation;
        return;
      }

      const {
        data: { user }
      } =
        await supabaseClient.auth
          .getUser();

      const {
        data,
        error
      } =
        await supabaseClient
          .from("staff_attendance")
          .insert({
            user_id:
              editingUserId,

            role:
              roleValue || null,

            clock_in:
              new Date(
                clockInValue
              ).toISOString(),

            clock_out:
              clockOutValue
                ? new Date(
                    clockOutValue
                  ).toISOString()
                : null,

            attendance_state:
              stateValue,

            corrected_by:
              user.id,

            corrected_at:
              new Date().toISOString(),

            correction_note:
              note ||
              "裏番による追加"
          })
          .select("id")
          .single();

      if (error) {
        message.textContent =
          "追加エラー：" +
          error.message;
        return;
      }

      editingAttendanceId =
        data.id;

      message.textContent =
        "✅ 勤務を追加しました。";

      await loadStaffStatus();

      await openAttendanceEditor(
        editingUserId,
        data.id
      );
    }


    async function deleteAttendance() {
      const message =
        document.getElementById(
          "editorMessage"
        );

      if (!editingAttendanceId) {
        message.textContent =
          "削除する勤怠を選択してください。";
        return;
      }

      const confirmed =
        confirm(
          "この勤怠記録を削除しますか？"
        );

      if (!confirmed) {
        return;
      }

      const userId =
        editingUserId;

      const { error } =
        await supabaseClient
          .from("staff_attendance")
          .delete()
          .eq(
            "id",
            editingAttendanceId
          );

      if (error) {
        message.textContent =
          "削除エラー：" +
          error.message;
        return;
      }

      editingAttendanceId = null;

      await loadStaffStatus();

      await openAttendanceEditor(
        userId
      );

      document.getElementById(
        "editorMessage"
      ).textContent =
        "✅ 勤怠を削除しました。";
    }


    function closeAttendanceEditor() {
      document.getElementById(
        "attendanceEditor"
      ).style.display =
        "none";

      editingUserId = null;
      editingAttendanceId = null;
    }


    async function checkLogin() {
      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (session) {
        await showBackArea();
      }
    }


    checkLogin();
  </script>

</body>
</html>
