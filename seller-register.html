<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>発行者登録</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>シグマ祭 発行者登録</h1>

  <div id="loadingArea">
    招待情報を確認しています...
  </div>

  <div
    id="registerArea"
    style="display:none;"
  >

    <h2>発行者アカウント登録</h2>

    <p id="sellerInfo"></p>

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <br><br>

    <input
      id="passwordConfirm"
      type="password"
      placeholder="パスワード確認"
    >

    <br><br>

    <button onclick="registerSeller()">
      登録する
    </button>

    <p id="message"></p>

  </div>

  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get("token");

    async function loadInvite() {

  const loadingArea =
    document.getElementById("loadingArea");

  const registerArea =
    document.getElementById("registerArea");

  const sellerInfo =
    document.getElementById("sellerInfo");

  if (!token) {
    loadingArea.textContent =
      "招待URLが正しくありません。";
    return;
  }

  loadingArea.textContent =
    "招待情報を確認しています...";

  const { data, error } =
    await supabaseClient.functions.invoke(
      "register-seller",
      {
        body: {
          action: "check",
          token: token
        }
      }
    );

  if (error) {

    let errorMessage = error.message;

    try {
      const errorBody =
        await error.context.json();

      if (errorBody?.error) {
        errorMessage = errorBody.error;
      }
    } catch (e) {
      console.log(e);
    }

    loadingArea.textContent =
      "エラー：" + errorMessage;

    return;
  }

  if (data?.error) {
    loadingArea.textContent =
      "エラー：" + data.error;
    return;
  }

  loadingArea.style.display = "none";

  sellerInfo.innerHTML = `
    発行者名：${data.seller_name}<br>
    メールアドレス：${data.email}
  `;

  registerArea.style.display = "block";
}

    async function registerSeller() {

  const password =
    document.getElementById(
      "password"
    ).value;

  const passwordConfirm =
    document.getElementById(
      "passwordConfirm"
    ).value;

  const message =
    document.getElementById(
      "message"
    );

  if (!password) {
    message.textContent =
      "パスワードを入力してください。";
    return;
  }

  if (password.length < 8) {
    message.textContent =
      "パスワードは8文字以上にしてください。";
    return;
  }

  if (password !== passwordConfirm) {
    message.textContent =
      "パスワードが一致していません。";
    return;
  }

  message.textContent =
    "登録しています...";

  const { data, error } =
    await supabaseClient.functions.invoke(
      "register-seller",
      {
        body: {
          action: "register",
          token: token,
          password: password
        }
      }
    );

  if (error) {

    let errorMessage = error.message;

    try {
      const errorBody =
        await error.context.json();

      if (errorBody?.error) {
        errorMessage = errorBody.error;
      }
    } catch (e) {
      console.log(e);
    }

    message.textContent =
      "登録エラー：" + errorMessage;

    return;
  }

  if (data?.error) {
    message.textContent =
      "登録エラー：" + data.error;
    return;
  }

  if (data.existing_user) {
    message.innerHTML = `
      ✅ 発行者登録が完了しました。<br><br>
      既存アカウントが使用されます。<br>
      これまでのパスワードでログインしてください。<br><br>

      <a href="seller.html">
        販売者ログインへ
      </a>
    `;
  } else {
    message.innerHTML = `
      ✅ 発行者登録が完了しました。<br><br>

      <a href="seller.html">
        販売者ログインへ
      </a>
    `;
  }

  document.getElementById(
    "password"
  ).disabled = true;

  document.getElementById(
    "passwordConfirm"
  ).disabled = true;
}

    loadInvite();

  </script>

</body>
</html>
