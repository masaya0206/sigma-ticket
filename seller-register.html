<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>シグマ祭 スタッフ登録</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card {
      margin-top: 18px;
      padding: 18px;
      background: #f2f2f2;
      border-radius: 12px;
      text-align: left;
    }

    .success {
      background: #e8f7e8 !important;
    }

    .danger {
      background: #ffe8e8 !important;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    #registerArea {
      display: none;
    }
  </style>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シグマ祭">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <style id="sigma-red-theme">
    :root {
      --sigma-red: #b5121b;
      --sigma-red-dark: #8f0e15;
      --sigma-red-soft: #fff1f2;
      --sigma-gold: #d9a526;
      --sigma-bg: #f7f4f2;
      --sigma-surface: #ffffff;
      --sigma-ink: #1c1c1e;
      --sigma-muted: #6e6e73;
      --sigma-line: #ece7e4;
      --sigma-green: #15803d;
      --sigma-shadow: 0 8px 24px rgba(74, 25, 25, 0.08);
    }

    html {
      background: var(--sigma-bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif !important;
      color: var(--sigma-ink) !important;
      background: var(--sigma-bg) !important;
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 20px !important;
    }

    body > h1:first-of-type {
      margin: -20px -20px 22px !important;
      padding:
        max(36px, env(safe-area-inset-top))
        22px
        34px !important;
      color: #fff !important;
      background:
        radial-gradient(circle at 86% 18%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(145deg, var(--sigma-red), var(--sigma-red-dark)) !important;
      border-radius: 0 0 28px 28px !important;
      font-size: 30px !important;
      letter-spacing: .02em !important;
      text-align: left !important;
    }

    input,
    select,
    textarea {
      color: var(--sigma-ink) !important;
      background: #fff !important;
      border: 1px solid #ddd5d1 !important;
      border-radius: 14px !important;
      box-shadow: none !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none !important;
      border-color: var(--sigma-red) !important;
      box-shadow: 0 0 0 3px rgba(181,18,27,.10) !important;
    }

    button {
      border-radius: 14px !important;
      font-weight: 750 !important;
      color: var(--sigma-red) !important;
      background: var(--sigma-red-soft) !important;
      box-shadow: none !important;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .45 !important;
    }

    #loginArea,
    #sellerArea,
    #staffArea,
    #adminArea,
    #backArea,
    #frontArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card,
    .subcard {
      border-radius: 20px !important;
    }

    #loginArea,
    #ticketArea,
    #ticketResult,
    #claimArea,
    #mySummaryArea,
    #summaryArea,
    #logArea,
    #newPasswordArea,
    .card {
      background: var(--sigma-surface) !important;
      border: 1px solid rgba(181,18,27,.06) !important;
      box-shadow: var(--sigma-shadow) !important;
    }

    .subcard {
      background: #fff !important;
      border-color: var(--sigma-line) !important;
    }

    .success {
      background: #ecfdf3 !important;
      color: #14532d !important;
    }

    .danger {
      background: #fff0f0 !important;
      color: #7f1d1d !important;
    }

    .warning {
      background: #fff8e8 !important;
      color: #6b4a00 !important;
    }

    a {
      color: var(--sigma-red) !important;
    }

    strong {
      color: inherit;
    }

    hr {
      border-color: var(--sigma-line) !important;
    }

    .ticket-code {
      color: var(--sigma-red) !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px !important;
      }

      body > h1:first-of-type {
        margin-left: -16px !important;
        margin-right: -16px !important;
      }
    }
  </style>

</head>

<body>

  <h1>シグマ祭 スタッフ登録</h1>


  <div
    id="loadingArea"
    class="card"
  >
    招待情報を確認しています...
  </div>


  <div
    id="registerArea"
    class="card"
  >

    <h2>アカウント登録</h2>

    <p id="sellerInfo"></p>

    <p class="small">
      このアカウントはスタッフ画面と
      チケット発行画面で共通して使用します。
    </p>

    <input
      id="password"
      type="password"
      placeholder="パスワード（8文字以上）"
      autocomplete="new-password"
    >

    <input
      id="passwordConfirm"
      type="password"
      placeholder="パスワード確認"
      autocomplete="new-password"
    >

    <button
      id="registerButton"
      onclick="registerSeller()"
    >
      登録する
    </button>

    <p id="message"></p>

  </div>


  <script>

    const SUPABASE_URL =
      "https://gsniytemgrbtgfywhqlu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get("token");


    async function getFunctionErrorMessage(
      error
    ) {

      if (!error) {
        return "";
      }

      let text =
        error.message ||
        "不明なエラー";

      try {

        const body =
          await error.context.json();

        text =
          body?.error ??
          body?.message ??
          JSON.stringify(body);

      } catch (e) {
      }

      return text;
    }


    async function loadInvite() {

      const loadingArea =
        document.getElementById(
          "loadingArea"
        );

      const registerArea =
        document.getElementById(
          "registerArea"
        );

      const sellerInfo =
        document.getElementById(
          "sellerInfo"
        );

      if (!token) {

        loadingArea.className =
          "card danger";

        loadingArea.textContent =
          "招待URLが正しくありません。";

        return;
      }

      loadingArea.textContent =
        "招待情報を確認しています...";

      const {
        data,
        error
      } =
        await supabaseClient
          .functions.invoke(
            "register-seller",
            {
              body: {
                action:
                  "check",
                token
              }
            }
          );

      if (error) {

        loadingArea.className =
          "card danger";

        loadingArea.textContent =
          "エラー：" +
          await getFunctionErrorMessage(
            error
          );

        return;
      }

      if (data?.error) {

        loadingArea.className =
          "card danger";

        loadingArea.textContent =
          "エラー：" +
          data.error;

        return;
      }

      loadingArea.style.display =
        "none";

      sellerInfo.innerHTML = `
        <strong>スタッフ名</strong><br>
        ${data.seller_name}

        <br><br>

        <strong>メールアドレス</strong><br>
        ${data.email}
      `;

      registerArea.style.display =
        "block";
    }


    async function registerSeller() {

      const password =
        document.getElementById(
          "password"
        ).value;

      const passwordConfirm =
        document.getElementById(
          "passwordConfirm"
        ).value;

      const message =
        document.getElementById(
          "message"
        );

      const button =
        document.getElementById(
          "registerButton"
        );

      if (!token) {

        message.textContent =
          "招待情報がありません。";

        return;
      }

      if (!password) {

        message.textContent =
          "パスワードを入力してください。";

        return;
      }

      if (
        password.length < 8
      ) {

        message.textContent =
          "パスワードは8文字以上にしてください。";

        return;
      }

      if (
        password !==
        passwordConfirm
      ) {

        message.textContent =
          "パスワードが一致していません。";

        return;
      }

      button.disabled = true;

      message.textContent =
        "登録しています...";

      const {
        data,
        error
      } =
        await supabaseClient
          .functions.invoke(
            "register-seller",
            {
              body: {
                action:
                  "register",
                token,
                password
              }
            }
          );

      if (error) {

        button.disabled =
          false;

        message.textContent =
          "登録エラー：" +
          await getFunctionErrorMessage(
            error
          );

        return;
      }

      if (data?.error) {

        button.disabled =
          false;

        message.textContent =
          "登録エラー：" +
          data.error;

        return;
      }

      document.getElementById(
        "password"
      ).disabled =
        true;

      document.getElementById(
        "passwordConfirm"
      ).disabled =
        true;

      button.style.display =
        "none";

      const registerArea =
        document.getElementById(
          "registerArea"
        );

      registerArea.className =
        "card success";

      if (data.existing_user) {

        message.innerHTML = `
          <strong>
            ✅ スタッフ登録が完了しました。
          </strong>

          <br><br>

          既存のアカウントが使用されます。
          今回入力したパスワードではなく、
          これまで使用していたパスワードで
          ログインしてください。

          <br><br>

          <button
            onclick="
              location.href='home.html'
            "
          >
            ポータルへ
          </button>

          <button
            onclick="
              location.href='seller.html'
            "
          >
            チケット発行画面へ
          </button>
        `;

      } else {

        message.innerHTML = `
          <strong>
            ✅ スタッフ登録が完了しました。
          </strong>

          <br><br>

          登録したメールアドレスと
          パスワードでログインできます。

          <br><br>

          <button
            onclick="
              location.href='home.html'
            "
          >
            ポータルへ
          </button>

          <button
            onclick="
              location.href='seller.html'
            "
          >
            チケット発行画面へ
          </button>
        `;
      }
    }


    loadInvite();

  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
