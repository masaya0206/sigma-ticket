<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイポイント</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input,select,textarea{border:1px solid #ddd5d1;background:#fff}button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}.primary{background:#b5121b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#6e6e73;line-height:1.5}.row{padding:10px 0;border-top:1px solid #eee}.score{font-size:28px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>⭐ マイポイント</h1></header><main><div class="card"><div class="grid"><button class="primary" onclick="load(false)">暫定ポイント</button><button onclick="load(true)">最終ポイント</button></div><p class="small">暫定値は1時間単位、最終値は30分単位で管理者が再計算します。</p></div><div class="card"><div id="total" class="score">-- pt</div><div id="rows"></div></div><button onclick="location.href='home.html'">ポータルへ戻る</button></main><script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const names={inside:'内',outside:'外',shopping:'買い出し',seller:'売り子',seller_team:'売り子チーム分配',register:'レジ',front:'表番',back:'裏番',cook:'調理',support:'サポート',shopping_team:'車持ちチーム',shopping_helper:'買い出し手伝い'};async function load(finalFlag){rows.innerHTML='読み込み中...';const {data,error}=await sb.rpc('my_point_summary',{p_final:finalFlag});if(error){rows.textContent=error.message;return}let inside=0,outside=0,shopping=0;rows.innerHTML=(data||[]).map(x=>{const p=Number(x.points)||0;if(x.point_side==='inside')inside+=p;else if(x.point_side==='outside')outside+=p;else shopping+=p;return `<div class="row"><span class="pill">${names[x.point_side]||x.point_side}</span> <b>${names[x.point_type]||x.point_type}</b><span style="float:right">${p.toFixed(2)} pt</span></div>`}).join('')||'ポイントはまだありません';let factor=1;if(finalFlag){const {data:c}=await sb.rpc('final_point_conversion');if(c&&c[0])factor=Number(c[0].inside_factor)||1;}const sum=inside*factor+outside+shopping;total.textContent=sum.toFixed(2)+' pt'+(finalFlag?'（確定）':'（暫定）');if(finalFlag)rows.innerHTML=`<div class="row"><b>内pt換算係数</b><span style="float:right">× ${factor.toFixed(4)}</span></div>`+rows.innerHTML;}load(false);</script></body></html>
