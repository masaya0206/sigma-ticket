<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイポイント</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4f2;color:#1c1c1e}
header{background:linear-gradient(145deg,#b5121b,#8f0e15);color:#fff;padding:34px 22px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:27px}
main{max-width:720px;margin:auto;padding:18px}https://github.com/masaya0206/sigma-ticket/edit/main/points-my.html
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(74,25,25,.07)}
button,input,select,textarea{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}
input,select,textarea{border:1px solid #ddd5d1;background:#fff}
button{border:0;background:#fff1f2;color:#b5121b;font-weight:800}
.primary{background:#b5121b;color:#fff}
.danger{background:#7f1d1d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#6e6e73;line-height:1.55}
.big{font-size:30px;font-weight:900}
.row{padding:11px 0;border-top:1px solid #eee}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1f2;color:#b5121b;font-size:12px;font-weight:800}
.ok{color:#15803d;font-weight:800}.err{color:#b00020;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.scorebox{background:#fff8f8;border-radius:15px;padding:14px}</style></head><body>
<header><h1>⭐ マイポイント</h1></header><main>
<div class="card"><h2>前売り</h2><div class="big" id="pre">-</div><div id="res" class="small"></div></div>
<div class="card"><h2>当日（別部門）</h2><div id="mode" class="pill">暫定</div><div class="grid" style="margin-top:12px"><div class="scorebox">テント内<div class="big" id="inside">0</div></div><div class="scorebox">テント外<div class="big" id="outside">0</div></div><div class="scorebox">買い出し<div class="big" id="shopping">0</div></div><div class="scorebox">準備・片付け<div class="big" id="special">0</div></div></div><p class="small">前売りptと当日ptは別部門です。誤解を避けるため総合ptは表示しません。</p></div>
<div class="card"><h2>内訳</h2><div id="details"></div></div><button onclick="location.href='staff.html'">スタッフ画面へ戻る</button></main><script>
const sb=supabase.createClient("https://gsniytemgrbtgfywhqlu.supabase.co","sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn");
async function run(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='home.html';return}const pr=await sb.rpc('my_presale_status');if(!pr.error){pre.textContent=Number(pr.data?.presale_points||0).toFixed(1)+' pt';res.textContent='残券 '+(pr.data?.residual_remaining||0)+'枚 / '+Number(pr.data?.residual_value||0).toLocaleString()+'円相当'}let r=await sb.rpc('my_point_summary',{p_final:true});let final=true;if(r.error||!r.data?.length){r=await sb.rpc('my_point_summary',{p_final:false});final=false}mode.textContent=final?'確定':'暫定';const sum={inside:0,outside:0,shopping:0,special:0};for(const x of (r.data||[]))sum[x.point_side]=(sum[x.point_side]||0)+Number(x.points||0);inside.textContent=sum.inside.toFixed(1)+' pt';outside.textContent=sum.outside.toFixed(1)+' pt';shopping.textContent=sum.shopping.toFixed(1)+' pt';special.textContent=sum.special.toFixed(1)+' pt';details.innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<div class="row"><b>${x.point_type}</b><span style="float:right">${Number(x.points).toFixed(2)} pt</span><br><span class="small">${x.point_side}</span></div>`).join(''):'ポイントはまだありません。'}
run();
</script></body></html>
