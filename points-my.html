<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自分のポイント</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f5;margin:0;color:#251313}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #f0caca;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #8b000012}h1{font-size:24px}h2{font-size:18px;margin-top:0}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#a91520;color:white;font-weight:700;font-size:16px}.secondary{background:#fff;color:#a91520;border:1px solid #a91520}.danger{background:#6d0c13}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9bcbc;border-radius:10px;font-size:16px;margin:5px 0 10px}.big{font-size:32px;font-weight:800}.muted{color:#725b5b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff7f7;border-radius:14px;padding:14px}.ok{color:#147b31}.warn{color:#b36a00}.row{padding:10px 0;border-bottom:1px solid #f0dddd}.pill{display:inline-block;padding:4px 8px;background:#f8dddd;border-radius:999px;font-size:12px}label{font-weight:700}</style></head><body><main><button class="secondary" onclick="location.href='home.html'">← ホーム</button><h1>自分のポイント</h1><p class="muted">前売りptと当日ptは別部門で計算されます。総合ptは表示しません。</p>
<div class="grid"><div class="metric"><div class="muted">前売りポイント</div><div class="big" id="prept">--</div></div><div class="metric"><div class="muted">残券</div><div class="big" id="res">--</div><div id="resmoney" class="muted"></div></div></div>
<div class="card"><h2>当日ポイント</h2><div class="grid"><div><div class="muted">暫定</div><div class="big" id="dayprov">--</div></div><div><div class="muted">確定</div><div class="big" id="dayfinal">--</div></div></div><div id="breakdown" class="muted"></div></div>
<div class="card"><h2>前売り状況</h2><div id="predetail"></div><button class="secondary" onclick="location.href='presale.html'">ノルマ詳細を見る</button></div>
<script>const SUPABASE_URL="https://gsniytemgrbtgfywhqlu.supabase.co";const SUPABASE_KEY="sb_publishable_r6nHm52sLazEmtKKDK5FVA_5ZQiXucn";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function sum(final){const{data,error}=await db.rpc('my_point_summary',{p_final:final});if(error)throw error;return (data||[]).reduce((a,x)=>a+Number(x.points||0),0)}
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='home.html';return}const[p,prov,fin]=await Promise.all([db.rpc('my_presale_status'),sum(false),sum(true)]);if(p.error)throw p.error;const x=p.data;prept.textContent=Number(x.presale_points||0).toFixed(1)+' pt';res.textContent=(x.residual_remaining||0)+' 枚';resmoney.textContent=(x.residual_remaining||0)?Number(x.residual_value||0).toLocaleString()+'円相当':'残券なし ✓';dayprov.textContent=prov.toFixed(2)+' pt';dayfinal.textContent=fin.toFixed(2)+' pt';predetail.innerHTML=`ノルマ: <b>${x.confirmed_quota??'未確定'}${x.confirmed_quota?'枚':''}</b><br>祭前販売: <b>${x.presale_sold}枚</b><br>超過販売: <b>${x.overflow_sold}枚</b>`}load().catch(e=>breakdown.textContent='エラー: '+e.message);</script></main></body></html>
